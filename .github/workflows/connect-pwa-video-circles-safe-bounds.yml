# Connect PWA — video circles: keep all controls inside the safe square around the circle.
# Upload to: .github/workflows/connect-pwa-video-circles-safe-bounds.yml
# Scope: ONLY video circles (small preview and expanded preview).
name: Connect PWA — video circles safe bounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-video-circles-safe-bounds.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-video-circles-safe-bounds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current PWA main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused video-circle bounds patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('app/connect-unified-chat.css')
          page_path = Path('app/page.tsx')
          marker = 'CONNECT_PWA_VIDEO_NOTE_SAFE_BOUNDS_V1_20261112'

          if not css_path.is_file() or not page_path.is_file():
              raise SystemExit('Required Connect PWA source files are missing; stopping without changing anything.')

          css = css_path.read_text(encoding='utf-8')
          page = page_path.read_text(encoding='utf-8')

          if marker in css:
              print('Video-circle safe-bounds patch is already installed (no changes).')
              raise SystemExit(0)

          required = [
              ('video-note bubble classes', 'video-note-bubble' in css),
              ('connect-v5 note stage', 'connect-v5-note-stage' in css),
              ('connect-v5 note close button', 'connect-v5-note-close' in css),
              ('connect-v5 note sound button', 'connect-v5-note-sound' in css),
              ('connect-v5 note time', 'connect-v5-note-time' in css),
              ('video note jsx', 'connect-v5-video-note' in page),
          ]
          missing = [name for name, ok in required if not ok]
          if missing:
              raise SystemExit('PWA source does not match the verified baseline: ' + ', '.join(missing))

          patch = r'''
          /* CONNECT_PWA_VIDEO_NOTE_SAFE_BOUNDS_V1_20261112
           * Video-note controls must live INSIDE the square crop around the circle.
           * Nothing may leave chat bounds. Applies to collapsed and expanded states.
           */
          .connect-app .bubble.sent.media-only.video-note-bubble,
          .connect-app .bubble.received.media-only.video-note-bubble {
            width: min(300px, calc(100vw - 36px)) !important;
            max-width: min(300px, calc(100vw - 36px)) !important;
            overflow: visible !important;
          }

          .connect-app .bubble.sent.media-only.video-note-bubble:has(.connect-v5-video-note.is-expanded),
          .connect-app .bubble.received.media-only.video-note-bubble:has(.connect-v5-video-note.is-expanded) {
            width: min(520px, calc(100vw - 30px)) !important;
            max-width: min(520px, calc(100vw - 30px)) !important;
          }

          .connect-app .bubble.video-note-bubble .bubble-body,
          .connect-app .bubble.video-note-bubble .attachment-preview,
          .connect-app .bubble.video-note-bubble .connect-v5-video-note {
            width: 100% !important;
            max-width: 100% !important;
            overflow: visible !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-stage {
            box-sizing: border-box !important;
            position: relative !important;
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            aspect-ratio: 1 / 1 !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            isolation: isolate !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-stage > .connect-v4-note-circle {
            box-sizing: border-box !important;
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            flex: none !important;
            aspect-ratio: 1 / 1 !important;
            margin: 0 !important;
            border: 1px solid var(--glass-stroke-hi, rgba(220,235,255,.23)) !important;
            border-radius: 50% !important;
            overflow: hidden !important;
            background: #111b25 !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-stage > .connect-v4-note-circle > .connect-v4-note-video,
          .connect-app .bubble.video-note-bubble .connect-v5-note-stage > .connect-v4-note-circle .connect-v4-note-progress,
          .connect-app .bubble.video-note-bubble .connect-v5-note-stage > .connect-v4-note-circle .connect-v4-note-hit {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-close,
          .connect-app .bubble.video-note-bubble .connect-v5-note-sound,
          .connect-app .bubble.video-note-bubble .connect-v5-note-time {
            position: absolute !important;
            z-index: 8 !important;
            transform: none !important;
          }

          /* The controls live inside the square crop, outside the circular mask. */
          .connect-app .bubble.video-note-bubble .connect-v5-note-close {
            top: 8px !important;
            right: 8px !important;
            left: auto !important;
            bottom: auto !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-sound {
            left: 8px !important;
            bottom: 8px !important;
            right: auto !important;
            top: auto !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-time {
            right: 8px !important;
            bottom: 8px !important;
            left: auto !important;
            top: auto !important;
            max-width: calc(100% - 56px) !important;
            padding: 5px 8px !important;
            border-radius: 12px !important;
            background: rgba(12, 18, 29, .76) !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-close,
          .connect-app .bubble.video-note-bubble .connect-v5-note-sound {
            width: 34px !important;
            height: 34px !important;
            min-width: 34px !important;
            min-height: 34px !important;
            border-radius: 12px !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v5-note-time .delivery-checks {
            margin-left: 2px !important;
          }

          .connect-app .bubble.video-note-bubble .connect-v4-note-length {
            bottom: 10px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 7 !important;
          }

          @media (max-width: 380px) {
            .connect-app .bubble.sent.media-only.video-note-bubble,
            .connect-app .bubble.received.media-only.video-note-bubble {
              width: min(284px, calc(100vw - 30px)) !important;
              max-width: min(284px, calc(100vw - 30px)) !important;
            }
          }
          '''

          css_path.write_text(css.rstrip() + '\n\n' + patch.strip() + '\n', encoding='utf-8')
          print('Applied safe-square video-circle layout: all controls stay within the square crop and within chat bounds.')
          PY
          git diff --check

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and supported Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: TypeScript, regression tests, production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Publish after successful checks only
        shell: bash
        run: |
          set -euo pipefail
          git add app/connect-unified-chat.css
          if git diff --cached --quiet; then
            echo 'No changes to commit; PWA is already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: keep video-circle controls inside safe square [skip ci]'
          git push origin HEAD:main
          
