name: Connect PWA transcription button fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connect-pwa-transcript-button-fix.yml'
permissions:
  contents: write
concurrency:
  group: connect-pwa-transcript-button-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true
      - name: Apply minimal PWA click fix
        shell: bash
        run: |
          python3 - <<'PY'
          COMPONENT = '"use client";\n\nimport { useRef, useState, type SyntheticEvent, type CSSProperties } from \'react\';\nimport type { SupabaseClient } from \'@supabase/supabase-js\';\n\n// Transcripts are private to the current in-memory session; never persisted to Supabase.\nconst inMemory = new Map<string, string>();\ntype Phase = \'closed\' | \'checking\' | \'consent\' | \'loading\' | \'ready\' | \'error\';\n\nexport default function ConnectTranscript({ client, messageId, compact = false }: {\n  client: SupabaseClient; messageId: string; compact?: boolean;\n}) {\n  const [phase, setPhase] = useState<Phase>(\'closed\');\n  const [text, setText] = useState(\'\');\n  const [error, setError] = useState(\'\');\n  const toggleRef = useRef<HTMLButtonElement>(null);\n  const [panelStyle, setPanelStyle] = useState<CSSProperties>({});\n  function positionPanel() {\n    const button = toggleRef.current;\n    if (!button) return;\n    const rect = button.getBoundingClientRect();\n    const viewport = button.closest(\'.message-scroll\')?.getBoundingClientRect();\n    const above = rect.top - (viewport?.top ?? 0);\n    const below = (viewport?.bottom ?? window.innerHeight) - rect.bottom;\n    const openAbove = above >= 185 || above > below;\n    const width = Math.min(285, window.innerWidth - 24);\n    const left = Math.max(10, Math.min(rect.right - width, window.innerWidth - width - 10)) - rect.left;\n    setPanelStyle({ width, left, right: \'auto\', top: openAbove ? \'auto\' : \'calc(100% + 7px)\',\n      bottom: openAbove ? \'calc(100% + 7px)\' : \'auto\' });\n  }\n  const stopTouch = (e: SyntheticEvent) => e.stopPropagation();\n\n  async function toggleTranscript() {\n    if (phase !== \'closed\') { setPhase(\'closed\'); return; }\n    // Update the UI immediately on tap, before any async authentication calls.\n    positionPanel();\n    setPhase(\'checking\');\n    setError(\'\');\n    try {\n      const { data: { session } } = await client.auth.getSession();\n      if (!session) { setError(\'Войди в Connect, чтобы расшифровать запись.\'); setPhase(\'error\'); return; }\n      const cached = inMemory.get(`${session.user.id}:${messageId}`);\n      if (cached !== undefined) { setText(cached); setPhase(\'ready\'); return; }\n      // Explicit consent for each recording. No window.confirm() (unreliable on iOS PWA).\n      setPhase(\'consent\');\n    } catch {\n      setError(\'Не удалось проверить авторизацию.\');\n      setPhase(\'error\');\n    }\n  }\n\n  async function transcribe() {\n    setPhase(\'loading\');\n    setError(\'\');\n    try {\n      const { data: { session } } = await client.auth.getSession();\n      if (!session) throw new Error(\'Войди в Connect, чтобы получить расшифровку.\');\n      const response = await fetch(\'/api/transcribe\', {\n        method: \'POST\', cache: \'no-store\', credentials: \'same-origin\',\n        headers: { Authorization: `Bearer ${session.access_token}`, \'Content-Type\': \'application/json\' },\n        body: JSON.stringify({ messageId }),\n      });\n      const data: { text?: unknown; error?: unknown } = await response.json().catch(() => ({}));\n      if (!response.ok) throw new Error(typeof data.error === \'string\' ? data.error : `Ошибка распознавания (${response.status}).`);\n      if (typeof data.text !== \'string\') throw new Error(\'Сервис вернул неверный ответ.\');\n      const result = data.text.trim().slice(0, 30000);\n      const cacheKey = `${session.user.id}:${messageId}`;\n      inMemory.set(cacheKey, result);\n      if (inMemory.size > 100) inMemory.delete(inMemory.keys().next().value!);\n      setText(result);\n      setPhase(\'ready\');\n    } catch (reason) {\n      setError(reason instanceof Error ? reason.message : \'Не удалось распознать запись.\');\n      setPhase(\'error\');\n    }\n  }\n\n  return <div className={\'connect-transcript\' + (compact ? \' is-compact\' : \'\')}\n    onClick={stopTouch} onTouchStart={stopTouch} onTouchMove={stopTouch}\n    onTouchEnd={stopTouch} onTouchCancel={stopTouch} onPointerDown={stopTouch}\n    onContextMenu={e => { e.preventDefault(); e.stopPropagation(); }}>\n    <button ref={toggleRef} type="button" className="connect-transcript-toggle" disabled={phase === \'loading\'}\n      aria-expanded={phase !== \'closed\'} aria-label={phase === \'closed\' ? \'Расшифровать запись в текст\' : \'Скрыть расшифровку\'}\n      title={phase === \'closed\' ? \'Расшифровать в текст\' : \'Скрыть расшифровку\'}\n      onClick={e => { e.stopPropagation(); void toggleTranscript(); }}>\n      <svg className="connect-arrow-t-icon" viewBox="0 0 24 24" width="19" height="19" fill="none"\n        stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">\n        <path d="M4.5 4.5v8.5a4 4 0 0 0 4 4h10"/>\n        <path d="m14.5 12.5 4.5 4.5-4.5 4.5"/>\n      </svg><span>Т</span>\n    </button>\n    {phase !== \'closed\' && <div className="connect-transcript-result" role="status" aria-live="polite" style={panelStyle}>\n      {phase === \'checking\' ? \'Проверяем доступ…\' :\n       phase === \'consent\' ? <>\n         <span>Для расшифровки Connect отправит эту запись в Cloudflare Workers AI. Продолжить?</span>\n         <div className="connect-transcript-actions">\n           <button type="button" className="connect-transcript-approve" onClick={e => { e.stopPropagation(); void transcribe(); }}>Расшифровать</button>\n           <button type="button" onClick={e => { e.stopPropagation(); setPhase(\'closed\'); }}>Отмена</button>\n         </div>\n       </> :\n       phase === \'loading\' ? \'Распознаём речь…\' :\n       phase === \'error\' ? <span className="connect-transcript-error">{error}</span> :\n       text || \'В записи не обнаружена речь.\'}\n    </div>}\n  </div>;\n}\n'
          CSS = '/* Connect transcript button: isolated touch target; visual feedback on iOS PWA. */\n.connect-app .connect-voice-v4-top {\n  display: flex;\n  align-items: center;\n  width: 100%;\n  gap: 6px;\n  min-width: 0;\n}\n.connect-app .connect-voice-v4-top > .voice-wave {\n  flex: 1 1 0;\n  width: auto;\n  min-width: 0;\n}\n.connect-app .connect-transcript {\n  position: relative;\n  z-index: 20;\n  isolation: isolate;\n  display: inline-flex;\n  flex: 0 0 auto;\n  align-items: flex-end;\n  flex-direction: column;\n  max-width: 100%;\n  touch-action: manipulation;\n}\n.connect-app .connect-transcript-toggle {\n  appearance: none;\n  -webkit-appearance: none;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0;\n  min-width: 39px;\n  min-height: 36px;\n  width: 39px;\n  height: 36px;\n  margin: 0;\n  padding: 0 5px;\n  border: 1px solid color-mix(in srgb, currentColor 22%, transparent);\n  border-radius: 13px;\n  background: color-mix(in srgb, var(--panel, #253044) 76%, transparent);\n  color: inherit;\n  font: 700 14px/1 system-ui, sans-serif;\n  cursor: pointer;\n  user-select: none;\n  -webkit-user-select: none;\n  touch-action: manipulation;\n  pointer-events: auto;\n  opacity: 1;\n  visibility: visible;\n}\n.connect-app .connect-transcript-toggle > svg {flex: 0 0 18px; pointer-events: none;}\n.connect-app .connect-transcript-toggle > span {pointer-events: none;}\n.connect-app .connect-transcript-toggle:disabled {opacity: .65; cursor: progress;}\n.connect-app .connect-transcript-toggle:focus-visible {outline: 2px solid var(--accent, #49aafc); outline-offset: 2px;}\n.connect-app .connect-transcript-result {\n  position: absolute;\n  z-index: 300;\n  right: 0;\n  bottom: calc(100% + 7px);\n  display: flex;\n  flex-direction: column;\n  gap: 9px;\n  box-sizing: border-box;\n  width: min(285px, calc(100vw - 46px));\n  max-height: 230px;\n  overflow-wrap: anywhere;\n  overflow-y: auto;\n  padding: 11px 12px;\n  border: 1px solid color-mix(in srgb, currentColor 20%, transparent);\n  border-radius: 14px;\n  background: var(--panel, #1c293a);\n  color: var(--text, #fff);\n  -webkit-backdrop-filter: blur(16px);\n  backdrop-filter: blur(16px);\n  box-shadow: 0 8px 24px rgba(0,0,0,.26);\n  font-size: 12px;\n  line-height: 1.45;\n  text-align: left;\n  white-space: normal;\n  pointer-events: auto;\n}\n.connect-app .connect-transcript-actions {display: flex; gap: 7px; flex-wrap: wrap;}\n.connect-app .connect-transcript-actions button {\n  border: 1px solid color-mix(in srgb,currentColor 20%,transparent);\n  border-radius: 10px;\n  padding: 8px 10px;\n  background: color-mix(in srgb,var(--panel,#253044) 70%,var(--text,#fff) 12%);\n  color: inherit;\n  font: 600 12px/1.2 system-ui, sans-serif;\n  cursor: pointer;\n  touch-action: manipulation;\n}\n.connect-app .connect-transcript-actions .connect-transcript-approve {\n  background: var(--accent, #248df1);\n  color: #fff;\n}\n.connect-app .connect-transcript-error {color: #ffa5a5;}\n'
          from pathlib import Path

          component_file = Path('components/ConnectTranscript.tsx')
          if not component_file.exists():
              raise SystemExit('ConnectTranscript.tsx not found; refusing to patch another repository')
          component_file.write_text(COMPONENT, encoding='utf-8')

          css_file = Path('app/connect-transcript.css')
          css_file.write_text(CSS, encoding='utf-8')

          layout_file = Path('app/layout.tsx')
          layout = layout_file.read_text(encoding='utf-8')
          line = "import './connect-transcript.css';"
          if line not in layout:
              if "import './connect-icons.css';" not in layout:
                  raise SystemExit('Unexpected layout.tsx imports; nothing written to layout')
              layout = layout.replace("import './connect-icons.css';", "import './connect-icons.css';\n" + line, 1)
              layout_file.write_text(layout, encoding='utf-8')

          page_file = Path('app/page.tsx')
          page = page_file.read_text(encoding='utf-8')
          old = "else if(Date.now()<suppressMessageClick.current){e.preventDefault();e.stopPropagation();}"
          new = "else if(Date.now()<suppressMessageClick.current && !(e.target instanceof Element && e.target.closest('.connect-transcript'))){e.preventDefault();e.stopPropagation();}"
          if old in page:
              page_file.write_text(page.replace(old, new, 1), encoding='utf-8')
          elif new not in page:
              raise SystemExit('Unexpected message click handler; refusing to change it')
          print('PWA transcript click fix staged')
          PY
      - name: Verify TypeScript (no npm install scripts)
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit fix to main
        shell: bash
        run: |
          git add components/ConnectTranscript.tsx app/connect-transcript.css app/layout.tsx app/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git -c user.name='Connect Action' -c user.email='actions@users.noreply.github.com' commit -m 'Fix PWA transcript button taps and inline consent'
          git push origin HEAD:main
