      - name: Remove the blue icon tile and raise the animated Connect letters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          component = Path('components/ConnectSplashScreen.tsx')
          css = Path('app/connect-splash.css')
          if not component.exists() or not css.exists():
              raise SystemExit('Approved splash screen is not installed. Aborting rather than editing unrelated UI.')
          s = component.read_text(encoding='utf-8')
          if 'connect-splash__waves' not in s or 'connect-splash__word' not in s:
              raise SystemExit('Expected Connect splash elements are missing. Nothing modified.')
          if "const BRAND = 'Connect'.split('');" not in s:
              raise SystemExit('Letter-by-letter Connect loading animation not found. Nothing modified.')
          image = ('        <img className="connect-splash__icon" '
                   'src="/connect-splash-bubbles-transparent.png" '
                   'alt="" aria-hidden="true" draggable={false} />')
          # Accept both earlier vector logo revisions and the preceding original PNG.
          svg_pattern = r'(?m)^        <svg className="connect-splash__icon"[^\n]*>.*?^        </svg>'
          img_pattern = r'(?m)^        <img className="connect-splash__icon"[^\n]*/>'
          if re.search(svg_pattern, s, flags=re.S):
              s, count = re.subn(svg_pattern, lambda _: image, s, count=1, flags=re.S)
          elif re.search(img_pattern, s):
              s, count = re.subn(img_pattern, lambda _: image, s, count=1)
          elif image in s:
              count = 1
          else:
              raise SystemExit('Cannot locate the existing splash icon. Refusing to alter other graphics.')
          if count != 1 or s.count('src="/connect-splash-bubbles-transparent.png"') != 1:
              raise SystemExit('Splash icon update was not unique.')

          style = css.read_text(encoding='utf-8')
          if '.connect-splash__icon' not in style or '.connect-splash__word' not in style:
              raise SystemExit('Unexpected splash CSS; refusing to modify.')
          # Keep the visible bubbles roughly the same size as before, but remove
          # the square's empty padding and lift the independent word indicator.
          style = style.replace('width: min(60vw, 270px);', 'width: min(47vw, 220px);')
          style = style.replace('margin-top: 17px;', 'margin-top: 4px;')
          style = style.replace('width: min(35vh, 230px);', 'width: min(30vh, 185px);')
          if 'width: min(47vw, 220px);' not in style or 'margin-top: 4px;' not in style:
              raise SystemExit('Could not reliably adjust the splash layout.')
          if '@keyframes connect-splash-wave-drift' not in style:
              raise SystemExit('Approved waves are missing; refusing to install.')
          component.write_text(s, encoding='utf-8')
          css.write_text(style, encoding='utf-8')
          print('The original floating bubbles replace the blue tile; letters moved closer. Waves unchanged.')
          PY

      - name: Validate changes
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/ConnectSplashScreen.tsx').read_text(encoding='utf-8')
          c=Path('app/connect-splash.css').read_text(encoding='utf-8')
          assert p.count('src="/connect-splash-bubbles-transparent.png"') == 1
          assert 'connect-splash__waves' in p and 'connect-splash__letter' in p
          assert 'margin-top: 4px;' in c and 'width: min(47vw, 220px);' in c
          assert Path('public/connect-splash-bubbles-transparent.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Splash screen integrity checks passed.')
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Commit only the splash appearance changes
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx app/connect-splash.css public/connect-splash-bubbles-transparent.png
          if git diff --cached --quiet; then
            echo 'Splash appearance already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: use floating original Connect bubbles and raised loading letters'
          git push origin HEAD:main
