name: Connect - floating original bubbles and raised letters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-floating-bubbles.yml'

permissions:
  contents: write

concurrency:
  group: connect-floating-bubbles
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

