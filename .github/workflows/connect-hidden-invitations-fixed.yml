name: Connect - hidden invitations (fixed workflow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-hidden-invitations-fixed.yml'

permissions:
  contents: write

concurrency:
  group: connect-hidden-invitations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect Messenger PWA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository identity
        shell: bash
        run: |
          test "${{ github.repository }}" = 'Chimera1988/connect-messenger' || { echo 'This workflow is for the PWA repository only'; exit 1; }
          test -f components/InvitationCodes.tsx
          test -f app/api/invite/redeem/route.ts
          test -f app/page.tsx
      - name: Build database migration file
        shell: bash
        run: |
          mkdir -p sql
          cat > sql/connect_hidden_members.sql <<'CONNECT_SQL'
          -- Connect Messenger: hidden members, bound to the invitation's administrator.
          -- Designed for the current public.profiles/conversations/messages/connect_calls schema.
          -- Apply BEFORE deploying the matching server/client code.
          begin;

          alter table public.connect_invitation_codes
            add column if not exists invite_type text not null default 'normal';
          do $$ begin
            if not exists (
              select 1 from pg_constraint
              where conname = 'connect_invite_type_allowed'
                and conrelid = 'public.connect_invitation_codes'::regclass
            ) then
              alter table public.connect_invitation_codes
                add constraint connect_invite_type_allowed
                check (invite_type in ('normal','hidden'));
            end if;
          end $$;

          create table if not exists public.connect_hidden_members (
            user_id uuid primary key references auth.users(id) on delete cascade,
            admin_id uuid not null references auth.users(id),
            created_at timestamptz not null default now(),
            constraint connect_hidden_member_is_not_admin check (user_id <> admin_id)
          );
          create index if not exists connect_hidden_members_admin_idx on public.connect_hidden_members(admin_id);
          alter table public.connect_hidden_members enable row level security;
          revoke all on public.connect_hidden_members from public, anon, authenticated;
          grant select,insert,update,delete on public.connect_hidden_members to service_role;

          -- Helper is in a non-exposed schema; it only returns whether two IDs may interact.
          -- The definer may read the hidden membership table without exposing its rows.
          create or replace function private.connect_can_reach(p_first uuid,p_second uuid)
          returns boolean
          language sql stable security definer set search_path = ''
          as $$
            select p_first is not null and p_second is not null and (
              p_first = p_second
              or (
                not exists(select 1 from public.connect_hidden_members h where h.user_id = p_first)
                and not exists(select 1 from public.connect_hidden_members h where h.user_id = p_second)
              )
              or exists(select 1 from public.connect_hidden_members h
                        where h.user_id = p_first and h.admin_id = p_second)
              or exists(select 1 from public.connect_hidden_members h
                        where h.user_id = p_second and h.admin_id = p_first)
            );
          $$;
          revoke all on function private.connect_can_reach(uuid,uuid) from public,anon;
          grant usage on schema private to authenticated;
          grant execute on function private.connect_can_reach(uuid,uuid) to authenticated;

          -- Restrictive policies are ANDed with existing permissive policies.
          -- This retains all current ownership and blocked-user rules.
          drop policy if exists "connect hidden profiles isolate" on public.profiles;
          create policy "connect hidden profiles isolate" on public.profiles as restrictive
            for select to authenticated using (private.connect_can_reach((select auth.uid()), id));

          drop policy if exists "connect hidden conversations read" on public.conversations;
          create policy "connect hidden conversations read" on public.conversations as restrictive
            for select to authenticated using (private.connect_can_reach(user_a,user_b));
          drop policy if exists "connect hidden conversations create" on public.conversations;
          create policy "connect hidden conversations create" on public.conversations as restrictive
            for insert to authenticated with check (private.connect_can_reach(user_a,user_b));
          drop policy if exists "connect hidden conversations update" on public.conversations;
          create policy "connect hidden conversations update" on public.conversations as restrictive
            for update to authenticated
            using (private.connect_can_reach(user_a,user_b))
            with check (private.connect_can_reach(user_a,user_b));

          -- Messages and reading state use the conversations SELECT policy; additionally
          -- restrict edits to old threads that become hidden after registration.
          drop policy if exists "connect hidden messages edits" on public.messages;
          create policy "connect hidden messages edits" on public.messages as restrictive
            for update to authenticated using (exists(
              select 1 from public.conversations c where c.id = conversation_id
            )) with check (exists(
              select 1 from public.conversations c where c.id = conversation_id
            ));
          drop policy if exists "connect hidden read states" on public.conversation_user_state;
          create policy "connect hidden read states" on public.conversation_user_state as restrictive
            for select to authenticated using (exists(
              select 1 from public.conversations c where c.id = conversation_id
            ));
          drop policy if exists "connect hidden state updates" on public.conversation_user_state;
          create policy "connect hidden state updates" on public.conversation_user_state as restrictive
            for update to authenticated using (exists(
              select 1 from public.conversations c where c.id = conversation_id
            )) with check (exists(
              select 1 from public.conversations c where c.id = conversation_id
            ));

          -- Audio calls: RLS for listening, trigger for SECURITY DEFINER call RPCs.
          drop policy if exists "connect hidden audio calls" on public.connect_calls;
          create policy "connect hidden audio calls" on public.connect_calls as restrictive
            for select to authenticated using (private.connect_can_reach(caller_id,callee_id));
          create or replace function private.connect_guard_audio_call()
          returns trigger language plpgsql security definer set search_path = '' as $$
          begin
            if TG_OP = 'INSERT' then
              if not private.connect_can_reach(new.caller_id,new.callee_id) then
                raise exception 'Call unavailable';
              end if;
            elsif TG_OP = 'UPDATE' and new.status = 'active' and old.status is distinct from 'active' then
              if not private.connect_can_reach(new.caller_id,new.callee_id) then
                raise exception 'Call unavailable';
              end if;
            end if;
            return new;
          end $$;
          revoke all on function private.connect_guard_audio_call() from public,anon,authenticated;
          drop trigger if exists connect_guard_audio_call_visibility on public.connect_calls;
          create trigger connect_guard_audio_call_visibility
            before insert or update of status on public.connect_calls
            for each row execute function private.connect_guard_audio_call();

          -- Music presence and public sticker packs otherwise reveal unknown user IDs.
          drop policy if exists "connect hidden music presence" on public.connect_music_presence;
          create policy "connect hidden music presence" on public.connect_music_presence as restrictive
            for select to authenticated using (private.connect_can_reach((select auth.uid()),owner_id));
          drop policy if exists "connect hidden sticker packs" on public.connect_sticker_packs;
          create policy "connect hidden sticker packs" on public.connect_sticker_packs as restrictive
            for select to authenticated using (private.connect_can_reach((select auth.uid()),owner_id));

          -- Private storage access. Signed URLs issued before hiding may remain valid until
          -- expiry; this controls newly authorized downloads and signed-URL creation.
          drop policy if exists "connect hidden private media" on storage.objects;
          create policy "connect hidden private media" on storage.objects as restrictive
            for select to authenticated using (
              case
                when bucket_id in ('connect-avatars','connect-profile-media') then
                  case when coalesce((storage.foldername(name))[1],'')
                          ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                    then private.connect_can_reach((select auth.uid()), (storage.foldername(name))[1]::uuid)
                    else false end
                when bucket_id = 'connect-stickers' then
                  exists(
                    select 1 from public.connect_stickers st
                    join public.connect_sticker_packs p on p.id = st.pack_id
                    where st.storage_path = objects.name
                      and private.connect_can_reach((select auth.uid()), p.owner_id)
                  )
                else true
              end
            );

          commit;
          CONNECT_SQL
      - name: Patch PWA code and server endpoints
        shell: bash
        run: |
          python3 - <<'CONNECT_PY'
          from pathlib import Path


          def change(path, old, new, name):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if new in s:
                  print('already patched:', name)
                  return
              num=s.count(old)
              if num != 1:
                  raise RuntimeError(f'{name}: expected exactly one anchor in {path}; found {num}. Nothing from this patch saved.')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('patched:',name)

          # Invitations: separate administrator entry points, common secure endpoint.
          p='components/InvitationCodes.tsx'
          change(p,
           'revoked_at:string|null };',
           "revoked_at:string|null;invite_type:'normal'|'hidden' };",
           'invite type')
          change(p,
           "[busy,setBusy]=useState(false);",
           "[busy,setBusy]=useState(false),[mode,setMode]=useState<'normal'|'hidden'>('normal');",
           'mode state')
          change(p,
           "const openInvites=()=>{if(!admin)return;setOpen(true);setError('');void load()};",
           "const openInvites=()=>{if(!admin)return;setMode('normal');setIssued('');setOpen(true);setError('');void load()};",
           'normal invitation mode')
          anchor=" useEffect(()=>{const openRegistration=()=>{if(signed)return;setOpen(true);setError('')};"
          insertion=" useEffect(()=>{const openHidden=()=>{if(!admin)return;setMode('hidden');setIssued('');setOpen(true);setError('');void load()};window.addEventListener('connect:open-hidden-invitations',openHidden);return()=>window.removeEventListener('connect:open-hidden-invitations',openHidden)},[admin]);\n"
          change(p,anchor,insertion+anchor,'hidden invitation event')
          change(p,
           "const d=await request('/api/admin/invite','POST',{email});",
           "const d=await request('/api/admin/invite','POST',{email,invite_type:mode});",
           'create typed invitation')
          change(p,
           "{signed?'Приглашения':'Регистрация по коду'}</h2>",
           "{signed?(mode==='hidden'?'Коды для скрытых':'Приглашения'):'Регистрация по коду'}</h2>",
           'modal heading')
          change(p,
           "<p>Создайте одноразовый код на 24 часа для email пользователя.</p>",
           "<p>{mode==='hidden'?'Этот код создаст скрытого участника. В его контактах будет только администратор.':'Создайте одноразовый код на 24 часа для email пользователя.'}</p>",
           'modal description')
          change(p,
           "{invites.map(x=><div key={x.id}",
           "{invites.filter(x=>(x.invite_type||'normal')===mode).map(x=><div key={x.id}",
           'filter invites')

          p='app/api/admin/invite/route.ts'
          change(p,
           ".select('id,email,created_at,expires_at,redeemed_at,revoked_at')",
           ".select('id,email,invite_type,created_at,expires_at,redeemed_at,revoked_at')",
           'admin list invitation types')
          change(p,
           "  if(email.length>254 || !/^\\S+@\\S+\\.\\S+$/.test(email)) throw new Error('Введите корректный email');",
           "  if(email.length>254 || !/^\\S+@\\S+\\.\\S+$/.test(email)) throw new Error('Введите корректный email');\n  const invite_type = body.invite_type === 'hidden' ? 'hidden' : body.invite_type === undefined || body.invite_type === 'normal' ? 'normal' : null;\n  if(!invite_type)throw new Error('Неизвестный тип приглашения');",
           'validate invitation type')
          change(p,
           "{code_hash:hash(code.replace(/-/g,'')),email,created_by:user.id}",
           "{code_hash:hash(code.replace(/-/g,'')),email,created_by:user.id,invite_type}",
           'persist invitation type')

          p='app/api/invite/redeem/route.ts'
          change(p,
           ".select('id,email').eq('code_hash',codeHash)",
           ".select('id,email,invite_type,created_by').eq('code_hash',codeHash)",
           'redeem typed invitation')
          change(p,
           "  await client.from('connect_invitation_codes').update({redeemed_by:created.user.id}).eq('id',invite.id);",
           "  if(invite.invite_type==='hidden'){\n   const {error:hideError}=await client.from('connect_hidden_members').insert({user_id:created.user.id,admin_id:invite.created_by});\n   if(hideError){\n    await client.auth.admin.deleteUser(created.user.id);\n    throw new Error('Не удалось защитить скрытый аккаунт. Попросите администратора выдать новый код.');\n   }\n  }\n  await client.from('connect_invitation_codes').update({redeemed_by:created.user.id}).eq('id',invite.id);",
           'persist hidden member before registration succeeds')

          p='app/page.tsx'
          change(p,
           "import ConnectNotificationSettings from '../components/ConnectNotificationSettings';",
           "import ConnectNotificationSettings from '../components/ConnectNotificationSettings';\nimport ConnectHiddenMembers from '../components/ConnectHiddenMembers';",
           'admin member component import')
          change(p,
           '<button type="button" className="settings-action" onClick={()=>window.dispatchEvent(new Event(\'connect:open-invitations\'))}>Коды приглашений</button></div>}',
           '<button type="button" className="settings-action" onClick={()=>window.dispatchEvent(new Event(\'connect:open-invitations\'))}>Коды приглашений</button><button type="button" className="settings-action" onClick={()=>window.dispatchEvent(new Event(\'connect:open-hidden-invitations\'))}>Коды для скрытых</button><div style={{marginTop:20}}><ConnectHiddenMembers request={authenticatedRequest} onChanged={()=>void loadDirectory()}/></div></div>}',
           'admin settings buttons and toggles')

          Path('components/ConnectHiddenMembers.tsx').write_text('''\'use client\';

          import { useEffect, useState } from 'react';

          type Member = { id:string; display_name:string; is_hidden:boolean };
          type Props = {
            request: (path:string, body?:object) => Promise<{members?:Member[];ok?:boolean}>;
            onChanged: () => void;
          };

          export default function ConnectHiddenMembers({request,onChanged}:Props){
            const [members,setMembers]=useState<Member[]>([]);
            const [loading,setLoading]=useState(true);
            const [busy,setBusy]=useState('');
            const [error,setError]=useState('');
            useEffect(()=>{
              let alive=true;
              void request('/api/admin/hidden-members').then(data=>{
                if(alive)setMembers(data.members||[]);
              }).catch(e=>{if(alive)setError(e instanceof Error?e.message:'Не удалось загрузить участников');})
                .finally(()=>{if(alive)setLoading(false)});
              return()=>{alive=false};
              // Request uses the current session; load once when the admin panel opens.
              // eslint-disable-next-line react-hooks/exhaustive-deps
            },[]);
            async function setHidden(member:Member){
              setBusy(member.id);setError('');
              try{
                await request('/api/admin/hidden-members',{user_id:member.id,hidden:!member.is_hidden});
                setMembers(old=>old.map(m=>m.id===member.id?{...m,is_hidden:!m.is_hidden}:m));
                onChanged();
              }catch(e){setError(e instanceof Error?e.message:'Не удалось изменить статус')}
              finally{setBusy('')}
            }
            return <>
              <strong>Статусы участников</strong>
              <p className="settings-hint">Скрытый участник видит только администратора. Изменения не удаляют переписки.</p>
              {loading?<p className="settings-hint">Загрузка участников…</p>:members.length===0?<p className="settings-hint">Пока нет других участников.</p>:members.map(m=><div key={m.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                <div style={{minWidth:0,overflowWrap:'anywhere'}}><strong>{m.display_name||'Без имени'}</strong><div className="settings-hint" style={{margin:0}}>{m.is_hidden?'Скрытый':'Обычный'}</div></div>
                <button type="button" className="settings-action secondary" style={{width:'auto',margin:0,padding:'8px 10px',fontSize:12}} disabled={Boolean(busy)} onClick={()=>void setHidden(m)}>{busy===m.id?'…':m.is_hidden?'Сделать обычным':'Скрыть'}</button>
              </div>)}
              {error&&<p role="alert" style={{color:'#ff9c9c'}}>{error}</p>}
            </>;
          }
          ''',encoding='utf-8')

          Path('app/api/admin/hidden-members').mkdir(parents=True,exist_ok=True)
          Path('app/api/admin/hidden-members/route.ts').write_text('''import { authenticatedUser, fail } from '../../../../lib/server/admin';

          export const runtime='nodejs';
          export const dynamic='force-dynamic';

          async function adminOnly(request:Request){
            const {client,user}=await authenticatedUser(request);
            if(!process.env.CONNECT_ADMIN_USER_ID||process.env.CONNECT_ADMIN_USER_ID!==user.id)
              throw new Error('Доступно только администратору');
            return {client,user};
          }

          export async function GET(request:Request){
            try{
              const {client,user}=await adminOnly(request);
              const [{data:profiles,error:profileError},{data:hidden,error:hiddenError}]=await Promise.all([
                client.from('profiles').select('id,display_name,is_blocked').neq('id',user.id).eq('is_blocked',false).order('display_name'),
                client.from('connect_hidden_members').select('user_id'),
              ]);
              if(profileError||hiddenError)throw profileError||hiddenError;
              const hiddenIds=new Set((hidden||[]).map(x=>x.user_id));
              return Response.json({members:(profiles||[]).map(p=>({id:p.id,display_name:p.display_name,is_hidden:hiddenIds.has(p.id)}))},{headers:{'Cache-Control':'no-store'}});
            }catch(e){return fail(e)}
          }

          export async function POST(request:Request){
            try{
              const {client,user}=await adminOnly(request);
              const body=await request.json();
              const id=body?.user_id;
              const hidden=body?.hidden;
              if(typeof id!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)||id===user.id||typeof hidden!=='boolean')
                throw new Error('Неверные параметры');
              const {data:profile,error:profileError}=await client.from('profiles').select('id,is_blocked').eq('id',id).maybeSingle();
              if(profileError||!profile||profile.is_blocked)throw new Error('Участник не найден');
              if(hidden){
                const {error}=await client.from('connect_hidden_members').upsert({user_id:id,admin_id:user.id},{onConflict:'user_id'});
                if(error)throw error;
              }else{
                const {error}=await client.from('connect_hidden_members').delete().eq('user_id',id).eq('admin_id',user.id);
                if(error)throw error;
              }
              return Response.json({ok:true});
            }catch(e){return fail(e)}
          }
          ''',encoding='utf-8')

          # Existing service-role push routes bypass RLS. Avoid delivering pushes between
          # newly separated accounts, including queued webhook jobs from old chats.
          Path('lib/server/visibility.ts').write_text('''import type { SupabaseClient } from '@supabase/supabase-js';

          /** Fail closed for any server-side service-role notification. */
          export async function canReach(client:SupabaseClient,a:string,b:string):Promise<boolean>{
            if(!a||!b)return false;
            if(a===b)return true;
            const {data,error}=await client.from('connect_hidden_members').select('user_id,admin_id').in('user_id',[a,b]);
            if(error)return false;
            const hidden=new Map((data||[]).map(x=>[x.user_id,x.admin_id]));
            return (!hidden.has(a)||hidden.get(a)===b)&&(!hidden.has(b)||hidden.get(b)===a);
          }
          ''',encoding='utf-8')

          p='app/api/push/message/route.ts'
          change(p,
           "import { NextRequest, NextResponse } from 'next/server';",
           "import { NextRequest, NextResponse } from 'next/server';\nimport { canReach } from '../../../../lib/server/visibility';",
           'push message helper')
          change(p,
           "  const recipient=conv.user_a===record.sender_id?conv.user_b:conv.user_a;",
           "  const recipient=conv.user_a===record.sender_id?conv.user_b:conv.user_a;\n  if(!await canReach(db,record.sender_id,recipient)) return NextResponse.json({ignored:true});",
           'push message isolation')

          p='app/api/push/call/route.ts'
          change(p,
           "import { NextRequest, NextResponse } from 'next/server';",
           "import { NextRequest, NextResponse } from 'next/server';\nimport { canReach } from '../../../../lib/server/visibility';",
           'push call helper')
          change(p,
           "  const [{ data: settings }, { data: devices }, { data: sender }] = await Promise.all([",
           "  if(!await canReach(db,call.caller_id,call.callee_id)) return NextResponse.json({ignored:true});\n  const [{ data: settings }, { data: devices }, { data: sender }] = await Promise.all([",
           'push call isolation')

          print('Connect hidden invitation code patch generated.')
          CONNECT_PY
      - name: Check code and TypeScript
        shell: bash
        run: |
          git diff --check
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Apply hidden-member database policies
        shell: bash
        env:
          CONNECT_DB_URL: ${{ secrets.CONNECT_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$CONNECT_DB_URL" ]; then
            echo '::error::Set GitHub Actions secret CONNECT_SUPABASE_DB_URL to the Connect Supabase PostgreSQL connection URI. No code was committed.'
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql "$CONNECT_DB_URL" -X -v ON_ERROR_STOP=1 -f sql/connect_hidden_members.sql
      - name: Commit Connect PWA changes
        shell: bash
        run: |
          git config user.name 'Connect Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/InvitationCodes.tsx components/ConnectHiddenMembers.tsx \
            app/page.tsx app/api/admin/invite/route.ts app/api/admin/hidden-members/route.ts \
            app/api/invite/redeem/route.ts app/api/push/message/route.ts \
            app/api/push/call/route.ts lib/server/visibility.ts sql/connect_hidden_members.sql
          if git diff --cached --quiet; then
            echo 'Connect hidden invitations already installed.'
          else
            git commit -m 'feat: hidden invitations, admin visibility and server isolation'
            git push origin HEAD:main
          fi
