name: Connect PWA — Turnix TURN relay (AUTO)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-turnix-auto.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-turnix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  turnix:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified Turnix source bundle
        run: |
          python3 - <<'CONNECT_TURNIX_PACKAGE'
          import os,json,gzip,base64,hashlib,pathlib
          root=pathlib.Path.cwd().resolve()
          workflow=os.environ['GITHUB_WORKFLOW_REF']
          name='.github/workflows/'+workflow.split('/.github/workflows/',1)[1].rsplit('@',1)[0]
          source=(root/name).read_text(encoding='utf-8')
          block=source.split('# CONNECT_TURNIX_BUNDLE_BEGIN\n',1)[1].split('# CONNECT_TURNIX_BUNDLE_END',1)[0]
          packed=base64.b64decode(''.join(line.removeprefix('# ') for line in block.splitlines()),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='5b54a5ce897a9dc8c4ace69e762d60ae8a30acc007db31d6ad5cce0329f28807','TURNIX package checksum mismatch'
          data=json.loads(gzip.decompress(packed))
          def file(name):
              p=root/name
              if not p.resolve().is_relative_to(root) or any(x.is_symlink() for x in [p,*p.parents] if x.is_relative_to(root)):
                  raise SystemExit('Unsafe package path: '+name)
              return p
          def blob(p):
              if not p.is_file():return None
              buf=p.read_bytes()
              return hashlib.sha1(('blob '+str(len(buf))+'\0').encode()+buf).hexdigest()
          # Fail atomically if main has diverged; do not overwrite unrelated updates.
          for path,content in data['files'].items():
              p=file(path)
              expected=content.encode('utf-8')
              new=hashlib.sha1(('blob '+str(len(expected))+'\0').encode()+expected).hexdigest()
              previous=blob(p)
              allowed=[new]+([data['before'][path]] if path in data['before'] else [None])
              if previous not in allowed:raise SystemExit('Source drift: '+path)
          for path,content in data['files'].items():
              p=file(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          print('Turnix ready: 5 checked files staged; TURNIX_API_TOKEN stays server-side')
          CONNECT_TURNIX_PACKAGE
      - name: Install locked dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify TypeScript, regressions, production build
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified Turnix changes
        run: |
          set -euo pipefail
          git add app/api/calls/ice/route.ts app/api/calls/health/route.ts tests/call-turnix.test.cjs package.json docs/turnix-setup.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add authenticated Turnix TURN relay to PWA and Android ICE endpoint'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

