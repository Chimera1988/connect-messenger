name: Connect PWA - fix video note orientation and circular progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-video-note-orientation-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-video-note-orientation-progress
  cancel-in-progress: false

jobs:
  fix-video-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PWA
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Apply isolated PWA video-note fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          style_path = Path('app/liquid-glass.css')
          page = page_path.read_text(encoding='utf-8')
          css = style_path.read_text(encoding='utf-8')

          marker = '// Connect video-note sound control v2'
          end_marker = '\ntype VideoNotePhase = '
          patch_id = '// Connect video-note orientation normalization v1'
          css_marker = '/* Connect video-note progress and external mute control v1 */'

          # Only patch the existing dedicated video-note player.
          if 'connect-video-note-progress' not in page:
              start = page.find(marker)
              end = page.find(end_marker, start)
              assert start >= 0 and end > start, 'VideoNoteBubble location has changed; refusing unsafe edit'
              old = page[start:end]
              assert 'function VideoNoteBubble' in old and 'connect-video-note-sound' in old and 'IntersectionObserver' in old, 'Unexpected video-note component'
              new = '''// Connect video-note sound control v3: round progress and mute below the circle
          function VideoNoteBubble({src,name}:{src:string;name:string}) {
            const ref=useRef<HTMLVideoElement|null>(null);
            const [muted,setMuted]=useState(true);
            const [duration,setDuration]=useState(0);
            const [progress,setProgress]=useState(0);
            const userPaused=useRef(false),mutedRef=useRef(true);
            useEffect(()=>{
              const video=ref.current;
              if(!video)return;
              userPaused.current=false;
              mutedRef.current=true;
              video.muted=true;setMuted(true);setProgress(0);
              let inView=false;
              function update(){
                if(!video)return;
                if(inView&&document.visibilityState==='visible'&&!userPaused.current){
                  video.muted=mutedRef.current;
                  void video.play().catch(()=>{});
                }else{
                  video.pause();
                }
              }
              const observer=new IntersectionObserver(entries=>{
                inView=Boolean(entries[0]?.isIntersecting);update();
              },{root:video.closest<HTMLElement>('.message-scroll'),threshold:.35});
              observer.observe(video);
              document.addEventListener('visibilitychange',update);
              return()=>{
                observer.disconnect();document.removeEventListener('visibilitychange',update);
                video.pause();video.muted=true;
              };
            },[src]);
            const circumference=2*Math.PI*47;
            return <div className="connect-video-note">
              <div className="connect-video-note-media">
                <button type="button" className="connect-video-note-screen" aria-label="Приостановить или продолжить видеокружок"
                  onClick={event=>{
                    event.stopPropagation();const video=ref.current;if(!video)return;
                    userPaused.current=!video.paused;
                    if(video.paused)void video.play().catch(()=>{});else video.pause();
                  }}>
                  <video ref={ref} src={src} muted={muted} autoPlay playsInline loop preload="metadata" aria-label={name}
                    onLoadedMetadata={event=>{const d=event.currentTarget.duration;if(Number.isFinite(d)&&d>0)setDuration(d)}}
                    onTimeUpdate={event=>{const v=event.currentTarget;const d=v.duration;if(Number.isFinite(d)&&d>0)setProgress(Math.max(0,Math.min(1,v.currentTime/d)))}}
                    onSeeked={event=>{const v=event.currentTarget;const d=v.duration;if(Number.isFinite(d)&&d>0)setProgress(Math.max(0,Math.min(1,v.currentTime/d)))}}/>
                </button>
                <svg className="connect-video-note-progress" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                  <circle className="connect-video-note-progress-track" cx="50" cy="50" r="47" fill="none" strokeWidth="2.7"/>
                  <circle className="connect-video-note-progress-fill" cx="50" cy="50" r="47" fill="none" strokeWidth="2.7"
                    strokeDasharray={circumference} strokeDashoffset={circumference*(1-progress)}/>
                </svg>
                {duration>0&&<span className="connect-video-note-length">{Math.floor(duration/60)}:{String(Math.floor(duration%60)).padStart(2,'0')}</span>}
              </div>
              <div className="connect-video-note-controls">
                <button type="button" className="connect-video-note-sound" aria-label={muted?'Включить звук видеокружка':'Выключить звук видеокружка'}
                  title={muted?'Включить звук':'Выключить звук'}
                  onClick={event=>{
                    event.stopPropagation();const video=ref.current;if(!video)return;
                    const next=!video.muted;mutedRef.current=next;video.muted=next;setMuted(next);
                    if(!next)void video.play().catch(()=>{});
                  }}><ConnectSoundGlyph muted={muted}/></button>
              </div>
            </div>;
          }
          '''
              page = page[:start] + new + page[end:]
              print('Applied videonote circular progress and external sound button')
          else:
              print('VideoNoteBubble progress patch already applied')

          # Bake orientation into actual encoded pixels (square canvas), instead
          # of relying on mobile MP4/WebM rotation metadata that other players
          # and Android versions interpret differently. Only NEW PWA recordings.
          if patch_id not in page:
              anchor = "  const savedRef=useRef<File|null>(null);"
              assert page.count(anchor)==1, 'VideoNoteRecorder savedRef anchor changed'
              page = page.replace(anchor, anchor + '''
            // Connect video-note orientation normalization v1
            const normalizedStreamRef=useRef<MediaStream|null>(null);
            const frameRequestRef=useRef<number|null>(null);''', 1)

              anchor = '  function clearClock(){if(timerRef.current!==null){window.clearInterval(timerRef.current);timerRef.current=null;}}'
              assert page.count(anchor)==1, 'VideoNoteRecorder timer anchor changed'
              page = page.replace(anchor, anchor + '''
            function stopNormalizedFrames(){
              if(frameRequestRef.current!==null){window.cancelAnimationFrame(frameRequestRef.current);frameRequestRef.current=null;}
              normalizedStreamRef.current?.getTracks().forEach(track=>track.stop());
              normalizedStreamRef.current=null;
            }
            function normalizedRecordingStream(camera:MediaStream):MediaStream{
              const source=live.current;
              if(!source || !source.videoWidth || !source.videoHeight)throw Error('Камера ещё не готова, повторите запись');
              const canvas=document.createElement('canvas');
              canvas.width=480;canvas.height=480;
              const context=canvas.getContext('2d',{alpha:false});
              if(!context)throw Error('Не удалось подготовить запись видео');
              // Preserve recording on older browsers that lack canvas.captureStream.
              if(typeof canvas.captureStream!=='function')return camera;
              const draw=()=>{
                if(source.readyState>=2&&source.videoWidth>0&&source.videoHeight>0){
                  const crop=Math.min(source.videoWidth,source.videoHeight);
                  const x=(source.videoWidth-crop)/2;
                  const y=(source.videoHeight-crop)/2;
                  context.drawImage(source,x,y,crop,crop,0,0,480,480);
                }
                frameRequestRef.current=window.requestAnimationFrame(draw);
              };
              draw();
              const pixels=canvas.captureStream(24);
              normalizedStreamRef.current=pixels;
              const track=pixels.getVideoTracks()[0];
              if(!track)throw Error('Не удалось получить видео для записи');
              return new MediaStream([track,...camera.getAudioTracks()]);
            }''',1)

              anchor = '      stopCamera();\n      if(previewRef.current)URL.revokeObjectURL(previewRef.current);'
              assert page.count(anchor)==1, 'VideoNoteRecorder unmount cleanup changed'
              page = page.replace(anchor, '      stopNormalizedFrames();\n' + anchor, 1)

              anchor = '      const recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:800000,audioBitsPerSecond:64000});'
              assert page.count(anchor)==1, 'VideoNoteRecorder MediaRecorder initialization changed'
              page = page.replace(anchor, '''      const recordingStream=normalizedRecordingStream(stream);
                const recorder=new MediaRecorder(recordingStream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:800000,audioBitsPerSecond:64000});''',1)

              anchor = "      recorder.onerror=()=>{setError('Ошибка записи видео');setPhase('error');clearClock();stopCamera()};"
              assert page.count(anchor)==1, 'VideoNoteRecorder onerror changed'
              page = page.replace(anchor, "      recorder.onerror=()=>{setError('Ошибка записи видео');setPhase('error');clearClock();stopNormalizedFrames();stopCamera()};",1)

              anchor = '        clearClock();stopCamera();'
              assert page.count(anchor)==1, 'VideoNoteRecorder onstop changed'
              page = page.replace(anchor, '        clearClock();stopNormalizedFrames();stopCamera();',1)

              anchor = "    }catch(e){setError(e instanceof Error?e.message:'Не удалось начать запись');setPhase('error')}"
              assert page.count(anchor)==1, 'VideoNoteRecorder start error handler changed'
              page = page.replace(anchor, "    }catch(e){stopNormalizedFrames();setError(e instanceof Error?e.message:'Не удалось начать запись');setPhase('error')}",1)
              print('Applied recorded-pixel orientation normalization for new PWA videonotes')
          else:
              print('Orientation normalization already applied')

          if css_marker not in css:
              css += '''

          /* Connect video-note progress and external mute control v1 */
          /* Keep the video and its progress ring circular, but put the sound
             button in a separate row BELOW the video: never overlay the face. */
          .connect-app .bubble.video-note-bubble .connect-video-note {
            display: flex !important;
            flex-direction: column !important;
            position: relative !important;
            width: 100% !important;
            height: auto !important;
            aspect-ratio: auto !important;
            margin-right: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-media {
            position: relative !important;
            display: block !important;
            flex: 0 0 auto !important;
            width: 100% !important;
            aspect-ratio: 1 / 1 !important;
            overflow: visible !important;
            border-radius: 50% !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-media > .connect-video-note-screen {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            border-radius: 50% !important;
            z-index: 1 !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-progress {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: visible !important;
            pointer-events: none !important;
            transform: rotate(-90deg);
            z-index: 3 !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-progress-track {
            stroke: rgba(255,255,255,.34);
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-progress-fill {
            stroke: var(--accent, #087dff);
            stroke-linecap: round;
            transition: stroke-dashoffset .19s linear;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-media > .connect-video-note-length {
            z-index: 4 !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-controls {
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            width: 100% !important;
            height: 36px !important;
            margin: 5px 0 0 !important;
            padding: 0 2px !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-controls > .connect-video-note-sound {
            position: static !important;
            inset: auto !important;
            display: grid !important;
            place-items: center !important;
            flex: 0 0 34px !important;
            width: 34px !important;
            height: 34px !important;
            min-width: 34px !important;
            min-height: 34px !important;
            margin: 0 !important;
            padding: 0 !important;
            transform: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            z-index: 2 !important;
            border-radius: 50% !important;
            background: rgba(8,15,25,.72) !important;
            color: #fff !important;
          }
          '''
              print('Added isolated videonote CSS; normal media styling untouched')
          else:
              print('CSS patch already applied')

          page_path.write_text(page, encoding='utf-8')
          style_path.write_text(css, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Commit only the targeted PWA change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/liquid-glass.css
          if git diff --cached --quiet; then
            echo 'Already applied: no changes to commit'
            exit 0
          fi
          git commit -m 'fix(pwa): correct video notes orientation and add circular progress'
          git push origin HEAD:main
