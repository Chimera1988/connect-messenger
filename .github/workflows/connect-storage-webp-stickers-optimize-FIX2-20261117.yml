name: Connect Storage | Optimize linked large WebP stickers 2026-11-17
'on':
  workflow_dispatch:
    inputs:
      apply:
        description: Apply verified optimization (false = read-only audit)
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: connect-storage-optimize-stickers-20261117
  cancel-in-progress: false
jobs:
  compress-linked-webp:
    name: Safely compress and relink WebP in Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout Connect PWA source before verifying repository files
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Verify guarded Connect project and main
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REPOSITORY" = ''Chimera1988/connect-messenger''

        test "$GITHUB_REF" = ''refs/heads/main''

        test -s package.json

        test -s app/page.tsx

        printf ''Only Supabase connect-stickers is eligible; original files will be retained.\n''

        '
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned image codec and HTTP library
      shell: bash
      run: 'set -euo pipefail

        python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0 requests==2.32.5

        '
    - name: Prepare isolated optimizer and regression tests
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/connect-webp-opt\"\ncat > \"$RUNNER_TEMP/connect-webp-opt/optimize_stickers.py\" <<'CONNECT_WEBP_OPT_SRC'\n\"\"\"Safe, idempotent optimization of linked Connect WebP stickers.\n\nWrites a versioned object, reads back, atomically re-points a single matching\nsticker DB row. Originals remain untouched until old APKs are upgraded.\n\"\"\"\nimport os\nimport re\nimport io\nimport json\nimport hashlib\nfrom pathlib import Path\nfrom urllib.parse import quote\nimport requests\nfrom PIL import Image, ImageOps, ImageChops\n\nPROJECT='https://tpwkmoxxzjfdsqsomhhr.supabase.co'\nBUCKET='connect-stickers'\nMARK='__webpopt26'\nMAX_SRC=3*1024*1024\nTHRESHOLD=500000\nALLOWED_PATH=re.compile(r'^[a-f0-9-]{36}/[a-f0-9-]{36}/[a-f0-9-]{36}\\.webp$',re.I)\n\ndef hash8(data):return hashlib.sha256(data).hexdigest()[:8]\n\ndef converted(source):\n    \"\"\"Return validated compressed WebP bytes or None; avoid animation corruption.\"\"\"\n    if not (THRESHOLD < len(source) <= MAX_SRC): return None\n    with Image.open(io.BytesIO(source)) as im:\n        if im.format!='WEBP' or getattr(im,'n_frames',1)!=1: return None\n        rgba=ImageOps.exif_transpose(im).convert('RGBA')\n        original_size=rgba.size\n        if max(rgba.size)>512:\n            rgba.thumbnail((512,512),Image.Resampling.LANCZOS)\n        original_alpha=rgba.getchannel('A')\n        options=[]\n        for quality in (82,76):\n            buf=io.BytesIO()\n            rgba.save(buf,format='WEBP',method=6,quality=quality,exact=True)\n            result=buf.getvalue()\n            if len(result)>=len(source)*0.85:continue\n            try:\n                with Image.open(io.BytesIO(result)) as decoded:\n                    if decoded.format!='WEBP' or decoded.size!=rgba.size or getattr(decoded,'n_frames',1)!=1:continue\n                    if ImageChops.difference(original_alpha,decoded.convert('RGBA').getchannel('A')).getbbox() is not None:continue\n            except Exception:continue\n            options.append((quality,result))\n        if not options:return None\n        # Prefer higher visual quality if it achieves a meaningful improvement.\n        return options[0][1]\n\nclass Supabase:\n    def __init__(self,key,transport=None):\n        assert len(key)>=20 and ('\\n' not in key),'Missing service role key'\n        self.transport=transport or requests.Session()\n        self.headers={'apikey':key,'Authorization':'Bearer '+key}\n    def request(self,method,path,params=None,body=None,raw=None,headers=None,expected=(200,201)):\n        if not path.startswith('/') or path.startswith('//') or '?' in path:raise ValueError('Unsafe endpoint')\n        kw={'headers':{**self.headers,**(headers or {})},'timeout':90,'allow_redirects':False}\n        if params is not None:kw['params']=params\n        if body is not None:kw['json']=body\n        if raw is not None:kw['data']=raw\n        res=self.transport.request(method,PROJECT+path,**kw)\n        if res.status_code not in expected:raise RuntimeError(f'Supabase {method} {path.split(\"/\")[1]} HTTP {res.status_code}')\n        return res\n    def linked(self):\n        rows=self.request('GET','/rest/v1/connect_stickers',{'select':'id,storage_path','limit':'1000'}).json()\n        if not isinstance(rows,list) or len(rows)>1000:raise RuntimeError('Unexpected catalog schema')\n        return rows\n    def info(self,path):\n        return self.request('GET',f'/storage/v1/object/info/{BUCKET}/{quote(path,safe=\"/\")}',expected=(200,)).json()\n    def download(self,path):\n        res=self.request('GET',f'/storage/v1/object/authenticated/{BUCKET}/{quote(path,safe=\"/\")}')\n        if len(res.content)>MAX_SRC:raise RuntimeError('Downloaded object exceeds sticker source cap')\n        return res.content\n    def upload(self,path,data):\n        self.request('POST',f'/storage/v1/object/{BUCKET}/{quote(path,safe=\"/\")}',raw=data,headers={'Content-Type':'image/webp','x-upsert':'false','cache-control':'3600'})\n    def relink(self,sticker_id,old,new):\n        params={'id':'eq.'+sticker_id,'storage_path':'eq.'+old,'select':'id,storage_path'}\n        rows=self.request('PATCH','/rest/v1/connect_stickers',params=params,body={'storage_path':new},headers={'Prefer':'return=representation'}).json()\n        if not isinstance(rows,list) or len(rows)!=1 or rows[0].get('storage_path')!=new:\n            raise RuntimeError('Sticker changed concurrently; new optimized object preserved for review')\n        return rows\n\ndef run(api,apply):\n    rows=api.linked()\n    ids={r['id']:r['storage_path'] for r in rows if r.get('id') and r.get('storage_path')}\n    selected=[]\n    for identifier,path in ids.items():\n        if not ALLOWED_PATH.fullmatch(path) or MARK in path:continue\n        meta=api.info(path)\n        m=meta.get('metadata') or {}\n        size=int(m.get('size') or meta.get('size') or m.get('contentLength') or 0)\n        if size>THRESHOLD:\n            if size>MAX_SRC:raise RuntimeError('Unexpected oversized sticker; no mutations performed')\n            selected.append((identifier,path,size))\n    print('Linked WebP above 500,000 bytes:',len(selected),'apply:',bool(apply))\n    if len(selected)>6:raise RuntimeError('More than six candidate images: source drift, stop and review before changes')\n    saved=0;completed=0;skipped=0\n    for identifier,old,size in selected:\n        orig=api.download(old)\n        if len(orig)!=size:raise RuntimeError('Storage size changed since preflight; halt')\n        result=converted(orig)\n        if not result:\n            print('SKIP insufficient safe savings',hash8(orig),'original',size)\n            skipped+=1;continue\n        new=old[:-5]+MARK+'.webp'\n        print('READY',hash8(orig),'from',size,'to',len(result),'saved',size-len(result),'bytes')\n        if not apply:continue\n        # Versioned upload; never mutate an existing object or break signed old URLs.\n        # A retry after a network interruption may find the new path already present.\n        # Storage returns 400 or 409 depending on duplicate handling; verify bytes\n        # before reusing it, never upsert and never infer success from HTTP status.\n        try:\n            api.upload(new,result)\n        except RuntimeError as error:\n            if 'HTTP 400' not in str(error) and 'HTTP 409' not in str(error):raise\n        existing=api.download(new)\n        if existing!=result:raise RuntimeError('Optimized object read-back mismatch; old pointer retained')\n        api.relink(identifier,old,new)\n        saved+=size-len(result);completed+=1\n        print('RELINK VERIFIED',hash8(result))\n    print(json.dumps({'candidates':len(selected),'optimized':completed,'skipped':skipped,'savedBytes':saved,'retainedOriginalsForOldClients':True},ensure_ascii=False))\n    return {'candidates':len(selected),'optimized':completed,'skipped':skipped,'savedBytes':saved}\n\nif __name__=='__main__':\n    key=os.environ.get('SUPABASE_SERVICE_ROLE_KEY','')\n    if not key:raise SystemExit('SUPABASE_SERVICE_ROLE_KEY is missing from PWA GitHub Actions secrets; no server writes performed')\n    apply=os.environ.get('CONNECT_APPLY','true').lower()=='true'\n    run(Supabase(key),apply=apply)\nCONNECT_WEBP_OPT_SRC\ncat > \"$RUNNER_TEMP/connect-webp-opt/test_optimize.py\" <<'CONNECT_WEBP_OPT_TEST'\nimport unittest, io\nfrom PIL import Image\nfrom optimize_stickers import converted, run, THRESHOLD\nfrom unittest.mock import patch\nclass ConversionTests(unittest.TestCase):\n def test_webp_converts_and_preserves_alpha(self):\n  im=Image.new('RGBA',(1024,1024))\n  import random\n  random.seed(2)\n  # Large pseudo photo with binary transparency to test alpha path.\n  px=im.load()\n  for y in range(1024):\n   for x in range(1024):\n    a=255 if (x+y)%7 else 0\n    px[x,y]=(random.randrange(256),random.randrange(256),random.randrange(256),a)\n  b=io.BytesIO();im.save(b,format='WEBP',quality=100,method=4,lossless=True)\n  src=b.getvalue();self.assertGreater(len(src),THRESHOLD)\n  result=converted(src)\n  self.assertIsNotNone(result)\n  with Image.open(io.BytesIO(result)) as result_img:\n   self.assertEqual(result_img.format,'WEBP');self.assertEqual(result_img.size,(512,512))\n   self.assertLess(len(result),len(src)*0.85)\n def test_small_sticker_untouched(self):\n  im=Image.new('RGBA',(40,40),(255,0,0,30));b=io.BytesIO();im.save(b,format='WEBP')\n  self.assertIsNone(converted(b.getvalue()))\n def test_animated_is_skipped(self):\n  frames=[Image.new('RGBA',(512,512),(x*45,0,0,255)) for x in range(4)]\n  b=io.BytesIO();frames[0].save(b,format='WEBP',save_all=True,append_images=frames[1:],duration=100,loop=0)\n  self.assertIsNone(converted(b.getvalue()))\nclass FakeSupabase:\n def __init__(self,blob):self.blob=blob;self.requests=[];self.files={};self.pointer='aaaa0000-aaaa-4aaa-8aaa-aaaaaaaaaaaa/bbbb0000-bbbb-4bbb-8bbb-bbbbbbbbbbbb/cccc0000-cccc-4ccc-8ccc-cccccccccccc.webp'\n def linked(self):return [{'id':'dddd0000-dddd-4ddd-8ddd-dddddddddddd','storage_path':self.pointer}]\n def info(self,path):\n  if path!=self.pointer and path not in self.files:raise RuntimeError('HTTP 404')\n  return {'metadata':{'size':len(self.blob)}}\n def download(self,path):return self.files.get(path,self.blob)\n def upload(self,path,data):self.requests.append(('upload',path));self.files[path]=data\n def relink(self,id,old,new):self.requests.append(('relink',old,new));self.pointer=new\nclass WorkflowTests(unittest.TestCase):\n def test_readonly_audit_never_writes(self):\n  stub=FakeSupabase(b'abc'*200000)\n  with patch('optimize_stickers.converted',return_value=b'optimized data'):\n   res=run(stub,False)\n  self.assertEqual(stub.requests,[]);self.assertEqual(res['optimized'],0)\n def test_source_drift_does_not_mutate(self):\n  stub=FakeSupabase(b'xyz'*200000)\n  stub.info=lambda path: {'metadata':{'size':1000001}}\n  with self.assertRaises(RuntimeError):run(stub,True)\n  self.assertEqual(stub.requests,[])\n def test_apply_writes_versioned_object_and_switches_pointer_after_readback(self):\n\
        \  stub=FakeSupabase(b'abc'*200000)\n  with patch('optimize_stickers.converted',return_value=b'valid-optimized'):\n   result=run(stub,True)\n  self.assertEqual(result['optimized'],1)\n  self.assertEqual(stub.requests[0][0],'upload')\n  self.assertEqual(stub.requests[1][0],'relink')\n  self.assertIn('__webpopt26.webp',stub.pointer)\n  self.assertEqual(stub.blob,b'abc'*200000)\n def test_apply_never_relinks_when_download_verification_fails(self):\n  stub=FakeSupabase(b'abc'*200000)\n  def bad_download(path):return b'corrupted' if '__webpopt26' in path else stub.blob\n  stub.download=bad_download\n  with patch('optimize_stickers.converted',return_value=b'valid-optimized'):\n   with self.assertRaises(RuntimeError):run(stub,True)\n  self.assertEqual([x[0] for x in stub.requests],['upload'])\nif __name__=='__main__':unittest.main()\nCONNECT_WEBP_OPT_TEST\npython -m py_compile \"$RUNNER_TEMP/connect-webp-opt/optimize_stickers.py\" \"$RUNNER_TEMP/connect-webp-opt/test_optimize.py\"\n"
    - name: Test compression, alpha, unchanged originals, atomic relinking
      shell: bash
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP/connect-webp-opt"

        python -m unittest -q test_optimize.py

        '
    - name: Optimize only linked heavy WebP (no source deletion)
      shell: bash
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CONNECT_APPLY: ${{ inputs.apply }}
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP/connect-webp-opt"

        python optimize_stickers.py

        '
