# Connect Messenger PWA | FIX4 | exact reference-like voice row and one geometry-safe video circle
# Replace .github/workflows/connect-pwa-gallery-video-transcript.yml with this file.
# Only two source files are modified; existing Android, E2EE and Supabase remain untouched.
name: Connect PWA — exact voice & video layout FIX4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-gallery-video-transcript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-media-geometry-fix4-${{ github.ref }}
  cancel-in-progress: false

