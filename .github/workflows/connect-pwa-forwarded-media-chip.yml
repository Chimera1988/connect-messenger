# Connect PWA — forwarded media: compact "от ..." chip and natural media size.
# Upload to: .github/workflows/connect-pwa-forwarded-media-chip.yml
# Target: forwarded photos, ordinary videos and albums only. Video circles stay unchanged.
name: Connect PWA — forwarded media chip and sizing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-forwarded-media-chip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-forwarded-media-chip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current PWA main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused forwarded-media CSS patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/connect-media-frame-overlay.css')
          unified = Path('app/connect-unified-chat.css')
          page = Path('app/page.tsx')
          marker = 'CONNECT_PWA_FORWARDED_MEDIA_CHIP_V1_20261112'

          if not all(p.is_file() for p in (path, unified, page)):
              raise SystemExit('Required Connect PWA source files are missing; stopping without changing anything.')
          current = path.read_text(encoding='utf-8')
          unified_css = unified.read_text(encoding='utf-8')
          page_source = page.read_text(encoding='utf-8')
          if marker in current:
              print('Forwarded-media chip is already installed (no changes).')
              raise SystemExit(0)

          required = [
              ('existing media-frame update', 'CONNECT_PWA_MEDIA_FRAME_OVERLAY_V1_20261112' in current),
              ('existing forwarding layout', '.connect-forward-compact' in unified_css),
              ('forwarded message element', 'className="connect-forward-compact"' in page_source),
              ('photo renderer', 'connect-adaptive-photo' in page_source),
              ('ordinary video renderer', 'connect-adaptive-video' in page_source),
              ('album renderer', 'connect-album-grid' in page_source),
          ]
          missing = [name for name, exists in required if not exists]
          if missing:
              raise SystemExit('PWA source does not match the verified baseline: '+', '.join(missing))

          css = r'''
          /* CONNECT_PWA_FORWARDED_MEDIA_CHIP_V1_20261112
           * Media preview sizing is identical for forwarded and ordinary media.
           * The forwarding label is removed from intrinsic width calculations.
           * Only forwarded images, regular videos, and albums are affected.
           */
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble):not(.sticker-bubble):has(> .bubble-body > .connect-forward-compact) > .bubble-body {
            box-sizing: border-box !important;
            position: relative !important;
            padding-top: 33px !important;
            margin: 0 !important;
            min-width: 0 !important;
            max-width: 100% !important;
            overflow: visible !important;
          }

          /* Single photos and regular videos keep their original responsive width.
             A long sender name must not expand the image or its containing bubble. */
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble):has(> .bubble-body > .connect-forward-compact):has(.connect-adaptive-photo) > .bubble-body,
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble):has(> .bubble-body > .connect-forward-compact):has(.connect-adaptive-video) > .bubble-body {
            width: fit-content !important;
            max-width: 100% !important;
          }
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble):has(> .bubble-body > .connect-forward-compact):has(.connect-album-grid) > .bubble-body {
            width: 100% !important;
            max-width: 100% !important;
          }

          /* Match the existing time/check pill, but keep the forward label ABOVE
             the image, not on top of it. The image maintains its existing thin border. */
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble):not(.sticker-bubble) > .bubble-body > .connect-forward-compact {
            box-sizing: border-box !important;
            position: absolute !important;
            z-index: 10 !important;
            top: 0 !important;
            left: 0 !important;
            right: auto !important;
            bottom: auto !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            width: max-content !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: auto !important;
            min-height: 24px !important;
            margin: 0 !important;
            padding: 4px 8px !important;
            gap: 5px !important;
            border: 1px solid rgba(229,240,255,.15) !important;
            border-radius: 10px !important;
            background: rgba(12,18,29,.76) !important;
            color: #f4f7fd !important;
            box-shadow: 0 1px 5px rgba(0,0,0,.16) !important;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            opacity: 1 !important;
            font-size: 11px !important;
            font-weight: 550 !important;
            line-height: 1.2 !important;
            white-space: nowrap !important;
          }
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble) > .bubble-body > .connect-forward-compact svg {
            display: block !important;
            flex: 0 0 15px !important;
            width: 15px !important;
            height: 15px !important;
            color: inherit !important;
          }
          .connect-app .message-row .bubble.connect-unified-media:not(.video-note-bubble) > .bubble-body > .connect-forward-compact span {
            min-width: 0 !important;
            max-width: 100% !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
          }
          '''

          path.write_text(current.rstrip() + '\n\n' + css.strip() + '\n', encoding='utf-8')
          print('Applied forwarded-media label chip and original media sizing; other message types unchanged.')
          PY
          git diff --check

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and supported Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: TypeScript, regression tests, production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Publish after successful checks only
        shell: bash
        run: |
          set -euo pipefail
          git add app/connect-media-frame-overlay.css
          if git diff --cached --quiet; then
            echo 'No changes to commit; PWA is already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: compact forwarding label and natural media sizing [skip ci]'
          git push origin HEAD:main
