name: Connect PWA | Restore real voice waveforms (2026-11-16)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-wave-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-pwa-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify target repository and source files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          for file in AGENTS.md app/page.tsx lib/chat-media-presentation.ts lib/media-cache.ts package.json package-lock.json; do
            test -s "$file" || { echo "SOURCE_DRIFT: missing $file"; exit 1; }
          done
          test -z "$(git status --porcelain)" || { echo "Unexpected dirty working tree"; exit 1; }

      - name: Setup Node.js 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium matching playwright-core
        run: npx playwright-core install --with-deps chromium

      - name: Check Chromium executable
        run: node -e "const fs=require('fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))process.exit(1)"

      - name: Apply guarded PWA-only waveform fix and add regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/voice_wave_patch.py" <<'CONNECT_VOICE_WAVE_PATCH_PY'
          #!/usr/bin/env python3
          """Guarded PWA voice waveform restoration without mass media downloads."""
          from pathlib import Path

          PAGE = Path('app/page.tsx')
          LIB = Path('lib/chat-media-presentation.ts')
          PKG = Path('package.json')
          TEST = Path('tests/pwa-voice-waveform.test.cjs')
          MARK = 'CONNECT_PWA_VOICE_WAVE_LAZY_RESTORE_20261116'


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'SOURCE_DRIFT ({label}): expected 1 exact anchor, got {count}')
              return text.replace(old, new, 1)


          def patch_page(src: str) -> str:
              src = replace_once(src,
                  'const VoicePlayer = memo(function VoicePlayer({ src, path, sentAt, mine, delivered, read, fileName, onSave }: { src:string;path:string;sentAt:string;mine:boolean;delivered:boolean;read:boolean;fileName?:string;onSave?:()=>void }) {',
                  'const VoicePlayer = memo(function VoicePlayer({ src, path, byteSize, sentAt, mine, delivered, read, fileName, onSave }: { src:string;path:string;byteSize?:number;sentAt:string;mine:boolean;delivered:boolean;read:boolean;fileName?:string;onSave?:()=>void }) {',
                  'VoicePlayer props')
              old = '''  useEffect(() => {
              const cached = isNativeMediaRuntime()?voiceWaveformCache.get(path):readChatWave(waveOwner,path);
              if (cached) { setBars(cached.bars); setDuration(cached.duration); }
              else { setBars(Array(43).fill(0.28)); setDuration(0); }
              // Never fetch or decode an audio file during initial chat render.
              // Decoding 80 recordings at once blocked the very first play and text send.
            }, [path,waveOwner]);'''
              new = '''  // CONNECT_PWA_VOICE_WAVE_LAZY_RESTORE_20261116
            useEffect(() => {
              const syncWave=()=>{
                const saved=isNativeMediaRuntime()?voiceWaveformCache.get(path):readChatWave(waveOwner,path);
                if(saved){setBars(saved.bars);setDuration(saved.duration);return true;}
                return false;
              };
              if(syncWave())return;
              setBars(Array(43).fill(0.28));setDuration(0);
              // Only a small, visible audio item can trigger a waveform download.
              // Never walk the entire history or decode on chat mount.
              if(isNativeMediaRuntime()||!waveOwner||!path||!src||!byteSize||byteSize>2*1024*1024)return;
              let disposed=false;
              const updated=(event:Event)=>{
                const detail=(event as CustomEvent<{user:string;path:string}>).detail;
                if(!disposed&&detail?.user===waveOwner&&detail.path===path)syncWave();
              };
              window.addEventListener('connect:chat-wave',updated);
              const generate=async()=>{
                try{
                  // Shares the existing bounded media-cache job with the audio prefetch;
                  // no second full-object GET if it was already being cached.
                  if(byteSize<=1024*1024)await prefetchChatAudio(src,waveOwner,byteSize);
                  if(disposed)return;
                  const identity='/storage/v1/object/sign/connect-attachments/'+path;
                  const local=await resolveCachedMedia(identity,waveOwner).catch(()=>identity);
                  if(disposed)return;
                  await prewarmChatWave(waveOwner,path,local.startsWith('blob:')?local:src,byteSize);
                  if(!disposed)syncWave();
                }catch{/* Waveform is optional; playback must remain available. */}
              };
              const node=audioRef.current?.parentElement;
              if(typeof IntersectionObserver==='undefined'||!node){void generate();return()=>{disposed=true;window.removeEventListener('connect:chat-wave',updated);};}
              const observer=new IntersectionObserver(entries=>{
                if(entries.some(entry=>entry.isIntersecting)){observer.disconnect();void generate();}
              },{root:node.closest('.message-scroll'),rootMargin:'100px 0px'});
              observer.observe(node);
              return()=>{disposed=true;observer.disconnect();window.removeEventListener('connect:chat-wave',updated);};
            }, [src,path,waveOwner,byteSize]);'''
              src = replace_once(src, old, new, 'wave effect')
              old = '''      file=prepared.file;
                // The dimensions travel with the storage path, so the recipient can reserve'''
              new = '''      file=prepared.file;
                // Locally recorded PWA audio already exists in memory: build its wave
                // without downloading the uploaded object again.
                if(kind==='audio'&&!isNativeMediaRuntime()&&file.size>0&&file.size<=2*1024*1024){
                  const localVoiceUrl=URL.createObjectURL(file);
                  void prewarmChatWave(user.id,path,localVoiceUrl,file.size).finally(()=>URL.revokeObjectURL(localVoiceUrl));
                }
                // The dimensions travel with the storage path, so the recipient can reserve'''
              src = replace_once(src, old, new, 'outgoing local file waveform')
              src = replace_once(src,
                '<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} sentAt={m.created_at} mine={mine} delivered=',
                '<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} byteSize={m.attachment_size||0} sentAt={m.created_at} mine={mine} delivered=',
                'received/sent voice bubble size')
              src = replace_once(src,
                '<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} sentAt={m.created_at} mine={mine} fileName=',
                '<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} byteSize={m.attachment_size||0} sentAt={m.created_at} mine={mine} fileName=',
                'audio file size')
              return src


          def patch_lib(src: str) -> str:
              src = replace_once(src,
                "  try{localStorage.setItem(key,JSON.stringify(normalized));}catch{/* UI still works without persistent storage. */}\n}",
                "  try{localStorage.setItem(key,JSON.stringify(normalized));}catch{/* UI still works without persistent storage. */}\n  if(typeof window!=='undefined')window.dispatchEvent(new CustomEvent('connect:chat-wave',{detail:{user,path}}));\n}",
                'waveform state notification')
              old = '''/** Compute wave peaks for a small voice file before the chat becomes visible.
           * Large/remote audio still loads on demand. Never preload full-size video here.
           */
          export async function prewarmChatWave(user:string,path:string,src:string,size:number=0):Promise<void>{
            if(isNativeMediaRuntime()||!user||!path||!src||size<=0||readChatWave(user,path)||size>2*1024*1024)return;
            let context:AudioContext|null=null;
            try{
              const controller=new AbortController();
              const timeout=setTimeout(()=>controller.abort(),7000);
              let bytes:ArrayBuffer;
              try{
                const response=await fetch(src,{signal:controller.signal});
                if(!response.ok) return;
                const length=Number(response.headers.get('content-length')||0);
                if(length>2*1024*1024)return;
                bytes=await response.arrayBuffer();
                if(bytes.byteLength>2*1024*1024)return;
              }finally{clearTimeout(timeout);}
              context=new AudioContext();
              const decoded=await context.decodeAudioData(bytes);
              const samples=decoded.getChannelData(0),count=43;
              const peaks=Array.from({length:count},(_,i)=>{
                const start=Math.floor(i*samples.length/count),end=Math.max(start+1,Math.floor((i+1)*samples.length/count));
                const stride=Math.max(1,Math.floor((end-start)/140));let peak=0;
                for(let j=start;j<end;j+=stride)peak=Math.max(peak,Math.abs(samples[j]||0));
                return peak;
              });
              const max=Math.max(.001,...peaks);
              rememberChatWave(user,path,{bars:peaks.map(x=>Math.max(.14,Math.min(1,Math.pow(x/max,.72)))),duration:decoded.duration});
            }catch{/* Audio decode is optional; playback retains its network fallback. */}
            finally{if(context)void context.close().catch(()=>{});}
          }'''
              new = '''// CONNECT_PWA_VOICE_WAVE_LAZY_RESTORE_20261116
          // At most two parallel decodes; one promise per stable storage path.
          // Waveform cache is account-scoped and contains just 43 amplitudes + duration.
          const wavePending=new Map<string,Promise<void>>();
          const waveQueue:Array<()=>void>=[];
          let activeWaveJobs=0;
          function scheduleWave(task:()=>Promise<void>):Promise<void>{
            return new Promise<void>(resolve=>{
              const start=()=>{
                activeWaveJobs++;
                void task().finally(()=>{
                  activeWaveJobs--;
                  resolve();
                  const next=waveQueue.shift();if(next)next();
                });
              };
              if(activeWaveJobs<2)start();else waveQueue.push(start);
            });
          }
          /** Decode small voice messages only when visible or already held locally.
           * The caller must not run this for every message in loaded history.
           */
          export function prewarmChatWave(user:string,path:string,src:string,size:number=0):Promise<void>{
            if(isNativeMediaRuntime()||!user||!path||!src||size<=0||size>2*1024*1024||readChatWave(user,path))return Promise.resolve();
            const key=user+':'+path;
            const existing=wavePending.get(key);
            if(existing)return existing;
            const job=scheduleWave(async()=>{
              if(readChatWave(user,path))return;
              let context:AudioContext|null=null;
              try{
                const controller=new AbortController();
                const timeout=setTimeout(()=>controller.abort(),7000);
                let bytes:ArrayBuffer;
                try{
                  const response=await fetch(src,{signal:controller.signal});
                  if(!response.ok)return;
                  const length=Number(response.headers.get('content-length')||0);
                  if(length>2*1024*1024)return;
                  bytes=await response.arrayBuffer();
                  if(bytes.byteLength>2*1024*1024)return;
                }finally{clearTimeout(timeout);}
                context=new AudioContext();
                const decoded=await context.decodeAudioData(bytes);
                const samples=decoded.getChannelData(0),count=43;
                const peaks=Array.from({length:count},(_,i)=>{
                  const start=Math.floor(i*samples.length/count),end=Math.max(start+1,Math.floor((i+1)*samples.length/count));
                  const stride=Math.max(1,Math.floor((end-start)/140));let peak=0;
                  for(let j=start;j<end;j+=stride)peak=Math.max(peak,Math.abs(samples[j]||0));
                  return peak;
                });
                const max=Math.max(.001,...peaks);
                rememberChatWave(user,path,{bars:peaks.map(x=>Math.max(.14,Math.min(1,Math.pow(x/max,.72)))),duration:decoded.duration});
              }catch{/* Waveform best effort; never affect playback. */}
              finally{if(context)void context.close().catch(()=>{});}
            });
            wavePending.set(key,job);
            void job.finally(()=>{if(wavePending.get(key)===job)wavePending.delete(key);});
            return job;
          }'''
              src = replace_once(src, old, new, 'lazy serialized waveform decoder')
              return src


          def patch_package(src: str) -> str:
              return replace_once(src,
                '"test": "node tests/crypto.test.cjs && ',
                '"test": "node tests/pwa-voice-waveform.test.cjs && node tests/crypto.test.cjs && ',
                'register waveform test in test suite')


          TEST_SOURCE = r'''// CONNECT_PWA_VOICE_WAVE_LAZY_RESTORE_20261116
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const ts=require('typescript');
          const path=require('node:path');

          const source=fs.readFileSync(path.join(__dirname,'../lib/chat-media-presentation.ts'),'utf8');
          const page=fs.readFileSync(path.join(__dirname,'../app/page.tsx'),'utf8');
          const compiled=ts.transpileModule(source,{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2020}}).outputText;
          const storage=new Map();
          let fetches=0;
          let events=0;
          const samples=new Float32Array(430);
          for(let i=0;i<samples.length;i++)samples[i]=Math.sin(i)*((Math.floor(i/10)%8+1)/8);
          class AudioContextFake {
            async decodeAudioData(buffer){assert.ok(buffer.byteLength>0);return {duration:4.3,getChannelData(){return samples;}};}
            async close(){}
          }
          const context={
            exports:{},AudioContext:AudioContextFake,AbortController,Promise,Map,Array,Math,Number,JSON,
            setTimeout,clearTimeout,
            window:{dispatchEvent(event){if(event.type==='connect:chat-wave')events++;}},
            CustomEvent:class {constructor(type,options){this.type=type;this.detail=options.detail;}},
            localStorage:{getItem:key=>storage.get(key)||null,setItem:(key,value)=>storage.set(key,value)},
            fetch:async ()=>{fetches++;await Promise.resolve();return {ok:true,headers:{get:()=>String(512)},arrayBuffer:async()=>new ArrayBuffer(512)};}
          };
          vm.runInNewContext(compiled,context,{filename:'chat-media-presentation.js'});
          const {readChatWave,prewarmChatWave}=context.exports;

          test('two calls for the same new voice share one fetch and render a non-uniform 43-bar wave',async()=>{
            await Promise.all([
              prewarmChatWave('alice','chat/voice.m4a','https://cdn.example/voice.m4a',512),
              prewarmChatWave('alice','chat/voice.m4a','https://cdn.example/voice.m4a',512),
            ]);
            const wave=readChatWave('alice','chat/voice.m4a');
            assert.ok(wave,'new voice must have cached waveform after decode');
            assert.equal(wave.bars.length,43);
            assert.ok(new Set(wave.bars.map(x=>Math.round(x*100))).size>4,'voice amplitude must vary');
            assert.equal(wave.duration,4.3);
            assert.equal(fetches,1,'concurrent decode must not duplicate egress');
            assert.equal(events,1,'mounted VoicePlayer must receive update');
          });

          test('waveform is saved per user and survives re-display without another request',async()=>{
            await prewarmChatWave('alice','chat/voice.m4a','https://cdn.example/voice.m4a',512);
            assert.equal(fetches,1);
            assert.ok(storage.has('connect-chat-wave-v1:alice:chat/voice.m4a'));
            assert.equal(readChatWave('bob','chat/voice.m4a'),null);
            await prewarmChatWave('bob','chat/voice.m4a','https://cdn.example/voice.m4a',512);
            assert.equal(fetches,2);
          });

          test('large and unknown-size audio is never automatically fetched for waveform',async()=>{
            await prewarmChatWave('alice','chat/large.m4a','https://cdn.example/large.m4a',2*1024*1024+1);
            await prewarmChatWave('alice','chat/unknown.m4a','https://cdn.example/unknown.m4a',0);
            assert.equal(fetches,2);
          });

          test('PWA renders waves only when voice is visible and computes outgoing wave locally',()=>{
            assert.match(page,/CONNECT_PWA_VOICE_WAVE_LAZY_RESTORE_20261116/);
            assert.match(page,/new IntersectionObserver\(entries=>/);
            assert.match(page,/void prewarmChatWave\(user\.id,path,localVoiceUrl,file\.size\)/);
            assert.match(page,/\.finally\(\(\)=>URL\.revokeObjectURL\(localVoiceUrl\)\)/);
            assert.match(page,/byteSize=\{m\.attachment_size\|\|0\}/);
          });
          '''


          def main() -> None:
              for item in (PAGE, LIB, PKG):
                  if not item.is_file():
                      raise RuntimeError(f'SOURCE_DRIFT: missing {item}')
              original = {p:p.read_text() for p in (PAGE, LIB, PKG)}
              markers = [MARK in original[PAGE], MARK in original[LIB]]
              if any(markers):
                  if not all(markers) or not TEST.is_file() or 'pwa-voice-waveform.test.cjs' not in original[PKG]:
                      raise RuntimeError('PARTIAL_PATCH: workflow requires manual review')
                  if TEST.read_text() != TEST_SOURCE:
                      raise RuntimeError('PARTIAL_PATCH: waveform regression test differs')
                  print('Already applied: all markers and regression tests confirmed')
                  return
              if TEST.exists():
                  raise RuntimeError('SOURCE_DRIFT: waveform regression test path occupied')
              updated_page = patch_page(original[PAGE])
              updated_lib = patch_lib(original[LIB])
              updated_pkg = patch_package(original[PKG])
              assert updated_page.count(MARK)==1 and updated_lib.count(MARK)==1
              # Transaction-like: validate all source anchors before mutating any file.
              PAGE.write_text(updated_page)
              LIB.write_text(updated_lib)
              PKG.write_text(updated_pkg)
              TEST.write_text(TEST_SOURCE)
              print('PWA-only lazy wave patch and regression tests applied')


          if __name__ == '__main__':
              main()
          CONNECT_VOICE_WAVE_PATCH_PY
          python3 "$RUNNER_TEMP/voice_wave_patch.py"

      - name: Check patch whitespace and changed files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          # Only these PWA files may be changed by the patch.
          python3 - <<'PY_CHECK'
          import subprocess
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed=tracked|untracked
          allowed={'app/page.tsx','lib/chat-media-presentation.ts','package.json','tests/pwa-voice-waveform.test.cjs'}
          assert changed<=allowed, f'Unexpected changed files: {changed-allowed}'
          # Repeated workflow runs are allowed when the patch is already present.
          PY_CHECK

      - name: Run focused voice waveform regression
        run: node tests/pwa-voice-waveform.test.cjs

      - name: Type-check entire PWA
        run: npm run typecheck

      - name: Run full PWA regression suite
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Commit and publish only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx lib/chat-media-presentation.ts package.json tests/pwa-voice-waveform.test.cjs
          if git diff --cached --quiet; then
            echo 'All changes already present; nothing to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PWA: restore real voice waveforms without mass downloads'
          git push origin HEAD:main
