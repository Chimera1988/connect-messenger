name: Connect PWA - match chat header handset icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-header-call-icon.yml'

permissions:
  contents: write

concurrency:
  group: connect-pwa-header-call-icon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-header-call-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect PWA
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace ONLY the chat header call SVG
        shell: bash
        run: |
          test "${{ github.repository }}" = 'Chimera1988/connect-messenger' || exit 1
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_file = Path('components/ConnectAudioCalls.tsx')
          nav_file = Path('components/ConnectCallsHub.tsx')
          if not header_file.is_file() or not nav_file.is_file():
              raise SystemExit('Connect PWA call components not found; no files modified.')

          header = header_file.read_text(encoding='utf-8')
          nav = nav_file.read_text(encoding='utf-8')

          # The Calls tab is the source of truth for the shape of the handset.
          # Extract its first SVG path instead of drawing a different approximation.
          nav_match = re.search(
              r'function CallIcon\([^\n]*\n[ \t]*return <svg[^\n]*\n[ \t]*<path d="([^"]+)"[ \t]*/>',
              nav,
          )
          if not nav_match:
              raise SystemExit('Could not identify the Calls tab handset SVG. No files modified.')
          reference_path = nav_match.group(1)

          # Change ONLY Glyph.call, used by the button in the chat header.
          glyph_regex = re.compile(r'(?m)^([ \t]{4}call: )<path d="[^"]+"[ \t]*/>(,)[ \t]*$')
          if len(list(glyph_regex.finditer(header))) != 1:
              raise SystemExit('Header call icon has changed; no files modified.')
          updated = glyph_regex.sub(
              lambda m: f'{m.group(1)}<path d="{reference_path}"/>{m.group(2)}',
              header,
              count=1,
          )

          # Stroke width matches the Calls tab for the handset only.
          original_stroke = "strokeWidth: 1.9, strokeLinecap: 'round' as const"
          patched_stroke = "strokeWidth: name === 'call' ? 2.0 : 1.9, strokeLinecap: 'round' as const"
          if patched_stroke in updated:
              pass  # idempotent re-run
          elif updated.count(original_stroke) == 1:
              updated = updated.replace(original_stroke, patched_stroke, 1)
          else:
              raise SystemExit('Unexpected stroke setup; no files modified.')

          # Do not change the button, its onClick, other SVGs, CSS, or colors.
          if 'className="connect-call-trigger"' not in updated or "new Event('connect:audio-call:start')" not in updated:
              raise SystemExit('Call button behavior does not match expected code. No files modified.')
          if header != updated:
              header_file.write_text(updated, encoding='utf-8')
              print('Updated chat-header handset to match the Calls tab exactly.')
          else:
              print('Chat-header handset is already identical to the Calls tab.')
          PY
      - name: Check patch and TypeScript
        shell: bash
        run: |
          git diff --check
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit handset icon only
        shell: bash
        run: |
          git config user.name 'Connect PWA UI'
          git config user.email 'actions@users.noreply.github.com'
          git add components/ConnectAudioCalls.tsx
          if git diff --cached --quiet; then
            echo 'Header handset already matches Calls tab.'
          else
            git commit -m 'style: match chat header handset to calls tab SVG'
            git push origin HEAD:main
          fi
