name: Connect - combined music player and profile media galleries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-music-gallery-combined.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Connect
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install music player and profile galleries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,re
          
          def unpack(encoded):
              return zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          
          def once(text, old, new, label):
              if old in text:
                  if text.count(old)!=1: raise RuntimeError(f'{label}: expected one occurrence, got {text.count(old)}')
                  return text.replace(old,new,1)
              if new in text:
                  print(f'Already installed: {label}')
                  return text
              raise RuntimeError(f'{label}: unexpected source code, stopped before commit')
          
          component=unpack('')
          css=unpack('')
          page=Path('components/ConnectProfileMedia.tsx')
          layout=Path('app/layout.tsx')
          app=Path('app/page.tsx')
          style=Path('app/music-system.css')
          assert page.exists() and layout.exists() and app.exists(), 'Connect profile media must already be installed.'
          
          # Mount a single persistent audio element at app layout level.
          l=layout.read_text(encoding='utf-8')
          l=once(l,"import './profile-media.css';","import './profile-media.css';\nimport './music-system.css';",'player stylesheet import')
          l=once(l,"import ConnectSonicRunner from '../components/ConnectSonicRunner';","import ConnectSonicRunner from '../components/ConnectSonicRunner';\nimport { ConnectMusicProvider } from '../components/ConnectMusicSystem';",'global music provider import')
          l=once(l,'<body>{children}<InvitationCodes />','<body><ConnectMusicProvider>{children}</ConnectMusicProvider><InvitationCodes />','persistent audio provider layout')
          
          s=page.read_text(encoding='utf-8')
          s=once(s,"import * as tus from 'tus-js-client';","import * as tus from 'tus-js-client';\nimport { ConnectMusicLibrary } from './ConnectMusicSystem';",'profile media player import')
          # A previously uploaded minimal player may have been installed independently.
          s=s.replace("import ConnectMinimalMusicPlayer from './ConnectMinimalMusicPlayer';\n",'')
          start=s.index("        {kind === 'music' &&")
          end=s.index("\n      </>}",start)
          block=s[start:end]
          replacement="        {kind === 'music' && <ConnectMusicLibrary client={client} ownerId={userId} items={items} isOwner={isOwner} busy={busy} onRemove={song => { const item=items.find(x=>x.path===song.path); if(item) void remove(item); }}/>}"
          if 'ConnectMusicLibrary' in block:
              print('Music library already updated')
          elif 'ConnectMinimalMusicPlayer' in block or '<audio key={song.path}' in block:
              s=s[:start]+replacement+s[end:]
          else: raise RuntimeError('Unexpected music component; no changes committed')
          s=s.replace("  const [selectedSong, setSelectedSong] = useState<string | null>(null);\n",'')
          s=s.replace("      if (selectedSong === item.path) setSelectedSong(null);\n",'')
          s=s.replace("  const song = items.find(item => item.path === selectedSong) || items[0];\n",'')
          # Give galleries their own back/forward navigation without altering photo uploads.
          ref="  const [preview, setPreview] = useState<MediaItem | null>(null);"
          extra='''
            const swipeStart=useRef<{x:number;y:number}|null>(null);
            const navigatePreview=useCallback((direction:1|-1)=>{
              setPreview(old=>{
                if(!old || !items.length)return old;
                const current=items.findIndex(item=>item.path===old.path);
                return items[(Math.max(0,current)+direction+items.length)%items.length];
              });
            },[items]);
            useEffect(()=>{
              if(!preview)return;
              const onKey=(event:KeyboardEvent)=>{
                if(event.key==='ArrowLeft'){event.preventDefault();navigatePreview(-1);}
                else if(event.key==='ArrowRight'){event.preventDefault();navigatePreview(1);}
                else if(event.key==='Escape')setPreview(null);
              };
              window.addEventListener('keydown',onKey);
              return()=>window.removeEventListener('keydown',onKey);
            },[preview,navigatePreview]);'''
          s=once(s,ref,ref+extra,'gallery swipe and key handlers')
          old_video='<video src={item.url} playsInline controls preload="metadata" className="connect-profile-video-player" aria-label={item.name}/>'
          new_video='<button type="button" className="connect-profile-video-thumb" onClick={()=>setPreview(item)} aria-label={`Просмотреть ${item.name}`}><video src={item.url} preload="metadata" playsInline muted tabIndex={-1}/><span aria-hidden="true">▶</span></button>'
          s=once(s,old_video,new_video,'video gallery thumbnails')
          if 'connect-gallery-nav' not in s:
              start=s.index('    {preview && <div className="connect-profile-photo-overlay"')
              end=s.index('\n  </>;',start)
              gallery='''    {preview && <div className="connect-profile-photo-overlay" role="dialog" aria-modal="true" aria-label={kind==='photos'?'Просмотр фотографий':'Просмотр видео'}
                onClick={()=>setPreview(null)}
                onTouchStart={e=>{const touch=e.touches[0];if(touch)swipeStart.current={x:touch.clientX,y:touch.clientY};}}
                onTouchEnd={e=>{const touch=e.changedTouches[0];const start=swipeStart.current;swipeStart.current=null;
                  if(touch && start){const dx=touch.clientX-start.x;const dy=touch.clientY-start.y;
                    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.25)navigatePreview(dx>0?-1:1);
                  }
                }}>
                <button type="button" className="connect-profile-photo-close" onClick={()=>setPreview(null)}>Закрыть</button>
                <span className="connect-gallery-count">{items.findIndex(item=>item.path===preview.path)+1} / {items.length}</span>
                {items.length>1 && <><button type="button" className="connect-gallery-nav connect-gallery-prev" onClick={e=>{e.stopPropagation();navigatePreview(-1);}} aria-label="Предыдущий файл">‹</button>
                  <button type="button" className="connect-gallery-nav connect-gallery-next" onClick={e=>{e.stopPropagation();navigatePreview(1);}} aria-label="Следующий файл">›</button></>}
                {kind==='videos' ? <video key={preview.path} src={preview.url} playsInline controls preload="metadata" onClick={e=>e.stopPropagation()} aria-label={preview.name}/>
                  : <img key={preview.path} src={preview.url} alt={preview.name} onClick={e=>e.stopPropagation()}/>}
                <span className="connect-gallery-name">{preview.name}</span>
                {isOwner && kind==='photos' && <button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(preview.mime)} onClick={e=>{e.stopPropagation();void makeAvatar(preview);setPreview(null);}}>Сделать аватаром</button>}
              </div>}'''
              s=s[:start]+gallery+s[end:]
          else:print('Gallery navigation already installed')
          
          # Users who opt in can share a transient text-only status; no media URL is exposed.
          a=app.read_text(encoding='utf-8')
          a=once(a,"import ConnectProfileMedia, { type ProfileMediaKind } from '../components/ConnectProfileMedia';", "import ConnectProfileMedia, { type ProfileMediaKind } from '../components/ConnectProfileMedia';\nimport { ConnectMusicStatus } from '../components/ConnectMusicSystem';",'profile music status import')
          a=once(a,"<p>{viewedProfile.bio || 'Информация о себе не указана'}</p>","<p>{viewedProfile.bio || 'Информация о себе не указана'}</p>\n                <ConnectMusicStatus client={supabase!} profileId={viewedProfile.id}/>",'opt-in public listening label')
          if "connect:music-open" not in a:
              marker='  async function saveProfile(e: FormEvent) {'
              addition='''  useEffect(()=>{
              const open=(event:Event)=>{
                const id=(event as CustomEvent<{ownerId:string}>).detail?.ownerId;
                const person=profiles.find(p=>p.id===id);
                if(!person)return;
                showProfile(person.id);setProfileMediaOpen('music');
              };
              window.addEventListener('connect:music-open',open);
              return()=>window.removeEventListener('connect:music-open',open);
              // eslint-disable-next-line react-hooks/exhaustive-deps
            },[profiles]);
          '''
              a=once(a,marker,addition+marker,'mini-player opens the music profile')
          
          Path('components/ConnectMusicSystem.tsx').write_text(component,encoding='utf-8')
          style.write_text(css,encoding='utf-8')
          page.write_text(s,encoding='utf-8')
          layout.write_text(l,encoding='utf-8')
          app.write_text(a,encoding='utf-8')
          print('Music, opt-in status, mini-player, photo/video gallery navigation installed.')
          PY
          git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit and deploy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/layout.tsx app/music-system.css components/ConnectProfileMedia.tsx components/ConnectMusicSystem.tsx
          if git diff --cached --quiet; then
            echo 'Update already installed.'
            exit 0
          fi
          git commit -m 'feat: persistent music, privacy status, and swipeable profile galleries'
          git push origin HEAD:main
