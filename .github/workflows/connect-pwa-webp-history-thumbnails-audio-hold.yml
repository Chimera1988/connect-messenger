              const paths=[...new Set(messages.filter(m=>m.conversation_id===activeChat).flatMap(m=>[
                ...(m.attachment_kind==='image'&&m.attachment_path?[m.attachment_path]:[]),
                ...parseAlbum(m.body).filter(x=>x.kind==='image').map(x=>x.path)
              ]).filter(supportsPhotoPreview))].filter(path=>!photoPreviewRequests.current.has(path));
              if(!paths.length)return;
              paths.forEach(path=>photoPreviewRequests.current.add(path));
              void Promise.all(paths.map(async path=>{
                try{const {data,error}=await supabase!.storage.from('connect-attachments').createSignedUrl(photoPreviewPath(path),3600);
                  return {path,url:!error&&data?.signedUrl?mediaUrl(data.signedUrl):null};
                }catch{return {path,url:null};}
              })).then(items=>{if(activePreviewUser.current===owner)setPhotoPreviews(prev=>{const next={...prev};for(const item of items)next[item.path]=item.url;return next;});});
            },[messages,activeChat,user?.id]);
            useEffect(()=>{photoPreviewRequests.current.clear();setPhotoPreviews({});},[user?.id]);

            // Prefetch only small preview images and avatars. Never bulk-download
            // large original videos or audio on slow/mobile connections.
            useEffect(()=>{
              if(!user?.id||!activeChat)return;
              const connection=(navigator as Navigator & {connection?:{saveData?:boolean;effectiveType?:string}}).connection;
              if(connection?.saveData||connection?.effectiveType==='2g')return;
              const paths=messages.filter(m=>m.conversation_id===activeChat).slice(-35).flatMap(m=>[
                ...(m.attachment_kind==='image'&&m.attachment_path?[m.attachment_path]:[]),
                ...parseAlbum(m.body).filter(x=>x.kind==='image').map(x=>x.path)
              ]);
              const urls=[...new Set([...Object.values(avatarUrls), ...paths.map(p=>photoPreviews[p]).filter((v):v is string=>typeof v==='string')])].filter(Boolean).slice(-22);
              let stopped=false;
              const timer=window.setTimeout(()=>{void(async()=>{for(const src of urls){if(stopped)break;await prefetchCachedMedia(src,user.id);}})();},650);
              return()=>{stopped=true;window.clearTimeout(timer);};
            },[user?.id,activeChat,photoPreviews,avatarUrls,messages]);

            function isKeyboardSticker(m: Message): boolean {'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Render sidecars in chat only; opening photo uses the original signed URL.
          # Important: do not calculate original dimensions from a 480px thumbnail.
          old='''(item.kind==='image'?<img src={attachmentUrls[item.path]} alt={item.name} loading="lazy"/>'''
          new='''(item.kind==='image'?(imageInChat(item.path)?<img src={imageInChat(item.path)} alt={item.name} loading="lazy" onError={()=>failedPhotoPreview(item.path)}/>:<span>Миниатюра…</span>)'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''<img src={attachmentUrls[m.attachment_path]} alt={m.attachment_name || 'Фото'} loading="lazy" onLoad={e=>connectUpdatePhotoSize(e.currentTarget,m.attachment_path!)}/>'''
          new='''(imageInChat(m.attachment_path!)
                                           ? <img src={imageInChat(m.attachment_path!)} alt={m.attachment_name || 'Фото'} loading="lazy"
                                               onError={()=>failedPhotoPreview(m.attachment_path!)}
                                               onLoad={e=>{if(!supportsPhotoPreview(m.attachment_path!))connectUpdatePhotoSize(e.currentTarget,m.attachment_path!);}}/>
                                           : <span>Миниатюра…</span>)'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Switch video thumbnail preload from full media to metadata-only.
          old='''    <video ref={videoRef} src={src} playsInline muted preload="auto"'''
          new='''    <video ref={videoRef} src={src} playsInline muted preload="metadata"'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # While a video circle is not yet decoded, its optional uploaded first frame
          # can be displayed instead of a blank circle. Existing inline playback remains.
          old='''function VideoNoteBubble({src,name}:{src:string;name:string}) {'''
          new='''function VideoNoteBubble({src,name,path}:{src:string;name:string;path:string}) {
            const [poster,setPoster]=useState<string|undefined>();
            useEffect(()=>{
              let alive=true;setPoster(undefined);
              if(supabase)void supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600)
                .then(({data,error})=>{if(alive&&!error&&data?.signedUrl)setPoster(mediaUrl(data.signedUrl));}).catch(()=>{});
              return()=>{alive=false;};
            },[path]);'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''<video ref={ref} src={src} muted={muted} autoPlay playsInline loop preload="metadata" aria-label={name}'''
          new='''<video ref={ref} src={src} poster={poster} muted={muted} autoPlay playsInline loop preload="metadata" aria-label={name}'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''<VideoNoteBubble src={attachmentUrls[m.attachment_path]} name={m.attachment_name||'Видеокружок'}/>'''
          new='''<VideoNoteBubble src={attachmentUrls[m.attachment_path]} name={m.attachment_name||'Видеокружок'} path={m.attachment_path}/>'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Handled audio player hold above; keep original action menu (delete locally /
          # delete for everyone) and existing Supabase RPC. Do not replace it.
          page_path.write_text(page,'utf-8')
          print('PATCH: app/page.tsx')

          # Read-only chat cache management; does not affect media cache or Supabase.
          settings=ROOT/'components/ConnectCacheSettings.tsx'
          s=settings.read_text('utf-8')
          s=insert_after_once(s,"import { cacheStats, clearCachedMedia, cacheLimit, setCacheLimit, type CacheCategory } from '../lib/media-cache';",
          "\nimport { chatHistoryStats, wipeUserHistory } from '../lib/chat-history-cache';",'cache settings imports')
          s=s.replace('export default function CacheSettings() {','export default function CacheSettings({userId}:{userId:string}) {',1)
          s=s.replace("    useEffect(() => { let active = true;", "    useEffect(() => { let active = true;",1)
          s=insert_after_once(s,"    const [stats,setStats] = useState", "", 'unused') if False else s
          # Keep this intentionally tiny: append section before the existing settings footer.
          needle='''    return <div className="settings-group data-settings connect-cache-settings">'''
          if needle not in s:
              # Source is minified (one long return line), so rewrite initial exact text.
              needle='''    return <div className="settings-group data-settings connect-cache-settings">'''
          s=s.replace('''    return <div className="settings-group data-settings connect-cache-settings">''',
          '''    return <div className="settings-group data-settings connect-cache-settings">''',1)
          # Add history count via nested component to avoid changing an existing minified component.
          s=s.replace('''const size = (n: number) =>''', '''function LocalHistoryCache({userId}:{userId:string}){
            const [info,setInfo]=useState<{chats:number;messages:number;bytes:number}|null>(null);
            const [busy,setBusy]=useState(false);
