      - name: JavaScript toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Execute project regression tests
        run: npm test
      - name: Validate Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify whitespace
        run: git diff --check
      - name: Commit only verified PWA changes
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css components/ConnectCacheSettings.tsx \
            lib/media-cache.ts lib/chat-history-cache.ts lib/chat-thumbnails.ts lib/stickers.ts \
            public/sw.js public/stickers
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pwa): WebP stickers, cached chat history, media thumbs and audio hold menus'
          git push origin HEAD:main
