          const size = (n: number) =>''',1)
          s=s.replace('''<strong>Управление кешем</strong>''','''<strong>Управление кешем</strong><LocalHistoryCache userId={userId}/>''',1)
          settings.write_text(s,'utf-8')
          print('PATCH: cache settings')
          rewrite('app/page.tsx','<CacheSettings/>','<CacheSettings userId={user.id}/>','cache UI account')

