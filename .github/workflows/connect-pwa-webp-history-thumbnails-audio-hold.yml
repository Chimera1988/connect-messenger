name: Connect PWA - WebP stickers, instant chat history, media thumbnails and audio hold

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-webp-history-thumbnails-audio-hold.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-webp-history-thumbnails
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current PWA
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
      - name: Create and run PWA upgrade
        shell: bash
        run: |
          cat > /tmp/connect_pwa_upgrade.py <<'CONNECT_PWA_PATCH_PY'
          """One-shot PWA-only upgrade, designed to run in GitHub Actions.
          Only relative paths inside the checked-out Connect Messenger repository are edited.
          """
          from __future__ import annotations
          import base64
          import io
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image

          ROOT = Path.cwd()
          STAMP = 'CONNECT_PWA_WEBP_HISTORY_THUMBS_AUDIO_HOLD_V1'
          if STAMP in (ROOT/'app/page.tsx').read_text('utf-8'):
              print('Connect PWA upgrade already present; nothing to do.')
              raise SystemExit(0)


          def rewrite(path: str, old: str, new: str, label: str) -> None:
              target = ROOT / path
              body = target.read_text('utf-8')
              count = body.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match in {path}, found {count}')
              target.write_text(body.replace(old, new, 1), 'utf-8')
              print('PATCH:', label)


          def insert_after_once(text: str, old: str, addition: str, label: str) -> str:
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected 1 anchor; found {text.count(old)}')
              return text.replace(old, old + addition, 1)


          def write_file(path: str, contents: str) -> None:
              dest = ROOT / path
              if dest.exists() and dest.read_text('utf-8') != contents:
                  raise RuntimeError(f'Will not overwrite existing non-matching {path}')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(contents, 'utf-8')
              print('ADD:', path)


          # A real local text-history cache. Kept apart from media and from auth/keys.
          HISTORY = '''/** Locally available chat history (not an alternative message server).
           * Scoped per authenticated user; server remains the source of truth.
           * IndexedDB failures never prevent network chat loading.
           */
          type Row = {id:string;conversation_id:string;created_at:string;deleted_at?:string|null};
          type Snapshot<T> = { messages:T[]; readAt:string; savedAt:number };
          type Stored = {key:string;user:string;chat:string;messages:Row[];readAt:string;savedAt:number;tombstones:string[]};
          const DB_NAME='connect-chat-history-v1', TABLE='chats', MAX_PER_CHAT=6000;
          let opening:Promise<IDBDatabase>|null=null;
          function open():Promise<IDBDatabase>{
            if(!opening) opening=new Promise((resolve,reject)=>{
              const req=indexedDB.open(DB_NAME,1);
              req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(TABLE))req.result.createObjectStore(TABLE,{keyPath:'key'});};
              req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>{db.close();opening=null;};resolve(db);};
              req.onerror=()=>{opening=null;reject(req.error);};
            });
            return opening;
          }
          async function request<T>(mode:IDBTransactionMode,fn:(store:IDBObjectStore)=>IDBRequest<T>):Promise<T>{
            const db=await open();return new Promise<T>((resolve,reject)=>{
              const tx=db.transaction(TABLE,mode),req=fn(tx.objectStore(TABLE));let out:T;
              req.onsuccess=()=>{out=req.result;};
              tx.oncomplete=()=>resolve(out);
              tx.onerror=()=>reject(tx.error||new Error('Local history failed'));
              tx.onabort=()=>reject(tx.error||new Error('Local history aborted'));
            });
          }
          const keyOf=(user:string,chat:string)=>`${user}:${chat}`;
          export async function readChatHistory<T extends Row>(user:string,chat:string):Promise<Snapshot<T>|null>{
            if(!user||!chat)return null;
            const row=await request<Stored|undefined>('readonly',s=>s.get(keyOf(user,chat)));
            if(!row || row.user!==user || row.chat!==chat)return null;
            const tombstones=new Set(row.tombstones||[]);
            return {messages:row.messages.filter(m=>m.conversation_id===chat&&!m.deleted_at&&!tombstones.has(m.id)) as T[],readAt:row.readAt||'',savedAt:row.savedAt};
          }
          // Per-chat serialized writes prevent slow IndexedDB saves from overriding newer results.
          const writes=new Map<string,Promise<void>>();
          export function writeChatHistory<T extends Row>(user:string,chat:string,messages:T[],readAt='',replace=false):Promise<void>{
            if(!user||!chat)return Promise.resolve();
            const key=keyOf(user,chat);
            const pending=(writes.get(key)||Promise.resolve()).catch(()=>{}).then(async()=>{
              const previous=replace?undefined:await request<Stored|undefined>('readonly',s=>s.get(key));
              const tombstones=new Set(previous?.tombstones||[]);
              const byId=new Map<string,Row>();
              for(const m of previous?.messages||[])if(!tombstones.has(m.id)&&!m.deleted_at)byId.set(m.id,m);
              for(const m of messages)if(m.conversation_id===chat){
                if(m.deleted_at){tombstones.add(m.id);byId.delete(m.id);}
                else if(!tombstones.has(m.id))byId.set(m.id,m);
              }
              const merged=[...byId.values()].sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id)).slice(-MAX_PER_CHAT);
              const row:Stored={key,user,chat,messages:merged,readAt:readAt>String(previous?.readAt||'')?readAt:String(previous?.readAt||''),savedAt:Date.now(),tombstones:[...tombstones].slice(-8000)};
              await request('readwrite',s=>s.put(row));
            }).finally(()=>{if(writes.get(key)===pending)writes.delete(key);});
            writes.set(key,pending);return pending;
          }
          export async function dropCachedMessage(user:string,chat:string,id:string):Promise<void>{
            if(!user||!chat||!id)return;
            const key=keyOf(user,chat);await (writes.get(key)||Promise.resolve()).catch(()=>{});
            const row=await request<Stored|undefined>('readonly',s=>s.get(key));
            if(!row)return;
            row.messages=row.messages.filter(m=>m.id!==id);
            row.tombstones=[...new Set([...(row.tombstones||[]),id])].slice(-8000);
            await request('readwrite',s=>s.put(row));
          }
          export async function dropCachedMessageById(user:string,id:string):Promise<void>{
            if(!user||!id)return;
            const all=await request<Stored[]>('readonly',s=>s.getAll());
            await Promise.all(all.filter(r=>r.user===user&&r.messages.some(m=>m.id===id)).map(r=>dropCachedMessage(user,r.chat,id)));
          }
          export async function wipeChatHistory(user:string,chat:string):Promise<void>{
            if(!user||!chat)return;
            const key=keyOf(user,chat);await (writes.get(key)||Promise.resolve()).catch(()=>{});
            await request('readwrite',s=>s.delete(key));
          }
          export async function wipeUserHistory(user:string):Promise<void>{
            if(!user)return;
            const all=await request<Stored[]>('readonly',s=>s.getAll());
            for(const row of all.filter(r=>r.user===user))await wipeChatHistory(user,row.chat);
          }
          export async function chatHistoryStats(user:string):Promise<{chats:number;messages:number;bytes:number}>{
            if(!user)return {chats:0,messages:0,bytes:0};
            const rows=(await request<Stored[]>('readonly',s=>s.getAll())).filter(r=>r.user===user);
            return {chats:rows.length,messages:rows.reduce((n,r)=>n+r.messages.length,0),bytes:rows.reduce((n,r)=>n+new Blob([JSON.stringify(r)]).size,0)};
          }
          '''

          THUMBNAILS = '''/** Upload-time WebP thumbnail generation. Originals stay private in Supabase Storage.
           * Modern Safari/iOS and Android use canvas decoding, preserving transparency.
           */
          export const photoPreviewPath=(path:string)=>path+'__thumb.webp';
          export function supportsPhotoPreview(path:string):boolean{
            return /__img_\\d{1,5}x\\d{1,5}$/.test(path);
          }
          export async function makePhotoPreview(file:File):Promise<Blob|null>{
            if(!file.type.startsWith('image/')||file.type==='image/gif'||file.size>100*1024*1024)return null;
            const src=URL.createObjectURL(file);
            try{
              const image=await new Promise<HTMLImageElement>((resolve,reject)=>{
                const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Cannot decode image'));
                img.src=src;
              });
              const width=image.naturalWidth,height=image.naturalHeight;
              if(!width||!height||width>100000||height>100000)return null;
              const scale=Math.min(1,480/width,480/height);
              const canvas=document.createElement('canvas');
              canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
              const context=canvas.getContext('2d');if(!context)return null;
              context.drawImage(image,0,0,canvas.width,canvas.height);
              const preview=await new Promise<Blob|null>(resolve=>canvas.toBlob(resolve,'image/webp',.78));
              return preview?.type==='image/webp'&&preview.size>0?preview:null;
            }catch{return null;}finally{URL.revokeObjectURL(src);}
          }
          '''

          write_file('lib/chat-history-cache.ts', HISTORY)
          write_file('lib/chat-thumbnails.ts', THUMBNAILS)

          # Convert exactly the 4 bundled image-only sticker sets. These SVG files carry
          # base64 PNG; they are not meaningful vector art. Do not touch UI icons.
          count=0;old_bytes=0;new_bytes=0
          for svg in sorted((ROOT/'public/stickers').glob('*/*.svg')):
              tree=ET.parse(svg);root=tree.getroot()
              children=list(root)
              images=[c for c in children if c.tag.endswith('}image') or c.tag=='image']
              if len(images)!=1 or any(not(c.tag.endswith('}title') or c.tag=='title' or c in images) for c in children):
                  raise RuntimeError(f'{svg}: non-raster SVG. Refusing lossy flattening.')
              uri=images[0].get('href') or images[0].get('{http://www.w3.org/1999/xlink}href') or ''
              if not uri.startswith('data:image/png;base64,'):
                  raise RuntimeError(f'{svg}: unexpected embedded image format')
              raw=base64.b64decode(uri.partition(',')[2],validate=True)
              image=Image.open(io.BytesIO(raw)).convert('RGBA')
              if max(image.size)>320:
                  image.thumbnail((320,320), Image.Resampling.LANCZOS)
              output=svg.with_suffix('.webp')
              image.save(output,'WEBP',quality=83,method=6,exact=True)
              if not output.exists() or output.stat().st_size<=0:
                  raise RuntimeError(f'WebP conversion failed for {svg}')
              old_bytes+=svg.stat().st_size;new_bytes+=output.stat().st_size
              svg.unlink()
              count+=1
          if count!=96:
              raise RuntimeError(f'Expected 96 bundled SVG stickers; found {count}. Inspect new repository state before rerun.')
          print(f'WebP: {count} stickers {old_bytes/1048576:.1f} MiB -> {new_bytes/1048576:.1f} MiB')
          rewrite('lib/stickers.ts', 'return `/stickers/${sticker.pack}/${sticker.id}.svg`;', 'return `/stickers/${sticker.pack}/${sticker.id}.webp`;', 'sticker references')

          # Add photo previews at send time, stable linked to the original Storage path.
          page_path=ROOT/'app/page.tsx'
          page=page_path.read_text('utf-8')
          if STAMP in page:
              raise RuntimeError('PWA history/thumbnail patch already installed; refuse duplicate patch')
          page=insert_after_once(page,"import {mediaIdentity, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",
          "\nimport { readChatHistory, writeChatHistory, dropCachedMessage, dropCachedMessageById, wipeUserHistory } from '../lib/chat-history-cache';\nimport { makePhotoPreview, photoPreviewPath, supportsPhotoPreview } from '../lib/chat-thumbnails';",
          'imports')
          page=insert_after_once(page,"const MESSAGE_COLUMNS = 'id,conversation_id,sender_id,body,created_at,edited_at,deleted_at,reply_to,attachment_path,attachment_name,attachment_type,attachment_size,attachment_kind';",
          "\n// "+STAMP+"\n",'upgrade stamp')

          # Root cause of missing long-press on audio bubbles: VoicePlayer prevents touch
          # and contextmenu from bubbling up to the existing working message menu.
          old='return <div className="voice-player" onTouchStart={e => e.stopPropagation()} onTouchMove={e => e.stopPropagation()} onTouchEnd={e => e.stopPropagation()} onContextMenu={e => e.stopPropagation()}>'
          new='return <div className="voice-player">'
          assert page.count(old)==1, 'voice player touch swallowing changed'
          page=page.replace(old,new,1)

          page=insert_after_once(page,"  const [messages, setMessages] = useState<Message[]>([]);",
          "\n  const [chatHistoryLoading,setChatHistoryLoading]=useState(false);\n  const [historyReadyChat,setHistoryReadyChat]=useState<string|null>(null);\n  const [historyHasMore,setHistoryHasMore]=useState(false);\n  const [historyLoadingMore,setHistoryLoadingMore]=useState(false);\n  const olderHistoryAnchor=useRef<{id:string;top:number}|null>(null);\n  const [photoPreviews,setPhotoPreviews]=useState<Record<string,string|null>>({});\n  const photoPreviewRequests=useRef(new Set<string>());\n  const activePreviewUser=useRef('');\n  activePreviewUser.current=user?.id||'';",
          'cached history UI state')
          page=page.replace('  const [attachmentUrls, setAttachmentUrls] = useState<Record<string,string>>({});',
          '''  const [attachmentUrls, setAttachmentUrls] = useState<Record<string,string>>({});
            function imageInChat(path:string):string|undefined {
              const preview=photoPreviews[path];
              if(!supportsPhotoPreview(path))return attachmentUrls[path];
              if(preview===undefined)return undefined; // Do not download a 10MB original while locating its thumb.
              return preview||attachmentUrls[path];
            }
            const failedPhotoPreview=(path:string)=>setPhotoPreviews(prev=>({...prev,[path]:null}));
          ''',1)

          # Rewrite chat-load effect to hydrate IndexedDB before fetching and keep the
          # local older messages when server returns a limited latest page.
          old='''    setMessages([]); setTyping(false); setPeerRecording(false); setMenuMessage(null);
              setChatReadingEntry(null); setShowChatJump(false);'''
          new='''    setMessages([]); setTyping(false); setPeerRecording(false); setMenuMessage(null);
              setChatHistoryLoading(true);setHistoryHasMore(false);setHistoryReadyChat(null);
              setChatReadingEntry(null); setShowChatJump(false);'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''    let firstLoad = true;
              let firstLoadPending = false;
              let refreshing = false;'''
          new='''    let firstLoad = true;
              let firstLoadPending = false;
              let refreshing = false;
              let cacheHydrated = false;'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old="if (!alive || document.visibilityState === 'hidden' || firstLoadPending || refreshing) return;"
          new="if (!alive || !cacheHydrated || document.visibilityState === 'hidden' || firstLoadPending || refreshing) return;"
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''      setMessages(prev => prev.length === incoming.length && prev.every((m, i) =>
                  m.id === incoming[i].id && m.body === incoming[i].body && m.edited_at === incoming[i].edited_at && m.deleted_at === incoming[i].deleted_at && m.attachment_path === incoming[i].attachment_path
                ) ? prev : incoming);'''
          new='''      setMessages(prev => {
                  // A 500-row response is a recent window, not proof that older cached
                  // messages were deleted. A shorter complete response supersedes cache.
                  const oldest=incoming[0]?.created_at||'';
                  const older=incoming.length===500 ? prev.filter(m=>m.conversation_id===id&&m.created_at<oldest&&!m.deleted_at&&!serverDeleted.current.has(m.id)) : [];
                  const merged=[...older,...incoming].filter(m=>!m.deleted_at&&!serverDeleted.current.has(m.id));
                  if(prev.length===merged.length&&prev.every((m,i)=>m.id===merged[i].id&&m.body===merged[i].body&&m.edited_at===merged[i].edited_at&&m.deleted_at===merged[i].deleted_at&&m.attachment_path===merged[i].attachment_path))return prev;
                  return merged;
                });
                if(!incoming.length)void wipeChatHistory(user.id,id).catch(()=>{});
                setChatHistoryLoading(false);'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''      if (error) { firstLoadPending = false; setNotice(error.message); return; }'''
          new='''      if (error) { firstLoadPending = false; setChatHistoryLoading(false); setNotice(error.message); return; }'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''      } catch (error) { if(alive)setNotice(error instanceof Error?error.message:'Ошибка обновления чата'); }
                finally { refreshing=false; firstLoadPending=false; }
              };
              void refresh();
              const channel = supabase.channel('connect-chat-' + id)'''
          new='''      } catch (error) { if(alive){setChatHistoryLoading(false);setNotice(error instanceof Error?error.message:'Ошибка обновления чата');} }
                finally { refreshing=false; firstLoadPending=false; }
              };
              // Read cache before the first network fetch so we never flash "no messages".
              void readChatHistory<Message>(user.id,id).then(snapshot=>{
                if(!alive||!snapshot?.messages.length)return;
                const saved=snapshot.messages;
                setMessages(saved);
                const readAt=readCache.current[id]>snapshot.readAt?readCache.current[id]:snapshot.readAt;
                const unreadIndex=saved.findIndex(m=>m.sender_id!==user.id&&m.created_at>readAt);
                const anchorIndex=unreadIndex>=0?Math.max(0,unreadIndex-1):saved.length-1;
                setChatReadingEntry({chatId:id,readAt,firstUnreadId:unreadIndex>=0?saved[unreadIndex].id:null,anchorId:saved[anchorIndex]?.id||null});
                setChatHistoryLoading(false);setHistoryReadyChat(id);
                setHistoryHasMore(saved.length>=500);
              }).catch(()=>{}).finally(()=>{cacheHydrated=true;if(alive)void refresh();});
              const channel = supabase.channel('connect-chat-' + id)'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Avoid rendering old chat messages for the single render between activeChat
          # change and the effect, even if React schedules its effect after paint.
          old='''  const visibleMessages=messages.filter(m=>!serverDeleted.current.has(m.id)&&!m.deleted_at'''
          new='''  const visibleMessages=messages.filter(m=>m.conversation_id===activeChat&&!serverDeleted.current.has(m.id)&&!m.deleted_at'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Persist message changes with debounce; one IndexedDB snapshot per chat.
          old="  // Position before paint; a chat with unread messages starts at its read"
          new='''  useEffect(()=>{
              if(!user?.id||!activeChat||!messages.some(m=>m.conversation_id===activeChat))return;
              const userId=user.id,chatId=activeChat;
              const rows=messages.filter(m=>m.conversation_id===chatId&&!m.deleted_at&&!serverDeleted.current.has(m.id));
              const timer=window.setTimeout(()=>{void writeChatHistory(userId,chatId,rows,readCache.current[chatId]||'').catch(()=>{});},400);
              return()=>window.clearTimeout(timer);
            },[user?.id,activeChat,messages]);

            async function loadOlderChatMessages(){
              if(!supabase||!user||!activeChat||historyLoadingMore||!historyHasMore||!visibleMessages.length)return;
              const id=activeChat,earliest=visibleMessages[0].created_at;
              setHistoryLoadingMore(true);
              const root=scrollRef.current;
              const first=root?.querySelector<HTMLElement>('.message-day-group[id]');
              if(first)olderHistoryAnchor.current={id:first.id,top:first.getBoundingClientRect().top};
              try{
                const {data,error}=await supabase.from('messages').select(MESSAGE_COLUMNS).eq('conversation_id',id)
                  .lt('created_at',earliest).order('created_at',{ascending:false}).limit(300);
                if(error)throw error;
                if(activeChatRef.current!==id)return;
                const older=((data||[]) as Message[]).reverse().filter(m=>!m.deleted_at&&!serverDeleted.current.has(m.id));
                if(older.length)setMessages(prev=>{
                  const ids=new Set(prev.map(m=>m.id));
                  return [...older.filter(m=>!ids.has(m.id)),...prev];
                });
                setHistoryHasMore((data||[]).length===300);
              }catch(e){olderHistoryAnchor.current=null;setNotice('Не удалось загрузить старые сообщения: '+(e instanceof Error?e.message:String(e)));}
              finally{setHistoryLoadingMore(false);}
            }
            useLayoutEffect(()=>{
              const point=olderHistoryAnchor.current;if(!point)return;
              const root=scrollRef.current,node=document.getElementById(point.id);
              if(root&&node){root.scrollTop+=node.getBoundingClientRect().top-point.top;olderHistoryAnchor.current=null;}
            },[messages]);

            // Position before paint; a chat with unread messages starts at its read'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Stop read receipts from resurrecting deleted media after refresh/restart.
          old="if (removedId) setMessages(prev=>prev.filter(row=>row.id!==removedId));"
          new="if (removedId){setMessages(prev=>prev.filter(row=>row.id!==removedId));void dropCachedMessage(user.id,id,removedId).catch(()=>{});}"
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old='''      const m = payload.new as Message;
                if (!m?.id) return;
                setMessages(prev => {'''
          new='''      const m = payload.new as Message;
                if (!m?.id) return;
                if(m.deleted_at)void dropCachedMessage(user.id,id,m.id).catch(()=>{});
                setMessages(prev => {'''
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old="await purgeDeletedMedia(user.id,row.message_id);if(!active)return;"
          new="await purgeDeletedMedia(user.id,row.message_id);await dropCachedMessageById(user.id,row.message_id).catch(()=>{});if(!active)return;"
          assert page.count(old)==1
          page=page.replace(old,new,1)
          old="if(!result.error){for(const path of [m.attachment_path,...parseAlbum(m.body).map(x=>x.path)])if(path)await clearCachedMedia('temporary','connect-attachments/'+path);}"
          new="if(!result.error){await dropCachedMessage(user!.id,m.conversation_id,m.id).catch(()=>{});for(const path of [m.attachment_path,...parseAlbum(m.body).map(x=>x.path)])if(path)await clearCachedMedia('temporary','connect-attachments/'+path);}"
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Keep persisted cache account-scoped, clear it on explicit logout.
          old="await supabase?.auth.signOut(); exitChat(); setProfiles([]); setConversations([]); setMessages([]);"
          new="if(user?.id)await wipeUserHistory(user.id).catch(()=>{}); await supabase?.auth.signOut(); exitChat(); setProfiles([]); setConversations([]); setMessages([]);"
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Correct waiting UI before history hydration completes.
          old='''{visibleMessages.length === 0 ? <div className="empty-chat"><Icon name="message" size={32}/><span>Напишите первое сообщение</span></div> : visibleMessages.map((m,index) => {'''
          new='''{visibleMessages.length === 0 ? <div className="empty-chat"><Icon name="message" size={32}/><span>{chatHistoryLoading||historyReadyChat!==activeChat?'Загружаем переписку…':'Напишите первое сообщение'}</span></div> : visibleMessages.map((m,index) => {'''
          assert page.count(old)==1
          page=page.replace(old,new,1)

          # Preserve originals, introduce optional WebP sidecars. A failure making a
          # thumbnail can never fail the message itself.
          old='''      let videoPoster: Blob | null = null;
                if (kind === 'video' && !/^connect-video-note-\\d+\\.(?:mp4|webm)$/i.test(file.name)) {'''
          new='''      let photoPreview: Blob | null = null;
