name: Connect Neon — production read-only integration

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/connect-neon-live-production.yml

permissions:
  contents: write

concurrency:
  group: connect-neon-live-release
  cancel-in-progress: false

jobs:
  integrate:
    name: Patch, verify, and release original Connect PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main, package lock, and source layout
        run: |
          test "$(git branch --show-current)" = main
          test -s package-lock.json
          test -s AGENTS.md
          test -s app/page.tsx
          test -s package.json
      - name: Set up Node 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current locked dependencies
        run: npm ci --no-audit --no-fund
