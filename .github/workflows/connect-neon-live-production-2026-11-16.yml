          root=Path.cwd()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as bundle:
              for name in bundle.namelist():
                  if name.startswith('/') or '..' in Path(name).parts:
                      raise SystemExit('Invalid archive path')
                  if name.startswith('_patch/'):
                      continue
                  out=root/name
                  data=bundle.read(name)
                  if out.exists():
                      if out.read_bytes()!=data:
                          raise SystemExit('SOURCE_DRIFT: conflicting source file: '+name)
                  else:
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(data)
              hook=bundle.read('_patch/supabase-session-hook.txt').decode('utf-8')
              shadow=bundle.read('_patch/chat-shadow-hook.txt').decode('utf-8')
              revoke=bundle.read('_patch/logout-inject.txt').decode('utf-8')
              anchor=bundle.read('_patch/anchor.txt').decode('utf-8')
          page=root/'app/page.tsx'
          source=page.read_text('utf-8')
          required=["supabase.from('messages')","supabase.channel('connect-chat-'",'async function logout() {']
          if any(s not in source for s in required):
              raise SystemExit('SOURCE_DRIFT: Connect PWA source is not compatible')
          if 'Neon production shadow session' in source:
              if source.count('Neon production shadow session')!=1 or 'nonblocking shadow' not in source or "method:'DELETE',credentials:'same-origin'" not in source:
                  raise SystemExit('SOURCE_DRIFT: incomplete previously applied migration')
          else:
              if source.count(anchor)!=1 or source.count('  async function logout() {')!=1:
                  raise SystemExit('SOURCE_DRIFT: expected stable anchors not unique')
              source=source.replace(anchor,hook+shadow+anchor)
              source=source.replace('  async function logout() {\n','  async function logout() {\n'+revoke)
              page.write_text(source,'utf-8')
          print('Neon main shadow read: patch verified; Supabase message writes unchanged.')
          PY
      - name: Install Neon server-side-only dependencies
        run: |
          npm install --save --no-audit --no-fund \
            pg@8.16.3 \
            @aws-sdk/client-s3@^3.900.0 \
            @aws-sdk/s3-request-presigner@^3.900.0
      - name: Verify new migration logic
        run: |
          node --test tests/connect-neon-live.test.cjs
          node --check lib/connect-neon-live-db.cjs
          node --check lib/connect-neon-live-cookie.cjs
      - name: Install matching browser for the full existing regression suite
        run: |
          npx playwright-core install --with-deps chromium
          node -e "const fs=require('fs'), p=require('playwright-core').chromium.executablePath(); if(!fs.existsSync(p)) process.exit(1)"
      - name: Full Connect PWA typecheck and tests
        run: |
          npm run typecheck
          npm test
      - name: Production build validation
        run: npm run build
      - name: Commit only after all checks pass
        shell: bash
        run: |
          git diff --check
          git status --short
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Neon integration already installed; nothing to commit."
            exit 0
          fi
          git config user.name "Connect Neon CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/api/connect-neon lib/connect-neon-live-* tests/connect-neon-live.test.cjs package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Connect: add production Neon read-only API with safe Supabase fallback"
          git push origin HEAD:main
