name: Connect PWA | Safe automatic media optimization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-safe-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-update:
    name: Test safe media optimizer before committing
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact Connect repository and required sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for file in AGENTS.md package.json package-lock.json tsconfig.json next-env.d.ts app/page.tsx lib/chat-thumbnails.ts lib/chat-media-presentation.ts; do
            test -s "$file" || { echo "SOURCE_DRIFT: missing $file" >&2; exit 1; }
          done
          grep -Fq "async function sendAlbum(files:File[])" app/page.tsx
          grep -Fq "async function sendAttachment(file: File" app/page.tsx
          grep -Fq "const recorder=new MediaRecorder(recordingStream," app/page.tsx
          grep -Fq "const recorder=new MediaRecorder(stream," app/page.tsx

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and matching Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          node -e "const fs=require('fs'),p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))process.exit(1)"

      - name: Install regression test and media patch in temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-media-optimizer.ts" <<'CONNECT_MEDIA_SOURCE'
          /** CONNECT_PWA_SAFE_MEDIA_OPTIMIZATION_V1_20261115
           * Best-effort, local and bounded. The original File is never mutated. 
           * No encoding occurs in the native Android wrapper.
           */
          export type ConnectMediaDecision = 'optimized' | 'unchanged' | 'unsupported' | 'failed';
          export type ConnectMediaResult = { file: File; decision: ConnectMediaDecision };
          const KB = 1024;
          const MB = 1024 * KB;
          const IMAGE_MIN = 700 * KB;
          const WAV_MIN = 1024 * KB;
          const VIDEO_MIN = 12 * MB;
          const MAX_UPLOAD = 100 * MB;
          const MAX_CANVAS_SIDE = 2048;
          const WAV_MAX = 24 * MB;
          const VIDEO_MAX_SECONDS = 150;
          
          export function connectCanOptimizeMedia(file: File, native = false): 'image' | 'wav' | 'video' | null {
            if (native || !file.size || file.size > MAX_UPLOAD) return null;
            const type = file.type.toLowerCase();
            const name = file.name.toLowerCase();
            // Animated GIFs, icons, stickers, videos recorded by Connect and compressed audio
            // retain their original codecs, transparency, animation and metadata.
            if (/^sticker-\d+\./.test(name) || /^connect-video-note-\d+\./.test(name)) return null;
            if (type === 'image/jpeg' || type === 'image/png' || type === 'image/webp')
              return file.size >= IMAGE_MIN ? 'image' : null;
            if ((type === 'audio/wav' || type === 'audio/wave' || type === 'audio/x-wav' || /\.wav$/.test(name)) && file.size >= WAV_MIN && file.size <= WAV_MAX)
              return 'wav';
            if (type.startsWith('video/') && file.size >= VIDEO_MIN) return 'video';
            return null;
          }
          function useful(candidate: Blob, original: File, minimumSaved = 0.12): boolean {
            return candidate.size > 0 && candidate.size <= MAX_UPLOAD && candidate.size <= original.size * (1 - minimumSaved);
          }
          function mediaFilename(name: string, ext: string): string {
            return (name.replace(/\.[^.]+$/, '').replace(/[\\/]/g, '_').slice(0,175) || 'media') + '.' + ext;
          }
          function bounded<T>(task: Promise<T>, ms: number): Promise<T> {
            return new Promise((resolve,reject) => {
              const timer=setTimeout(()=>reject(Error('Media operation timeout')),ms);
              task.then(value=>{clearTimeout(timer);resolve(value);},error=>{clearTimeout(timer);reject(error);});
            });
          }
          function toBlob(canvas: HTMLCanvasElement, mime: string, quality: number): Promise<Blob | null> {
            return new Promise(resolve => canvas.toBlob(blob => resolve(blob), mime, quality));
          }
          async function optimizeImage(original: File): Promise<File> {
            const url = URL.createObjectURL(original);
            try {
              const img = new Image();
              img.decoding = 'async';
              img.src = url;
              if (typeof img.decode === 'function') await bounded(img.decode(),12000);
              else await new Promise<void>((resolve, reject) => { img.onload = () => resolve(); img.onerror = () => reject(Error('Фото не декодировано')); });
              if (!img.naturalWidth || !img.naturalHeight || img.naturalWidth * img.naturalHeight > 40_000_000) return original;
              const scale = Math.min(1, MAX_CANVAS_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
              const ctx = canvas.getContext('2d');
              if (!ctx) return original;
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              // WebP preserves PNG transparency, while JPEG remains widely compatible.
              const mime = original.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp';
              const blob = await bounded(toBlob(canvas, mime, mime === 'image/jpeg' ? .83 : .82), 12000);
              if (!blob || blob.type !== mime || !useful(blob, original)) return original;
              return new File([blob], mediaFilename(original.name, mime === 'image/jpeg' ? 'jpg' : 'webp'), {type:mime,lastModified:original.lastModified});
            } finally { URL.revokeObjectURL(url); }
          }
          
          function audioRecorderMime(): string | null {
            if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return null;
            // Require an explicit AAC encoder for iPhone/Android playback. MP4 containing
            // Opus may be produced by some other browsers and is intentionally rejected.
            return ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4;codecs="mp4a.40.2"']
              .find(mime => MediaRecorder.isTypeSupported(mime)) || null;
          }
          function bufferRms(buffer: AudioBuffer): number {
            const samples = Math.min(8192, buffer.length);
            let sum = 0, count = 0;
            for(let ch=0;ch<buffer.numberOfChannels;ch++) {
              const data = buffer.getChannelData(ch), skip=Math.max(1,Math.floor(buffer.length/samples));
              for(let i=0;i<data.length;i+=skip) { sum += data[i] * data[i]; count++; }
            }
            return Math.sqrt(sum / Math.max(1,count));
          }
          async function optimizeWav(original: File): Promise<File> {
            const mime = audioRecorderMime();
            if (!mime || typeof AudioContext === 'undefined') return original;
            const context = new AudioContext();
            let stream: MediaStream | null = null;
            let recorder: MediaRecorder | null = null;
            try {
              const buffer = await context.decodeAudioData(await original.arrayBuffer());
              if (!buffer.length || buffer.duration > 65 || buffer.duration < 1 || buffer.numberOfChannels > 2) return original;
              const source = context.createBufferSource();
              source.buffer = buffer;
              const destination = context.createMediaStreamDestination();
              source.connect(destination);
              stream = destination.stream;
              recorder = new MediaRecorder(stream, {mimeType:mime,audioBitsPerSecond:64_000});
              const chunks: Blob[] = [];
              const record = recorder;
              const finished = new Promise<Blob>((resolve,reject) => {
                const timeout = window.setTimeout(() => reject(Error('Audio timeout')), Math.min(90000,buffer.duration * 1500 + 7000));
                record.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                record.onerror = () => { window.clearTimeout(timeout); reject(Error('Audio recorder error')); };
                record.onstop = () => { window.clearTimeout(timeout); resolve(new Blob(chunks,{type:'audio/mp4'})); };
              });
              await bounded(context.resume(),8000);
              if (context.state !== 'running') return original;
              record.start(500);
              source.onended = () => { if (record.state !== 'inactive') record.stop(); };
              source.start();
              const candidate = await finished;
              if (!useful(candidate,original,.20)) return original;
              // Avoid silent outputs: Safari can occasionally record an empty/silent track.
              const decoded = await context.decodeAudioData(await candidate.arrayBuffer());
              if (decoded.duration < buffer.duration * .90 || decoded.duration > buffer.duration * 1.1) return original;
              if (bufferRms(buffer) > .008 && bufferRms(decoded) < .003) return original;
              return new File([candidate],mediaFilename(original.name,'m4a'),{type:'audio/mp4',lastModified:original.lastModified});
            } finally {
              if (recorder?.state === 'recording') { try {recorder.stop();} catch {} }
              stream?.getTracks().forEach(t=>t.stop());
              await context.close().catch(()=>{});
            }
          }
          
          function videoRecorderMime(): string | null {
            if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return null;
            // An explicit MP4/H.264/AAC claim is mandatory. Chromium's generic MP4 recorder
            // may emit Opus-in-MP4, which is not a safe iPhone recipient format.
            return ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs=avc1.42E01E,mp4a.40.2']
              .find(mime => MediaRecorder.isTypeSupported(mime)) || null;
          }
          async function waitMetadata(video: HTMLVideoElement): Promise<void> {
            if (video.readyState >= 1) return;
            await new Promise<void>((resolve,reject)=>{
              const timeout=window.setTimeout(()=>done(Error('video timeout')),12000);
              const done=(error?:Error)=>{window.clearTimeout(timeout);video.removeEventListener('loadedmetadata',ok);video.removeEventListener('error',fail);error?reject(error):resolve();};
              const ok=()=>done(),fail=()=>done(Error('video metadata'));
              video.addEventListener('loadedmetadata',ok);video.addEventListener('error',fail);
            });
          }
          /** Browser-capability-gated real-time compression. No codec proof => leave original.
           * In particular, current iOS PWA capabilities must be validated on a real device.
           */
          async function optimizeVideo(original: File, onProgress?: (fraction:number)=>void): Promise<File> {
            const mime=videoRecorderMime();
            if (!mime || typeof HTMLCanvasElement === 'undefined' || typeof HTMLCanvasElement.prototype.captureStream !== 'function' || typeof AudioContext === 'undefined') return original;
            let video:HTMLVideoElement|null=null, media:MediaStream|null=null, context:AudioContext|null=null, recorder:MediaRecorder|null=null;
            let url:string|null=null, frame=0, interval:number|null=null, timeout:number|null=null;
            try {
              video=document.createElement('video');
              video.playsInline=true;video.preload='auto';video.volume=1;
              video.style.cssText='position:fixed;left:-200px;top:0;width:4px;height:4px;pointer-events:none;opacity:0';
              document.body.appendChild(video);
              url=URL.createObjectURL(original);video.src=url;video.load();
              await waitMetadata(video);
              const duration=video.duration;
              if (!Number.isFinite(duration) || duration<1 || duration>VIDEO_MAX_SECONDS || !video.videoWidth || !video.videoHeight) return original;
              const scale=Math.min(1,1280/video.videoWidth,720/video.videoHeight);
              const canvas=document.createElement('canvas');
              canvas.width=Math.max(2,2*Math.floor(video.videoWidth*scale/2));
              canvas.height=Math.max(2,2*Math.floor(video.videoHeight*scale/2));
              const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return original;
              const frameStream=canvas.captureStream(24);
              context=new AudioContext();
              const source=context.createMediaElementSource(video);
              const destination=context.createMediaStreamDestination();
              source.connect(destination); // no connection to speakers
              const analyser=context.createAnalyser();
              analyser.fftSize=2048;
              source.connect(analyser);
              const inputSamples=new Float32Array(analyser.fftSize);
              let inputAudioPeak=0;
              media=new MediaStream([...frameStream.getVideoTracks(),...destination.stream.getAudioTracks()]);
              if (media.getVideoTracks().length!==1 || media.getAudioTracks().length!==1) return original;
              await bounded(context.resume(),8000);if(context.state!=='running')return original;
              const expectedSize=duration*(1_100_000+96_000)/8;
              if(expectedSize>=original.size*.86)return original;
              const chunks:Blob[]=[];
              recorder=new MediaRecorder(media,{mimeType:mime,videoBitsPerSecond:1_100_000,audioBitsPerSecond:96_000});
              const rec=recorder;
              const finished=new Promise<Blob>((resolve,reject)=>{
                const stop=()=>resolve(new Blob(chunks,{type:'video/mp4'}));
                rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
                rec.onstop=stop;rec.onerror=()=>reject(Error('video record error'));
              });
              void finished.catch(()=>{}); // Recorder can fail before playback completes.
              const draw=()=>{if(video && !video.paused && video.readyState>=2)try{ctx.drawImage(video,0,0,canvas.width,canvas.height)}catch{}frame=requestAnimationFrame(draw);};
              draw();rec.start(1000);
              const playback= new Promise<void>((resolve,reject)=>{
                video!.onended=()=>resolve();video!.onerror=()=>reject(Error('video playback error'));
                timeout=window.setTimeout(()=>reject(Error('video encoding timeout')),Math.min(280000,(duration+10)*1700));
                interval=window.setInterval(()=>{
                  if(document.visibilityState==='hidden'){reject(Error('background'));return;}
                  analyser.getFloatTimeDomainData(inputSamples);
                  let sum=0;for(let i=0;i<inputSamples.length;i++)sum+=inputSamples[i]*inputSamples[i];
                  inputAudioPeak=Math.max(inputAudioPeak,Math.sqrt(sum/inputSamples.length));
                  onProgress?.(Math.min(.99,video!.currentTime/duration));
                },700);
              });
              await bounded(video.play(), 10000);
              await playback;
              rec.stop();
              const output=await bounded(finished, 10000);
              if(!useful(output,original,.15))return original;
              // A media container can have an audio track yet carry silence. Require detectable
              // source audio AND successfully decoded audio on the compressed candidate.
              // Reject instead of silently breaking voice/soundtrack on any unsupported browser.
              if(inputAudioPeak < .004) return original;
              let decodedAudio:AudioBuffer;
              try { decodedAudio=await context.decodeAudioData(await output.arrayBuffer()); }
              catch { return original; }
              if(decodedAudio.duration < duration*.90 || bufferRms(decodedAudio) < .002) return original;
              // Video-level automated verification is not a replacement for actual iOS testing.
              // Reject recordings with implausibly short duration or playback decode failure.
              const probe=document.createElement('video');probe.preload='metadata';probe.playsInline=true;
              const outputUrl=URL.createObjectURL(output);
              try{probe.src=outputUrl;probe.load();await waitMetadata(probe);
                if(!Number.isFinite(probe.duration) || probe.duration<duration*.90 || probe.duration>duration*1.1)return original;
              }finally{probe.removeAttribute('src');probe.load();URL.revokeObjectURL(outputUrl);}
              onProgress?.(1);
              return new File([output],mediaFilename(original.name,'mp4'),{type:'video/mp4',lastModified:original.lastModified});
            } finally {
              if(frame)cancelAnimationFrame(frame);
              if(interval!==null)window.clearInterval(interval);
              if(timeout!==null)window.clearTimeout(timeout);
              if(recorder?.state==='recording')try{recorder.stop()}catch{}
              media?.getTracks().forEach(t=>t.stop());
              if(context)await context.close().catch(()=>{});
              if(video){video.pause();video.removeAttribute('src');video.load();video.remove();}
              if(url)URL.revokeObjectURL(url);
            }
          }
          
          export async function connectOptimizeMedia(
            file: File,
            options:{native?:boolean;onProgress?:(fraction:number)=>void}={}
          ):Promise<ConnectMediaResult> {
            const mode=connectCanOptimizeMedia(file,options.native);
            if(!mode)return {file,decision:'unchanged'};
            try {
              // Never allow failed compression to interrupt the existing upload pipeline.
              const candidate=mode==='image'?await optimizeImage(file):mode==='wav'?await optimizeWav(file):await optimizeVideo(file,options.onProgress);
              return {file:candidate,decision:candidate===file?'unsupported':'optimized'};
            }catch{return {file,decision:'failed'};}
          }
          CONNECT_MEDIA_SOURCE
          cat > "$RUNNER_TEMP/pwa-media-optimizer.test.cjs" <<'CONNECT_MEDIA_TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const ts=require('typescript');
          const root=process.cwd();
          const helper=fs.readFileSync(path.join(root,'lib/connect-media-optimizer.ts'),'utf8');
          const page=fs.readFileSync(path.join(root,'app/page.tsx'),'utf8');
          const js=ts.transpileModule(helper.replace(/^export /gm,''),{compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None}}).outputText;
          const policy=new Function(js+'; return connectCanOptimizeMedia;')();
          const fake=(name,type,size)=>({name,type,size});
          
          test('media decisions preserve compressed originals, stickers, notes, native and no-op uploads',()=>{
            assert.equal(policy(fake('pic.jpg','image/jpeg',2e6),false),'image');
            assert.equal(policy(fake('pic.png','image/png',1e6),false),'image');
            assert.equal(policy(fake('animation.gif','image/gif',2e6),false),null);
            assert.equal(policy(fake('sticker-132.png','image/png',2e6),false),null);
            assert.equal(policy(fake('audio.wav','audio/wav',2e6),false),'wav');
            assert.equal(policy(fake('sound.mp3','audio/mpeg',2e6),false),null);
            assert.equal(policy(fake('voice.m4a','audio/mp4',2e6),false),null);
            assert.equal(policy(fake('clip.mp4','video/mp4',14e6),false),'video');
            assert.equal(policy(fake('connect-video-note-123.mp4','video/mp4',14e6),false),null);
            assert.equal(policy(fake('big.mp4','video/mp4',101*1024*1024),false),null);
            assert.equal(policy(fake('pic.jpg','image/jpeg',2e6),true),null);
          });
          
          test('single uploads and albums both prepare before thumbnail, upload and metadata; PWA recordings bounded',()=>{
            assert.equal((page.match(/await connectOptimizeMedia\(file,\s*\{native:isNativeMediaRuntime\(\)/g)||[]).length,2,'shared optimizer must apply to albums and single videos');
            const album=page.slice(page.indexOf('async function sendAlbum('),page.indexOf('async function sendAttachment('));
            const single=page.slice(page.indexOf('async function sendAttachment('),page.indexOf('async function beginRecording('));
            for(const [name,src] of [['album',album],['single',single]]){
              assert.ok(src.indexOf('await connectOptimizeMedia(') < src.indexOf('connectVideoFilePreview('),name+': prepare before poster');
              assert.ok(src.indexOf('await connectOptimizeMedia(') < src.indexOf("storage.from('connect-attachments').upload("),name+': prepare before upload');
            }
            assert.match(page,/audioBitsPerSecond:isNativeMediaRuntime\(\)\?64000:56000/);
            assert.match(page,/videoBitsPerSecond:isNativeMediaRuntime\(\)\?800000:720000/);
            assert.match(page,/!isNativeMediaRuntime\(\)\?\{audioBitsPerSecond:56000\}:\{\}/);
          });
          
          test('real Chromium: full photo compression, alpha preservation, originals and codec fallbacks',async()=>{
            const {chromium}=require('playwright-core');
            const browser=await chromium.launch({args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.setContent('<html><head></head><body></body></html>');
              await page.addScriptTag({content:js+'\nwindow.runOptimize=connectOptimizeMedia;'});
              const result=await page.evaluate(async()=>{
                const canvas=document.createElement('canvas');canvas.width=1780;canvas.height=1200;
                const ctx=canvas.getContext('2d');
                const pixels=ctx.createImageData(canvas.width,canvas.height);
                let seed=17;
                for(let i=0;i<pixels.data.length;i+=4){seed=(seed*1664525+1013904223)>>>0;pixels.data[i]=seed&255;pixels.data[i+1]=(seed>>>8)&255;pixels.data[i+2]=(seed>>>16)&255;pixels.data[i+3]=i%20===0?0:255;}
                ctx.putImageData(pixels,0,0);
                const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
                const input=new File([png],'photo.png',{type:'image/png'});
                const result=await window.runOptimize(input);
                const out=result.file;
                let alpha=false;
                if(out!==input){const bitmap=await createImageBitmap(out);const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;const x=c.getContext('2d');x.drawImage(bitmap,0,0);alpha=x.getImageData(0,0,1,1).data[3]<255;bitmap.close();}
                const gif=new File([new Uint8Array(2e6)],'animated.gif',{type:'image/gif'});
                const noGif=await window.runOptimize(gif);
                const raw=new File([new Uint8Array(16e6)],'video.mp4',{type:'video/mp4'});
                const originalIsReturned=(await window.runOptimize(raw)).file===raw;
                const native=(await window.runOptimize(input,{native:true})).file===input;
                return {input:input.size,output:out.size,mime:out.type,optimized:out!==input,alpha,noGif:noGif.file===gif,originalIsReturned,native};
              });
              assert.ok(result.optimized,'PNG must be optimized in Chromium');
              assert.ok(result.output <= result.input*.88,`expected meaningful saved bytes: ${JSON.stringify(result)}`);
              assert.equal(result.mime,'image/webp');
              assert.equal(result.alpha,true,'transparent pixels stay transparent');
              assert.equal(result.noGif,true);
              assert.equal(result.originalIsReturned,true,'MP4 unsupported encoder must retain its source');
              assert.equal(result.native,true);
              await page.close();
            }finally{await browser.close()}
          });
          CONNECT_MEDIA_TEST
          cat > "$RUNNER_TEMP/apply_patch.py" <<'CONNECT_MEDIA_PATCH'
          #!/usr/bin/env python3
          """Bounded, idempotent PWA optimizer patch. Never edits Android or any database."""
          from pathlib import Path
          import sys
          MARK='CONNECT_PWA_SAFE_MEDIA_OPTIMIZATION_V1_20261115'
          PAGE=Path('app/page.tsx')
          LIB=Path('lib/connect-media-optimizer.ts')
          TEST=Path('tests/pwa-media-optimizer.test.cjs')
          
          OLD={
           'import':"import { makePhotoPreview, photoPreviewPath, supportsPhotoPreview } from '../lib/chat-thumbnails';",
           'album':"      for(let i=0;i<files.length;i++){\n        const file=files[i];let path=`${chatId}/${uid}/${crypto.randomUUID()}`;",
           'single':"    try {\n      // The dimensions travel with the storage path, so the recipient can reserve",
           'note':"const recorder=new MediaRecorder(recordingStream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:800000,audioBitsPerSecond:64000});",
           'voice':"const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);",
          }
          NEW={
           'import':OLD['import']+"\nimport { connectOptimizeMedia } from '../lib/connect-media-optimizer'; // "+MARK,
           'album':"""      for(let i=0;i<files.length;i++){
                  let file=files[i];
                  // Reduce supported media BEFORE creating thumbnails, uploading, or recording album MIME.
                  const prepared=await connectOptimizeMedia(file,{native:isNativeMediaRuntime(),onProgress:f=>setUploadProgress(Math.round(((i+f*.35)/files.length)*100))});
                  file=prepared.file;
                  let path=`${chatId}/${uid}/${crypto.randomUUID()}`;""",
           'single':"""    try {
                // The same preparation is used for a single file and every item in an album.
                // It retains the original file when iOS cannot safely encode the audio/video.
                const prepared=await connectOptimizeMedia(file,{native:isNativeMediaRuntime(),onProgress:f=>setUploadProgress(Math.round(f*35))});
                file=prepared.file;
                // The dimensions travel with the storage path, so the recipient can reserve""",
           'note':"const recorder=new MediaRecorder(recordingStream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:isNativeMediaRuntime()?800000:720000,audioBitsPerSecond:isNativeMediaRuntime()?64000:56000});",
           'voice':"const recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),...(!isNativeMediaRuntime()?{audioBitsPerSecond:56000}:{})});",
          }
          
          # Write new library/test only when already verified to match the intended new content.
          def ensure_new(path:Path, content:str)->None:
              if path.exists():
                  if path.read_text(encoding='utf8')!=content:
                      raise SystemExit(f'SOURCE_DRIFT: existing {path} differs from this update')
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(content,encoding='utf8')
          
          def apply():
              if not PAGE.is_file(): raise SystemExit('SOURCE_DRIFT: no app/page.tsx')
              s=PAGE.read_text(encoding='utf8')
              complete=all(s.count(v)==1 for v in NEW.values())
              if complete:
                  if s.count(MARK)!=1: raise SystemExit('SOURCE_DRIFT: unexpected optimizer marker count')
                  print('Existing exact PWA media wiring verified.')
              else:
                  for key in OLD:
                      if s.count(OLD[key])!=1:
                          raise SystemExit(f'SOURCE_DRIFT: expected exact unique {key}; found {s.count(OLD[key])}')
                  for key in OLD:
                      s=s.replace(OLD[key],NEW[key],1)
                  if s.count(MARK)!=1: raise SystemExit('SOURCE_DRIFT: bad inserted marker')
                  PAGE.write_text(s,encoding='utf8')
                  print('PWA media wiring updated.')
              ensure_new(LIB,Path(__file__).with_name('connect-media-optimizer.ts').read_text(encoding='utf8'))
              ensure_new(TEST,Path(__file__).with_name('pwa-media-optimizer.test.cjs').read_text(encoding='utf8'))
          
          if __name__=='__main__':apply()
          CONNECT_MEDIA_PATCH
          if test -e tests/pwa-media-optimizer.test.cjs; then
            cmp -s tests/pwa-media-optimizer.test.cjs "$RUNNER_TEMP/pwa-media-optimizer.test.cjs" || { echo 'SOURCE_DRIFT: existing optimizer tests differ' >&2; exit 1; }
          fi
          cp "$RUNNER_TEMP/pwa-media-optimizer.test.cjs" tests/pwa-media-optimizer.test.cjs

      - name: RED - source missing or previous behavior still present
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'CONNECT_PWA_SAFE_MEDIA_OPTIMIZATION_V1_20261115' app/page.tsx; then
            echo 'Already applied. Verify exact content in idempotent patch and GREEN checks.'
          else
            if node --test --test-name-pattern='media decisions preserve' tests/pwa-media-optimizer.test.cjs > "$RUNNER_TEMP/optimizer-red.log" 2>&1; then
              echo 'RED FAILED: media optimization unexpectedly already works' >&2
              exit 1
            fi
            echo 'RED confirmed: unified media optimizer not available in current application.'
          fi

      - name: Apply source-guarded and idempotent PWA change
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/apply_patch.py"
          python3 "$RUNNER_TEMP/apply_patch.py"
          git diff --check

      - name: GREEN - TypeScript, media policy, real Chromium and upload path tests
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --test tests/pwa-media-optimizer.test.cjs
          node --test tests/pwa-list-parity-gesture.test.cjs tests/pwa-dock-motion.test.cjs

      - name: Run full Connect regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Verify production Next.js build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Commit only verified intended files
        shell: bash
        run: |
          set -euo pipefail
          # Next.js rewrites this generated tracked file in some environments.
          # Restoring it is intentional; never loosen the guard for unrelated files.
          git restore -- next-env.d.ts
          git diff --check
          while IFS= read -r file; do
            case "$file" in
              app/page.tsx) ;;
              *) echo "Unexpected tracked file changed: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          while IFS= read -r file; do
            case "$file" in
              lib/connect-media-optimizer.ts|tests/pwa-media-optimizer.test.cjs) ;;
              *) echo "Unexpected untracked file: $file" >&2; exit 1 ;;
            esac
          done < <(git ls-files --others --exclude-standard)
          git add app/page.tsx lib/connect-media-optimizer.ts tests/pwa-media-optimizer.test.cjs
          if git diff --cached --quiet; then
            echo 'Verified exact media optimizer already present; nothing to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pwa): safe automatic media optimization with audio-preserving fallback'
          git push origin HEAD:main
