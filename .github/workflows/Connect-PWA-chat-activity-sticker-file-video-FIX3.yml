name: 'Connect PWA | Chat activity: sticker file video FIX3'
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-chat-activity-main
  cancel-in-progress: false
jobs:
  statuses:
    name: 'Apply and verify ephemeral chat activity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify Connect PWA checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f app/page.tsx
          test -f package-lock.json
          test -f lib/sticker-webp-transport.ts
          grep -q 'CONNECT_PWA_UNIFIED_CHAT_MEDIA_V1_20261112' app/page.tsx
      - name: Apply guarded activity status changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib tests
          cat > lib/chat-activity.ts <<'TS'
          export type ChatActivityKind = 'typing'|'voice'|'video'|'sticker'|'file';
          export type PeerActivity = {chat:string;kind:string;until:number};

          /** Video is advertised only after MediaRecorder actually begins recording. */
          export function composerActivity(videoRecording:boolean,stickerPicker:boolean,filePickerOpen:boolean): ChatActivityKind|null {
            if(videoRecording)return 'video';
            if(stickerPicker)return 'sticker';
            if(filePickerOpen)return 'file';
            return null;
          }

          /** Do not leak a stale status when switching to a different conversation. */
          export function visiblePeerActivity(peer:PeerActivity|null,activeChat:string|null,now:number): ChatActivityKind|null {
            if(!peer || !activeChat || peer.chat!==activeChat || !Number.isFinite(peer.until) || peer.until<=now)return null;
            return ['typing','voice','video','sticker','file'].includes(peer.kind)?peer.kind as ChatActivityKind:null;
          }

          /** The mobile OS can suspend JavaScript while its system file picker is open. */
          export function activityTtl(kind:string|null):number { return kind==='file'?60000:8000; }
          TS
          cat > tests/chat-activity-status.test.cjs <<'JS'
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),vm=require('node:vm'),ts=require('typescript');
          const root=path.resolve(__dirname,'..');
          const file=fs.readFileSync(root+'/lib/chat-activity.ts','utf8');
          const js=ts.transpileModule(file,{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2020}}).outputText;
          const mexports={};vm.runInNewContext(js,{exports:mexports});
          const {composerActivity,visiblePeerActivity,activityTtl}=mexports;

          test('file chooser survives mobile app backgrounding but expires if abandoned',()=>{assert.equal(activityTtl('file'),60000);assert.equal(activityTtl('sticker'),8000);assert.equal(activityTtl(null),8000)});
          test('idle composer does not claim activity',()=>assert.equal(composerActivity(false,false,false),null));
          test('opening sticker picker announces sticker selection',()=>assert.equal(composerActivity(false,true,false),'sticker'));
          test('opening file picker announces file selection',()=>assert.equal(composerActivity(false,false,true),'file'));
          test('opening video camera without recording does not claim recording',()=>assert.equal(composerActivity(false,false,false),null));
          test('video status starts only while recorder is active',()=>assert.equal(composerActivity(true,false,false),'video'));
          test('recording has priority when another picker was previously open',()=>assert.equal(composerActivity(true,true,true),'video'));
          test('sticker picker takes priority over a pending attachment dialog',()=>assert.equal(composerActivity(false,true,true),'sticker'));
          test('cancelling or completing all actions removes the status',()=>assert.equal(composerActivity(false,false,false),null));
          test('recipient sees a fresh activity in the same conversation',()=>assert.equal(visiblePeerActivity({chat:'one',kind:'file',until:9000},'one',1000),'file'));
          test('recipient does not see a different chat activity',()=>assert.equal(visiblePeerActivity({chat:'one',kind:'sticker',until:9000},'two',1000),null));
          test('recipient does not see a stale activity',()=>assert.equal(visiblePeerActivity({chat:'one',kind:'video',until:1000},'one',1000),null));
          test('recipient rejects invalid activity kinds and invalid expiries',()=>{assert.equal(visiblePeerActivity({chat:'one',kind:'something',until:9000},'one',1000),null);assert.equal(visiblePeerActivity({chat:'one',kind:'file',until:NaN},'one',1000),null)});

          test('actual PWA wires video, file and sticker status through the same activity channel',()=>{
           const page=fs.readFileSync(root+'/app/page.tsx','utf8');
           assert.match(page,/composerActivity\(videoNoteRecording,stickerPicker,filePickerOpen\)/);
           assert.match(page,/onRecordingChange=\{setVideoNoteRecording\}/);
           assert.match(page,/onCancel=\{\(\)=>setFilePickerOpen\(false\)\}/);
           assert.match(page,/const activePeerKind=visiblePeerActivity\(peerActivity,activeChat,Date\.now\(\)\)/);
           assert.match(page,/const updateTyping=useCallback/);
           assert.match(page,/const updateRecording=useCallback/);
          });
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re

          MARKER = 'CONNECT_PWA_CHAT_ACTIVITY_STATUS_V1_20261115'
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')


          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {count}')
              s = s.replace(old, new, 1)

          if MARKER not in s:
              replace_once(
                  "import { convertStickerWebpOnServer } from '../lib/sticker-webp-transport'; // CONNECT_PWA_STICKER_BINARY_TRANSPORT_FIX4_20261115",
                  "import { convertStickerWebpOnServer } from '../lib/sticker-webp-transport'; // CONNECT_PWA_STICKER_BINARY_TRANSPORT_FIX4_20261115\nimport { composerActivity, visiblePeerActivity, activityTtl } from '../lib/chat-activity'; // " + MARKER,
                  'activity helpers import'
              )
              replace_once(
                  'function VideoNoteRecorder({onClose,onSend}:{onClose:()=>void;onSend:(file:File)=>void}) {',
                  'function VideoNoteRecorder({onClose,onSend,onRecordingChange}:{onClose:()=>void;onSend:(file:File)=>void;onRecordingChange:(recording:boolean)=>void}) {',
                  'video recorder contract'
              )
              replace_once(
                  '      disposed=true;clearClock();\n      const recorder=recorderRef.current;',
                  '      disposed=true;clearClock();onRecordingChange(false);\n      const recorder=recorderRef.current;',
                  'video recorder unmount cleanup'
              )
              replace_once(
                  "recorder.onerror=()=>{setError('Ошибка записи видео');setPhase('error');clearClock();stopNormalizedFrames();stopCamera()};",
                  "recorder.onerror=()=>{onRecordingChange(false);setError('Ошибка записи видео');setPhase('error');clearClock();stopNormalizedFrames();stopCamera()};",
                  'video error cleanup'
              )
              replace_once(
                  '      recorder.onstop=()=>{\n        clearClock();stopNormalizedFrames();stopCamera();',
                  '      recorder.onstop=()=>{\n        onRecordingChange(false);clearClock();stopNormalizedFrames();stopCamera();',
                  'video stop cleanup'
              )
              replace_once(
                  "recorder.start(1000);startRef.current=Date.now();setSeconds(0);setPhase('recording');",
                  "recorder.start(1000);startRef.current=Date.now();setSeconds(0);setPhase('recording');onRecordingChange(true);",
                  'video recording starts only after MediaRecorder.start'
              )
              replace_once(
                  "}catch(e){stopNormalizedFrames();setError(e instanceof Error?e.message:'Не удалось начать запись');setPhase('error')}",
                  "}catch(e){onRecordingChange(false);stopNormalizedFrames();setError(e instanceof Error?e.message:'Не удалось начать запись');setPhase('error')}",
                  'video start failure cleanup'
              )
              replace_once(
                  '  function cancel(){onClose()}',
                  '  function cancel(){onRecordingChange(false);onClose()}',
                  'video cancel cleanup'
              )
              replace_once(
                  '  const [stickerPicker, setStickerPicker] = useState(false);',
                  '  const [stickerPicker, setStickerPicker] = useState(false);\n  const [filePickerOpen,setFilePickerOpen] = useState(false);\n  const [videoNoteRecording,setVideoNoteRecording] = useState(false);',
                  'picker state'
              )
              replace_once(
                  '  const [peerActivity,setPeerActivity]=useState<{kind:string;until:number}|null>(null);',
                  '  const [peerActivity,setPeerActivity]=useState<{chat:string;kind:string;until:number}|null>(null);',
                  'peer status scoped to chat'
              )
              replace_once(
                  "  const activitySupported=useRef(false),activityLast=useRef({chat:'',kind:'',at:0});",
                  "  const activitySupported=useRef(false),activityLast=useRef({chat:'',kind:'',at:0});\n  const activityWriteQueue=useRef<Promise<void>>(Promise.resolve());",
                  'serialized activity writes'
              )
              replace_once(
                  '  const attachmentInput = useRef<HTMLInputElement | null>(null);',
                  "  const attachmentInput = useRef<HTMLInputElement | null>(null);\n  const filePickerOpenedAt=useRef(0);\n  useEffect(()=>{\n    if(!filePickerOpen)return;\n    // Some iOS file pickers do not fire cancel. Regaining focus ends the indicator.\n    const onFocus=()=>{if(Date.now()-filePickerOpenedAt.current>800)window.setTimeout(()=>setFilePickerOpen(false),150);};\n    window.addEventListener('focus',onFocus);\n    return()=>window.removeEventListener('focus',onFocus);\n  },[filePickerOpen]);",
                  'file picker focus return handling'
              )
              old = '''  const updateActivity=useCallback(async(id:string,kind:string|null)=>{
              if(!supabase||!user)return;
              const now=Date.now(),last=activityLast.current;
              if(last.chat===id&&last.kind===(kind||'')&&now-last.at<4000)return;
              activityLast.current={chat:id,kind:kind||'',at:now};
              const until=kind?new Date(now+8000).toISOString():null;
              const values:Record<string,unknown>={conversation_id:id,user_id:user.id,typing_until:kind==='typing'?until:null,recording_until:kind==='voice'?until:null};
              if(activitySupported.current){values.activity_kind=kind;values.activity_until=until;}
              await supabase.from('conversation_user_state').upsert(values,{onConflict:'conversation_id,user_id'});
            },[user?.id]);'''
              new = '''  const updateActivity=useCallback((id:string,kind:string|null):Promise<void>=>{
              if(!supabase||!user)return Promise.resolve();
              const now=Date.now(),last=activityLast.current;
              if(last.chat===id&&last.kind===(kind||'')&&now-last.at<4000)return Promise.resolve();
              activityLast.current={chat:id,kind:kind||'',at:now};
              const until=kind?new Date(now+activityTtl(kind)).toISOString():null;
              const values:Record<string,unknown>={conversation_id:id,user_id:user.id,typing_until:kind==='typing'?until:null,recording_until:kind==='voice'?until:null};
              if(activitySupported.current){values.activity_kind=kind;values.activity_until=until;}
              // Serialize status writes so a delayed cleanup cannot overwrite the next status.
              const client=supabase;
              const write=activityWriteQueue.current.then(async()=>{
                const {error}=await client.from('conversation_user_state').upsert(values,{onConflict:'conversation_id,user_id'});
                if(error)console.warn('Connect activity update failed:',error.message);
              });
              activityWriteQueue.current=write.catch(()=>{});
              return activityWriteQueue.current;
            },[user?.id]);'''
              replace_once(old,new,'activity upsert serialisation')
              replace_once(
                  "    const kind=videoNoteOpen?'video':stickerPicker?'sticker':null;",
                  "    const kind=composerActivity(videoNoteRecording,stickerPicker,filePickerOpen);",
                  'active status uses actual recorder phase and picker'
              )
              replace_once(
                  '    const hidden=()=>{if(document.visibilityState!==\'visible\')void updateActivity(activeChat,null);};',
                  '    const hidden=()=>{\n      const isVisible=document.visibilityState===\'visible\';\n      // A system file picker can temporarily hide a mobile PWA; keep its short-lived status.\n      if(kind===\'file\' && !isVisible)return;\n      void updateActivity(activeChat,isVisible?kind:null);\n    };',
                  'background/return status lifecycle'
              )
              replace_once(
                  '  },[activeChat,videoNoteOpen,stickerPicker,updateActivity]);',
                  '  },[activeChat,videoNoteRecording,stickerPicker,filePickerOpen,updateActivity]);',
                  'activity effect dependencies'
              )
              replace_once(
                  '      setPeerActivity(action?{kind:action.activity_kind,until:Date.parse(action.activity_until)}:null);',
                  '      setPeerActivity(action?{chat:current||'',kind:action.activity_kind,until:Date.parse(action.activity_until)}:null);',
                  'peer status belongs to current conversation'
              )
              replace_once(
                  "  const peerStatus = peerActivity&&peerActivity.until>Date.now()?activityText[peerActivity.kind]||formatPresence(peerPresence,clock):peerRecording?'Записывает голосовое…':typing?'Печатает…':formatPresence(peerPresence,clock);",
                  "  const activePeerKind=visiblePeerActivity(peerActivity,activeChat,Date.now());\n  const peerStatus = activePeerKind?activityText[activePeerKind]||formatPresence(peerPresence,clock):peerRecording?'Записывает голосовое…':typing?'Печатает…':formatPresence(peerPresence,clock);",
                  'filter expired and other-chat peer status'
              )
              replace_once(
                  "  function enterChat(id: string) { setChatDisplayReady(",
                  "  function enterChat(id: string) { setPeerActivity(null);setTyping(false);setPeerRecording(false);setFilePickerOpen(false);setVideoNoteRecording(false);setChatDisplayReady(",
                  'clear previous chat activity on enter'
              )
              replace_once(
                  "  function exitChat() { captureChatAnchor();",
                  "  function exitChat() { setFilePickerOpen(false);setVideoNoteRecording(false);setPeerActivity(null);setPeerRecording(false);captureChatAnchor();",
                  'exit chat clear status'
              )
              replace_once(
                  "  function switchTab(t: Tab) { setSettingsPage('home'); setStickerPicker(false);",
                  "  function switchTab(t: Tab) { setSettingsPage('home'); setFilePickerOpen(false);setStickerPicker(false);",
                  'switch tab cleanup'
              )
              replace_once(
                  '              <input ref={attachmentInput} type="file" multiple hidden onChange={e=>{chooseAttachments(e.currentTarget.files);e.currentTarget.value=\'\';}}/>',
                  '              <input ref={attachmentInput} type="file" multiple hidden onChange={e=>{setFilePickerOpen(false);chooseAttachments(e.currentTarget.files);e.currentTarget.value=\'\';}} onCancel={()=>setFilePickerOpen(false)}/>',
                  'file chooser selection or cancellation'
              )
              replace_once(
                  "onClick={()=>setStickerPicker(x=>!x)} aria-label=\"Стикеры\"",
                  "onClick={()=>{setFilePickerOpen(false);setStickerPicker(x=>!x);}} aria-label=\"Стикеры\"",
                  'sticker button closes file picker'
              )
              replace_once(
                  "onClick={()=>{if(activeChat)void updateActivity(activeChat,'file');attachmentInput.current?.click();}} aria-label=\"Прикрепить фото, видео или файл\"",
                  "onClick={()=>{setStickerPicker(false);filePickerOpenedAt.current=Date.now();setFilePickerOpen(true);attachmentInput.current?.click();}} aria-label=\"Прикрепить фото, видео или файл\"",
                  'file button sends life-cycle status'
              )
              replace_once(
                  "{videoNoteOpen && <VideoNoteRecorder onClose={()=>setVideoNoteOpen(false)} onSend={file=>{setVideoNoteOpen(false);void sendAttachment(file)}}/>}",
                  "{videoNoteOpen && <VideoNoteRecorder onClose={()=>{setVideoNoteRecording(false);setVideoNoteOpen(false)}} onRecordingChange={setVideoNoteRecording} onSend={file=>{setVideoNoteRecording(false);setVideoNoteOpen(false);void sendAttachment(file)}}/>}",
                  'video recorder binds actual recording phase'
              )
              s = s.replace('// CONNECT_PWA_UNIFIED_CHAT_MEDIA_V1_20261112', '// CONNECT_PWA_UNIFIED_CHAT_MEDIA_V1_20261112\n// '+MARKER, 1)
              p.write_text(s,encoding='utf-8')
              print('Applied guarded chat activity status patch.')
          else:
              print('Status patch already applied; no source rewrite.')
          PY
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: npm ci
      - name: Test chat activity lifecycle and existing typing and voice integration
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/chat-activity-status.test.cjs
      - name: Install pinned Chromium and verify real browser launch
        shell: bash
        run: |
          set -euo pipefail
          # Only playwright-core is a locked project dependency (1.58.2).
          # Never run `npx playwright install`: npm installs a newer Playwright
          # and its browser build no longer matches require('playwright-core').
          # playwright-core 1.58.2 supports Ubuntu 24.04; ubuntu-latest currently
          # selects 26.04, for which the pinned Playwright version has no browser build.
          . /etc/os-release
          test "$VERSION_ID" = "24.04" || { echo "Expected Ubuntu 24.04, got ${PRETTY_NAME:-unknown}"; exit 1; }
          test -f ./node_modules/playwright-core/cli.js
          node -e "const p=require('playwright-core/package.json'); console.log('Using installed playwright-core '+p.version)"
          node ./node_modules/playwright-core/cli.js install --with-deps chromium
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const executable = chromium.executablePath();
            if (!fs.existsSync(executable)) throw new Error('Missing Chromium for locked playwright-core: ' + executable);
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            try {
              const page = await browser.newPage();
              await page.goto('data:text/html,<title>connect-ready</title>');
              if (await page.title() !== 'connect-ready') throw new Error('Chromium smoke test failed');
              console.log('Pinned Chromium ready: ' + executable);
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
      - name: Typecheck all existing tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          git diff --check
      - name: Commit only verified changes to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main changed during validation, please rerun workflow'; exit 1; }
          git add app/page.tsx lib/chat-activity.ts tests/chat-activity-status.test.cjs
          if git diff --cached --quiet; then
            echo 'Activity update already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show sticker file and video activity in chat'
          git push origin HEAD:main
