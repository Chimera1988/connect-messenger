      - name: Repair WebRTC integration harness for call output state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RTC_HARNESS'
          from pathlib import Path
          path=Path('tests/call-rtc.integration.cjs')
          if not path.is_file():raise SystemExit('SOURCE_DRIFT: missing real WebRTC integration test')
          source=path.read_text(encoding='utf-8')
          marker='// CONNECT_PWA_CALL_OUTPUT_HARNESS_FIX1_20261114'
          old='setSpeakerOn(){},setElapsed(){},setMuted(){},setToast(){},setError(){},'
          new='setSpeakerOn(){},setAudioRouteOpen(){},setAudioRouteBusy(){},setAudioRouteName(){},setAudioRouteDevices(){},setElapsed(){},setMuted(){},setToast(){},setError(){},'
          # Start with failing preflight: the current harness must be the documented one.
          if marker in source:
              if source.count(marker)!=1 or source.count(new)!=1:
                  raise SystemExit('Existing test-harness fix differs; refusing silent reuse')
              print('RTC test harness already adapted and guarded')
          else:
              if source.count(old)!=1:
                  raise SystemExit(f'SOURCE_DRIFT: expected one original mock setter list, found {source.count(old)}')
              source=source.replace(old,new,1)
              anchor='  vm.createContext(context);'
              if source.count(anchor)!=1:
                  raise SystemExit(f'SOURCE_DRIFT: VM initialization count {source.count(anchor)}')
              guard="""  // CONNECT_PWA_CALL_OUTPUT_HARNESS_FIX1_20261114
          // Fail at VM setup, not during asynchronous call cleanup: every unqualified
          // React state setter used in cleanup must be present in the test harness.
          const cleanupText=functions.get('cleanup')||'';
          const cleanupSetters=new Set(cleanupText.match(/(?<![\w.])set[A-Z]\w*(?=\s*\()/g)||[]);
          for(const setter of cleanupSetters){
            assert.equal(typeof context[setter],'function','RTC test harness missing cleanup setter: '+setter);
          }
          """
              source=source.replace(anchor,guard+anchor,1)
              path.write_text(source,encoding='utf-8')
              print('RTC harness synchronized with four new call output UI setters; guard installed')
          PY_RTC_HARNESS

      - name: Install dependencies (no version drift)
        run: npm ci --no-audit --no-fund

      - name: Install matching Chromium before browser regressions
        run: npx playwright-core install --with-deps chromium

      - name: Verify actual Chromium executable
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Chromium missing: '+p)"

      - name: Check changes and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run typecheck

      - name: Run specific Push and audio output tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/connect-push-repair.test.cjs tests/connect-call-output.test.cjs

      - name: Run full existing Connect regression tests
        run: npm test

      - name: Verify production build of PWA
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: AQID
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Commit verified PWA-only changes
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/calls.css \
            components/ConnectAudioCalls.tsx components/ConnectWebPushDiagnostics.tsx \
            components/ConnectPushGuardian.tsx lib/connect-push-repair.ts lib/connect-call-output.ts \
            tests/connect-push-repair.test.cjs tests/connect-call-output.test.cjs \
            tests/call-rtc.integration.cjs
          if git diff --cached --quiet; then
            echo 'PWA update already present; no commit needed.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): self-repair push, audio routes, and RTC harness coverage'
          git push origin HEAD:main
