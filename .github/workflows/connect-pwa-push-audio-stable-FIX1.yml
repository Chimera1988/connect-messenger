name: Connect PWA | Push self-repair and call audio output FIX1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-push-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pwa-push-and-audio:
    name: Guarded PWA-only push recovery and audio selection
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assert expected repository and npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test -s package-lock.json
          test -s AGENTS.md
          test -s components/ConnectAudioCalls.tsx
          test -s components/ConnectWebPushDiagnostics.tsx
          test -s app/page.tsx
          test -s app/calls.css
          test -s tests/cache-browser.test.cjs

      - name: Setup Node.js 22 (locked dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

