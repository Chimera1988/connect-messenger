name: Connect Neon | Media mirror FIX1 verified read-back

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connect-neon-media-mirror-FIX1-2026-11-16.yml'

permissions:
  contents: write

concurrency:
  group: connect-neon-media-bulk-production
  cancel-in-progress: false

jobs:
  repair:
    name: Repair mirror verification without changing Connect clients
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout existing Connect main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate baseline and prevent unrelated patches
        run: |
          test -s AGENTS.md
          test -s app/page.tsx
          test -s app/api/connect-neon/admin/media-mirror/route.js
          test -s lib/connect-neon-media-guards.cjs
          test -s tests/connect-neon-media-mirror.test.cjs
          test -s package-lock.json
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
