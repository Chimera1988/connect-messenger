      - name: Unit tests including malformed S3 URLs and independent SHA-256
        run: |
          node --check lib/connect-neon-media-verify.cjs
          node --check lib/connect-neon-media-guards.cjs
          node --check app/api/connect-neon/admin/media-mirror/route.js
          node --test tests/connect-neon-media-verify.test.cjs
          node --test tests/connect-neon-media-mirror.test.cjs
          node --test tests/connect-neon-consolidated.test.cjs
          git diff --check
      - name: TypeScript gate
        run: npm run typecheck
      - name: Install Chromium for existing browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Run entire existing Connect regression suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit and deploy verified server-only fix
        shell: bash
        run: |
          git add app/api/connect-neon/admin/media-mirror/route.js \
            lib/connect-neon-media-verify.cjs \
            tests/connect-neon-media-verify.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Mirror read-back fix already applied; no commit necessary'
            exit 0
          fi
          git config user.name 'Connect Neon CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect: repair private Neon media SHA-256 readback and diagnostics'
          git push origin HEAD:main
