name: Connect Neon | Production media migration (single release)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connect-neon-media-bulk-production-2026-11-16.yml'

permissions:
  contents: write

concurrency:
  group: connect-neon-media-bulk-production
  cancel-in-progress: false

jobs:
  release:
    name: Mirror media to private Neon Storage without breaking APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout working Connect repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate app and package baseline
        shell: bash
        run: |
          test -s AGENTS.md
          test -s app/page.tsx
          test -s lib/connect-neon-live-db.cjs
          test -s lib/connect-neon-live-session.cjs
          test -s app/api/connect-neon/messages/route.js
          test -s tests/connect-neon-consolidated.test.cjs
          test -s package-lock.json
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
