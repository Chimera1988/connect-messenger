          bundle=zipfile.ZipFile(io.BytesIO(base64.b64decode(data)))
          files={name:bundle.read(name) for name in bundle.namelist()}
          assert len(files)==4 and all(not name.startswith('/') and '..' not in Path(name).parts for name in files)
          assert all(name.startswith(('app/api/connect-neon/','lib/','tests/')) for name in files)
          for name,content in files.items():
              path=root/name
              if path.exists() and path.read_bytes()!=content:
                  raise SystemExit('SOURCE_DRIFT: existing source differs at '+name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(content)
          print('Prepared',len(files),'files safely; no PWA or APK code overwritten')
          PYEMBED
      - name: Validate mirrored object security and server routes
        shell: bash
        run: |
          node --check lib/connect-neon-media-guards.cjs
          node --check app/api/connect-neon/admin/media-mirror/route.js
          node --check app/api/connect-neon/media/route.js
          node --test tests/connect-neon-media-mirror.test.cjs
          node --test tests/connect-neon-consolidated.test.cjs
          git diff --check
      - name: Run TypeScript before expensive browser installation
        run: npm run typecheck
      - name: Install the Chromium required by existing tests
        run: npx playwright-core install --with-deps chromium
      - name: Run complete Connect regression suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit only validated server additions
        shell: bash
        run: |
          git add lib/connect-neon-media-guards.cjs \
            app/api/connect-neon/admin/media-mirror/route.js \
            app/api/connect-neon/media/route.js \
            tests/connect-neon-media-mirror.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Media mirror already installed; no changes needed'
            exit 0
          fi
          git config user.name 'Connect Neon CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect: private Neon media mirror, verified transfer and old APK fallback'
          git push origin HEAD:main
