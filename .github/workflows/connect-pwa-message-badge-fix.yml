name: Connect PWA — Background Message Icon Badge Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-message-badge-fix.yml'

permissions:
  contents: write

concurrency:
  group: connect-pwa-message-badge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  message-badge:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout current PWA sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify repository and patch only message badge handling
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          python3 - <<'PATCH_BADGE_PY'
          from pathlib import Path


          def replace_one(value: str, old: str, new: str, title: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{title}: expected 1 exact occurrence, found {count}; no changes saved')
              return value.replace(old, new, 1)


          def apply(root: Path):
              swfile = root / 'public/sw.js'
              pushfile = root / 'app/api/push/message/route.ts'
              sw = swfile.read_text('utf8')
              push = pushfile.read_text('utf8')
              if 'const badgeTask=isCall?Promise.resolve()' in sw and "const payload=JSON.stringify({kind:'message'" in push:
                  print('Background message badges already fixed; skipping source changes')
                  return

              old_push = "  const payload=JSON.stringify({title,body:'Новое сообщение',conversationId:record.conversation_id,messageId:record.id,createdAt:record.created_at,userId:recipient});"
              new_push = """  // Web Push may arrive without a timestamp in a legacy webhook row. The
            // installed PWA still needs a dated, deduplicable event for its icon badge.
            const createdAt=typeof record.created_at==='string'&&Number.isFinite(Date.parse(record.created_at))
              ?record.created_at:new Date().toISOString();
            const payload=JSON.stringify({kind:'message',title,body:'Новое сообщение',conversationId:record.conversation_id,messageId:record.id,createdAt,userId:recipient});"""
              push = replace_one(push, old_push, new_push, 'message push metadata')

              old_sw = """ const isCall=d.kind==='incoming-call';if(!isCall&&d.userId&&d.createdAt){const read=await watermark(d.userId,d.conversationId);if(Date.parse(d.createdAt)<=Date.parse(read))return;}
           await self.registration.showNotification(d.title||'Connect',{body:isCall?'Входящий аудиозвонок':'Новое сообщение',icon:'/icon-192.png',badge:'/icon-192.png',tag:isCall?'connect-call-'+d.callId:'connect-message-'+d.messageId,data:{kind:isCall?'incoming-call':'message',conversationId:d.conversationId||null,callId:d.callId||null,createdAt:d.createdAt||'',userId:d.userId||''},silent:false,...(isCall?{requireInteraction:true}:{})});if(!isCall)await badgeEvent(d,'message').catch(()=>{});"""
              new_sw = """ const isCall=d.kind==='incoming-call';
           const messageAt=badgeDate(d.createdAt)?d.createdAt:new Date().toISOString();
           if(!isCall&&d.userId&&d.createdAt){const read=await watermark(d.userId,d.conversationId);if(badgeDate(d.createdAt)&&badgeDate(d.createdAt)<=badgeDate(read))return;}
           // On iOS Home Screen, start the badge write in this same background push event,
           // not only after notification display has resolved. waitUntil covers both tasks.
           // The event ID is unchanged, so duplicate web push delivery counts only once.
           const badgeTask=isCall?Promise.resolve():badgeEvent({...d,createdAt:messageAt},'message').catch(()=>{});
           const notificationTask=self.registration.showNotification(d.title||'Connect',{body:isCall?'Входящий аудиозвонок':'Новое сообщение',icon:'/icon-192.png',badge:'/icon-192.png',tag:isCall?'connect-call-'+d.callId:'connect-message-'+d.messageId,data:{kind:isCall?'incoming-call':'message',conversationId:d.conversationId||null,callId:d.callId||null,createdAt:messageAt,userId:d.userId||''},silent:false,...(isCall?{requireInteraction:true}:{})});
           await Promise.all([badgeTask,notificationTask]);"""
              sw = replace_one(sw, old_sw, new_sw, 'background message badge scheduling')
              swfile.write_text(sw,'utf8')
              pushfile.write_text(push,'utf8')
              print('Patched service worker and message webhook only')


          if __name__=='__main__':
              apply(Path('.'))
          PATCH_BADGE_PY
          python3 - <<'CHECK_BADGE_PY'
          from pathlib import Path
          sw=Path('public/sw.js').read_text()
          payload=Path('app/api/push/message/route.ts').read_text()
          assert 'const badgeTask=isCall?Promise.resolve()' in sw
          assert 'await Promise.all([badgeTask,notificationTask]);' in sw
          assert "kind:'message',title,body:'Новое сообщение'" in payload
          assert "await badgeEvent(d,'call')" in sw, 'Existing missed-call badge must be preserved'
          CHECK_BADGE_PY
          git diff --check

      - name: Include background Web Push regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/app-badge-push.test.cjs <<'BADGE_PUSH_TEST'
          'use strict';
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const {readFileSync}=require('node:fs');
          const vm=require('node:vm');

          function worker() {
            const handlers={};
            const displayed=[];
            const notices=[];
            let holdNotification=false;
            let releaseNotification=()=>{};
            const self={
              navigator:{setAppBadge:async value=>{displayed.push(value);},clearAppBadge:async()=>{displayed.push(0);}},
              registration:{
                showNotification:(title,options)=>{
                  notices.push({title,options});
                  if(!holdNotification)return Promise.resolve();
                  return new Promise(resolve=>{releaseNotification=resolve;});
                },getNotifications:async()=>[],
              },
              addEventListener:(type,callback)=>{handlers[type]=callback;},
            };
            const ctx=vm.createContext({self,indexedDB:{},Promise,Date,Number,Math,Object,console,URL});
            vm.runInContext(readFileSync('public/sw.js','utf8'),ctx);
            // Use the real badge event and count logic but avoid browser-specific IndexedDB
            // transaction plumbing: the test is specifically the push event path.
            vm.runInContext(`let state=badgeEmpty();
              badgeChange=async(_user,update)=>{update(state);await badgeDisplay(badgeCount(state));};
              watermark=async()=>'';
            `,ctx);
            function receive(data){
              let promise;
              handlers.push({data:{json:()=>data},waitUntil(value){promise=value;}});
              assert.ok(promise,'push must be owned by waitUntil');
              return promise;
            }
            return {displayed,notices,ctx,receive,
              hold(){holdNotification=true;},
              release(){holdNotification=false;releaseNotification();}
            };
          }
          const chat='11111111-1111-4111-8111-111111111111';
          const message={kind:'message',userId:'viewer',conversationId:chat,messageId:'message-1',createdAt:'2026-11-13T02:00:00Z',title:'From Connect'};

          test('message push sets badge in background while iOS notification promise is still pending',async()=>{
           const w=worker();w.hold();
           const finish=w.receive({...message});
           // If a pending notification blocks the icon badge, this test catches it.
           for(let i=0;i<5;i++)await new Promise(resolve=>setImmediate(resolve));
           assert.equal(w.notices.length,1,'message notification was scheduled');
           assert.equal(w.displayed.at(-1),1,'badge updated without waiting for notification UI');
           w.release();await finish;
          });

          test('legacy message payload without createdAt receives a badge and duplicate push is counted once',async()=>{
           const w=worker();
           const legacy={...message,messageId:'legacy-1'};delete legacy.createdAt;
           await w.receive(legacy);
           assert.equal(w.displayed.at(-1),1);
           assert.ok(Date.parse(w.notices.at(-1).options.data.createdAt),'notification timestamp must be valid');
           await w.receive(legacy);
           assert.equal(w.displayed.at(-1),1,'same message must not inflate the badge');
          });

          test('read watermark still suppresses already read message pushes',async()=>{
           const w=worker();
           vm.runInContext("watermark=async()=> '2026-11-13T03:00:00Z'",w.ctx);
           await w.receive(message);
           assert.equal(w.displayed.length,0);
           assert.equal(w.notices.length,0);
          });

          test('incoming call path does not add an event badge',async()=>{
           const w=worker();
           await w.receive({kind:'incoming-call',callId:'call-1',userId:'viewer',title:'Incoming'});
           assert.equal(w.notices.length,1);
           assert.equal(w.displayed.length,0);
          });
          BADGE_PUSH_TEST
          node --check public/sw.js
          node --check tests/app-badge-push.test.cjs

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check badge push, read and missed-call regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/app-badge.test.cjs tests/app-badge-push.test.cjs
          node tests/missed-call-status.test.cjs
          npm run typecheck
          npm run build
          git diff --check

      - name: Commit only verified PWA changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/sw.js app/api/push/message/route.ts tests/app-badge-push.test.cjs
          if git diff --cached --quiet; then
            echo 'Message badge fix is already applied; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix iPhone background message home icon badges'
          git push origin HEAD:main
