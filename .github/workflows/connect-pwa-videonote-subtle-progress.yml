name: Connect PWA - subtle video note progress ring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-videonote-subtle-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust-video-note-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect PWA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make video note progress ring thin and subtle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/liquid-glass.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Connect PWA: subtle video-note progress ring v1 */'
          if marker in css:
              print('Progress ring adjustment already applied.')
          else:
              required = (
                  '.connect-video-note-progress-track',
                  '.connect-video-note-progress-fill',
                  '.connect-video-note-progress',
              )
              if not all(selector in css for selector in required):
                  raise SystemExit('Expected video-note progress styles are missing; leaving code unchanged.')
              css = css.rstrip() + '''

          /* Connect PWA: subtle video-note progress ring v1 */
          /* Only affects circular VIDEO NOTES; ordinary videos and other controls remain unchanged. */
          .connect-app .bubble.video-note-bubble .connect-video-note-progress .connect-video-note-progress-track {
            stroke: rgba(255, 255, 255, .12) !important;
            stroke-width: .7px !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note-progress .connect-video-note-progress-fill {
            stroke: var(--accent, #087dff) !important;
            stroke-width: .7px !important;
            opacity: .34 !important;
          }
          '''
              path.write_text(css, encoding='utf-8')
              print('Video note ring: 0.7 SVG units, low-opacity track and progress.')
          PY
      - name: Check patch
        run: git diff --check
      - name: Commit CSS-only fix
        shell: bash
        run: |
          git add app/liquid-glass.css
          if git diff --cached --quiet; then
            echo 'Already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: make video note progress ring thin and subtle'
          git push origin HEAD:main
