name: Connect PWA - reference SVG icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-reference-icons.yml'

permissions:
  contents: write

concurrency:
  group: connect-pwa-reference-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect PWA
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate target and patch SVGs
        shell: bash
        run: |
          test "${{ github.repository }}" = 'Chimera1988/connect-messenger'
          python3 - <<'PY'
          from pathlib import Path
          import re

          page_file = Path('app/page.tsx')
          call_file = Path('components/ConnectCallsHub.tsx')
          layout_file = Path('app/layout.tsx')
          css_file = Path('app/connect-icons.css')

          for path in (page_file,call_file,layout_file):
              if not path.is_file():
                  raise SystemExit(f'Required Connect PWA source not found: {path}')

          page = page_file.read_text(encoding='utf-8')
          call = call_file.read_text(encoding='utf-8')
          layout = layout_file.read_text(encoding='utf-8')

          if 'function Icon({ name, size = 22, stroke = 1.9 }:' not in page:
              raise SystemExit('Connect icon component has changed; stopping without guessing')
          if 'function CallIcon({ outgoing = false, size = 24 }:' not in call:
              raise SystemExit('ConnectCallsHub icon component has changed; stopping without guessing')
          if 'aria-label="Основная навигация"' not in page or 'aria-label="Стикеры"' not in page:
              raise SystemExit('Connect navigation/composer structure changed; stopping')

          # One inline SVG path set per existing icon. Button actions and app logic are unchanged.
          icons = {
              'chats': '''<><path d="M10.1 4.4a8.3 8.3 0 0 1 9.6 11.7l1.3 3.1-3.4-1.2"/><path d="M12 7.4a7.8 7.8 0 0 0-6.5 12.1L4 22l3.9-1.3a7.8 7.8 0 1 0 4.1-13.3Z"/></>''',
              'contacts': '''<><circle cx="8.8" cy="8.5" r="2.8"/><path d="M2.8 19.9v-1.4a6 6 0 0 1 11.9-1.3"/><circle cx="16.7" cy="7.4" r="2.5"/><path d="M14.9 14a6.3 6.3 0 0 1 6.3 6v.3h-8.6"/></>''',
              'settings': '''<><path d="M10.2 2.7h3.6l.6 2.1c.6.2 1.3.5 1.8 1l2-.9 2.4 2.5-1.1 1.9c.3.6.4 1.3.5 1.9l2 1.1v3.4l-2.1.7c-.2.7-.5 1.3-.8 1.9l.8 2-2.5 2.4-1.9-1.1c-.6.3-1.2.5-1.9.6l-1 2.1h-3.4l-.7-2.1c-.7-.2-1.3-.5-1.9-.8l-2 .8-2.4-2.5 1.1-1.9c-.3-.6-.5-1.2-.6-1.9L1.8 14v-3.4l2.1-.7c.2-.7.5-1.3.8-1.9l-.9-2 2.5-2.4 1.9 1.1c.6-.3 1.2-.5 1.9-.6z"/><circle cx="12" cy="12.3" r="3.1"/></>''',
              'camera': '''<><path d="M3.2 7.4h3.7l1.7-2.6h6.8l1.7 2.6h3.7c.7 0 1.2.6 1.2 1.3v10c0 .8-.5 1.3-1.2 1.3H3.2c-.7 0-1.2-.5-1.2-1.3v-10c0-.7.5-1.3 1.2-1.3Z"/><circle cx="12" cy="13.3" r="3.6"/></>''',
              'plus': '''<path d="M12 3.4v17.2M3.4 12h17.2"/>''',
              'mic': '''<><rect x="9" y="2" width="6" height="13.1" rx="3"/><path d="M5.2 10.5a6.8 6.8 0 0 0 13.6 0M12 17.3V22m-4.2 0h8.4"/></>''',
              'smile': '''<><circle cx="12" cy="12" r="9.1"/><circle cx="8.5" cy="9.4" r=".8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="9.4" r=".8" fill="currentColor" stroke="none"/><path d="M7.8 14.4c1 1.9 2.6 2.9 4.2 2.9s3.2-1 4.2-2.9"/></>''',
          }

          # Add smile to the existing TypeScript union and replace the text emoji with actual SVG.
          if "'settings' | 'smile'" not in page:
              old = "type IconName = 'chats' | 'contacts' | 'settings' | 'back'"
              new = "type IconName = 'chats' | 'contacts' | 'settings' | 'smile' | 'back'"
              if page.count(old) != 1:
                  raise SystemExit('IconName union no longer matches expected source')
              page = page.replace(old, new, 1)

          for key, markup in icons.items():
              new_line = f'    {key}: {markup},'
              pattern = re.compile(r'(?m)^    '+re.escape(key)+r': .*,$')
              matches = list(pattern.finditer(page))
              if key == 'smile' and not matches:
                  anchor = '    plus: '
                  at = page.find(anchor)
                  if at == -1:
                      raise SystemExit('Missing plus SVG anchor')
                  page = page[:at] + new_line + '\n' + page[at:]
                  continue
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one SVG for {key}, found {len(matches)}')
              start, end = matches[0].span()
              if page[start:end] != new_line:
                  page = page[:start] + new_line + page[end:]

          old_sticker = 'aria-label="Стикеры">☺</button>'
          new_sticker = 'aria-label="Стикеры"><Icon name="smile" size={24}/></button>'
          if old_sticker in page:
              if page.count(old_sticker) != 1:
                  raise SystemExit('Unexpected multiple sticker buttons')
              page = page.replace(old_sticker, new_sticker, 1)
          elif new_sticker not in page:
              raise SystemExit('Sticker trigger changed; refusing unsafe patch')

          # The calls tab is rendered by ConnectCallsHub, not app/page.tsx.
          call_before = 'strokeWidth="1.85" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">\n    <path d="M5 3.8c-1.6 1-1.3 4.8 1.2 8.6 2.4 3.8 5.9 6.7 8.7 6.4 1.1-.1 3-1.4 3.3-2.7l.2-2.3c0-.7-.5-1.4-1.3-1.6l-3.2-.9a1.4 1.4 0 0 0-1.5.6l-1.2 1.4c-2.3-1-4.5-3.2-5.5-5.5l1.4-1.2c.5-.4.7-1 .5-1.6l-.9-3.2A1.7 1.7 0 0 0 7.7 3z" />'
          call_after = 'strokeWidth="2.0" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">\n    <path d="M6.3 3.2c-.6-.6-1.5-.6-2.2-.1L2.9 4.3c-1 1-1.2 2.2-.7 3.8 2.4 6.7 6.9 11.2 13.6 13.6 1.6.5 2.8.3 3.8-.7l1.2-1.2c.5-.7.5-1.6-.1-2.2l-3.3-2.7a1.8 1.8 0 0 0-2.2 0l-1.4 1.2a15 15 0 0 1-6.2-6.2l1.2-1.4a1.8 1.8 0 0 0 0-2.2Z" />'
          if call_before in call:
              call = call.replace(call_before, call_after, 1)
          elif call_after not in call:
              raise SystemExit('Calls SVG changed; refusing unsafe patch')

          # Separate stylesheet, imported after the existing theme sheets, for transparent overrides.
          import_line = "import './connect-icons.css';"
          if import_line not in layout:
              anchor = "import './connect-splash.css';"
              if layout.count(anchor) != 1:
                  raise SystemExit('Root layout CSS import anchor changed')
              layout = layout.replace(anchor, anchor + '\n' + import_line, 1)

          css = r'''/* Connect PWA: reference SVG icon set, 2026-11. Do not change handlers. */
          .connect-app .bottom-nav .nav-tab {
            min-height: 54px !important;
            gap: 3px !important;
            padding: 4px 3px !important;
            border-radius: 19px;
          }
          .connect-app .bottom-nav .nav-tab .nav-symbol {
            width: 34px !important;
            height: 31px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
          }
          .connect-app .bottom-nav .nav-tab .nav-symbol svg,
          .connect-app .bottom-nav > .connect-calls-tab .nav-symbol svg {
            width: 28px !important;
            height: 28px !important;
            stroke-width: 1.85;
            overflow: visible;
          }
          .connect-app .bottom-nav .nav-tab small {
            font-size: 11px !important;
            font-weight: 640;
            line-height: 1.25;
          }
          .connect-app .bottom-nav .nav-tab.selected {
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 34%, rgba(186,218,250,.15)) !important;
            background: linear-gradient(145deg,
              color-mix(in srgb, var(--accent) 16%, rgba(24,48,86,.42)),
              color-mix(in srgb, var(--accent) 10%, rgba(27,49,78,.36))) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.13), 0 0 0 1px color-mix(in srgb, var(--accent) 8%, transparent) !important;
          }
          .connect-app .chat-composer .compose-line > button.composer-extra[aria-label="Стикеры"] {
            font-size: initial !important;
            line-height: normal;
          }
          /* Remove the older decorative mask; the real smile SVG replaces it. */
          .connect-app .chat-composer .compose-line > button.composer-extra[aria-label="Стикеры"]::before {
            content: none !important;
            display: none !important;
          }
          .connect-app .chat-composer .compose-line .composer-extra {
            width: 32px !important;
            min-width: 30px !important;
            height: 40px !important;
            opacity: 1;
            color: var(--accent2);
          }
          .connect-app .chat-composer .compose-line .composer-extra svg {
            width: 26px !important;
            height: 26px !important;
            stroke-width: 1.85;
          }
          .connect-app .chat-composer .compose-line > input {
            min-width: 0;
          }
          @media (max-width: 390px) {
            .connect-app .bottom-nav .nav-tab .nav-symbol svg,
            .connect-app .bottom-nav > .connect-calls-tab .nav-symbol svg {
              width: 25px !important;
              height: 25px !important;
            }
            .connect-app .chat-composer .compose-line .composer-extra {
              width: 28px !important;
              min-width: 27px !important;
            }
            .connect-app .chat-composer .compose-line .composer-extra svg {
              width: 23px !important;
              height: 23px !important;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .connect-app .bottom-nav .nav-tab { transition: none !important; }
          }
          '''

          page_file.write_text(page, encoding='utf-8')
          call_file.write_text(call, encoding='utf-8')
          layout_file.write_text(layout, encoding='utf-8')
          css_file.write_text(css, encoding='utf-8')
          print('Updated real SVG icons in PWA navigation and composer. Existing handlers unchanged.')
          PY
      - name: Validate diff and TypeScript
        shell: bash
        run: |
          git diff --check
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit only PWA icon changes
        shell: bash
        run: |
          git config user.name 'Connect PWA UI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx components/ConnectCallsHub.tsx app/layout.tsx app/connect-icons.css
          if git diff --cached --quiet; then
            echo 'Reference icons already installed.'
          else
            git commit -m 'style: match Connect PWA icons to reference'
            git push origin HEAD:main
          fi
