name: Connect PWA | WebP stickers, JPG and editor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-sticker-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sticker-upgrade:
    name: Patch, verify and commit PWA sticker system
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify repository and source files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s app/page.tsx
          test -s app/globals.css
          test -s package.json
          test -s package-lock.json
          test -s lib/connect-media-optimizer.ts
          test -s tests/media-recovery.test.cjs
      - name: Apply guarded sticker PWA patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect_sticker_upgrade_patch.py" <<'CONNECT_STICKER_PWA_PATCH_20261115'
          #!/usr/bin/env python3
          """Idempotent guarded patch of Connect PWA sticker upload, legacy conversion and editor."""
          from pathlib import Path

          ROOT=Path('.')
          PAGE=ROOT/'app/page.tsx'
          CSS=ROOT/'app/globals.css'
          STICKER=ROOT/'lib/sticker-webp.ts'
          TEST=ROOT/'tests/sticker-webp.test.cjs'
          MARKER='CONNECT_PWA_STICKER_WEBP_EDITOR_20261115'

          converter = r'''/** CONNECT_PWA_STICKER_WEBP_EDITOR_20261115
           * Convert still PNG/JPEG to transparent-friendly WebP *before* uploading.
           * GIFs and existing WebP files retain their bytes and possible animation.
           */
          const MAX_STICKER_BYTES = 2 * 1024 * 1024;
          const MAX_STICKER_INPUT = 12 * 1024 * 1024;
          const MAX_STICKER_SIDE = 512;

          export async function prepareStickerFile(file: File): Promise<File> {
            const extension = file.name.toLowerCase().match(/\.(jpe?g|png|webp|gif)$/)?.[1];
            const detected = file.type.toLowerCase();
            const mime = detected === 'image/jpg' ? 'image/jpeg' : detected || (
              extension === 'jpg' || extension === 'jpeg' ? 'image/jpeg' :
              extension === 'png' ? 'image/png' :
              extension === 'webp' ? 'image/webp' :
              extension === 'gif' ? 'image/gif' : ''
            );
            if (!['image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(mime)) {
              throw new Error('Поддерживаются JPG, PNG, WebP и GIF');
            }
            if (file.size <= 0 || file.size > MAX_STICKER_INPUT) {
              throw new Error('Исходное изображение должно быть до 12 МБ');
            }
            // Never flatten animations during optimization.
            if (mime === 'image/gif' || mime === 'image/webp') {
              if (file.size > MAX_STICKER_BYTES) throw new Error('GIF и WebP должны быть не больше 2 МБ');
              if (file.type === mime) return file;
              return new File([file], file.name, { type: mime, lastModified: file.lastModified });
            }

            const url = URL.createObjectURL(file);
            try {
              const image = new Image();
              await new Promise<void>((resolve, reject) => {
                image.onload = () => resolve();
                image.onerror = () => reject(new Error('Не удалось прочитать изображение'));
                image.src = url;
              });
              if (!image.naturalWidth || !image.naturalHeight ||
                  image.naturalWidth * image.naturalHeight > 40_000_000) {
                throw new Error('Изображение слишком большое или повреждено');
              }
              const scale = Math.min(1, MAX_STICKER_SIDE / Math.max(image.naturalWidth, image.naturalHeight));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
              const context = canvas.getContext('2d');
              if (!context) throw new Error('Нет поддержки обработки изображения');
              context.imageSmoothingEnabled = true;
              context.imageSmoothingQuality = 'high';
              // Alpha remains transparent; do not paint an opaque background.
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              const blob = await new Promise<Blob>((resolve, reject) => {
                canvas.toBlob(result => result ? resolve(result) : reject(new Error('Не удалось создать WebP')),
                  'image/webp', 0.9);
              });
              if (blob.type !== 'image/webp' || !blob.size || blob.size > MAX_STICKER_BYTES) {
                throw new Error('Конвертация WebP не поддерживается или файл больше 2 МБ');
              }
              const filename = (file.name.replace(/\.[^.]+$/, '') || 'sticker') + '.webp';
              return new File([blob], filename, { type: 'image/webp', lastModified: file.lastModified });
            } finally {
              URL.revokeObjectURL(url);
            }
          }
          '''

          test_source = r'''// CONNECT_PWA_STICKER_WEBP_EDITOR_20261115 - focused no-network regression tests.
          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const ts = require('typescript');
          const vm = require('node:vm');
          const source = fs.readFileSync(path.join(__dirname, '../lib/sticker-webp.ts'), 'utf8');
          const compiled = ts.transpileModule(source, {
            compilerOptions: { target: ts.ScriptTarget.ES2020, module: ts.ModuleKind.CommonJS }
          }).outputText;
          class BrowserFile extends Blob {
            constructor(parts, name, options = {}) {
              super(parts, options);
              this.name = name;
              this.lastModified = options.lastModified ?? 0;
            }
          }
          function makeContext() {
            const drawings = [];
            let revoked = 0;
            class FakeImage {
              constructor() { this.naturalWidth = 1200; this.naturalHeight = 600; }
              set src(_) { queueMicrotask(() => this.onload?.()); }
            }
            const context = {
              exports: {}, Blob, File: BrowserFile, Image: FakeImage,
              URL: { createObjectURL: () => 'blob:sticker-test', revokeObjectURL: () => { revoked++; } },
              document: { createElement: (name) => {
                assert.equal(name, 'canvas');
                const canvas = { width: 0, height: 0,
                  getContext: () => ({ drawImage: () => { drawings.push([canvas.width, canvas.height]); } }),
                  toBlob: (callback, mime) => callback(new Blob([Buffer.from('RIFF1234WEBP')], { type: mime })) };
                return canvas;
              } },
            };
            vm.runInNewContext(compiled, context);
            return { prepare: context.exports.prepareStickerFile, drawings, get revoked() { return revoked; } };
          }
          test('JPG and PNG convert to real WebP MIME and resize proportionally', async () => {
            for (const [name,type] of [['photo.jpg','image/jpeg'],['sticker.png','image/png']]) {
              const c = makeContext();
              const input = new BrowserFile(['original'],name,{type,lastModified:1234});
              const result = await c.prepare(input);
              assert.equal(result.type, 'image/webp');
              assert.equal(result.name, name.replace(/\.[^.]+$/,'.webp'));
              assert.equal(result.lastModified, 1234);
              assert.equal(c.drawings.length,1);
              assert.deepEqual(c.drawings[0],[512,256]);
              assert.equal(c.revoked,1);
            }
          });
          test('GIF and WebP remain original, preserving animation and existing pixels', async () => {
            const c = makeContext();
            for (const [name,type] of [['animated.gif','image/gif'],['sticker.webp','image/webp']]) {
              const input = new BrowserFile(['bytes'],name,{type});
              assert.equal(await c.prepare(input),input);
            }
            assert.equal(c.drawings.length,0);
          });
          test('rejects SVG, zero size, over-limit files and large animation', async () => {
            const c = makeContext();
            await assert.rejects(c.prepare(new BrowserFile(['<svg/>'],'bad.svg',{type:'image/svg+xml'})),/JPG, PNG/);
            await assert.rejects(c.prepare(new BrowserFile([],'empty.png',{type:'image/png'})),/12 МБ/);
            await assert.rejects(c.prepare(new BrowserFile([Buffer.alloc(2*1024*1024+1)],'big.gif',{type:'image/gif'})),/2 МБ/);
          });
          '''


          def replace_once(source: str, old: str, new: str, label: str) -> str:
              n=source.count(old)
              assert n==1, f'SOURCE_DRIFT: {label}: anchor count {n}, expected exactly one'
              return source.replace(old,new,1)

          def replace_region(source: str, start: str, end: str, replacement: str, label: str) -> str:
              a=source.find(start)
              assert a>=0, f'SOURCE_DRIFT: missing start for {label}'
              b=source.find(end,a+len(start))
              assert b>a, f'SOURCE_DRIFT: missing end for {label}'
              return source[:a]+replacement+source[b:]

          assert PAGE.is_file() and CSS.is_file(), 'SOURCE_DRIFT: required PWA files missing'
          page=PAGE.read_text('utf8')
          css=CSS.read_text('utf8')
          if MARKER not in page:
              page=replace_once(page,
                "import { connectOptimizeMedia } from '../lib/connect-media-optimizer'; // CONNECT_PWA_SAFE_MEDIA_OPTIMIZATION_V1_20261115",
                "import { connectOptimizeMedia } from '../lib/connect-media-optimizer'; // CONNECT_PWA_SAFE_MEDIA_OPTIMIZATION_V1_20261115\nimport { prepareStickerFile } from '../lib/sticker-webp'; // CONNECT_PWA_STICKER_WEBP_EDITOR_20261115",
                'import')
              page=replace_once(page,
                "  const [customPack,setCustomPack] = useState<string>('');",
                "  const [customPack,setCustomPack] = useState<string>('');\n  const [editingStickerPack,setEditingStickerPack] = useState<string|null>(null);\n  const [selectedStickerIds,setSelectedStickerIds] = useState<string[]>([]);\n  const migratedStickerAttempts=useRef<Set<string>>(new Set());",
                'editor state')

              actions = r'''  async function uploadCustomStickers(files:FileList|null){
              if(!supabase||!user||!customPack||!files?.length||busy)return;
              const pack=customPacks.find(p=>p.id===customPack);
              if(!pack||pack.owner_id!==user.id)return;
              setBusy(true);
              try{
                for(const file of Array.from(files).slice(0,30)){
                  const prepared=await prepareStickerFile(file);
                  const ext=prepared.type==='image/gif'?'gif':'webp';
                  const path=`${user.id}/${pack.id}/${crypto.randomUUID()}.${ext}`;
                  const uploaded=await supabase.storage.from('connect-stickers')
                    .upload(path,prepared,{contentType:prepared.type,upsert:false});
                  if(uploaded.error)throw uploaded.error;
                  const saved=await supabase.from('connect_stickers').insert({
                    pack_id:pack.id,name:file.name.replace(/\.[^.]+$/,'').slice(0,60),storage_path:path
                  });
                  if(saved.error){await supabase.storage.from('connect-stickers').remove([path]);throw saved.error;}
                }
                await loadCustomStickers();setNotice('Стикеры добавлены. JPG и PNG сохраняются в WebP.');
              }catch(e){setNotice('Не удалось загрузить: '+(e instanceof Error?e.message:'Ошибка'));}
              finally{setBusy(false);if(stickerFileInput.current)stickerFileInput.current.value='';}
            }
            function toggleStickerSelection(id:string){
              setSelectedStickerIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
            }
            async function deleteCustomStickers(items:CustomSticker[]){
              if(!supabase||!user||busy||!items.length)return;
              const ownPackIds=new Set(customPacks.filter(p=>p.owner_id===user.id).map(p=>p.id));
              const chosen=items.filter(st=>ownPackIds.has(st.pack_id));
              if(!chosen.length)return;
              const question=chosen.length===1?'Удалить стикер навсегда из набора?':'Удалить выбранные стикеры навсегда ('+chosen.length+' шт.)?';
              if(!window.confirm(question+' Файлы будут удалены с сервера. Ранее отправленные сообщения останутся в чатах как «Стикер недоступен».'))return;
              setBusy(true);
              try{
                const {data,error}=await supabase.from('connect_stickers').delete()
                  .in('id',chosen.map(st=>st.id)).select('id');
                if(error)throw error;
                if((data||[]).length!==chosen.length)throw new Error('Некоторые стикеры не были удалены');
                setSelectedStickerIds([]);
                await loadCustomStickers();
                setNotice('Удалено стикеров: '+chosen.length+'. Файлы удалит серверная очистка не позднее следующего ежедневного запуска.');
              }catch(error){setNotice('Ошибка удаления: '+(error instanceof Error?error.message:String(error)));}
              finally{setBusy(false);}
            }
            async function deleteCustomSticker(st:CustomSticker){await deleteCustomStickers([st]);}
            async function deleteCustomPack(pack:CustomPack){
              if(!supabase||!user||busy||pack.owner_id!==user.id||!window.confirm(`Удалить набор «${pack.name}» со всеми стикерами? Файлы будут очищены на сервере.`))return;
              setBusy(true);
              try{
                const {data,error}=await supabase.from('connect_sticker_packs').delete()
                  .eq('id',pack.id).eq('owner_id',user.id).select('id');
                if(error||!data?.length)throw error||new Error('Набор не удалён');
                setEditingStickerPack(null);setSelectedStickerIds([]);setCustomPack('');
                await loadCustomStickers();
                setNotice('Набор удалён. Файлы поставлены в очередь безопасной очистки.');
              }catch(error){setNotice('Ошибка удаления набора: '+(error instanceof Error?error.message:String(error)));}
              finally{setBusy(false);}
            }
            // Convert previously uploaded PNG/JPEG when its owner opens Settings → Stickers.
            // Upload + download-verify + conditional DB path switch; the old path is queued
            // by a database trigger and only removed after the new object is active.
            useEffect(()=>{
              if(!supabase||!user||busy||settingsPage!=='stickers')return;
              const ownPacks=new Set(customPacks.filter(p=>p.owner_id===user.id).map(p=>p.id));
              const candidate=customStickers.find(st=>ownPacks.has(st.pack_id)&&
                /\.(png|jpe?g)$/i.test(st.storage_path)&&!migratedStickerAttempts.current.has(st.id));
              if(!candidate)return;
              migratedStickerAttempts.current.add(candidate.id);
              void (async()=>{
                setBusy(true);
                let freshPath='';
                try{
                  const old=await supabase!.storage.from('connect-stickers').download(candidate.storage_path);
                  if(old.error||!old.data)throw old.error||new Error('Исходный стикер недоступен');
                  const inputType=/\.png$/i.test(candidate.storage_path)?'image/png':'image/jpeg';
                  const next=await prepareStickerFile(new File([old.data],candidate.name+'.png',{type:inputType}));
                  if(next.type!=='image/webp')throw new Error('Конвертация не создала WebP');
                  freshPath=`${user!.id}/${candidate.pack_id}/${crypto.randomUUID()}.webp`;
                  const up=await supabase!.storage.from('connect-stickers').upload(freshPath,next,{contentType:'image/webp',upsert:false});
                  if(up.error)throw up.error;
                  const check=await supabase!.storage.from('connect-stickers').download(freshPath);
                  if(check.error||!check.data||check.data.size!==next.size)throw new Error('Не удалось проверить загруженный WebP');
                  const update=await supabase!.from('connect_stickers').update({storage_path:freshPath})
                    .eq('id',candidate.id).eq('storage_path',candidate.storage_path).select('id');
                  if(update.error||update.data?.length!==1)throw update.error||new Error('Стикер изменён на другом устройстве');
                  freshPath=''; // The new file is active. Trigger queued the old PNG for server GC.
                  await loadCustomStickers();
                  setNotice('Старый PNG преобразован в WebP.');
                }catch(error){
                  if(freshPath)await supabase!.storage.from('connect-stickers').remove([freshPath]);
                  setNotice('Конвертация старого стикера: '+(error instanceof Error?error.message:String(error)));
                }finally{setBusy(false);}
              })();
            },[settingsPage,user?.id,busy,customStickers,customPacks,loadCustomStickers]);
          '''
              page=replace_region(page,
                '  async function uploadCustomStickers(files:FileList|null){',
                '  function customStickerUrl(st:CustomSticker){',
                actions,
                'upload/delete/editor/legacy auto-conversion')

              # iOS sticker favorites: remove PNG fallback, normalize JPG and PNG to WebP.
              fav_a='      let imageBlob: Blob = source.data;'
              fav_b="      const hash = await crypto.subtle.digest('SHA-256', await imageBlob.arrayBuffer());"
              fav_new=r'''      let imageBlob: Blob = await prepareStickerFile(new File(
                  [source.data],m.attachment_name||'sticker.png',
                  {type:(m.attachment_type||source.data.type||'image/png').toLowerCase()}
                ));
                const mime=imageBlob.type;
          '''
              page=replace_region(page, fav_a, fav_b, fav_new, 'iOS favorites conversion')

              # Replace exactly the pack-management UI; keep existing following settings hint.
              grid_start='{customPacks.filter(p=>p.owner_id===user.id).map(p=>'
              grid_end='<p className="settings-hint">В чате нажмите ☺'
              grid_new=r'''{customPacks.filter(p=>p.owner_id===user.id).map(p=><div key={p.id} className="settings-group data-settings">
                                <strong>{p.emoji} {p.name} · {customStickers.filter(st=>st.pack_id===p.id).length} шт.</strong>
                                <small>{p.is_public?'Общий набор':'Личный набор'}</small>
                                {editingStickerPack===p.id&&<p className="settings-hint">Выберите стикеры для удаления. После подтверждения они исчезнут из всех наборов и файлового хранилища.</p>}
                                <div className={'connect-custom-grid'+(editingStickerPack===p.id?' is-editing':'')}>
                                  {customStickers.filter(st=>st.pack_id===p.id).map(st=><button key={st.id} type="button" disabled={busy}
                                    title={editingStickerPack===p.id?'Выбрать или снять выбор':'Редактировать набор'}
                                    aria-pressed={editingStickerPack===p.id?selectedStickerIds.includes(st.id):undefined}
                                    onClick={()=>{if(editingStickerPack===p.id)toggleStickerSelection(st.id);else{setEditingStickerPack(p.id);setSelectedStickerIds([st.id]);}}}>
                                    <img src={customStickerUrl(st)} alt={st.name||'Стикер'}/>
                                    {editingStickerPack===p.id&&<span className="connect-sticker-check" aria-hidden="true">{selectedStickerIds.includes(st.id)?'✓':'○'}</span>}
                                  </button>)}
                                </div>
                                <button className="settings-action secondary" type="button" disabled={busy} onClick={()=>{
                                  if(editingStickerPack===p.id){setEditingStickerPack(null);setSelectedStickerIds([]);}
                                  else{setEditingStickerPack(p.id);setSelectedStickerIds([]);}
                                }}>{editingStickerPack===p.id?'Готово':'Редактировать стикеры'}</button>
                                {editingStickerPack===p.id&&<button className="settings-action" type="button"
                                  disabled={busy||selectedStickerIds.length===0}
                                  onClick={()=>void deleteCustomStickers(customStickers.filter(st=>st.pack_id===p.id&&selectedStickerIds.includes(st.id)))}>
                                  Удалить выбранные ({selectedStickerIds.length})
                                </button>}
                                <button className="settings-action" type="button" disabled={busy} onClick={()=>{
                                  setCustomPack(p.id);setTimeout(()=>document.getElementById('connect-sticker-upload')?.click(),0);
                                }}>Добавить стикеры</button>
                                <button className="settings-action secondary" type="button" disabled={busy} onClick={()=>void deleteCustomPack(p)}>Удалить набор</button>
                                {customPack===p.id&&<input id="connect-sticker-upload" type="file"
                                  accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg" multiple hidden
                                  onChange={e=>void uploadCustomStickers(e.target.files)}/>} 
                              </div>)}
                              '''
              page=replace_region(page,grid_start,grid_end,grid_new,'settings sticker editor')

              # Keep the existing iOS favorites behavior and existing message ID semantics.
              assert 'async function deleteCustomSticker(st:CustomSticker)' in page
              assert 'Стикер недоступен' in page
              assert "accept=\"image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg\"" in page
              assert "[...prev,id]" in page
              PAGE.write_text(page,encoding='utf8')
              print('Updated app/page.tsx (WebP uploads, JPG, legacy migration, sticker editor)')
          else:
              print('Page already has the sticker editor patch; leaving it unchanged')

          style=r'''
          /* CONNECT_PWA_STICKER_WEBP_EDITOR_20261115 — explicit selection, never delete on preview tap. */
          .connect-custom-grid.is-editing button{position:relative;min-width:0;padding:2px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.025)}
          .connect-custom-grid.is-editing button[aria-pressed="true"]{border-color:var(--accent);background:rgba(90,166,255,.14)}
          .connect-sticker-check{position:absolute;right:2px;top:2px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);font-size:13px;color:var(--accent2);line-height:1}
          .connect-custom-grid.is-editing button[aria-pressed="true"] .connect-sticker-check{background:var(--accent);color:#fff;border-color:var(--accent)}
          '''
          if MARKER not in css:
              CSS.write_text(css.rstrip()+style,encoding='utf8')
              print('Added sticker editor styles')
          if not STICKER.exists():
              STICKER.write_text(converter,encoding='utf8')
              print('Added lib/sticker-webp.ts')
          else:
              assert MARKER in STICKER.read_text('utf8'), 'SOURCE_DRIFT: preexisting lib/sticker-webp.ts'
          if not TEST.exists():
              TEST.write_text(test_source,encoding='utf8')
              print('Added focused tests for WebP upload')
          else:
              assert MARKER in TEST.read_text('utf8'), 'SOURCE_DRIFT: preexisting test'

          print('Verified patch anchors and output paths; ready for TypeScript/tests/build')
          CONNECT_STICKER_PWA_PATCH_20261115
          python3 "$RUNNER_TEMP/connect_sticker_upgrade_patch.py"
          test -s lib/sticker-webp.ts
          test -s tests/sticker-webp.test.cjs
      - name: Install Node and lockfile dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Focused sticker image regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/sticker-webp.test.cjs
      - name: Install matching Playwright Chromium for full suite
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright-core install --with-deps chromium
          node - <<'VERIFY_CHROMIUM'
          const fs=require('node:fs');
          const exe=require('playwright-core').chromium.executablePath();
          if(!fs.existsSync(exe))throw Error('Matching Chromium not installed: '+exe);
          console.log('Chromium verified:',exe);
          VERIFY_CHROMIUM
      - name: Verify TypeScript, complete tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated PWA patch to main
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css lib/sticker-webp.ts tests/sticker-webp.test.cjs
          if git diff --cached --quiet; then
            echo 'All sticker changes already present'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA: WebP sticker uploads, JPG support and safe editor'
            git push origin HEAD:main
          fi
