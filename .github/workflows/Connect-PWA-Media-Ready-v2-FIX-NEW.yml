name: Connect PWA | Chat media ready v2 FIX (single update)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-pwa-media-ready.yml

permissions:
  contents: write

concurrency:
  group: connect-pwa-media-ready-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pwa-media-ready:
    name: Prepare cached chat media, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply PWA chat-media change (E2EE untouched)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          ROOT=Path('.')
          page_file=ROOT/'app/page.tsx'
          cache_file=ROOT/'lib/media-cache.ts'
          css_file=ROOT/'app/globals.css'
          helper_file=ROOT/'lib/chat-media-presentation.ts'
          
          assert page_file.is_file() and cache_file.is_file() and css_file.is_file(), 'Expected Connect PWA source is missing'
          
          
          def replace_once(text:str, old:str,new:str,label:str)->str:
              count=text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, got {count}; refusing an unsafe edit')
              return text.replace(old,new,1)
          
          helper = r'''/** Stable presentation data, independent of expiring signed URLs and React remounts.
           * Current non-E2EE PWA only. A future E2EE rollout MUST re-audit local persistence.
           */
          export type ChatWave={bars:number[];duration:number};
          export function isNativeMediaRuntime():boolean {
            return typeof window!=='undefined'&&Boolean(window.ConnectAndroid||window.ConnectNative);
          }
          const waveMemory=new Map<string,ChatWave>();
          const posterMemory=new Map<string,{url:string;until:number}>();
          const waveKey=(user:string,path:string)=>`connect-chat-wave-v1:${user}:${path}`;
          const posterKey=(user:string,path:string)=>`${user}:${path}`;
          export function readChatWave(user:string,path:string):ChatWave|null{
            if(isNativeMediaRuntime()||!user||!path)return null;
            const key=waveKey(user,path),hot=waveMemory.get(key);
            if(hot)return hot;
            try{
              const raw=localStorage.getItem(key);
              if(!raw)return null;
              const value=JSON.parse(raw) as ChatWave;
              if(!Array.isArray(value.bars)||value.bars.length!==43||!value.bars.every(x=>Number.isFinite(x)&&x>=0&&x<=1)||!Number.isFinite(value.duration)||value.duration<=0)return null;
              waveMemory.set(key,value);
              return value;
            }catch{return null;}
          }
          export function rememberChatWave(user:string,path:string,value:ChatWave){
            if(isNativeMediaRuntime()||!user||!path||value.bars.length!==43||!Number.isFinite(value.duration)||value.duration<=0)return;
            const normalized={bars:value.bars.map(n=>Math.max(0,Math.min(1,n))),duration:value.duration};
            const key=waveKey(user,path);
            waveMemory.set(key,normalized);
            if(waveMemory.size>600)waveMemory.delete(waveMemory.keys().next().value!);
            try{localStorage.setItem(key,JSON.stringify(normalized));}catch{/* UI still works without persistent storage. */}
          }
          export function getHotChatPoster(user:string,path:string):string|null{
            if(isNativeMediaRuntime())return null;
            const value=posterMemory.get(posterKey(user,path));
            if(!value||value.until<Date.now()){posterMemory.delete(posterKey(user,path));return null;}
            return value.url;
          }
          export function rememberChatPoster(user:string,path:string,url:string){
            if(isNativeMediaRuntime()||!user||!path||!url)return;
            posterMemory.set(posterKey(user,path),{url,until:url.startsWith('blob:')||url.startsWith('data:')?Number.MAX_SAFE_INTEGER:Date.now()+48*60*1000});
            if(posterMemory.size>400)posterMemory.delete(posterMemory.keys().next().value!);
          }
          export function forgetUserChatPresentation(user:string){
            for(const key of waveMemory.keys())if(key.startsWith(`connect-chat-wave-v1:${user}:`))waveMemory.delete(key);
            for(const key of posterMemory.keys())if(key.startsWith(user+':'))posterMemory.delete(key);
          }
          
          /** Compute wave peaks for a small voice file before the chat becomes visible.
           * Large/remote audio still loads on demand. Never preload full-size video here.
           */
          export async function prewarmChatWave(user:string,path:string,src:string,size:number=0):Promise<void>{
            if(isNativeMediaRuntime()||!user||!path||!src||size<=0||readChatWave(user,path)||size>2*1024*1024)return;
            let context:AudioContext|null=null;
            try{
              const controller=new AbortController();
              const timeout=setTimeout(()=>controller.abort(),7000);
              let bytes:ArrayBuffer;
              try{
                const response=await fetch(src,{signal:controller.signal});
                if(!response.ok) return;
                const length=Number(response.headers.get('content-length')||0);
                if(length>2*1024*1024)return;
                bytes=await response.arrayBuffer();
                if(bytes.byteLength>2*1024*1024)return;
              }finally{clearTimeout(timeout);}
              context=new AudioContext();
              const decoded=await context.decodeAudioData(bytes);
              const samples=decoded.getChannelData(0),count=43;
              const peaks=Array.from({length:count},(_,i)=>{
                const start=Math.floor(i*samples.length/count),end=Math.max(start+1,Math.floor((i+1)*samples.length/count));
                const stride=Math.max(1,Math.floor((end-start)/140));let peak=0;
                for(let j=start;j<end;j+=stride)peak=Math.max(peak,Math.abs(samples[j]||0));
                return peak;
              });
              const max=Math.max(.001,...peaks);
              rememberChatWave(user,path,{bars:peaks.map(x=>Math.max(.14,Math.min(1,Math.pow(x/max,.72)))),duration:decoded.duration});
            }catch{/* Audio decode is optional; playback retains its network fallback. */}
            finally{if(context)void context.close().catch(()=>{});}
          }
          '''
          if helper_file.exists():
              if 'CONNECT_PWA_CHAT_MEDIA_ENTRY_V2' in page_file.read_text(encoding='utf-8'):
                  print('Media readiness patch is already present; nothing to modify.')
                  raise SystemExit(0)
              raise RuntimeError('chat-media-presentation.ts already exists without matching entry gate; refusing unsafe patch')
          helper_file.write_text(helper,encoding='utf-8')
          
          cache=cache_file.read_text(encoding='utf-8')
          cache=replace_once(cache,"const avatar = row.category === 'system' && !row.key.includes(':core'), expired = Date.now() - row.used > 30 * 86400000;",
                              "const avatar = row.category === 'system' && !row.key.includes(':core'), expired = Boolean((window as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectAndroid||(window as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectNative) && Date.now() - row.used > 30 * 86400000;",
                              'PWA LRU policy / preserve Android expiry behavior')
          cache += r'''
          
          /** Save a generated video-note first frame to the existing account-scoped media cache.
           * Only a JPEG image is written. This never persists an extra video decoder.
           */
          export async function storeGeneratedChatPoster(viewer:string,path:string,image:Blob):Promise<string|null>{
            if(!viewer||owner!==viewer||!path||image.type!=='image/jpeg'||!image.size||image.size>512*1024)return null;
            const identity='connect-attachments/'+path+'__poster.jpg',key=viewer+':'+identity;
            try{
              const bytes=await image.arrayBuffer();
              const database=await db();
              await new Promise<void>((resolve,reject)=>{
                const tx=database.transaction([STORE,'retired'],'readwrite');
                const guard=tx.objectStore('retired').get(key);
                guard.onsuccess=()=>{if(!guard.result)tx.objectStore(STORE).put({key,user:viewer,category:'photos',size:image.size,used:Date.now(),bytes,type:'image/jpeg'} satisfies Entry);};
                tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
              });
              return await resolveCachedMedia('/storage/v1/object/sign/'+identity,viewer);
            }catch{return null;}
          }
          '''
          cache_file.write_text(cache,encoding='utf-8')
          
          page=page_file.read_text(encoding='utf-8')
          page=replace_once(page,
           "import {mediaIdentity, mediaCacheOwner, resolveCachedMedia, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",
           "import {mediaIdentity, mediaCacheOwner, resolveCachedMedia, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia, storeGeneratedChatPoster} from '../lib/media-cache';\nimport {readChatWave, rememberChatWave, prewarmChatWave, getHotChatPoster, rememberChatPoster, forgetUserChatPresentation, isNativeMediaRuntime} from '../lib/chat-media-presentation';",
           'media imports')
          
          # Native player keeps the original memory cache and playback behavior.
          page=replace_once(page,
           "const VoicePlayer = memo(function VoicePlayer({ src, sentAt, mine, delivered, read, fileName, onSave }: { src:string;sentAt:string;mine:boolean;delivered:boolean;read:boolean;fileName?:string;onSave?:()=>void }) {",
           "const VoicePlayer = memo(function VoicePlayer({ src, path, sentAt, mine, delivered, read, fileName, onSave }: { src:string;path:string;sentAt:string;mine:boolean;delivered:boolean;read:boolean;fileName?:string;onSave?:()=>void }) {\n  const waveOwner=mediaCacheOwner();\n  const savedWave=readChatWave(waveOwner,path);",
           'stable voice identity')
          page=replace_once(page,'  const [duration, setDuration] = useState(0);\n  const [position, setPosition] = useState(0);\n  const [bars, setBars] = useState<number[]>(Array(43).fill(0.28));',
                            '  const [duration, setDuration] = useState(()=>savedWave?.duration||0);\n  const [position, setPosition] = useState(0);\n  const [bars, setBars] = useState<number[]>(()=>savedWave?.bars||Array(43).fill(0.28));',
                            'restore waveform synchronously')
          page=replace_once(page,
           "    const cached = voiceWaveformCache.get(src);\n    if (cached) { setBars(cached.bars); setDuration(cached.duration); return; }",
           "    const cached = isNativeMediaRuntime()?voiceWaveformCache.get(src):readChatWave(waveOwner,path);\n    if (cached) { setBars(cached.bars); setDuration(cached.duration); return; }",
           'persistent waveform lookup')
          page=replace_once(page,
           "        voiceWaveformCache.set(src, {bars:waveform,duration:decoded.duration});\n        if (voiceWaveformCache.size > 100) voiceWaveformCache.delete(voiceWaveformCache.keys().next().value!);",
           "        if(isNativeMediaRuntime()){voiceWaveformCache.set(src,{bars:waveform,duration:decoded.duration});if(voiceWaveformCache.size>100)voiceWaveformCache.delete(voiceWaveformCache.keys().next().value!); }\n        else rememberChatWave(waveOwner,path,{bars:waveform,duration:decoded.duration});",
           'waveform persist')
          page=replace_once(page, '  }, [src]);\n\n  async function toggle()', '  }, [src,path,waveOwner]);\n\n  async function toggle()', 'wave effect deps')
          
          # Cache a returned JPEG poster under the stable file path, not a signed URL.
          start=page.index('async function cachedChatPoster(path:string):Promise<string|null>{')
          end=page.index('\n}\n',start)+2
          old=page[start:end]
          new='''async function cachedChatPoster(path:string):Promise<string|null>{
            if(!supabase||!path)return null;
            if(isNativeMediaRuntime()){
              const viewer=mediaCacheOwner(),identity='/storage/v1/object/sign/connect-attachments/'+path+'__poster.jpg';
              if(viewer){const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);if(local.startsWith('blob:'))return local;}
              const {data,error}=await supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600);
              if(error||!data?.signedUrl)return null;
              const signed=mediaUrl(data.signedUrl);
              if(viewer)void prefetchCachedMedia(signed,viewer);
              return signed;
            }
            const viewer=mediaCacheOwner();
            const hot=getHotChatPoster(viewer,path);
            if(hot)return hot;
            const identity='/storage/v1/object/sign/connect-attachments/'+path+'__poster.jpg';
            if(viewer){
              const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
              if(local.startsWith('blob:')){rememberChatPoster(viewer,path,local);return local;}
            }
            const {data,error}=await supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600);
            if(error||!data?.signedUrl)return null;
            const signed=mediaUrl(data.signedUrl);
            if(viewer){
              await prefetchCachedMedia(signed,viewer);
              const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
              if(local.startsWith('blob:')){rememberChatPoster(viewer,path,local);return local;}
              rememberChatPoster(viewer,path,signed);
            }
            return signed;
          }'''
          page=page[:start]+new+page[end:]
          
          # Loaded posters survive both remount and viewport release.
          page=replace_once(page,
           "  const [uploadedPoster,setUploadedPoster]=useState<string|null>(null);",
           "  const [uploadedPoster,setUploadedPoster]=useState<string|null>(()=>path?getHotChatPoster(mediaCacheOwner(),path):null);",
           'thumbnail first frame memory')
          page=replace_once(page,
           "    setUploadedPoster(null);setPosterChecked(false);",
           "    setUploadedPoster(path?getHotChatPoster(mediaCacheOwner(),path):null);setPosterChecked(false);",
           'thumbnail reset remembers poster')
          page=replace_once(page,
           "    void cachedChatPoster(path).then(url=>{if(!cancelled){setUploadedPoster(url);setPosterChecked(true);}})",
           "    void cachedChatPoster(path).then(url=>{if(!cancelled){if(url)rememberChatPoster(mediaCacheOwner(),path,url);setUploadedPoster(url);setPosterChecked(true);}})",
           'thumbnail poster loader')
          page=replace_once(page,
           "      if(url.length>100)setPoster(url);",
           "      if(url.length>100){setPoster(url);if(path)rememberChatPoster(mediaCacheOwner(),path,url);}",
           'thumbnail fallback persist')
          page=replace_once(page,
           "  const [poster,setPoster]=useState<string|null>(null);\n  const [error,setError]=useState(false);",
           "  const [poster,setPoster]=useState<string|null>(()=>getHotChatPoster(mediaCacheOwner(),path));\n  const [error,setError]=useState(false);",
           'inline video cached poster')
          page=replace_once(page,
           "    setPoster(null);setError(false);",
           "    setPoster(getHotChatPoster(mediaCacheOwner(),path));setError(false);",
           'inline video remount')
          page=replace_once(page,
           "    void cachedChatPoster(path).then(url=>{if(!cancelled)setPoster(url);}).catch(()=>{});",
           "    void cachedChatPoster(path).then(url=>{if(!cancelled&&url)setPoster(url);}).catch(()=>{});",
           'inline poster refresh')
          
          page=replace_once(page,
           "  const [poster,setPoster] = useState<string|undefined>();\n  useEffect(()=>{\n    let alive=true;\n    setPoster(undefined);",
           "  const [poster,setPoster] = useState<string|undefined>(()=>getHotChatPoster(mediaCacheOwner(),path)||undefined);\n  const [videoFrameReady,setVideoFrameReady]=useState(false);\n  useEffect(()=>{\n    let alive=true;\n    setPoster(getHotChatPoster(mediaCacheOwner(),path)||undefined);",
           'video note hot poster')
          page=replace_once(page,
           "  const toggleNote=(event:React.MouseEvent)=>{",
           '''  const captureNotePoster=(video:HTMLVideoElement)=>{
              if(isNativeMediaRuntime()||poster||!video.videoWidth||!video.videoHeight||!mediaCacheOwner())return;
              try{
                const canvas=document.createElement('canvas'),scale=Math.min(1,360/video.videoWidth,360/video.videoHeight);
                canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
                canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
                canvas.getContext('2d')?.drawImage(video,0,0,canvas.width,canvas.height);
                canvas.toBlob(blob=>{
                  if(!blob)return;
                  const viewer=mediaCacheOwner();
                  void storeGeneratedChatPoster(viewer,path,blob).then(url=>{
                    if(!url)return;
                    rememberChatPoster(viewer,path,url);setPoster(url);
                  });
                },'image/jpeg',.74);
              }catch{/* Cross-origin frames may not be readable; keep the regular player. */}
            };
            const toggleNote=(event:React.MouseEvent)=>{''',
           'video note poster capture')
          page=replace_once(page,
           '''        <video ref={ref} className="connect-v4-note-video" poster={poster} muted={muted} playsInline loop preload="none" aria-label={name}
                    onLoadedMetadata={event=>{const d=event.currentTarget.duration;if(Number.isFinite(d)&&d>0)setDuration(d);}}''',
           '''        {!isNativeMediaRuntime()&&(poster?<img className="connect-note-still" src={poster} alt="" aria-hidden="true"/>:<span className="connect-note-still connect-note-still-fallback" aria-hidden="true">▶</span>)}
                  <video ref={ref} className="connect-v4-note-video" poster={poster} crossOrigin={isNativeMediaRuntime()?undefined:'anonymous'} muted={muted} playsInline loop preload="none" aria-label={name} style={isNativeMediaRuntime()?undefined:{opacity:videoFrameReady?1:0}}
                    onLoadedData={event=>{if(!isNativeMediaRuntime()){setVideoFrameReady(true);captureNotePoster(event.currentTarget);}}}
                    onEmptied={()=>{if(!isNativeMediaRuntime())setVideoFrameReady(false);}}
                    onLoadedMetadata={event=>{const d=event.currentTarget.duration;if(Number.isFinite(d)&&d>0)setDuration(d);}}''',
           'note stable still overlay')
          
          # Pass stable attachment identities down to voice renderers.
          page=replace_once(page,
           "<VoicePlayer src={attachmentUrls[m.attachment_path]} sentAt={m.created_at} mine={mine} delivered=",
           "<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} sentAt={m.created_at} mine={mine} delivered=",
           'voice message identity')
          page=replace_once(page,
           "<VoicePlayer src={attachmentUrls[m.attachment_path]} sentAt={m.created_at} mine={mine} fileName=",
           "<VoicePlayer src={attachmentUrls[m.attachment_path]} path={m.attachment_path} sentAt={m.created_at} mine={mine} fileName=",
           'audio file identity')
          
          # One opening gate: build links and small previews before revealing the chat. This
          # replaces the old fire-and-forget signer and does NOT preload entire movies.
          old='''  useEffect(() => {
              if (!supabase || !user) return;
              let cancelled = false;
              const paths = Array.from(new Set(messages.filter(m=>!m.deleted_at).flatMap(m=>[...(m.attachment_path?[m.attachment_path]:[]),...parseAlbum(m.body).map(x=>x.path)])));
              const missing = paths.filter(path => !attachmentUrls[path]);
              if (!missing.length) return;
              void Promise.all(missing.map(async path => {
                // Do not materialize large videos/audio just to render the chat screen.
                const meta=messages.find(m=>m.attachment_path===path);
                if(meta?.attachment_kind==='image'||!meta&&supportsPhotoPreview(path)){
                  const identity='/storage/v1/object/sign/connect-attachments/'+path;
                  const local=await resolveCachedMedia(identity,user.id).catch(()=>identity);
                  if(local.startsWith('blob:'))return {path,url:local};
                }
                const {data} = await supabase.storage.from('connect-attachments').createSignedUrl(path, 3600);
                return {path, url:data?.signedUrl ? mediaUrl(data.signedUrl) : undefined};
              })).then(rows => {
                if (cancelled) return;
                setAttachmentUrls(prev => {
                  const next={...prev};
                  rows.forEach(row => {if(row.url) next[row.path]=row.url;});
                  return next;
                });
              });
              return () => {cancelled=true;};
            }, [messages, user?.id]);'''
          new='''  // CONNECT_PWA_CHAT_MEDIA_ENTRY_V2
            useEffect(() => {
              if(!supabase||!user)return;
              let cancelled=false;
              const client=supabase,viewer=user.id;
              // The packaged Android UI keeps its original signer and playback lifecycle.
              if(isNativeMediaRuntime()){
                const paths=Array.from(new Set(messages.filter(m=>!m.deleted_at).flatMap(m=>[...(m.attachment_path?[m.attachment_path]:[]),...parseAlbum(m.body).map(x=>x.path)])));
                const missing=paths.filter(path=>!attachmentUrls[path]);
                if(missing.length)void Promise.all(missing.map(async path=>{
                  const meta=messages.find(m=>m.attachment_path===path);
                  if(meta?.attachment_kind==='image'||!meta&&supportsPhotoPreview(path)){
                    const identity='/storage/v1/object/sign/connect-attachments/'+path;
                    const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
                    if(local.startsWith('blob:'))return {path,url:local};
                  }
                  const {data}=await client.storage.from('connect-attachments').createSignedUrl(path,3600);
                  return {path,url:data?.signedUrl?mediaUrl(data.signedUrl):undefined};
                })).then(rows=>{if(!cancelled)setAttachmentUrls(prev=>{const next={...prev};rows.forEach(row=>{if(row.url)next[row.path]=row.url;});return next;});});
                return()=>{cancelled=true;};
              }
              if(!activeChat||historyReadyChat!==activeChat)return;
              const chatId=activeChat;
              // Newest first. UI can open while older attachments continue preparing.
              const entries=[...new Map(messages.filter(m=>m.conversation_id===chatId&&!m.deleted_at&&!serverDeleted.current.has(m.id))
                .flatMap(m=>[
                  ...(m.attachment_path?[{path:m.attachment_path,kind:m.attachment_kind||'file',size:m.attachment_size||0}]:[]),
                  ...parseAlbum(m.body).map(x=>({path:x.path,kind:x.kind,size:0}))
                ]).filter(item=>Boolean(item.path)).map(item=>[item.path,item] as const)).values()].reverse();
              // Set readiness as soon as the recent set is prepared; outer timer is a hard cap.
              let offset=0,recentLeft=Math.min(10,entries.length);
              if(!recentLeft)setChatDisplayReady(chatId);
              const worker=async()=>{
                while(!cancelled&&offset<entries.length){
                  const index=offset++,item=entries[index],path=item.path;
                  try{
                    const identity='/storage/v1/object/sign/connect-attachments/'+path;
                    const cached=await resolveCachedMedia(identity,viewer);
                    const previous=attachmentUrls[path];
                    let url=cached.startsWith('blob:')?cached:(previous&&(previous.startsWith('blob:')||(signedMediaLifetimes.current.get(path)||0)>Date.now()+60000)?previous:'');
                    if(!url){
                      const {data,error}=await client.storage.from('connect-attachments').createSignedUrl(path,3600);
                      if(!error&&data?.signedUrl){url=mediaUrl(data.signedUrl);signedMediaLifetimes.current.set(path,Date.now()+48*60*1000);}
                    }
                    if(!url)continue;
                    if(!cancelled)setAttachmentUrls(prev=>prev[path]===url?prev:{...prev,[path]:url});
                    if(item.kind==='image'&&supportsPhotoPreview(path)){
                      const thumb=photoPreviewPath(path),thumbIdentity='/storage/v1/object/sign/connect-attachments/'+thumb;
                      let local=await resolveCachedMedia(thumbIdentity,viewer);
                      if(!local.startsWith('blob:')){
                        const signed=await client.storage.from('connect-attachments').createSignedUrl(thumb,3600);
                        if(signed.data?.signedUrl){const thumbUrl=mediaUrl(signed.data.signedUrl);
                          await prefetchCachedMedia(thumbUrl,viewer);
                          const hydrated=await resolveCachedMedia(thumbIdentity,viewer);
                          local=hydrated.startsWith('blob:')?hydrated:thumbUrl;
                        }else local='';
                      }
                      if(!cancelled)setPhotoPreviews(prev=>prev[path]=== (local||null)?prev:{...prev,[path]:local||null});
                    }
                    if(item.kind==='video')await cachedChatPoster(path).catch(()=>null);
                    if(item.kind==='audio'&&index<10&&item.size>0&&item.size<=2*1024*1024&&!readChatWave(viewer,path))
                      await prewarmChatWave(viewer,path,url,item.size);
                  }catch{/* Never let a failed attachment block message navigation. */}
                  finally{
                    if(index<10&&--recentLeft===0&&!cancelled){
                      warmedChatWindows.current.set(viewer+':'+chatId,Date.now()+42*60*1000);
                      setChatDisplayReady(chatId);
                    }
                  }
                }
              };
              void Promise.all(Array.from({length:Math.min(3,entries.length)},()=>worker())).catch(()=>{});
              return()=>{cancelled=true;};
              // eslint-disable-next-line react-hooks/exhaustive-deps
            },[activeChat,historyReadyChat,messages,user?.id]);'''
          page=replace_once(page,old,new,'entry media gate source')
          page=replace_once(page,
           '  const [historyReadyChat,setHistoryReadyChat]=useState<string|null>(null);',
           '  const [historyReadyChat,setHistoryReadyChat]=useState<string|null>(null);\n  const [chatDisplayReady,setChatDisplayReady]=useState<string|null>(null);\n  useEffect(()=>{\n    if(!activeChat||isNativeMediaRuntime())return;\n    const timer=window.setTimeout(()=>setChatDisplayReady(activeChat),1400);\n    return()=>window.clearTimeout(timer);\n  },[activeChat,user?.id]);\n  const signedMediaLifetimes=useRef(new Map<string,number>());\n  const warmedChatWindows=useRef(new Map<string,number>());',
           'gate state')
          page=replace_once(page,
           '  function enterChat(id: string) { resetChatTools(); setListActions(null); setActiveChat(id);',
           '  function enterChat(id: string) { setChatDisplayReady(user?.id&&(warmedChatWindows.current.get(user.id+":"+id)||0)>Date.now()?id:null); resetChatTools(); setListActions(null); setActiveChat(id);',
           'instant return to a hot chat')
          # Expired media URLs cannot be assumed permanently valid; prefer existing cached bytes when reopening.
          # Keep the chat stream mounted so existing read anchors and scroll positioning work.
          page=replace_once(page,
           '          : activeChat && selected ? <div className="chat-view">',
           '          : activeChat && selected ? <div className={"chat-view"+(!isNativeMediaRuntime()&&chatDisplayReady!==activeChat?" connect-chat-preparing":"")}>',
           'chat CSS gate')
          page=replace_once(page,
           '''            <div className={"message-scroll"+(wallpaper?" has-wallpaper":"")} style={wallpaper?{backgroundImage:`linear-gradient(#00000018,#00000018),url(${wallpaper})`}:undefined} ref={scrollRef} onScroll={trackScroll} onPointerDownCapture={()=>{historyTouched.current=true}} onWheelCapture={()=>{historyTouched.current=true}} aria-label="История сообщений">''',
           '''            {!isNativeMediaRuntime()&&chatDisplayReady!==activeChat&&<div className="connect-chat-entry-overlay" role="status" aria-live="polite"><span className="connect-chat-entry-spinner" aria-hidden="true"/><strong>Подготавливаем переписку</strong><small>Восстанавливаем медиа и миниатюры…</small></div>}
                      <div className={"message-scroll"+(wallpaper?" has-wallpaper":"")} style={wallpaper?{backgroundImage:`linear-gradient(#00000018,#00000018),url(${wallpaper})`}:undefined} ref={scrollRef} onScroll={trackScroll} onPointerDownCapture={()=>{historyTouched.current=true}} onWheelCapture={()=>{historyTouched.current=true}} aria-label="История сообщений">''',
           'entry overlay')
          page=replace_once(page,
           "<span>Загрузка вложения…</span>",
           "(isNativeMediaRuntime()?<span>Загрузка вложения…</span>:<span className=\"connect-media-unavailable\" aria-label=\"Подготовка вложения\">{m.attachment_kind==='video'?'▶':m.attachment_kind==='audio'?'♪':m.attachment_kind==='image'?'▧':'◇'}</span>)",
           'avoid repeated attachment loading text')
          
          # On logout we already clear other local account caches; discard hot presentation data too.
          page=replace_once(page,
           "await supabase?.auth.signOut(); exitChat(); setProfiles([]); setConversations([]); setMessages([]);",
           "if(user?.id)forgetUserChatPresentation(user.id); warmedChatWindows.current.clear();signedMediaLifetimes.current.clear(); await supabase?.auth.signOut(); exitChat(); setProfiles([]); setConversations([]); setMessages([]);",
           'hot cache cleanup')
          page_file.write_text(page,encoding='utf-8')
          
          css=css_file.read_text(encoding='utf-8')
          if 'CONNECT_PWA_CHAT_MEDIA_ENTRY_V2' in css:
              raise RuntimeError('entry overlay already installed')
          css+='''
          /* CONNECT_PWA_CHAT_MEDIA_ENTRY_V2: quiet, stable first paint of media-bearing chats. */
          .chat-view.connect-chat-preparing .message-scroll{visibility:hidden;pointer-events:none}
          .connect-chat-entry-overlay{position:absolute;inset:60px 0 0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:var(--bg);color:var(--text);pointer-events:auto;text-align:center;padding:24px}
          .connect-chat-entry-overlay strong{font-size:14px;font-weight:600}
          .connect-chat-entry-overlay small{font-size:12px;color:var(--muted)}
          .connect-chat-entry-spinner{width:24px;height:24px;border:2px solid var(--line,rgba(130,140,150,.25));border-top-color:var(--text);border-radius:50%;animation:connect-chat-entry-spin .8s linear infinite}
          @keyframes connect-chat-entry-spin{to{transform:rotate(360deg)}}
          .connect-v4-note-circle:has(>.connect-note-still){position:relative;isolation:isolate}
          .connect-v4-note-circle>.connect-note-still{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none;z-index:0}
          .connect-v4-note-circle>.connect-note-still-fallback{display:flex;align-items:center;justify-content:center;background:var(--panel,rgba(45,55,70,.72));font-size:22px;color:var(--muted)}
          .connect-v4-note-circle:has(>.connect-note-still)>.connect-v4-note-video{z-index:1;transition:none!important}
          .connect-media-unavailable{color:var(--muted);font-size:12px}
          '''
          css_file.write_text(css,encoding='utf-8')
          assert 'CONNECT_PWA_CHAT_MEDIA_ENTRY_V2' in page and 'isNativeMediaRuntime()' in page and '1400' in page
          assert ': {isNativeMediaRuntime()?' not in page, 'Invalid nested JSX block near attachment placeholder'
          assert ': (isNativeMediaRuntime()?' in page, 'Missing JSX-safe fallback expression'
          print('PWA-only chat media readiness patch applied (1.4s maximum overlay). E2EE/Android native untouched.')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Build release PWA
        run: npm run build

      - name: Commit patch after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css lib/media-cache.ts lib/chat-media-presentation.ts
          if git diff --cached --quiet; then
            echo 'Already up to date. No commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): prepare chat media before paint and preserve media previews'
          git push origin HEAD:main
