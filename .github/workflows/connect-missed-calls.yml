name: Connect PWA — missed calls badge and notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-missed-calls.yml']
permissions:
  contents: write
concurrency:
  group: connect-missed-pwa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified missed-call fixes to PWA
        run: |
          python3 - <<'CONNECT_MISSED_INSTALL'
          import base64,gzip,hashlib,json,os,pathlib,re,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          workflow=root/'.github/workflows/connect-missed-calls.yml'
          source=workflow.read_text()
          data=source.split('# CONNECT_MISSED_PATCH_BEGIN\n',1)[1].split('# CONNECT_MISSED_PATCH_END',1)[0]
          packed=base64.b64decode(''.join(line[2:] for line in data.splitlines() if line.startswith('# ')),validate=True)
          assert hashlib.sha256(packed).hexdigest()=="8def2788859a246246c57404c83be1bc856dd6b08ad0698c8f5ac74c32e9a540",'Installer checksum mismatch'
          files=json.loads(gzip.decompress(packed))
          expected={'apply.py','call-missed.ts','missed-call-test.cjs','push-call-ended-route.ts'}
          assert set(files)==expected and all(isinstance(value,str) for value in files.values())
          with tempfile.TemporaryDirectory(prefix='connect-missed-') as dirname:
            work=pathlib.Path(dirname)
            for name,content in files.items():(work/name).write_text(content,encoding='utf-8')
            if "pwa"=='android':
              config=root/'native/app.json'
              version=json.loads(config.read_text())['expo']['version']
              if version=='2.2.8':
                assert (root/'native/web/lib/call-missed.ts').is_file(),'Incomplete Android 2.2.8 source'
                print('Connect Android 2.2.8 already published: rebuilding verified source')
                sys.exit(0)
              if version=='2.2.6':
                src=(root/'.github/workflows/connect-android-final-build.yml').read_text()
                assert src.startswith('name: Connect 2.2.7'), '2.2.7 bootstrap workflow absent'
                m=re.search(r"^\s+python3 - <<'CONNECT_PACKAGE'\r?\n(.*?)^\s+CONNECT_PACKAGE\s*$",src,re.M|re.S)
                assert m, 'Previous 2.2.7 source installer absent'
                import textwrap
                bootstrap_env=dict(os.environ)
                bootstrap_env['GITHUB_WORKFLOW_REF']='Chimera1988/connect-android/.github/workflows/connect-android-final-build.yml@refs/heads/main'
                subprocess.run([sys.executable,'-c',textwrap.dedent(m.group(1))],env=bootstrap_env,check=True)
                assert json.loads(config.read_text())['expo']['version']=='2.2.7', '2.2.7 bootstrap incomplete'
              else:
                assert version=='2.2.7','Unexpected Android prerequisite: '+version
            subprocess.run([sys.executable,str(work/'apply.py'),"pwa"],check=True)
          CONNECT_MISSED_INSTALL
      - name: Install and prepare browser regression tests
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/connect-call-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify PWA types, calls, tests and production build
        run: |
          set -euo pipefail
          npm run typecheck
          CONNECT_SQL_TEST_MODULE="$RUNNER_TEMP/connect-call-sql/node_modules/@electric-sql/pglite" npm test
          npm run build
          node --check public/sw.js
      - name: Publish checked PWA source
        run: |
          set -euo pipefail
          git add components/ConnectCallsHub.tsx lib/call-missed.ts tests/missed-call-status.test.cjs app/api/push/call/end/route.ts public/sw.js package.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix missed call badge and persistent Web Push alerts'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

