name: Connect PWA | Logout and media cache stability FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-logout-session-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Reproduce, repair, verify, and publish PWA sign-out
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check repository and source files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s AGENTS.md
          test -s package-lock.json
          test -s package.json
          test -s app/page.tsx
          node -e "const p=require('./package.json'); if(p.dependencies['@supabase/supabase-js']!=='2.57.0') process.exit(1)"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      - name: Add regression tests, before the fix
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/pwa-logout-regression.test.cjs <<'CONNECT_LOGOUT_TEST'
          'use strict';
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const source=fs.readFileSync(path.join(__dirname,'../app/page.tsx'),'utf8');
          function makeLogout(result){
            const begin=source.indexOf('  async function logout() {');
            const end=source.indexOf('\n  const keyboardOpen',begin);
            assert(begin>=0&&end>begin,'Logout body missing or moved');
            const events=[];
            const deps={
              supabase:{auth:{signOut:async options=>{events.push(['signOut',options]);return result;}}},
              busy:false,
              setBusy:v=>events.push(['busy',v]),
              fetch:async()=>({ok:true,status:200}),
              user:{id:'00000000-0000-0000-0000-000000000001'},
              wipeUserHistory:async()=>{events.push(['wipe']);},
              historyWarmStamps:{current:{}},
              inboxMediaWarm:{current:{clear(){}}},
              avatarCacheEpoch:{current:0},
              setAvatarUrls:()=>{},
              forgetUserChatPresentation:()=>{},
              warmedChatWindows:{current:{clear(){}}},
              signedMediaLifetimes:{current:{clear(){}}},
              exitChat:()=>events.push(['exitChat']),
              setProfiles:()=>{},
              setConversations:()=>{},
              setMessages:()=>{},
              setLatest:()=>{},
              setUnread:()=>{},
              readCache:{current:{}},
              setPassword:()=>{},
              setNotice:v=>events.push(['notice',v]),
              setUser:v=>events.push(['user',v]),
              setLoading:v=>events.push(['loading',v]),
              setSetup:v=>events.push(['setup',v]),
            };
            const logout=Function(...Object.keys(deps),source.slice(begin,end)+'\nreturn logout;')(...Object.values(deps));
            return {events,logout};
          }
          test('a successful local sign-out always switches to the login view',async()=>{
            const {events,logout}=makeLogout({error:null});
            await logout();
            assert.deepEqual(events.find(e=>e[0]==='signOut')?.[1],{scope:'local'},'Only this device must sign out');
            assert(events.some(e=>e[0]==='user'&&e[1]===null),'React auth state must be cleared explicitly');
            assert(events.some(e=>e[0]==='loading'&&e[1]===false),'Login screen must not remain behind a spinner');
            assert(events.some(e=>e[0]==='wipe'),'After success local cached chat data can be cleared');
          });
          test('failed sign-out preserves the current authenticated UI and history',async()=>{
            const {events,logout}=makeLogout({error:new Error('network unavailable')});
            await logout();
            assert(!events.some(e=>e[0]==='wipe'),'Never clear history before sign-out success');
            assert(!events.some(e=>e[0]==='user'&&e[1]===null),'Do not claim logged out on auth failure');
            assert(events.some(e=>e[0]==='notice'&&String(e[1]).includes('Не удалось выйти')),'Show a real error');
          });
          test('SIGNED_OUT auth event updates login UI before awaiting any native session bridge',()=>{
            const from=source.indexOf('supabase.auth.onAuthStateChange((event, session) =>');
            const to=source.indexOf('return () => { alive = false; subscription.unsubscribe(); };',from);
            assert(from>=0&&to>from,'Session listener not found');
            const body=source.slice(from,to);
            assert(/event === 'SIGNED_OUT'/.test(body),'SIGNED_OUT event must be handled explicitly');
            const beforeAwait=body.slice(0,body.indexOf('await window.__connectPrepareSession'));
            assert(beforeAwait.includes('setUser(null)'),'SIGNED_OUT should immediately enter login UI');
          });
          CONNECT_LOGOUT_TEST
          # An actual regression must fail before modification, not merely be assumed.
          if node --test tests/pwa-logout-regression.test.cjs > "$RUNNER_TEMP/expected-red.log" 2>&1; then
            echo 'RED_TEST_FAILED: regression unexpectedly passed on existing source' >&2
            cat "$RUNNER_TEMP/expected-red.log"
            exit 1
          fi
          grep -Fq 'not ok 1 - a successful local sign-out always switches to the login view' "$RUNNER_TEMP/expected-red.log" || {
            echo 'RED_TEST_FAILED: unexpected test failure; not a confirmed logout regression' >&2
            cat "$RUNNER_TEMP/expected-red.log"
            exit 1
          }
          echo 'RED confirmed: existing logout does not transition to login.'
      - name: Apply surgical logout repair (SOURCE_DRIFT protected)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_LOGOUT_PATCH'
          from pathlib import Path
          p=Path('app/page.tsx')
          src=p.read_text('utf8')
          marker='CONNECT_PWA_LOGOUT_SESSION_RECOVERY_20261117'
          if marker in src:
              raise SystemExit('SOURCE_DRIFT: fix already present; rerun is not an unverified no-op')
          import re
          observed_listener=re.search(r'    const \{ data: \{ subscription \} \} = supabase\.auth\.onAuthStateChange\(\(event, session\) => \{[\s\S]*?\n    \}\);',src)
          assert observed_listener, 'SOURCE_DRIFT: no identifiable auth event listener'
          listener=observed_listener.group(0)
          assert listener.count('await window.__connectPrepareSession?.(session)')==1, 'SOURCE_DRIFT: auth event semantics changed'
          assert 'setUser(session?.user || null)' in listener, 'SOURCE_DRIFT: unexpected auth session handler'
          assert listener.count('if (!alive) return;')==1, 'SOURCE_DRIFT: unknown listener lifecycle'
          listener_replacement="""    const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
              if (!alive) return;
              if (event === 'SIGNED_OUT' || !session) {
                // CONNECT_PWA_LOGOUT_SESSION_RECOVERY_20261117
                setUser(null); setLoading(false); setSetup(false);
                void Promise.resolve().then(() => window.__connectPrepareSession?.(null)).catch(() => {});
                return;
              }
              void Promise.resolve().then(async()=>{await window.__connectPrepareSession?.(session);if(!alive)return;setUser(session.user);setLoading(false);if(event==='PASSWORD_RECOVERY'||(invited&&session))setSetup(true);}).catch(error=>{if(alive){setLoading(false);setNotice(error instanceof Error?error.message:'Не удалось восстановить настройки');}});
            });"""
          observed_logout=re.search(r'  async function logout\(\) \{[\s\S]*?\n  \}\n\n  const keyboardOpen',src)
          assert observed_logout, 'SOURCE_DRIFT: logout block missing'
          logout=observed_logout.group(0)
          assert 'await supabase?.auth.signOut()' in logout, 'SOURCE_DRIFT: unexpected sign-out flow'
          assert 'wipeUserHistory(user.id)' in logout and "fetch('/api/connect-neon/session'" in logout, 'SOURCE_DRIFT: missing prior cleanup'
          replacement="""  async function logout() {
              if (!supabase || busy) return;
              setBusy(true);
              try {
                const { error } = await supabase.auth.signOut({ scope: 'local' });
                if (error) { setNotice('Не удалось выйти: ' + error.message); return; }
                // Auth listener may lag or fail: transition independently.
                setUser(null); setLoading(false); setSetup(false);
                try {
                  const response = await fetch('/api/connect-neon/session', {method:'DELETE',credentials:'same-origin',cache:'no-store'});
                  if (!response.ok) console.warn('Connect Neon logout HTTP',response.status);
                } catch { console.warn('Connect Neon logout request failed'); }
                if (user?.id) await wipeUserHistory(user.id).catch(() => {});
                historyWarmStamps.current = {};
                inboxMediaWarm.current.clear();
                avatarCacheEpoch.current++;
                setAvatarUrls({});
                if (user?.id) forgetUserChatPresentation(user.id);
                warmedChatWindows.current.clear(); signedMediaLifetimes.current.clear();
                exitChat(); setProfiles([]); setConversations([]); setMessages([]);
                setLatest({}); setUnread({}); readCache.current = {};
                setPassword(''); setNotice('');
              } catch (error) {
                setNotice('Не удалось выйти: ' + (error instanceof Error ? error.message : 'Ошибка авторизации'));
              } finally { setBusy(false); }
            }

            const keyboardOpen"""
          # Replace exactly one logout and one listener, without touching Android code or data APIs.
          src=src.replace(listener,listener_replacement,1)
          src=src.replace(logout,replacement,1)
          if src.count(marker)!=1 or src.count("supabase.auth.signOut({ scope: 'local' })")!=1:
              raise SystemExit('SOURCE_DRIFT: patch application not unique')
          p.write_text(src,encoding='utf8')
          # Include the regression in all future default npm test runs.
          import json
          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text('utf8'))
          old_command=pkg['scripts']['test']
          assert 'node tests/pwa-voice-waveform.test.cjs' in old_command, 'SOURCE_DRIFT: default test command changed'
          guard='node tests/pwa-logout-regression.test.cjs'
          assert guard not in old_command, 'SOURCE_DRIFT: test already registered'
          pkg['scripts']['test']=guard+' && '+old_command
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          CONNECT_LOGOUT_PATCH
      - name: Run new regression tests (GREEN)
        run: node --test tests/pwa-logout-regression.test.cjs
      - name: Install exact-match Chromium for existing tests
        run: |
          npx playwright-core install --with-deps chromium
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))process.exit(1)"
      - name: Stage exact delayed-image-error regression (RED)
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/media-cache-stale-error.test.cjs <<'CONNECT_CACHE_RACE_TEST'
          'use strict';
          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const http = require('node:http');
          const ts = require('typescript');
          const { chromium } = require(process.env.CONNECT_PLAYWRIGHT_MODULE || 'playwright-core');
          const root = path.resolve(__dirname, '..');
          const media = ts.transpileModule(fs.readFileSync(path.join(root,'lib/media-cache.ts'),'utf8'),
            {compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2020}}).outputText;
          const png = fs.readFileSync(path.join(root,'public/icon-192.png'));
          test('delayed image error must not evict verified media blob', {timeout:45000}, async () => {
            const server = http.createServer((req,res) => {
              const url = new URL(req.url,'http://127.0.0.1');
              if (url.pathname.endsWith('.png')) {
                res.writeHead(200,{'content-type':'image/png','content-length':png.length});res.end(png);return;
              }
              res.writeHead(200,{'content-type':'text/html; charset=utf-8'});
              res.end('<!doctype html><div id="fixtures"></div><script>var exports={};'+media+';window.cache=exports;window.release=cache.installMediaCache("cache-test")</script>');
            });
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            let browser;
            try {
              browser = await chromium.launch({executablePath:process.env.CONNECT_CHROMIUM_PATH||undefined,args:['--no-sandbox']});
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:'+server.address().port,{waitUntil:'domcontentloaded'});
              await page.evaluate(async()=>{
                const img = new Image();img.id='original';img.src='/storage/v1/object/sign/connect-avatars/a.png?token=fresh';
                document.getElementById('fixtures').appendChild(img);
                await img.decode();
              });
              await page.waitForFunction(async()=> (await cache.cacheStats()).system>0,null,{timeout:12000});
              await page.evaluate(async()=>{
                const src=await cache.resolveCachedMedia('/storage/v1/object/sign/connect-avatars/a.png?token=fresh');
                if(!src.startsWith('blob:')) throw Error('Expected indexed cached avatar before error simulation');
                window.cachedProbe=new Image();cachedProbe.id='cached-probe';cachedProbe.src=src;
                document.getElementById('fixtures').appendChild(cachedProbe);
                await cachedProbe.decode();
                window.spuriousEvictions=0;
                window.addEventListener('connect:cache-changed',()=>spuriousEvictions++);
              });
              // Allow the MutationObserver to record the actual blob binding before injecting
              // a delayed error event for an earlier resource (a real browser race).
              await page.waitForTimeout(80);
              await page.evaluate(()=>cachedProbe.dispatchEvent(new Event('error')));
              await page.waitForTimeout(160);
              const state=await page.evaluate(async()=>({
                evictions:spuriousEvictions,
                cached: (await cache.resolveCachedMedia('/storage/v1/object/sign/connect-avatars/a.png?token=fresh')).startsWith('blob:')
              }));
              assert.equal(state.evictions,0,'Spurious image error evicted a valid persistent cache entry');
              assert(state.cached,'Persistent image cache must remain readable');
              await page.close();
            } finally {
              try {if(browser)await browser.close();}
              finally {await new Promise(resolve=>server.close(resolve));}
            }
          });
          CONNECT_CACHE_RACE_TEST
          if node --test tests/media-cache-stale-error.test.cjs > "$RUNNER_TEMP/cache-race-red.log" 2>&1; then
            echo 'RED_TEST_FAILED: stale error regression passed without media fix' >&2
            cat "$RUNNER_TEMP/cache-race-red.log"
            exit 1
          fi
          grep -Fq 'Spurious image error evicted a valid persistent cache entry' "$RUNNER_TEMP/cache-race-red.log" || {
            echo 'RED_TEST_FAILED: unexpected browser/media failure instead of stale-error regression' >&2
            cat "$RUNNER_TEMP/cache-race-red.log"
            exit 1
          }
          echo 'RED confirmed: a stale image error discards healthy cached media.'
      - name: Repair stale image error without suppressing corrupt-media recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_CACHE_RACE_PATCH'
          from pathlib import Path
          p=Path('lib/media-cache.ts')
          s=p.read_text(encoding='utf8')
          old="""    const failed = (event: Event) => {
                  const el = event.target;
                  if (!(el instanceof HTMLImageElement || el instanceof HTMLMediaElement)) return;
                  const binding = bindings.get(el);
                  if (!binding || binding.retried) return;
                  binding.retried = true;
                  void (async () => {
                      const id = mediaIdentity(binding.source);
          """
          new="""    const failed = (event: Event) => {
                  const el = event.target;
                  if (!(el instanceof HTMLImageElement || el instanceof HTMLMediaElement)) return;
                  const binding = bindings.get(el);
                  if (!binding || binding.retried) return;
                  const failedSrc = el.getAttribute('src') || '';
                  if (failedSrc !== binding.current) return;
                  binding.retried = true;
                  void (async () => {
                      // CONNECT_MEDIA_STALE_IMAGE_ERROR_GUARD_20261117
                      // An old request can dispatch `error` after a healthy cached blob
                      // becomes current. Only evict when the CURRENT image fails decode.
                      if (el instanceof HTMLImageElement && originals.has(failedSrc)) {
                          try {
                              await el.decode();
                              if (alive && bindings.get(el) === binding && el.getAttribute('src') === failedSrc) {
                                  binding.retried = false;
                                  return;
                              }
                          } catch { /* Decode really failed; follow existing repair path. */ }
                      }
                      if (!alive || bindings.get(el) !== binding || el.getAttribute('src') !== failedSrc) {
                          binding.retried = false;
                          return;
                      }
                      const id = mediaIdentity(binding.source);
          """
          assert s.count(old)==1, 'SOURCE_DRIFT: cache image error handler has changed'
          assert 'CONNECT_MEDIA_STALE_IMAGE_ERROR_GUARD_20261117' not in s, 'SOURCE_DRIFT: media fix already present'
          p.write_text(s.replace(old,new,1),encoding='utf8')
          import json
          pp=Path('package.json')
          package=json.loads(pp.read_text('utf8'))
          existing='node tests/media-recovery.test.cjs'
          new_test='node tests/media-cache-stale-error.test.cjs'
          assert package['scripts']['test'].count(existing)==1 and new_test not in package['scripts']['test'], 'SOURCE_DRIFT: test suite changed'
          package['scripts']['test']=package['scripts']['test'].replace(existing,new_test+' && '+existing,1)
          pp.write_text(json.dumps(package,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          CONNECT_CACHE_RACE_PATCH
      - name: Verify delayed-image regression and existing media recovery (GREEN)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/media-cache-stale-error.test.cjs
          node --test tests/media-recovery.test.cjs
      - name: Full PWA checks
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified PWA-only fix
        shell: bash
        run: |
          set -euo pipefail
          git add -N app/page.tsx lib/media-cache.ts tests/pwa-logout-regression.test.cjs tests/media-cache-stale-error.test.cjs package.json
          git diff --check
          git add app/page.tsx lib/media-cache.ts tests/pwa-logout-regression.test.cjs tests/media-cache-stale-error.test.cjs package.json
          git diff --cached --quiet && { echo 'No changes to publish' >&2; exit 1; }
          git config user.name 'Connect PWA CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: recover logout and protect healthy media blobs'
          git push origin HEAD:main
