name: Connect PWA | Supabase-only rollback 2026-11-17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-production-supabase-only-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore Supabase client, remove Neon runtime, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout production main and full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact known production source and recovery base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD:app/page.tsx)" = 'd80b568d3b978af36d55bf3abd598a6bc3eec711' || {
            echo 'SOURCE_DRIFT: app/page.tsx changed since the checked rollback baseline; no changes made.' >&2
            exit 1
          }
          BASE='7e28b80363243f5d6220a692af952673bf6f1261'
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$BASE:app/page.tsx"
          git cat-file -e "$BASE:package-lock.json"
          test -d app/api/connect-neon
          test -s tests/pwa-logout-regression.test.cjs
          test -s tests/media-cache-stale-error.test.cjs
          test -s AGENTS.md
          test -s package.json
          test -s package-lock.json

      - name: Write rollback regression tests (RED before changes)
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/supabase-only-rollback.test.cjs <<'CONNECT_SUPABASE_ROLLBACK_TEST'
          'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.join(__dirname,'..');
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const page=read('app/page.tsx');
          const pkg=JSON.parse(read('package.json'));
          test('one authoritative Supabase path for send, read, edit, delete and history',()=>{
            assert.match(page,/supabase\.from\('messages'\)\.insert/);
            assert.match(page,/supabase\.from\('messages'\)\.update/);
            assert.match(page,/await eraseMessage\(m\)/);
            assert.match(page,/supabase\.from\('messages'\)\.select/);
            assert.doesNotMatch(page,/connectNeon|connect-neon|CONNECT_NEON/i);
          });
          test('all Neon HTTP endpoints, client helpers and rollout jobs are gone',()=>{
            assert.equal(fs.existsSync(path.join(root,'app/api/connect-neon')),false);
            for(const prefix of ['lib/connect-neon-','tests/connect-neon-','.github/workflows/connect-neon-']){
              const dir=path.dirname(prefix),head=path.basename(prefix);
              const found=fs.readdirSync(path.join(root,dir)).filter(name=>name.startsWith(head));
              assert.deepEqual(found,[],prefix+' residual files');
            }
          });
          test('old sign-out and media-cache repairs are preserved',()=>{
            assert.match(page,/CONNECT_PWA_LOGOUT_SESSION_RECOVERY_20261117/);
            assert.match(page,/signOut\(\{ scope: 'local' \}\)/);
            assert.match(page,/setUser\(null\); setLoading\(false\); setSetup\(false\)/);
            assert.equal(fs.existsSync(path.join(root,'tests/pwa-logout-regression.test.cjs')),true);
            assert.equal(fs.existsSync(path.join(root,'tests/media-cache-stale-error.test.cjs')),true);
          });
          test('Neon client libraries are removed, essential Supabase services unchanged',()=>{
            for(const name of ['pg','@aws-sdk/client-s3','@aws-sdk/s3-request-presigner']){
              assert.equal(pkg.dependencies[name],undefined,name+' no longer needed');
            }
            assert.equal(pkg.dependencies['@supabase/supabase-js'],'2.57.0');
            assert.match(pkg.scripts.test,/pwa-logout-regression\.test\.cjs/);
            assert.match(pkg.scripts.test,/media-cache-stale-error\.test\.cjs/);
            assert.match(pkg.scripts.test,/supabase-only-rollback\.test\.cjs/);
          });
          CONNECT_SUPABASE_ROLLBACK_TEST
          if node --test tests/supabase-only-rollback.test.cjs > "$RUNNER_TEMP/connect-rollback-red.log" 2>&1; then
            echo 'TEST_ERROR: the migration regression passed before a rollback; refusing unverified change.' >&2
            exit 1
          fi
          grep -Fq 'not ok' "$RUNNER_TEMP/connect-rollback-red.log" || {
            cat "$RUNNER_TEMP/connect-rollback-red.log"
            echo 'TEST_ERROR: pre-rollback failure is not an assertion failure.' >&2
            exit 1
          }
          echo 'RED confirmed: production still contains Neon text paths and APIs.'

      - name: Surgical restoration (preserve logout and media-cache fixes)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_SUPABASE_ROLLBACK_PATCH'
          from pathlib import Path
          import json,subprocess
          BASE='7e28b80363243f5d6220a692af952673bf6f1261'
          root=Path('.')
          def original(path):
              return subprocess.check_output(['git','show',f'{BASE}:{path}'],text=True)
          def between(source,left,right):
              if source.count(left)!=1: raise SystemExit('SOURCE_DRIFT: anchor count '+left)
              start=source.index(left)
              end=source.find(right,start+len(left))
              if end<0: raise SystemExit('SOURCE_DRIFT: end anchor '+right)
              return source[start:end]
          current=(root/'app/page.tsx').read_text(encoding='utf8')
          previous=original('app/page.tsx')
          auth_start='    const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {'
          auth_end='\n    return () => { alive = false; subscription.unsubscribe(); };'
          current_auth=between(current,auth_start,auth_end)
          old_auth=between(previous,auth_start,auth_end)
          if 'CONNECT_PWA_LOGOUT_SESSION_RECOVERY_20261117' not in current_auth or 'setUser(null)' not in current_auth:
              raise SystemExit('SOURCE_DRIFT: current sign-out event fix absent')
          logout_start='  async function logout() {'
          logout_end='\n  const keyboardOpen'
          current_logout=between(current,logout_start,logout_end)
          previous_logout=between(previous,logout_start,logout_end)
          obsolete=(
              "      try {\n"
              "        const response = await fetch('/api/connect-neon/session', {method:'DELETE',credentials:'same-origin',cache:'no-store'});\n"
              "        if (!response.ok) console.warn('Connect Neon logout HTTP',response.status);\n"
              "      } catch { console.warn('Connect Neon logout request failed'); }\n"
          )
          # The obsolete call is intentionally removed, not replaced by another session authority.
          if current_logout.count(obsolete)!=1: raise SystemExit('SOURCE_DRIFT: Neon logout call changed')
          current_logout=current_logout.replace(obsolete,'')
          if "signOut({ scope: 'local' })" not in current_logout or 'setUser(null)' not in current_logout:
              raise SystemExit('SOURCE_DRIFT: local sign-out fix absent')
          restored=previous.replace(old_auth,current_auth,1).replace(previous_logout,current_logout,1)
          if any(value.lower() in restored.lower() for value in ('connect-neon','connectNeon','CONNECT_NEON')):
              raise SystemExit('SOURCE_DRIFT: a Neon reference survived in PWA entry point')
          if "supabase.from('messages').insert" not in restored or 'await eraseMessage(m)' not in restored:
              raise SystemExit('SOURCE_DRIFT: restored Supabase text behavior is missing')
          (root/'app/page.tsx').write_text(restored,encoding='utf8')
          package_path=root/'package.json'
          current_package=json.loads(package_path.read_text('utf8'))
          before_package=json.loads(original('package.json'))
          removed=('pg','@aws-sdk/client-s3','@aws-sdk/s3-request-presigner')
          for name in removed:
              if name not in current_package['dependencies'] or name in before_package['dependencies']:
                  raise SystemExit('SOURCE_DRIFT: dependency inventory '+name)
              del current_package['dependencies'][name]
          for name,version in before_package['dependencies'].items():
              if current_package['dependencies'].get(name)!=version:
                  raise SystemExit('SOURCE_DRIFT: unrelated dependency changed '+name)
          command='node tests/supabase-only-rollback.test.cjs'
          if command in current_package['scripts']['test']:
              raise SystemExit('SOURCE_DRIFT: rollback test already in package.json')
          current_package['scripts']['test']=command+' && '+current_package['scripts']['test']
          package_path.write_text(json.dumps(current_package,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          # Restore the verified pre-migration dependency graph, without changing subsequent test scripts.
          (root/'package-lock.json').write_text(original('package-lock.json'),encoding='utf8')
          CONNECT_SUPABASE_ROLLBACK_PATCH
          git rm -r -- app/api/connect-neon
          git rm -- lib/connect-neon-* tests/connect-neon-* .github/workflows/connect-neon-*.yml
          test ! -e app/api/connect-neon
          test -s app/page.tsx

      - name: Verify recovery contract (GREEN)
        run: node --test tests/supabase-only-rollback.test.cjs

      - name: Node 22 and install restored locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean installation exactly from restored Supabase lockfile
        run: npm ci --no-audit --no-fund

      - name: Install browser for real cached media regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          node -e "const fs=require('node:fs'); const p=require('playwright-core').chromium.executablePath(); if(!fs.existsSync(p)) process.exit(1)"

      - name: Full static checks, all PWA tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          if grep -REn 'connect-neon|connectNeon|CONNECT_NEON' app components lib --exclude='*.map'; then
            echo 'ROLLBACK_INCOMPLETE: Neon reference in runtime sources.' >&2
            exit 1
          fi
          git diff --check
          git diff --cached --check

      - name: Commit verified Supabase-only application and publish main
        shell: bash
        run: |
          set -euo pipefail
          git add -A app/page.tsx package.json package-lock.json tests/supabase-only-rollback.test.cjs
          git diff --cached --quiet && { echo 'No changes produced; refusing empty rollback.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect: restore Supabase-only messages, sessions and media; remove Neon runtime'
          git push origin HEAD:main
          echo 'APP_ROLLBACK_PUBLISHED: Supabase-only PWA source committed. Follow up: verify Vercel deployment, disable Supabase Neon cron, remove Neon Vercel environment variables.'
