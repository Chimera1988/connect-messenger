name: Apply Connect 1.3.3 with chat reading position

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-connect-1-3-3-chat.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply previous 1.3.3 fixes including proximity and audio
        run: python3 scripts/apply_connect_1_3_3.py
      - name: Apply chat read-position and unread-divider improvements
        run: python3 scripts/apply_connect_chat_reading.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit PWA changes
        run: |
          git config user.name 'Connect updater'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx app/globals.css app/calls.css components/ConnectAudioCalls.tsx components/ConnectCallsHub.tsx components/ConnectNotificationSettings.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: stable unread-aware chat scroll and 1.3.3 Android integration'
            git push
          else
            echo 'Already updated'
          fi
