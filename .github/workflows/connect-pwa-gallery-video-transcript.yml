      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies and Chromium on supported Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify PWA behavior and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Publish only if every check succeeds
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/profile-media.css components/ConnectProfileMedia.tsx components/ConnectGalleryViewer.tsx components/ConnectTranscript.tsx
          if git diff --cached --quiet; then
            echo 'PWA media UI is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: fullscreen media viewer and compact video/voice controls [skip ci]'
          git push origin HEAD:main
