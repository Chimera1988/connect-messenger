# Connect PWA: unified chat/profile gallery, video-note controls, opt-in transcription.
# Upload to: .github/workflows/connect-pwa-gallery-video-transcript.yml
# No E2EE enablement, no Supabase migrations, no Android changes.
name: Connect PWA — galleries, video circles and voice transcription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-gallery-video-transcript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-media-ux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply atomic PWA changes from verified source anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_EXTRACT'
          import base64,gzip,io,tarfile
          from pathlib import Path
          archive=gzip.decompress(base64.b64decode(""""""))
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as bundle:
              paths={'patch.py':'/tmp/connect-media-patch.py',
                     'transcript_component.tsx':'/tmp/connect-transcript-component.tsx',
                     'transcribe_route.ts':'/tmp/connect-transcribe-route.ts'}
              assert set(bundle.getnames())==set(paths)
              for member in bundle.getmembers():
                  data=bundle.extractfile(member).read()
                  Path(paths[member.name]).write_bytes(data)
          PY_CONNECT_EXTRACT
          python3 /tmp/connect-media-patch.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies and browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify PWA changes with existing tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Publish only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/page.tsx app/profile-media.css components/ConnectProfileMedia.tsx components/ConnectTranscript.tsx app/api/transcribe/route.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA: galleries, video circles and opt-in transcription [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
