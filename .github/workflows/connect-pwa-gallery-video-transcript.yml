# Connect PWA - one-file media UX correction. REPLACE the existing file with this name.
# Scope: ONLY PWA chat gallery, profile gallery, video notes and arrow-T transcription UI.
# No Android changes, E2EE enablement, Supabase schema migrations or calls changes.
name: Connect PWA - clean fullscreen gallery and video notes (FIX2)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-gallery-video-transcript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-media-ux-fix2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
