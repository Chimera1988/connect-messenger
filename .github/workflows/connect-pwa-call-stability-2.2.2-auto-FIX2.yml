name: Connect PWA - stable audio calls 2.2.2 (AUTO FIX2)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-call-stability-2.2.2-auto-FIX2.yml'
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit and push tested PWA call fixes
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: connect-call-stability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate source and apply embedded call update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_INSTALLER'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          workflow=root/'.github/workflows/connect-pwa-call-stability-2.2.2-auto-FIX2.yml'
          lines=workflow.read_text().splitlines()
          start=lines.index('# CONNECT_CALL_PACKAGE_BEGIN')+1
          end=lines.index('# CONNECT_CALL_PACKAGE_END',start)
          assert all(line.startswith('# ') for line in lines[start:end]),'Malformed package'
          packed=base64.b64decode(''.join(line[2:] for line in lines[start:end]),validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=1024*1024+1)
          assert decoder.eof and not decoder.unused_data and len(raw)<=1024*1024,'Package size exceeded'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert sha(raw)=='c7a88c634786f815ede5be8f77e596dcefefa9670f5f884139eeb2ffda75b275','Package integrity failed'
          package=json.loads(raw)
          assert subprocess.run(['git','diff','--quiet']).returncode==0,'Tracked working tree is dirty'
          assert subprocess.run(['git','diff','--cached','--quiet']).returncode==0,'Index is dirty'
          for name,digest in package['requirements'].items():
              assert not (root/name).is_symlink() and sha((root/name).read_bytes())==digest,'Incompatible dependencies: '+name
          verified={}
          for item in package['files']:
              rel=pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              target=root/str(rel)
              assert not target.is_symlink() and all(not parent.is_symlink() for parent in target.parents if parent!=root),'Symlink refused'
              actual=sha(target.read_bytes()) if target.exists() else None
              assert actual in (item['before'],item['after']),'Source mismatch: '+str(rel)
              data=base64.b64decode(item['data'],validate=True)
              assert sha(data)==item['after'],'File integrity failed: '+str(rel)
              verified[str(rel)]=data
          # Check every preimage before writing any file; unrelated newer UI is preserved.
          changed=0
          for name,data in verified.items():
              target=root/name
              if not target.exists() or target.read_bytes()!=data:
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);changed+=1
          marker=root/'.connect-call-stability.json'
          marker.write_text(json.dumps({'packageSha256':'c7a88c634786f815ede5be8f77e596dcefefa9670f5f884139eeb2ffda75b275','base':package['base'],'version':'2.2.2','files':list(verified),'serverAutomaticallyMigrated':False},indent=2)+'\n')
          print('Verified call update; changed files:',changed,'; repeated:',changed==0)
          CONNECT_INSTALLER
      - name: Await both stored media objects before cache assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_MEDIA_REGRESSION_FIX2'
          from pathlib import Path
          path=Path('tests/media-recovery.test.cjs')
          code=path.read_text('utf-8')
          mark='CONNECT_CALLS_MEDIA_FIX2_WAIT_FOR_EXACT_OBJECTS'
          anchor=" await page.evaluate(async()=>{\n const base=location.origin+'/storage/v1/object/sign/';"
          patch=" // CONNECT_CALLS_MEDIA_FIX2_WAIT_FOR_EXACT_OBJECTS\n await page.waitForFunction(async()=>{\n   const base=location.origin+'/storage/v1/object/sign/';\n   const urls=await Promise.all([\n     cache.resolveCachedMedia(base+'connect-avatars/a.png?token=one'),\n     cache.resolveCachedMedia(base+'connect-attachments/a.png?token=one')\n   ]);\n   return urls.every(url=>url.startsWith('blob:'));\n },null,{timeout:30000});"+"\n"
          if mark in code:
              print('Exact-media cache regression wait already present.')
          else:
              assert code.count(anchor)==1, 'Current FIX6 media test anchor differs; refusing to overwrite.'
              path.write_text(code.replace(anchor,patch+anchor,1),encoding='utf-8')
              print('FIX: wait for exact avatar and photo cache objects')
          CONNECT_MEDIA_REGRESSION_FIX2
      - name: Install locked dependencies and browser
        run: |
          set -euo pipefail
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Verify types and existing regressions plus device ownership
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          git diff --check
      - name: Build production PWA
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cp next-env.d.ts "$RUNNER_TEMP/connect-next-env.d.ts"
          npm run build
          cp "$RUNNER_TEMP/connect-next-env.d.ts" next-env.d.ts
      - name: Commit checked files when allowed
        id: commit
        if: github.event_name == 'push' || inputs.commit_changes
        run: |
          set -euo pipefail
          python3 - <<'PY_STAGE'
          import json,subprocess
          files=json.load(open('.connect-call-stability.json'))['files']
          files.append('tests/media-recovery.test.cjs')
          subprocess.run(['git','add','--',*files,'.connect-call-stability.json'],check=True)
          PY_STAGE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: prevent audio call races between trusted devices'
          fi
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::GitHub rejected the push. Tested changes are in the artifact; repository was not updated.'
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package source and deployment status
        env:
          SOURCE_PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          python3 - <<'PY_RESULT'
          import json,os,pathlib,shutil
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'connect-pwa-calls'
          out.mkdir(exist_ok=True)
          marker=json.load(open('.connect-call-stability.json'))
          for name in marker['files']+['tests/media-recovery.test.cjs','.connect-call-stability.json']:
              dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(name,dest)
          status={'sourcePushed':os.environ.get('SOURCE_PUSHED')=='true','serverChangedByWorkflow':False,'productionDeviceTests':False,'note':'Server response-owner guard was separately deployed on 2026-11-10; included SQL is repeatable and checks the existing RPC. This workflow does not deploy or enable E2EE.'}
          (out/'DEPLOYMENT-STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Connect PWA audio calls: '+json.dumps(status,ensure_ascii=False)+'\n')
          PY_RESULT
      - uses: actions/upload-artifact@v4
        with:
          name: connect-pwa-call-stability
          path: ${{ runner.temp }}/connect-pwa-calls
          include-hidden-files: true
          retention-days: 14

