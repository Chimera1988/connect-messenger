    - name: Verify exact source and apply embedded reviewed files
      run: |
        node "$RUNNER_TEMP/connect-installer/apply.cjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/connect-installer/payload.b64" "$CONNECT_PAYLOAD_SHA" "$RUNNER_TEMP/connect-installer/paths"
    - name: Verify lockfile
      run: test -s package-lock.json
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --no-audit --no-fund
    - run: npm run audit:prod
    - name: Install the Chromium matching playwright-core
      run: |
        set -euo pipefail
        npx --no-install playwright-core install --with-deps chromium
        node -e "const fs=require('fs');if(!fs.existsSync(require('playwright-core').chromium.executablePath()))process.exit(1)"
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.5.6
    - run: npm run typecheck -- --incremental false
    - run: npm run check:architecture
    - run: npm run check:edge
    - name: Run every discovered regression, SQL and WebRTC integration test
      run: npm test
    - run: npm run build
    - name: Test the actual production PWA with isolated services
      run: npm run test:e2e
    - run: git diff --check
    - name: Preserve verified installer inputs (no credentials)
      uses: actions/upload-artifact@v4
      with:
        name: connect-verified-installer
        path: ${{ runner.temp }}/connect-installer/
        retention-days: 14
    - name: Publish verified review branch and PR
      if: ${{ inputs.operation == 'prepare' && inputs.publish_review_branch }}
      env:
        CONNECT_VERIFIED: TESTS_AND_BUILD_PASSED
        GH_TOKEN: ${{ secrets.CONNECT_REMEDIATION_TOKEN }}
      run: |
        set -euo pipefail
        export CONNECT_SOURCE_HEAD="$(cat "$RUNNER_TEMP/connect-installer/source-head")"
        export CONNECT_PATHS_FILE="$RUNNER_TEMP/connect-installer/paths"
        export CONNECT_RELEASE_SHA="$CONNECT_PAYLOAD_SHA"
        bash scripts/publish-remediation.sh
    - name: Explain selected completion
      env:
        SELECTED_OPERATION: ${{ inputs.operation }}
      run: |
        if [[ "$SELECTED_OPERATION" == prepare ]]; then
          echo 'Source verified. Production database and Edge Functions were not modified.' >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'Source verified. Separate protected backend job is selected.' >> "$GITHUB_STEP_SUMMARY"
        fi
  backend:
    if: ${{ inputs.operation == 'backend' }}
    needs: validate
    environment: connect-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: connect-verified-installer
        path: ${{ runner.temp }}/connect-installer
    - name: Reapply verified payload to the same source
      run: |
        set -euo pipefail
        node "$RUNNER_TEMP/connect-installer/apply.cjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/connect-installer/payload.b64" "$CONNECT_PAYLOAD_SHA"
    - name: Apply only reviewed schema and Edge changes
      env:
        CONNECT_BACKEND_CONFIRMATION: ${{ inputs.backend_confirmation }}
        CONNECT_BACKUP_ID: ${{ inputs.backup_id }}
        CONNECT_DATABASE_URL: ${{ secrets.CONNECT_DATABASE_URL }}
        CONNECT_PROJECT_REF: tpwkmoxxzjfdsqsomhhr
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npm exec --yes --package=supabase@3.2.0 -- bash scripts/apply-backend.sh
    - run: |-
        echo "Reviewed backend upgrades and four active Edge Functions applied. Review the PR before releasing PWA." >> "$GITHUB_STEP_SUMMARY"
