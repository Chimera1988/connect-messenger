name: Connect PWA - universal build and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: TypeScript, tests and Next.js production build
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for real browser cache tests
        run: npx playwright-core install --with-deps chromium

      - name: Locate Chromium for browser-based tests
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          test -x "$CHROME_PATH"
          echo "CONNECT_CHROMIUM_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run all Connect PWA tests
        run: npm test

      - name: Build production Next.js application
        run: npm run build

      - name: Package verified server-capable PWA build
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -d .next
          test -f .next/BUILD_ID
          mkdir -p release
          tar -czf release/connect-pwa-build.tgz \
            --exclude='.next/cache' \
            .next public package.json package-lock.json next.config.mjs
          sha256sum release/connect-pwa-build.tgz > release/SHA256.txt
          printf 'Source commit: %s\nPWA version: %s\n' \
            "$GITHUB_SHA" "$(node -p 'require("./package.json").version')" > release/BUILD-INFO.txt

      - name: Upload production build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Connect-PWA-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

# Checks/build only. The deployed Next.js server and its push/FCM/VAPID/TURN
# environment remain managed by the existing hosting provider. This workflow
# never deploys, writes source code, changes Supabase or deletes other workflows.
