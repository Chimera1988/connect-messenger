name: Connect - inline autoplay video and sound buttons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-inline-autoplay-video.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect PWA
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply inline video playback and separate sound controls
        shell: bash
        run: |
          python3 - <<'PY_PATCH'
          from pathlib import Path
          
          page_path = Path('app/page.tsx')
          css_path = Path('app/liquid-glass.css')
          page = page_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          
          marker = '// Connect inline autoplay video and separate audio controls v1'
          if marker not in page:
              anchor = '// Video notes use the existing video attachments schema, but have a distinct presentation.'
              assert page.count(anchor) == 1, 'Cannot find video-note anchor; repository code has changed'
              component = r'''// Connect inline autoplay video and separate audio controls v1
          function ConnectSoundGlyph({muted}:{muted:boolean}) {
            return <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none"
                stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M4 9h4l4-3v12l-4-3H4z"/>
              {muted ? <path d="m16 9 5 6m0-6-5 6"/> : <><path d="M16 9c1.5 1.1 1.5 4.9 0 6"/><path d="M19 6c3.5 3 3.5 9 0 12"/></>}
            </svg>;
          }
          
          function ConnectInlineAutoplayVideo({src,path,onOpen}:{src:string;path:string;onOpen:()=>void}) {
            const ref=useRef<HTMLVideoElement|null>(null);
            const soundRef=useRef(true);
            const [muted,setMuted]=useState(true);
            const [poster,setPoster]=useState<string|null>(null);
            const [error,setError]=useState(false);
          
            useEffect(()=>{
              setPoster(null);setError(false);
              if(!supabase || !/__vid_\d{1,5}x\d{1,5}$/.test(path))return;
              let cancelled=false;
              void supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600)
                .then(({data,error:requestError})=>{
                  if(!cancelled&&!requestError&&data?.signedUrl)setPoster(mediaUrl(data.signedUrl));
                }).catch(()=>{});
              return()=>{cancelled=true;};
            },[path]);
          
            useEffect(()=>{
              const video=ref.current;
              if(!video)return;
              soundRef.current=true;video.muted=true;setMuted(true);
              let inView=false;
              function update(){
                if(!video)return;
                if(inView&&document.visibilityState==='visible'){
                  video.muted=soundRef.current;
                  void video.play().catch(()=>{}); // iOS low-power mode may block autoplay
                }else{
                  video.pause();video.muted=true;soundRef.current=true;setMuted(true);
                }
              }
              const observer=new IntersectionObserver(entries=>{
                inView=Boolean(entries[0]?.isIntersecting);
                update();
              },{root:video.closest<HTMLElement>('.message-scroll'),threshold:.35});
              observer.observe(video);
              document.addEventListener('visibilitychange',update);
              return()=>{
                observer.disconnect();document.removeEventListener('visibilitychange',update);
                video.pause();video.muted=true;
              };
            },[src]);
          
            return <div className="connect-inline-autoplay-video">
              <button type="button" className="connect-inline-autoplay-video-open" aria-label="Открыть видео на весь экран"
                onClick={event=>{event.stopPropagation();onOpen();}}>
                <video ref={ref} src={src} poster={poster||undefined} autoPlay muted={muted} loop playsInline preload="metadata"
                  onLoadedMetadata={event=>connectUpdateVideoFrame(event.currentTarget,path)}
                  onError={()=>setError(true)}/>
                {error&&<span className="connect-inline-video-error">Видео недоступно</span>}
              </button>
              <button type="button" className="connect-inline-video-sound" aria-label={muted?'Включить звук':'Выключить звук'}
                title={muted?'Включить звук':'Выключить звук'}
                onClick={event=>{
                  event.stopPropagation();const video=ref.current;if(!video)return;
                  const next=!video.muted;
                  soundRef.current=next;video.muted=next;setMuted(next);
                  if(!next)void video.play().catch(()=>{});
                }}><ConnectSoundGlyph muted={muted}/></button>
            </div>;
          }
          
          '''
              page = page.replace(anchor, component + anchor, 1)
          
          note_marker = '// Connect video-note sound control v2'
          if note_marker not in page:
              start = page.find('function VideoNoteBubble({src,name}:{src:string;name:string}) {')
              end = page.find('\ntype VideoNotePhase',start)
              assert start>=0 and end>start, 'Cannot find video-note component boundaries'
              old_note = page[start:end]
              assert 'connect-video-note-sound' in old_note and 'IntersectionObserver' in old_note, 'Unexpected video-note component'
              new_note = r'''// Connect video-note sound control v2
          function VideoNoteBubble({src,name}:{src:string;name:string}) {
            const ref=useRef<HTMLVideoElement|null>(null);
            const [muted,setMuted]=useState(true);
            const [duration,setDuration]=useState(0);
            useEffect(()=>{
              const video=ref.current;
              if(!video)return;
              video.muted=true;setMuted(true);
              let inView=false;
              function update(){
                if(!video)return;
                if(inView&&document.visibilityState==='visible'){
                  video.muted=true;setMuted(true);
                  void video.play().catch(()=>{});
                }else{
                  video.pause();video.muted=true;setMuted(true);
                }
              }
              const observer=new IntersectionObserver(entries=>{
                inView=Boolean(entries[0]?.isIntersecting);update();
              },{root:video.closest<HTMLElement>('.message-scroll'),threshold:.35});
              observer.observe(video);
              document.addEventListener('visibilitychange',update);
              return()=>{
                observer.disconnect();document.removeEventListener('visibilitychange',update);
                video.pause();video.muted=true;
              };
            },[src]);
            return <div className="connect-video-note">
              <button type="button" className="connect-video-note-screen" aria-label="Приостановить или продолжить видеокружок"
                onClick={event=>{
                  event.stopPropagation();const video=ref.current;if(!video)return;
                  if(video.paused)void video.play().catch(()=>{});else video.pause();
                }}>
                <video ref={ref} src={src} muted={muted} autoPlay playsInline loop preload="metadata" aria-label={name}
                  onLoadedMetadata={event=>{const d=event.currentTarget.duration;if(Number.isFinite(d))setDuration(d)}}/>
              </button>
              {duration>0&&<span className="connect-video-note-length">{Math.floor(duration/60)}:{String(Math.floor(duration%60)).padStart(2,'0')}</span>}
              <button type="button" className="connect-video-note-sound" aria-label={muted?'Включить звук видеокружка':'Выключить звук видеокружка'}
                title={muted?'Включить звук':'Выключить звук'}
                onClick={event=>{
                  event.stopPropagation();const video=ref.current;if(!video)return;
                  const next=!video.muted;video.muted=next;setMuted(next);
                  if(!next)void video.play().catch(()=>{});
                }}><ConnectSoundGlyph muted={muted}/></button>
            </div>;
          }
          '''
              page=page[:start]+new_note+page[end:]
          
          old_video = r''': m.attachment_kind==='video' ? <button type="button" className="connect-media-thumb connect-adaptive-video-thumb" onClick={e=>{e.stopPropagation();setMediaViewer({url:attachmentUrls[m.attachment_path!],path:m.attachment_path!,name:m.attachment_name || 'Видео.mp4',kind:'video'})}} aria-label="Воспроизвести видео"><VideoThumbnail src={attachmentUrls[m.attachment_path]} path={m.attachment_path!}/><span className="connect-media-play">▶</span></button>'''
          new_video = r''': m.attachment_kind==='video' ? <ConnectInlineAutoplayVideo src={attachmentUrls[m.attachment_path]} path={m.attachment_path} onOpen={()=>setMediaViewer({url:attachmentUrls[m.attachment_path!],path:m.attachment_path!,name:m.attachment_name || 'Видео.mp4',kind:'video'})}/>'''
          if old_video in page:
              assert page.count(old_video)==1
              page=page.replace(old_video,new_video,1)
          else:
              assert page.count(new_video)==1, 'Cannot find standalone video render; repository code has changed'
          
          css_marker = '/* Connect inline autoplay videos and corner sound controls v1 */'
          if css_marker not in css:
              # The existing broad 4:3 image/video rules must not override adaptive inline video.
              start=css.find('/* Reserve the FULL media footprint before a signed URL/image/video is ready.')
              end=css.find('/* Video notes already have a round 1:1 player.',start)
              assert start>=0 and end>start, 'Fixed media rule location changed'
              old_css=css[start:end]
              exclusion=':not(:has(.connect-adaptive-photo))'
              assert old_css.count(exclusion)>=5, 'Unexpected fixed media selectors'
              new_css=old_css.replace(exclusion,exclusion+':not(:has(.connect-adaptive-video))')
              css=css[:start]+new_css+css[end:]
          
              css+=r'''
          
          /* Connect inline autoplay videos and corner sound controls v1 */
          /* The existing adaptive video frame preserves aspect ratio and album-style borders. */
          .connect-app .bubble.media-only:has(.connect-adaptive-video) .attachment-preview.connect-adaptive-video > .connect-inline-autoplay-video {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            box-sizing: border-box !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            background: #0b1019 !important;
          }
          .connect-app .bubble.media-only:has(.connect-adaptive-video) .connect-inline-autoplay-video-open {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            background: transparent !important;
            cursor: pointer;
          }
          .connect-app .bubble.media-only:has(.connect-adaptive-video) .connect-inline-autoplay-video-open > video {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            box-sizing: border-box !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            min-width: 0 !important;
            min-height: 0 !important;
            object-fit: contain !important;
            border: 0 !important;
            border-radius: 12px !important;
            background: transparent !important;
            pointer-events: none;
          }
          .connect-app .bubble.media-only:has(.connect-adaptive-video) .connect-inline-video-sound,
          .connect-app .connect-video-note .connect-video-note-sound {
            position: absolute !important;
            z-index: 25 !important;
            right: 8px !important;
            bottom: 8px !important;
            display: grid !important;
            place-items: center !important;
            width: 34px !important;
            height: 34px !important;
            min-width: 34px !important;
            min-height: 34px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 1px solid rgba(255,255,255,.24) !important;
            border-radius: 999px !important;
            color: #fff !important;
            background: rgba(8,15,25,.66) !important;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px rgba(0,0,0,.18) !important;
            cursor: pointer;
            touch-action: manipulation;
          }
          .connect-app .connect-video-note .connect-video-note-screen {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            border-radius: 50% !important;
            background: transparent !important;
            overflow: hidden !important;
            cursor: pointer;
          }
          .connect-app .connect-video-note .connect-video-note-screen video {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            pointer-events: none;
          }
          .connect-app .bubble.media-only:has(.connect-adaptive-video) .connect-inline-video-error {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 12px;
            background: rgba(12,18,30,.85);
          }
          '''
          
          assert marker in page
          assert note_marker in page
          assert new_video in page
          assert css_marker in css
          page_path.write_text(page,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          print('Connect inline-autoplay video and note controls updated')
          PY_PATCH
      - name: Check patch whitespace
        run: git diff --check
      - name: Install packages
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit changes to main
        shell: bash
        run: |
          git add app/page.tsx app/liquid-glass.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: autoplay inline videos with corner sound controls"
          git push origin HEAD:main
