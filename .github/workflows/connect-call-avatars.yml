name: Connect - theme avatar rings and call photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-call-avatars.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Connect
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add theme rings and call avatars
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          # A focused, repeatable patch for Connect messenger PWA.
          def replace_once(path: str, old: str, new: str, marker: str | None = None):
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if new in content:
                  print('Already applied:', path, (marker or new)[:55])
                  return
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected {path}: anchor {old[:85]!r} occurs {count} times')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')
              print('Updated:', path, (marker or old)[:55])

          helper = Path('components/ConnectCallAvatar.tsx')
          helper_source = r'''\'use client\';

          import { useEffect, useState } from 'react';
          import type { SupabaseClient } from '@supabase/supabase-js';

          type AvatarPerson = { id: string; avatar_path?: string | null };

          // Convert signed media URLs to the existing Connect proxy on its alternate domain.
          function callAvatarMediaUrl(url: string): string {
            if (typeof window === 'undefined' || window.location.hostname !== 'connect-chat.duckdns.org') return url;
            const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL || '';
            if (!supabaseUrl) return url;
            try {
              const original = new URL(url);
              const base = new URL(supabaseUrl);
              if (original.hostname === base.hostname)
                return window.location.origin + '/supabase' + original.pathname + original.search + original.hash;
              const storageHost = base.hostname.replace('.supabase.co', '.storage.supabase.co');
              if (original.hostname === storageHost)
                return window.location.origin + '/supabase-storage' + original.pathname + original.search + original.hash;
            } catch { /* Keep the original URL when a proxy cannot be used. */ }
            return url;
          }

          export async function loadCallAvatarUrls(client: SupabaseClient, people: AvatarPerson[]): Promise<Record<string,string>> {
            const rows = await Promise.all(people.filter(person => Boolean(person.avatar_path)).map(async person => {
              try {
                const { data, error } = await client.storage.from('connect-avatars').createSignedUrl(person.avatar_path!, 3600);
                return !error && data?.signedUrl ? [person.id, callAvatarMediaUrl(data.signedUrl)] as const : null;
              } catch { return null; }
            }));
            return Object.fromEntries(rows.filter((row): row is readonly [string,string] => row !== null));
          }

          export default function ConnectCallAvatar({name, url, className}: {name:string;url?:string|null;className:string}) {
            const [broken, setBroken] = useState(false);
            useEffect(() => { setBroken(false); }, [url]);
            const letter = Array.from(name.trim())[0]?.toLocaleUpperCase('ru-RU') || '?';
            return <span className={className} aria-hidden="true">
              {url && !broken ? <img src={url} alt="" onError={() => setBroken(true)} /> : letter}
            </span>;
          }
          '''
          # Quote the initial directive normally, not with raw-python escapes.
          helper_source = helper_source.replace("\\'use client\\';", "'use client';", 1)
          if helper.exists():
              existing = helper.read_text(encoding='utf-8')
              if existing != helper_source:
                  raise SystemExit('Existing ConnectCallAvatar component differs; refusing overwrite')
          else:
              helper.write_text(helper_source, encoding='utf-8')
              print('Added helper:', helper)

          hub = 'components/ConnectCallsHub.tsx'
          replace_once(hub,
              "import { createClient, type SupabaseClient } from '@supabase/supabase-js';",
              "import { createClient, type SupabaseClient } from '@supabase/supabase-js';\nimport ConnectCallAvatar, { loadCallAvatarUrls } from './ConnectCallAvatar';")
          replace_once(hub,
              'type Profile = { id: string; display_name: string; is_blocked: boolean };',
              'type Profile = { id: string; display_name: string; is_blocked: boolean; avatar_path: string | null };')
          replace_once(hub,
              '  const [names, setNames] = useState<Record<string, string>>({});',
              '  const [names, setNames] = useState<Record<string, string>>({});\n  const [avatarUrls, setAvatarUrls] = useState<Record<string,string>>({});')
          replace_once(hub,
              """    if (ids.length) {
                const people = await client.from('profiles').select('id,display_name').in('id', ids);
                if (generation !== refreshGeneration.current) return;
                if (people.data) setNames(Object.fromEntries((people.data as Profile[]).map(p => [p.id, p.display_name])));
              } else setNames({});""",
              """    if (ids.length) {
                const people = await client.from('profiles').select('id,display_name,avatar_path').in('id', ids);
                if (generation !== refreshGeneration.current) return;
                if (people.data) {
                  const profiles = people.data as Profile[];
                  setNames(Object.fromEntries(profiles.map(p => [p.id, p.display_name])));
                  const photos = await loadCallAvatarUrls(client, profiles);
                  if (generation !== refreshGeneration.current) return;
                  setAvatarUrls(previous => ({...previous, ...photos}));
                }
              } else { setNames({}); setAvatarUrls({}); }""")
          replace_once(hub,
              "client.from('profiles').select('id,display_name,is_blocked').eq('is_blocked', false)",
              "client.from('profiles').select('id,display_name,is_blocked,avatar_path').eq('is_blocked', false)")
          replace_once(hub,
              """        .sort((a, b) => a.peerName.localeCompare(b.peerName, 'ru')));
              } catch {""",
              """        .sort((a, b) => a.peerName.localeCompare(b.peerName, 'ru')));
                const photos = await loadCallAvatarUrls(client, (peopleResult.data || []) as Profile[]);
                setAvatarUrls(previous => ({...previous, ...photos}));
              } catch {""")
          replace_once(hub,
              "<div className=\"connect-call-history-avatar\" aria-hidden=\"true\">{displayName.trim()[0]?.toLocaleUpperCase('ru-RU') || '?'}</div>",
              '<ConnectCallAvatar className="connect-call-history-avatar" name={displayName} url={avatarUrls[peerId]}/>')
          replace_once(hub,
              "<span className=\"connect-call-history-avatar\" aria-hidden=\"true\">{contact.peerName.trim()[0]?.toLocaleUpperCase('ru-RU') || '?'}</span>",
              '<ConnectCallAvatar className="connect-call-history-avatar" name={contact.peerName} url={avatarUrls[contact.peerId]}/>')

          call = 'components/ConnectAudioCalls.tsx'
          replace_once(call,
              "import type { RealtimeChannel, SupabaseClient } from '@supabase/supabase-js';",
              "import type { RealtimeChannel, SupabaseClient } from '@supabase/supabase-js';\nimport ConnectCallAvatar, { loadCallAvatarUrls } from './ConnectCallAvatar';")
          replace_once(call,
              "  const [shownName, setShownName] = useState('');",
              "  const [shownName, setShownName] = useState('');\n  const [shownPeerId, setShownPeerId] = useState<string | null>(null);\n  const [shownAvatarUrl, setShownAvatarUrl] = useState('');")
          replace_once(call,
              """  useEffect(() => {
              // iPhone Safari/PWA generally needs an explicit gesture to unlock audio.""",
              """  // The call modal may open from the chat, the Calls tab, or an incoming call.
            // Resolve its image from the actual peer ID rather than guessing by display name.
            useEffect(() => {
              let active = true;
              setShownAvatarUrl('');
              if (client && shownPeerId) {
                void Promise.resolve(client.from('profiles').select('avatar_path').eq('id', shownPeerId).maybeSingle())
                  .then(async ({data}) => {
                    if (!active || !data?.avatar_path) return;
                    const photos = await loadCallAvatarUrls(client, [{id:shownPeerId, avatar_path:data.avatar_path}]);
                    if (active) setShownAvatarUrl(photos[shownPeerId] || '');
                  }).catch(() => {});
              }
              return () => { active = false; };
            }, [client, shownPeerId]);

            useEffect(() => {
              // iPhone Safari/PWA generally needs an explicit gesture to unlock audio.""")
          replace_once(call,
              "    setShown(null); setPhase('idle'); setElapsed(0); setMuted(false);",
              "    setShown(null); setShownPeerId(null); setShownAvatarUrl(''); setPhase('idle'); setElapsed(0); setMuted(false);")
          replace_once(call,
              "callRef.current = row; setShown(row); setShownName('Собеседник'); setPhase('incoming'); setError('');",
              "callRef.current = row; setShown(row); setShownName('Собеседник'); setShownPeerId(row.caller_id); setPhase('incoming'); setError('');")
          replace_once(call,
              "setShownName(selectedName); setError(''); setToast(''); setPhase('preparing');",
              "setShownName(selectedName); setShownPeerId(selectedPeer); setError(''); setToast(''); setPhase('preparing');")
          replace_once(call,
              '<div className="connect-call-avatar">{initials(shownName)}</div>',
              '<ConnectCallAvatar className="connect-call-avatar" name={shownName || \'Собеседник\'} url={shownAvatarUrl}/>')

          css = 'app/calls.css'
          css_content = Path(css).read_text(encoding='utf-8')
          marker = '/* Connect avatar rings: match selected accent without changing avatar geometry. */'
          if marker not in css_content:
              css_content += '\n' + marker + '''
          .connect-app .person-avatar {
            outline: 2px solid color-mix(in srgb, var(--accent) 77%, transparent) !important;
            outline-offset: 1px !important;
          }
          .connect-app .connect-call-history-avatar {
            box-sizing: border-box !important;
            overflow: hidden !important;
            border: 2px solid color-mix(in srgb, var(--accent) 74%, transparent) !important;
          }
          .connect-app .connect-call-history-avatar img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 50% !important;
          }
          .connect-app .connect-call-avatar {
            box-sizing: border-box !important;
            overflow: hidden !important;
            border: 3px solid color-mix(in srgb, var(--accent) 84%, transparent) !important;
          }
          .connect-app .connect-call-avatar img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 50% !important;
          }
          '''
              Path(css).write_text(css_content, encoding='utf-8')
              print('Added accent ring styles:', css)
          else:
              print('Accent ring styles already exist')

          assert 'connect-call-history-avatar' in Path(hub).read_text(encoding='utf-8')
          assert 'shownPeerId' in Path(call).read_text(encoding='utf-8')
          print('Call avatars patch applied successfully.')
          PYTHON
      - name: Check changes
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit and deploy
        run: |
          git add components/ConnectCallAvatar.tsx components/ConnectCallsHub.tsx components/ConnectAudioCalls.tsx app/calls.css
          if git diff --cached --quiet; then
            echo "Already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: theme rings and actual avatars for calls"
          git push origin HEAD:main
