          root=Path.cwd()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as bundle:
              items={name:bundle.read(name) for name in bundle.namelist()}
          assert all('..' not in Path(name).parts and not name.startswith('/') for name in items)
          current=root/'app/api/connect-neon/messages/route.js'
          assert current.exists()
          previous=current.read_text('utf-8')
          new=items['app/api/connect-neon/messages/route.js'].decode('utf-8')
          if previous!=new:
              assert '// No POST handler until old APKs are compatible with Neon-authoritative writes.' in previous, 'SOURCE_DRIFT: legacy Neon API changed'
              assert 'message_tombstones' in previous, 'SOURCE_DRIFT: missing deletion protection'
          for name,data in items.items():
              if name.startswith('_patch/'):
                  continue
              path=root/name
              if path.exists():
                  if name=='app/api/connect-neon/messages/route.js':
                      path.write_bytes(data)
                  elif path.read_bytes()!=data:
                      raise SystemExit('SOURCE_DRIFT: new Neon release collides with existing source: '+name)
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          # The previous release test asserted the Neon API had no POST route.
          # This assertion must change with the verified write cutover.
          oldtest=root/'tests/connect-neon-live.test.cjs'
          test_src=oldtest.read_text('utf-8')
          old="assert(!/export async function (POST|PUT|PATCH|DELETE)/.test(source));"
          new="assert(/export async function POST/.test(source));"
          if old in test_src:
              assert test_src.count(old)==1
              test_src=test_src.replace(old,new)
              test_src=test_src.replace('messages API reads only, verifies membership and tombstones','messages API reads safely and writes through an authorized Neon function')
              oldtest.write_text(test_src,'utf-8')
          elif new not in test_src:
              raise SystemExit('SOURCE_DRIFT: unexpected previous migration test')
          patched=root/'_connect_neon_apply.py'
          patched.write_bytes(items['_patch/apply.py'])
          try:
              runpy.run_path(str(patched),run_name='__main__')
          finally:
              patched.unlink(missing_ok=True)
          PY
      - name: Check JavaScript and guarded API source
        shell: bash
        run: |
          node --check app/api/connect-neon/messages/route.js
          node --check app/api/connect-neon/message/'[id]'/route.js
          node --check app/api/connect-neon/events/route.js
          node --check app/api/connect-neon/directory/route.js
          node --check lib/connect-neon-mutation.cjs
          node --test tests/connect-neon-consolidated.test.cjs
          node --test tests/connect-neon-live.test.cjs
          git diff --check
      - name: Install exactly matching Chromium used by Connect tests
        run: |
          npx playwright-core install --with-deps chromium
          node -e "const fs=require('fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))process.exit(1)"
      - name: TypeScript and full existing Connect regression suite
        run: |
          npm run typecheck
          npm test
      - name: Production build verification
        run: npm run build
      - name: Commit the entire release together only after all checks pass
        shell: bash
        run: |
          git diff --check
          git add app/page.tsx app/api/connect-neon/messages/route.js app/api/connect-neon/message/'[id]'/route.js \
            app/api/connect-neon/events/route.js app/api/connect-neon/directory/route.js \
            lib/connect-neon-mutation.cjs lib/connect-neon-text-client.ts \
            tests/connect-neon-live.test.cjs tests/connect-neon-consolidated.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Unified Neon integration already installed'
            exit 0
          fi
          git config user.name 'Connect Neon CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect: Neon authoritative text with legacy compatibility and rollback'
          git push origin HEAD:main
