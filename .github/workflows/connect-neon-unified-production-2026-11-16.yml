name: Connect Neon - unified production text migration

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/connect-neon-unified-production.yml

permissions:
  contents: write

concurrency:
  group: connect-neon-unified-production
  cancel-in-progress: false

jobs:
  release:
    name: Build and release one complete Neon text integration
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout the currently deployed Connect main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require the known Connect PWA repository structure
        shell: bash
        run: |
          test "$(git branch --show-current)" = main
          test -s AGENTS.md
          test -s app/page.tsx
          test -s lib/connect-neon-live-session.cjs
          test -s app/api/connect-neon/messages/route.js
          test -s tests/connect-neon-live.test.cjs
          test -s package-lock.json
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
