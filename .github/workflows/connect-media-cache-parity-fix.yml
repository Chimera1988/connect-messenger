name: Connect — Cache and Thumbnail Parity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-media-parity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  synchronize-media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the current repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Guard exact repository and clean baseline
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            Chimera1988/connect-messenger|Chimera1988/connect-android) ;;
            *) echo 'Wrong Connect repository' >&2; exit 1;;
          esac
          git status --short

      - name: Apply guarded source updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import os, re
          
          repo = os.environ.get('GITHUB_REPOSITORY','').lower()
          android = repo.endswith('/connect-android')
          pwa = repo.endswith('/connect-messenger')
          if not (android or pwa):
              raise RuntimeError('Run only in Chimera1988/connect-messenger or Chimera1988/connect-android')
          base = Path('native/web') if android else Path('.')
          changed=[]
          
          def read(path):
              p=Path(path)
              if not p.exists(): raise RuntimeError('Missing required source: '+str(p))
              return p.read_text(encoding='utf8')
          
          def write(path,content):
              p=Path(path); previous=p.read_text(encoding='utf8') if p.exists() else None
              if content==previous: return
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf8')
              changed.append(str(p))
          
          def one(src,old,new,description):
              n=src.count(old)
              if n!=1: raise RuntimeError(f'{description}: expected exactly one match, found {n}')
              return src.replace(old,new,1)
          
          def sub_one(src,pattern,new,description,flags=0):
              changed,n=re.subn(pattern,lambda m:new,src,count=1,flags=flags)
              if n!=1: raise RuntimeError(f'{description}: expected exactly one regex match, found {n}')
              return changed
          
          # Shared chat poster path: same IndexedDB key as the uploaded JPEG, not an expiring signed URL.
          page=str(base/'app/page.tsx')
          s=read(page)
          if pwa:
              s=one(s,"import {mediaIdentity, resolveCachedMedia, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",
                "import {mediaIdentity, mediaCacheOwner, resolveCachedMedia, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",'poster: PWA import')
              cache='lib/media-cache.ts'; c=read(cache)
              c=one(c,"let owner = '';","let owner = '';\n/** IDB entries and signed URLs are scoped to the current viewer. */\nexport function mediaCacheOwner(){return owner;}",'poster: cache owner')
              write(cache,c)
          else:
              s=one(s,"import {mediaIdentity, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",
                "import {mediaIdentity, mediaCacheOwner, installMediaCache, clearCachedMedia, linkMessageMedia, purgeDeletedMedia} from '../lib/media-cache';",'poster: Android web owner import')
          poster_function = '''/** Share one stable IndexedDB-backed JPEG poster across videos, albums and video notes. */
          async function cachedChatPoster(path:string):Promise<string|null>{
            if(!supabase||!path)return null;
            const viewer=mediaCacheOwner();
            const identity='/storage/v1/object/sign/connect-attachments/'+path+'__poster.jpg';
            if(viewer){
              const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
              if(local.startsWith('blob:'))return local;
            }
            const {data,error}=await supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600);
            if(error||!data?.signedUrl)return null;
            const signed=mediaUrl(data.signedUrl);
            if(viewer)void prefetchCachedMedia(signed,viewer);
            return signed;
          }
          
          '''
          if android:
              # The Android web shell already provides a user-isolated resolver.
              poster_function=poster_function.replace("const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);\n    if(local.startsWith('blob:'))return local;",
                  "const local=await resolveCachedStorageFile(viewer,'connect-attachments',path+'__poster.jpg').catch(()=>null);\n    if(local)return local;")
              poster_function=poster_function.replace("  const identity='/storage/v1/object/sign/connect-attachments/'+path+'__poster.jpg';\n",'')
          s=one(s,'function VideoThumbnail({src,path}:{src:string;path?:string}) {',poster_function+'function VideoThumbnail({src,path}:{src:string;path?:string}) {','poster helper placement')
          s=one(s,"    void supabase.storage.from('connect-attachments').createSignedUrl(path + '__poster.jpg', 3600)\n      .then(({data,error}) => {\n        if (!cancelled) {if(!error&&data?.signedUrl)setUploadedPoster(mediaUrl(data.signedUrl));setPosterChecked(true);}\n      }).catch(() => {if(!cancelled)setPosterChecked(true);});",
                 "    void cachedChatPoster(path).then(url=>{if(!cancelled){setUploadedPoster(url);setPosterChecked(true);}})\n      .catch(()=>{if(!cancelled)setPosterChecked(true);});",'poster: album frame')
          s=one(s,"    void supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600)\n      .then(({data,error:requestError})=>{\n        if(!cancelled&&!requestError&&data?.signedUrl)setPoster(mediaUrl(data.signedUrl));\n      }).catch(()=>{});",
                 "    void cachedChatPoster(path).then(url=>{if(!cancelled)setPoster(url);}).catch(()=>{});",'poster: inline video')
          s=one(s,"    if(supabase)void supabase.storage.from('connect-attachments').createSignedUrl(path+'__poster.jpg',3600)\n      .then(({data,error})=>{if(alive&&!error&&data?.signedUrl)setPoster(mediaUrl(data.signedUrl));}).catch(()=>{});",
                 "    if(supabase)void cachedChatPoster(path).then(url=>{if(alive)setPoster(url||undefined);}).catch(()=>{});",'poster: video note')
          
          # Retry a missing/expired WebP thumb twice after a delay, then show its original.
          s=one(s,'  const photoPreviewRequests=useRef(new Set<string>());', '''  const photoPreviewRequests=useRef(new Set<string>());
            const photoPreviewAttempts=useRef(new Map<string,number>());
            const photoPreviewRetryTimers=useRef(new Map<string,number>());
            const [photoPreviewRetry,setPhotoPreviewRetry]=useState(0);
            function retryPhotoPreview(path:string){
              photoPreviewRequests.current.delete(path);
              if((photoPreviewAttempts.current.get(path)||0)>=3||photoPreviewRetryTimers.current.has(path))return;
              const timer=window.setTimeout(()=>{
                photoPreviewRetryTimers.current.delete(path);
                setPhotoPreviewRetry(value=>value+1);
              },10000);
              photoPreviewRetryTimers.current.set(path,timer);
            }''','thumbnail retries: refs')
          s=one(s,'  const failedPhotoPreview=(path:string)=>setPhotoPreviews(prev=>({...prev,[path]:null}));',
          '''  const failedPhotoPreview=(path:string)=>{
              setPhotoPreviews(prev=>({...prev,[path]:null}));
              retryPhotoPreview(path);
            };''','thumbnail retry on img error')
          s=one(s,']).filter(supportsPhotoPreview))].filter(path=>!photoPreviewRequests.current.has(path));',
          ''']).filter(supportsPhotoPreview))].filter(path=>
                !photoPreviewRequests.current.has(path)&&!photoPreviewRetryTimers.current.has(path)&&
                (photoPreviewAttempts.current.get(path)||0)<3);''','thumbnail requests bounded')
          s=one(s,'    paths.forEach(path=>photoPreviewRequests.current.add(path));',
          '''    paths.forEach(path=>{
                photoPreviewRequests.current.add(path);
                photoPreviewAttempts.current.set(path,(photoPreviewAttempts.current.get(path)||0)+1);
              });''','thumbnail attempts')
          if pwa:
              old='''        const previewPath=photoPreviewPath(path),identity='/storage/v1/object/sign/connect-attachments/'+previewPath;
                  const local=await resolveCachedMedia(identity,owner);
                  if(local.startsWith('blob:'))return {path,url:local};
                  const {data,error}=await supabase!.storage.from('connect-attachments').createSignedUrl(previewPath,3600);
                  return {path,url:!error&&data?.signedUrl?mediaUrl(data.signedUrl):null};'''
              new='''        const previewPath=photoPreviewPath(path),identity='/storage/v1/object/sign/connect-attachments/'+previewPath;
                  const local=await resolveCachedMedia(identity,owner);
                  if(local.startsWith('blob:'))return {path,url:local};
                  const {data,error}=await supabase!.storage.from('connect-attachments').createSignedUrl(previewPath,3600);
                  if(error||!data?.signedUrl)return {path,url:null};
                  const signed=mediaUrl(data.signedUrl);
                  void prefetchCachedMedia(signed,owner);
                  return {path,url:signed};'''
          else:
              old='''      try{const {data,error}=await supabase!.storage.from('connect-attachments').createSignedUrl(photoPreviewPath(path),3600);
                  return {path,url:!error&&data?.signedUrl?mediaUrl(data.signedUrl):null};'''
              new='''      try{
                  const local=await resolveCachedStorageFile(owner,'connect-attachments',photoPreviewPath(path));
                  if(local)return {path,url:local};
                  const {data,error}=await supabase!.storage.from('connect-attachments').createSignedUrl(photoPreviewPath(path),3600);
                  if(error||!data?.signedUrl)return {path,url:null};
                  const signed=mediaUrl(data.signedUrl);void prefetchCachedMedia(signed,owner);
                  return {path,url:signed};'''
          s=one(s,old,new,'thumbnail cached/signed lookup')
          s=one(s,
          "    })).then(items=>{if(activePreviewUser.current===owner)setPhotoPreviews(prev=>{const next={...prev};for(const item of items)next[item.path]=item.url;return next;});});",
          "    })).then(items=>{if(activePreviewUser.current===owner){setPhotoPreviews(prev=>{const next={...prev};for(const item of items)next[item.path]=item.url;return next;});for(const item of items)if(!item.url)retryPhotoPreview(item.path);}});",
            'thumbnail signed failure recovery')
          s=one(s,'  },[messages,activeChat,user?.id]);\n  useEffect(()=>{photoPreviewRequests.current.clear();setPhotoPreviews({});},[user?.id]);',
          '''  },[messages,activeChat,user?.id,photoPreviewRetry]);
            useEffect(()=>{
              photoPreviewRequests.current.clear();photoPreviewAttempts.current.clear();
              for(const timer of photoPreviewRetryTimers.current.values())window.clearTimeout(timer);
