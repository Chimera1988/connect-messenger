            },[user?.id]);
            useEffect(()=>{
              const online=()=>{photoPreviewRequests.current.clear();photoPreviewAttempts.current.clear();setPhotoPreviewRetry(v=>v+1);};
              window.addEventListener('online',online);return()=>window.removeEventListener('online',online);
