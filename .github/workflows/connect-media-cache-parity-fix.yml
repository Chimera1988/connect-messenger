      - name: Setup Node for source verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PWA TypeScript and production build
        if: github.repository == 'Chimera1988/connect-messenger'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build

      - name: Check embedded Android UI and native source types — no APK build
        if: github.repository == 'Chimera1988/connect-android'
        shell: bash
        run: |
          set -euo pipefail
          cd native
          npm ci
          npm run typecheck:web
          npm run typecheck
          npm run build:web

      - name: Commit source only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger' ]; then
            git add -- app/page.tsx app/profile-media.css lib/media-cache.ts lib/profile-media-index.ts lib/profile-thumbnails.ts components/ConnectProfileMedia.tsx
          else
            git add -- native/web/app/page.tsx native/web/app/profile-media.css native/web/lib/profile-media-index.ts native/web/lib/profile-thumbnails.ts native/web/components/ConnectProfileMedia.tsx native/src/nativeMediaPreview.ts native/src/ConnectNativeChat.tsx native/src/nativeMediaUtils.ts
          fi
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix media thumbnail/cache parity across Connect clients [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
