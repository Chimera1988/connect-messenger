          # Profile miniatures: a separate persistent, lightweight WebP/JPEG beside the original.
          profile_path=str(base/'lib/profile-thumbnails.ts')
          if Path(profile_path).exists():raise RuntimeError('Unexpected existing profile-thumbnails module; review required')
