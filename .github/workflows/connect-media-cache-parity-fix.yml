                      attachment_kind:path?m.attachment_kind:null,
                    });
                    if(error)throw error;
                    count++;
                  }catch(error){
                    if(copiedPaths.length)await bucket.remove(copiedPaths).catch(()=>{});
                    throw error;
                  }
                }'''
              block=block[:start_loop]+loop+block[end_loop:]
