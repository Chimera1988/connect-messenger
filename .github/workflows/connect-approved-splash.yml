name: Install Connect approved splash screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-approved-splash.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install approved loading screen assets
        shell: bash
        run: |
          mkdir -p components app
          cat > components/ConnectSplashScreen.tsx <<'CONNECT_SPLASH_TSX'
          'use client';
          
          import { useEffect, useState } from 'react';
          
          const BRAND = 'Connect'.split('');
          
          type Props = {
            ready: boolean;
            onComplete: () => void;
          };
          
          /**
           * The letters are the only loading indicator: the final "t" is revealed only
           * after the initial session and chat directory have finished loading.
           */
          export default function ConnectSplashScreen({ ready, onComplete }: Props) {
            const [letters, setLetters] = useState(0);
            const [leaving, setLeaving] = useState(false);
          
            useEffect(() => {
              if (letters >= BRAND.length - 1) return;
              const timer = window.setTimeout(() => setLetters(letters + 1), 200);
              return () => window.clearTimeout(timer);
            }, [letters]);
          
            useEffect(() => {
              if (!ready || letters !== BRAND.length - 1) return;
              const timer = window.setTimeout(() => setLetters(BRAND.length), 200);
              return () => window.clearTimeout(timer);
            }, [ready, letters]);
          
            useEffect(() => {
              if (!ready || letters !== BRAND.length) return;
              const fade = window.setTimeout(() => setLeaving(true), 300);
              const done = window.setTimeout(onComplete, 750);
              return () => {
                window.clearTimeout(fade);
                window.clearTimeout(done);
              };
            }, [ready, letters, onComplete]);
          
            // Network failures must not leave a permanent overlay in front of login.
            useEffect(() => {
              const timeout = window.setTimeout(onComplete, 12000);
              return () => window.clearTimeout(timeout);
            }, [onComplete]);
          
            return (
              <div className={'connect-splash' + (leaving ? ' connect-splash--leaving' : '')}
                role="status" aria-label="Загрузка Connect">
                <svg className="connect-splash__waves" viewBox="0 0 430 900"
                  preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                  <defs>
                    <linearGradient id="splashUpper" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stopColor="#15b5ff" stopOpacity=".85"/>
                      <stop offset=".5" stopColor="#0067e8" stopOpacity=".63"/>
                      <stop offset="1" stopColor="#053ebd" stopOpacity=".08"/>
                    </linearGradient>
                    <linearGradient id="splashLower" x1="0" y1="0" x2=".7" y2="1">
                      <stop offset="0" stopColor="#009aff" stopOpacity=".15"/>
                      <stop offset=".43" stopColor="#078bfa" stopOpacity=".78"/>
                      <stop offset="1" stopColor="#063bc4" stopOpacity=".7"/>
                    </linearGradient>
                    <linearGradient id="splashEdge" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0" stopColor="#3caefb" stopOpacity=".04"/>
                      <stop offset=".42" stopColor="#69ecff" stopOpacity=".9"/>
                      <stop offset="1" stopColor="#27a9ff" stopOpacity=".12"/>
                    </linearGradient>
                  </defs>
                  <g className="connect-splash__upper-wave">
                    <path d="M-80 250 C80 265 181 199 285 116 S438 43 520 -18 L520 -90 L-80 -90Z"
                      fill="url(#splashUpper)"/>
                    <path d="M-80 250 C80 265 181 199 285 116 S438 43 520 -18"
                      fill="none" stroke="url(#splashEdge)" strokeWidth="2"/>
                    <path d="M-90 305 C100 245 191 213 317 163 S450 110 520 97"
                      fill="none" stroke="#48a6fe" strokeWidth="1" strokeOpacity=".27"/>
                  </g>
                  <g className="connect-splash__lower-wave">
                    <path d="M-80 676 C79 787 153 751 260 677 S418 587 530 601 L530 990 L-80 990Z"
                      fill="url(#splashLower)" opacity=".95"/>
                    <path d="M-80 676 C79 787 153 751 260 677 S418 587 530 601"
                      fill="none" stroke="url(#splashEdge)" strokeWidth="2.4"/>
                    <path d="M-100 754 C87 823 169 767 264 717 S436 687 540 651"
                      fill="none" stroke="#41aaff" strokeOpacity=".6" strokeWidth="2"/>
                    <path d="M-100 809 C75 883 193 794 300 763 S424 738 536 722"
                      fill="none" stroke="#288afe" strokeOpacity=".25" strokeWidth="1"/>
                  </g>
                </svg>
                <div className="connect-splash__center">
                  <svg className="connect-splash__icon" viewBox="0 0 300 300" aria-hidden="true">
                    <defs>
                      <linearGradient id="connectSplashBlue" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stopColor="#059fff"/>
                        <stop offset=".53" stopColor="#0075fb"/>
                        <stop offset="1" stopColor="#004cf2"/>
                      </linearGradient>
                      <linearGradient id="connectSplashWhite" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stopColor="#ffffff"/>
                        <stop offset="1" stopColor="#e7edff"/>
                      </linearGradient>
                      <filter id="connectSplashShadow" x="-30%" y="-30%" width="160%" height="170%">
                        <feDropShadow dx="0" dy="8" stdDeviation="8" floodColor="#002b94" floodOpacity=".28"/>
                      </filter>
                    </defs>
                    <rect width="300" height="300" rx="70" fill="url(#connectSplashBlue)"/>
                    <g filter="url(#connectSplashShadow)">
                      <path d="M116 111 C73 111 40 140 40 177 C40 199 53 218 71 229
                        L65 253 Q63 261 72 256 L100 239
                        Q109 241 119 241 C166 241 198 213 198 176
                        C198 139 165 111 116 111Z" fill="url(#connectSplashWhite)"/>
                      <path d="M180 54 C122 54 83 86 83 132 C83 178 123 208 181 208
                        Q199 208 213 202 L244 220 Q253 225 250 214 L245 187
                        Q272 166 272 132 C272 86 232 54 180 54Z"
                        fill="url(#connectSplashWhite)"/>
                      <circle cx="137" cy="131" r="9" fill="#0566ec"/>
                      <circle cx="179" cy="131" r="9" fill="#0566ec"/>
                      <circle cx="221" cy="131" r="9" fill="#0566ec"/>
                    </g>
                  </svg>
                  <div className="connect-splash__word" aria-hidden="true">
                    {BRAND.map((character, index) => (
                      <span key={index}
                        className={'connect-splash__letter' + (index < letters ? ' is-visible' : '')}>
                        {character}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            );
          }
          CONNECT_SPLASH_TSX
          cat > app/connect-splash.css <<'CONNECT_SPLASH_CSS'
          /* Connect approved launch design: original blue, waves, white logo, letter progress. */
          .connect-splash {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            overflow: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            background:
              radial-gradient(90% 75% at 0% 10%, #075ff1 0%, transparent 66%),
              radial-gradient(100% 90% at 110% 105%, #0758d5 0%, transparent 73%),
              linear-gradient(157deg, #073ab7 0%, #052b9c 43%, #041e78 100%);
            color: #fff;
            isolation: isolate;
            opacity: 1;
            transition: opacity 420ms ease;
            -webkit-font-smoothing: antialiased;
            pointer-events: all;
          }
          .connect-splash--leaving { opacity: 0; pointer-events: none; }
          .connect-splash__waves {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
          }
          .connect-splash__upper-wave,
          .connect-splash__lower-wave {
            transform-origin: center;
            animation: connect-splash-wave-drift 9s ease-in-out infinite alternate;
          }
          .connect-splash__lower-wave { animation-duration: 12s; animation-direction: alternate-reverse; }
          .connect-splash__center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transform: translateY(-2.8%);
            padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
          }
          .connect-splash__icon {
            display: block;
            width: min(60vw, 270px);
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 22px rgba(0, 13, 95, .23));
          }
          .connect-splash__word {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            margin-top: 17px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-size: clamp(37px, 9.3vw, 55px);
            font-weight: 750;
            line-height: 1.12;
            letter-spacing: -.045em;
            text-shadow: 0 2px 8px rgba(9, 39, 122, .09);
            user-select: none;
          }
          .connect-splash__letter {
            color: rgba(222, 235, 255, .18);
            opacity: .36;
            transform: translateY(5px);
            transition: color 260ms ease, opacity 260ms ease, transform 260ms ease;
          }
          .connect-splash__letter.is-visible {
            color: #fff;
            opacity: 1;
            transform: translateY(0);
          }
          @keyframes connect-splash-wave-drift {
            from { transform: translate3d(-2%, 0, 0) scale(1.01); }
            to { transform: translate3d(2%, -0.6%, 0) scale(1.035); }
          }
          @media (max-height: 570px) {
            .connect-splash__icon { width: min(35vh, 230px); }
            .connect-splash__word { font-size: clamp(27px, 7vw, 46px); margin-top: 9px; }
          }
          @media (prefers-reduced-motion: reduce) {
            .connect-splash__upper-wave,
            .connect-splash__lower-wave { animation: none; }
            .connect-splash__letter { transition: none; transform: none; }
            .connect-splash { transition-duration: 100ms; }
          }
          CONNECT_SPLASH_CSS
      - name: Integrate with the initial session and chat load
        shell: bash
        run: |
          cat > /tmp/apply_connect_splash.py <<'CONNECT_SPLASH_PATCH'
          from pathlib import Path
          
          
          def replace_once(source, old, new, description):
              if old not in source:
                  raise SystemExit(f'Cannot find {description}: project changed, no patch applied.')
              return source.replace(old, new, 1)
          
          page = Path('app/page.tsx')
          s = page.read_text(encoding='utf-8')
          if 'import ConnectSplashScreen from' not in s:
              s = replace_once(s,
                  "import ConnectNotificationSettings from '../components/ConnectNotificationSettings';",
                  "import ConnectNotificationSettings from '../components/ConnectNotificationSettings';\nimport ConnectSplashScreen from '../components/ConnectSplashScreen';",
                  'initial imports')
          if 'const [splashVisible, setSplashVisible]' not in s:
              s = replace_once(s,
                  '  const [loading, setLoading] = useState(true);',
                  '  const [loading, setLoading] = useState(true);\n'
                  '  const [splashVisible, setSplashVisible] = useState(true);\n'
                  '  const [directoryReady, setDirectoryReady] = useState(false);\n'
                  '  const finishSplash = useCallback(() => setSplashVisible(false), []);',
                  'initial loading state')
          if 'setDirectoryReady(false);' not in s:
              s = replace_once(s,
                  "  useEffect(() => {\n    if (!supabase) { setLoading(false); return; }",
                  "  useEffect(() => { setDirectoryReady(false); }, [user?.id]);\n\n"
                  "  useEffect(() => {\n    if (!supabase) { setLoading(false); return; }",
                  'session effect')
          if '    setDirectoryReady(true);' not in s:
              s = replace_once(s,
                  '    if (c.error) setNotice(c.error.message); else setConversations((c.data || []) as Conversation[]);',
                  '    if (c.error) setNotice(c.error.message); else setConversations((c.data || []) as Conversation[]);\n'
                  '    setDirectoryReady(true);',
                  'initial directory completion')
          if 'splashVisible && <ConnectSplashScreen' not in s:
              s = replace_once(s,
                  "    {!supabase ? <div className=\"connection-error\">",
                  "    {splashVisible && <ConnectSplashScreen ready={!loading && (!user || directoryReady)} onComplete={finishSplash}/>}\n"
                  "    {!supabase ? <div className=\"connection-error\">",
                  'root app view')
          page.write_text(s, encoding='utf-8')
          
          layout = Path('app/layout.tsx')
          s = layout.read_text(encoding='utf-8')
          if "import './connect-splash.css';" not in s:
              s = replace_once(s, "import './music-system.css';", "import './music-system.css';\nimport './connect-splash.css';", 'layout css imports')
          layout.write_text(s, encoding='utf-8')
          print('Connect loading overlay integrated into Next.js app.')
          CONNECT_SPLASH_PATCH
          python3 /tmp/apply_connect_splash.py
      - name: Check diff formatting
        run: git diff --check
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Commit splash screen files to main
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx app/connect-splash.css app/page.tsx app/layout.tsx
          if git diff --cached --quiet; then
            echo 'Splash screen already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add approved Connect splash with letter progress'
          git push origin HEAD:main
