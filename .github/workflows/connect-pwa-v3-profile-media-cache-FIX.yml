name: Connect PWA 3.0 - Instant Profile Media (FIX Chromium)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-v3-profile-media-cache-FIX.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-v3-profile-media-cache
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Connect PWA main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply PWA 3.0 media-library upgrade
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/connect_profile_v3_patch.py <<'CONNECT_PROFILE_PY'
          from pathlib import Path
          import json
          from textwrap import dedent

          ROOT = Path.cwd()
          STAMP = 'CONNECT_PROFILE_MEDIA_INSTANT_CACHE_V3_20261111'
          PAGE = ROOT / 'app/page.tsx'
          PROFILE = ROOT / 'components/ConnectProfileMedia.tsx'
          MEDIA = ROOT / 'lib/media-cache.ts'
          MUSIC = ROOT / 'components/ConnectMusicSystem.tsx'
          INDEX = ROOT / 'lib/profile-media-index.ts'

          package = json.loads((ROOT/'package.json').read_text('utf-8'))
          if package.get('version') != '3.0.0':
              raise RuntimeError('Connect PWA must be version 3.0.0; refusing to patch a different baseline')
          if STAMP in PROFILE.read_text('utf-8'):
              print('Profile media cache update already installed; idempotent no-op')
              raise SystemExit(0)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one exact match; got {count}')
              print('PATCH', label)
              return text.replace(old, new, 1)

          index = r'''/** Persistent profile media catalog. Per-viewer namespace, metadata only.
           * Never write temporary signed URLs, credentials, audio blobs or video blobs here.
           * Actual authenticated media bytes use existing connect-media-v1 cache.
           */
          import type { SupabaseClient } from '@supabase/supabase-js';
          export type ProfileLibraryKind = 'photos' | 'videos' | 'music';
          export type ProfileLibraryRow = { path: string; createdAt: string };
          type Catalog = { key: string; viewer: string; owner: string; kind: ProfileLibraryKind; savedAt: number; items: ProfileLibraryRow[] };
          const NAME = 'connect-profile-index-v1';
          const STORE = 'catalogs';
          let opening: Promise<IDBDatabase> | undefined;
          const kinds: readonly ProfileLibraryKind[] = ['photos', 'videos', 'music'];
          const key = (viewer:string,owner:string,kind:ProfileLibraryKind) => viewer+':'+owner+':'+kind;
          function db(): Promise<IDBDatabase> {
            return opening ??= new Promise((resolve,reject) => {
              const request=indexedDB.open(NAME,1);
              request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE,{keyPath:'key'});};
              request.onsuccess=()=>{request.result.onversionchange=()=>{request.result.close();opening=undefined;};resolve(request.result);};
              request.onerror=()=>{opening=undefined;reject(request.error);};
            });
          }
          function operation<T>(mode: IDBTransactionMode, fn:(s:IDBObjectStore)=>IDBRequest<T>):Promise<T> {
            return db().then(database=>new Promise<T>((resolve,reject)=>{
              const tx=database.transaction(STORE,mode), request=fn(tx.objectStore(STORE));
              let value:T;
              request.onsuccess=()=>{value=request.result;};
              tx.oncomplete=()=>resolve(value);
              tx.onerror=()=>reject(tx.error||request.error);
              tx.onabort=()=>reject(tx.error||Error('Profile library IndexedDB aborted'));
            }));
          }
          export async function readProfileLibrary(viewer:string,owner:string,kind:ProfileLibraryKind):Promise<ProfileLibraryRow[]|null> {
            if(!viewer||!owner)return null;
            const row=await operation<Catalog|undefined>('readonly',s=>s.get(key(viewer,owner,kind)));
            if(!row||row.viewer!==viewer||row.owner!==owner||row.kind!==kind||!Array.isArray(row.items))return null;
            const prefix=owner+'/'+kind+'/';
            return row.items.filter(x=>typeof x?.path==='string'&&x.path.startsWith(prefix)&&typeof x.createdAt==='string').slice(0,100);
          }
          export async function writeProfileLibrary(viewer:string,owner:string,kind:ProfileLibraryKind,items:ProfileLibraryRow[]):Promise<void>{
            if(!viewer||!owner)return;
            const prefix=owner+'/'+kind+'/';
            const safe=items.filter(x=>x.path.startsWith(prefix)).slice(0,100).map(x=>({path:x.path,createdAt:x.createdAt}));
            await operation('readwrite',s=>s.put({key:key(viewer,owner,kind),viewer,owner,kind,savedAt:Date.now(),items:safe} satisfies Catalog));
          }
          export async function removeProfileLibraryItem(viewer:string,owner:string,kind:ProfileLibraryKind,path:string):Promise<void>{
            const items=await readProfileLibrary(viewer,owner,kind);
            if(items)await writeProfileLibrary(viewer,owner,kind,items.filter(x=>x.path!==path));
          }
          /** Warm up the three *own* directories while the main screen is idle.
           * Best effort only: Supabase and its access rules remain authoritative.
           */
          export async function warmOwnProfileLibraries(client:SupabaseClient,viewer:string):Promise<void>{
            if(!viewer)return;
            await Promise.all(kinds.map(async kind=>{
              try{
                const {data,error}=await client.storage.from('connect-profile-media').list(viewer+'/'+kind,{
                  limit:100,sortBy:{column:'created_at',order:'desc'}
                });
                if(error)return;
                await writeProfileLibrary(viewer,viewer,kind,(data||[]).filter(row=>row.id&&row.name).map(row=>({
                  path:viewer+'/'+kind+'/'+row.name,createdAt:row.created_at||''
                })));
              }catch{/* Offline: preserve the last catalog. */}
            }));
          }
          '''

          if INDEX.exists():
              raise RuntimeError('lib/profile-media-index.ts already exists unexpectedly; do not overwrite')

          media = MEDIA.read_text('utf-8')
          media += r'''

          /** Look up private profile media bytes using stable storage identity.
           * The catalog never needs an expired signed URL to show locally cached files.
           */
          export async function resolveCachedProfileFile(viewer:string,path:string):Promise<string|null>{
            if(!viewer||!/^[-a-zA-Z0-9_]+\/(?:photos|videos|music)\/[^?#]+$/.test(path))return null;
            const id='connect-profile-media/'+path, key=viewer+':'+id;
            try{
              const row=await run<Entry|undefined>('readonly',store=>store.get(key));
              if(!row||row.user!==viewer)return null;
              const type=contentType(id,row.type||row.blob?.type);
              const blob=row.blob||(row.bytes instanceof ArrayBuffer?new Blob([row.bytes],{type}):undefined);
              if(!blob?.size||!usableType(type))return null;
              let url=objectUrls.get(key);
              if(!url){url=URL.createObjectURL(blob.type===type?blob:blob.slice(0,blob.size,type));objectUrls.set(key,url);}
              return url;
            }catch{return null;}
          }

          /** Stop inflight fills from restoring an item deleted remotely. */
          export async function retireCachedProfileFile(viewer:string,path:string):Promise<void>{
            if(!viewer||owner!==viewer||!/^[-a-zA-Z0-9_]+\/(?:photos|videos|music)\/[^?#]+$/.test(path))return;
            const key=viewer+':connect-profile-media/'+path;
            try{
              const database=await db();
              await new Promise<void>((resolve,reject)=>{
                const tx=database.transaction([STORE,'retired'],'readwrite');
                tx.objectStore('retired').put(true,key);
                tx.objectStore(STORE).delete(key);
                tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
              });
              const local=objectUrls.get(key);
              if(local){restoreUrl(local);objectUrls.delete(key);}
            }catch{/* A failed local purge must not affect remote deletion. */}
          }

          /** On successful owner upload, keep a small original without a second download. */
          export async function cacheUploadedProfileFile(viewer:string,path:string,file:File):Promise<void>{
            if(!viewer||owner!==viewer||!/^[-a-zA-Z0-9_]+\/(?:photos|videos|music)\/[^?#]+$/.test(path))return;
            const id='connect-profile-media/'+path;
            const category=mediaCategory(id,file.type);
            const max=category==='photos'?8*1024**2:category==='audio'?24*1024**2:20*1024**2;
            if(!file.size||file.size>max)return;
            try{
              const bytes=await file.arrayBuffer();
              if(owner!==viewer)return;
              await run('readwrite',s=>s.put({key:viewer+':'+id,user:viewer,category,size:file.size,used:Date.now(),bytes,type:file.type||contentType(id)} satisfies Entry));
              void trimCache().catch(()=>{});
            }catch{/* Storage quota failure is not an upload failure. */}
          }

          /** Load only small photos, audio and short videos in background; full-size media
           * not cached yet can always stream over the existing signed URL.
           */
          export async function prefetchProfileFile(url:string,viewer:string,kind:'photos'|'videos'|'music'):Promise<void>{
            const id=mediaIdentity(url);
            if(!id?.startsWith('connect-profile-media/')||!viewer)return;
            const category=mediaCategory(id);
            if((kind==='photos'&&category!=='photos')||(kind==='music'&&category!=='audio')||(kind==='videos'&&category!=='videos'))return;
            const connection=(navigator as Navigator&{connection?:{saveData?:boolean;effectiveType?:string}}).connection;
            if(connection?.saveData||connection?.effectiveType==='2g')return;
            const max=kind==='photos'?8*1024**2:kind==='music'?24*1024**2:16*1024**2;
            try{await remember(url,viewer,max,true);}catch{/* Network streaming remains available. */}
          }
          '''
          print('PATCH', 'media cache profile helper methods')

          page = PAGE.read_text('utf-8')
          page = replace_once(page,
          "import ConnectProfileMedia, { type ProfileMediaKind } from '../components/ConnectProfileMedia';",
          "import ConnectProfileMedia, { type ProfileMediaKind } from '../components/ConnectProfileMedia';\nimport { warmOwnProfileLibraries } from '../lib/profile-media-index';",
          'page import warmup')
          page = replace_once(page,
          "  useEffect(()=>{if(!user?.id)return;return installMediaCache(user.id, refreshMediaUrl);},[user?.id]);",
          """  useEffect(()=>{if(!user?.id)return;return installMediaCache(user.id, refreshMediaUrl);},[user?.id]);
            // CONNECT_PROFILE_MEDIA_INSTANT_CACHE_V3_20261111
            // Prefetch only library metadata after login, without bulk downloading media.
            useEffect(()=>{
              if(!supabase||!user?.id)return;
              let cancelled=false;
              const timer=window.setTimeout(()=>{
                if(!cancelled&&document.visibilityState==='visible')void warmOwnProfileLibraries(supabase,user.id);
              },1800);
              return()=>{cancelled=true;window.clearTimeout(timer);};
            },[user?.id]);""",
          'page idle warmup')
          page = replace_once(page,
          "client={supabase!} userId={profileView} isOwner={profileView===user.id} kind={profileMediaOpen}",
          "client={supabase!} userId={profileView} viewerId={user.id} isOwner={profileView===user.id} kind={profileMediaOpen}",
          'page viewer scoping')

          profile = PROFILE.read_text('utf-8')
          profile = replace_once(profile,
          "import { ConnectMusicLibrary } from './ConnectMusicSystem';",
          "import { ConnectMusicLibrary } from './ConnectMusicSystem';\nimport { readProfileLibrary, writeProfileLibrary, removeProfileLibraryItem, type ProfileLibraryRow } from '../lib/profile-media-index';\nimport { resolveCachedProfileFile, prefetchProfileFile, cacheUploadedProfileFile, retireCachedProfileFile } from '../lib/media-cache';\n// CONNECT_PROFILE_MEDIA_INSTANT_CACHE_V3_20261111",
          'profile imports')
          profile = replace_once(profile,
          "  userId: string;\n  kind: ProfileMediaKind;",
          "  userId: string;\n  viewerId: string;\n  kind: ProfileMediaKind;",
          'profile viewer prop')
          profile = replace_once(profile,
          "export default function ConnectProfileMedia({ client, userId, kind, onBack, onAvatar, isOwner }: Props) {",
          "export default function ConnectProfileMedia({ client, userId, viewerId, kind, onBack, onAvatar, isOwner }: Props) {",
          'profile viewer injection')
          profile = replace_once(profile,
          "  const inputRef = useRef<HTMLInputElement>(null);",
          "  const inputRef = useRef<HTMLInputElement>(null);\n  const fetchGeneration=useRef(0);\n  const hasDisplayed=useRef(false);",
          'profile generation tracking')
          start=profile.index('  const load = useCallback(async () => {')
          end=profile.index('  async function upload(files: File[]) {',start)
          old=profile[start:end]
          new=r'''  // Display metadata and any downloaded media from IndexedDB first, then
            // reconcile with Supabase. Never store signed URLs in the persistent index.
            const load = useCallback(async (forceServer=false) => {
              const generation=++fetchGeneration.current;
              setError('');
              const makeItem=(entry:ProfileLibraryRow,url:string):MediaItem=>{
                const filename=entry.path.split('/').pop()||'';
                const name=decodeName(filename);
                return {path:entry.path,name,mime:MIME[extension(name)]||'application/octet-stream',url,createdAt:entry.createdAt};
              };
              let previous:ProfileLibraryRow[]|null=null;
              if(!forceServer){
                previous=await readProfileLibrary(viewerId,userId,kind).catch(()=>null);
                if(generation!==fetchGeneration.current)return;
                if(previous){
                  const cached=await Promise.all(previous.map(async entry=>makeItem(entry,await resolveCachedProfileFile(viewerId,entry.path)||'')));
                  if(generation!==fetchGeneration.current)return;
                  setItems(cached);setLoading(false);hasDisplayed.current=true;
                }
              }
              try {
                const {data,error:listError}=await client.storage.from(BUCKET).list(`${userId}/${kind}`,{
                  limit:100,sortBy:{column:'created_at',order:'desc'}
                });
                if(generation!==fetchGeneration.current)return;
                if(listError)throw listError;
                const rows:ProfileLibraryRow[]=(data||[]).filter(row=>row.id&&row.name).map(row=>({
                  path:`${userId}/${kind}/${row.name}`,createdAt:row.created_at||''
                }));
                // One signed-URL batch instead of an individual request per file.
                const signed=new Map<string,string>();
                if(rows.length){
                  const batch=await client.storage.from(BUCKET).createSignedUrls(rows.map(x=>x.path),3600);
                  if(generation!==fetchGeneration.current)return;
                  for(const entry of batch.data||[])if(entry.path&&entry.signedUrl)signed.set(entry.path,playbackUrl(entry.signedUrl));
                  // Best-effort compatibility fallback for storage gateways without bulk signing.
                  if(batch.error||signed.size===0){
                    await Promise.all(rows.map(async entry=>{
                      try{const {data}=await client.storage.from(BUCKET).createSignedUrl(entry.path,3600);
                        if(data?.signedUrl)signed.set(entry.path,playbackUrl(data.signedUrl));
                      }catch{/* Cached file is still available. */}
                    }));
                  }
                }
                if(generation!==fetchGeneration.current)return;
                const fresh=await Promise.all(rows.map(async entry=>makeItem(entry,await resolveCachedProfileFile(viewerId,entry.path)||signed.get(entry.path)||'')));
                if(generation!==fetchGeneration.current)return;
                setItems(fresh);setLoading(false);hasDisplayed.current=true;
                await writeProfileLibrary(viewerId,userId,kind,rows).catch(()=>{});
                // Do not treat the 100-item page limit as proof that older items were deleted.
                if(previous&&rows.length<100){
                  const current=new Set(rows.map(x=>x.path));
                  for(const deleted of previous.filter(x=>!current.has(x.path))){
                    void retireCachedProfileFile(viewerId,deleted.path);
                  }
                }
                // Limited background warmup, low priority. The global cache already has
                // a three-request worker pool and enforces the user's storage limit.
                const connection=(navigator as Navigator&{connection?:{saveData?:boolean;effectiveType?:string}}).connection;
                if(!connection?.saveData&&connection?.effectiveType!=='2g'){
                  const count=kind==='photos'?12:kind==='music'?3:2;
                  for(const entry of rows.slice(0,count)){
                    const url=signed.get(entry.path);
                    if(url)void prefetchProfileFile(url,viewerId,kind);
                  }
                }
              }catch(err){
                if(generation===fetchGeneration.current){
                  setLoading(false);
                  setError((hasDisplayed.current?'Не удалось обновить медиатеку, показана локальная копия: ':'Не удалось открыть медиатеку: ')+(err instanceof Error?err.message:String(err)));
                }
              }
            },[client,userId,viewerId,kind]);

            useEffect(()=>{
              void load();
              const visible=()=>{if(document.visibilityState==='visible')void load(true);};
              document.addEventListener('visibilitychange',visible);
              return()=>{fetchGeneration.current++;document.removeEventListener('visibilitychange',visible);};
            },[load]);

          '''
          profile=profile[:start]+new+profile[end:]
          print('PATCH', 'profile IndexedDB-first loading + signed URL batch + bounded prefetch')
          profile=replace_once(profile,
          "        completed++;",
          "        await cacheUploadedProfileFile(viewerId,path,file);\n        completed++;",
          'profile owner upload seeding')
          profile=replace_once(profile,
          "      setNotice(completed === 1 ? 'Файл добавлен.' : `Загружено файлов: ${completed}.`);",
          "      setNotice(completed === 1 ? 'Файл добавлен.' : `Загружено файлов: ${completed}.`);",
          'profile upload guard')
          profile=replace_once(profile,
          "    } finally {\n      setBusy(false); setUploadProgress(null); await load();\n    }",
          "    } finally {\n      setBusy(false); setUploadProgress(null); await load(true);\n    }",
          'profile post-upload refresh')
          profile=replace_once(profile,
          "      if (preview?.path === item.path) setPreview(null);\n      setNotice('Файл удалён.');",
          """      if (preview?.path === item.path) setPreview(null);
                fetchGeneration.current++;
                setItems(prev=>prev.filter(row=>row.path!==item.path));
                await removeProfileLibraryItem(viewerId,userId,kind,item.path).catch(()=>{});
                await retireCachedProfileFile(viewerId,item.path);
                setNotice('Файл удалён.');""",
          'profile file deletion invalidates cache')
          profile=replace_once(profile,
          "    finally { setBusy(false); await load(); }",
          "    finally { setBusy(false); await load(true); }",
          'profile post-delete refresh')
          profile=replace_once(profile,
          "{loading ? <div className=\"connect-profile-media-empty\">Загружаем медиатеку…</div> : items.length === 0 ?",
          "{loading && items.length===0 ? <div className=\"connect-profile-media-empty\">Загружаем медиатеку…</div> : items.length === 0 ?",
          'profile no empty flicker when cached')
          profile=replace_once(profile,
          "<img loading=\"lazy\" src={item.url} alt={item.name}/>",
          "{item.url ? <img loading=\"lazy\" src={item.url} alt={item.name}/> : <span aria-hidden=\"true\" style={{fontSize:26}}>▧</span>}",
          'profile photo offline placeholder')
          profile=replace_once(profile,
          "<video src={item.url} preload=\"metadata\" playsInline muted tabIndex={-1}/><span aria-hidden=\"true\">▶</span>",
          "{item.url && <video src={item.url} preload=\"none\" playsInline muted tabIndex={-1}/>}<span aria-hidden=\"true\">▶</span>",
          'profile videos avoid mass metadata loading')
          profile=replace_once(profile,
          "src={preview.url} playsInline controls preload=\"metadata\"",
          "src={preview.url||undefined} playsInline controls preload=\"metadata\"",
          'profile offline video src')

          # A music catalog can contain names before their signed URLs arrive. Do not
          # select an inaccessible file, and refresh a paused player when URLs rotate.
          music=MUSIC.read_text('utf-8')
          music=replace_once(music,
          "const chosen=(saved?.ownerId===id && list.some(s=>s.path===saved.path)) ? saved.path : (list[0]?.path||null);",
          "const chosen=(saved?.ownerId===id && list.some(s=>s.path===saved.path && !!s.url)) ? saved.path : (list.find(s=>!!s.url)?.path||null);",
          'music playlist choose playable song')
          music=replace_once(music,
          """      if(audio){ audio.pause();audio.src=list.find(s=>s.path===chosen)?.url||'';audio.load(); }
              }
            },[]);""",
          """      if(audio){
                  audio.pause();
                  const url=list.find(s=>s.path===chosen)?.url;
                  if(url)audio.src=url;else audio.removeAttribute('src');
                  audio.load();
                }
              }else{
                const next=list.find(s=>s.path===old)?.url;
                const audio=audioRef.current;
                if(audio?.paused && next && audio.src!==next){audio.src=next;audio.load();}
              }
            },[]);""",
          'music player updates paused source when signed links or cache arrive')
          music=replace_once(music,
          '<button type="button" className="connect-minimal-track-main" onClick={()=>music.select(song)}>',
          '<button type="button" className="connect-minimal-track-main" disabled={!song.url} onClick={()=>music.select(song)}>',
          'music unavailable track disabled')
          music=replace_once(music,
          '<small>Трек {i+1}</small>',
          "<small>{song.url?`Трек ${i+1}`:'Файл пока не доступен локально'}</small>",
          'music catalog while offline label')


          INDEX.parent.mkdir(parents=True,exist_ok=True)
          INDEX.write_text(index,encoding='utf-8')
          MEDIA.write_text(media,encoding='utf-8')
          PROFILE.write_text(profile,encoding='utf-8')
          MUSIC.write_text(music,encoding='utf-8')
          PAGE.write_text(page,encoding='utf-8')
          print('Ready: Connect PWA 3.0 media-library instant cache (photo/video/music)')
          CONNECT_PROFILE_PY
          python3 /tmp/connect_profile_v3_patch.py
          git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright browser tests
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
      - name: Validate TypeScript, existing tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit the one-shot PWA upgrade
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx components/ConnectProfileMedia.tsx components/ConnectMusicSystem.tsx lib/media-cache.ts lib/profile-media-index.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA 3.0: instant photo video music library cache'
            git push origin HEAD:main
          fi
