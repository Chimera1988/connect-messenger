name: Apply Android 1.3.2 PWA audio and counters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-1-3-2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded PWA patches
        run: python3 scripts/apply_android_1_3_2.py
      - name: Validate diff
        run: git diff --check
      - name: Commit PWA updates
        run: |
          git config user.name 'Connect updater'
          git config user.email 'actions@users.noreply.github.com'
          git add components/ConnectAudioCalls.tsx components/ConnectCallsHub.tsx app/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: native Android ringtone and subtle unread counters'
            git push
          else
            echo 'Already up to date'
          fi
