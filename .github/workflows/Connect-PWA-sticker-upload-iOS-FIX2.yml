name: Connect PWA | Sticker JPG PNG picker iOS FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-sticker-picker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sticker-picker:
    name: Repair Safari picker, test, and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Connect PWA checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s app/page.tsx
          test -s app/globals.css
          test -s lib/sticker-webp.ts
          test -s tests/sticker-webp.test.cjs
      - name: Apply guarded native sticker picker fix
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sticker_picker_patch.py" <<'CONNECT_STICKER_IOS_PATCH'
          #!/usr/bin/env python3
          """Targeted iOS Safari sticker picker repair; strictly guard all source edits."""
          from pathlib import Path

          page_path=Path('app/page.tsx')
          css_path=Path('app/globals.css')
          assert page_path.is_file() and css_path.is_file(), 'Connect PWA source files not found'
          page=page_path.read_text(encoding='utf8')
          css=css_path.read_text(encoding='utf8')
          MARK='CONNECT_PWA_STICKER_PICKER_IOS_FIX_20261115'

          def once(s, old, new, label):
              n=s.count(old)
              if n!=1:raise RuntimeError(f'SOURCE DRIFT ({label}): found {n}, expected 1')
              return s.replace(old,new,1)

          if MARK in page:
              assert 'connect-sticker-upload-input' in page
              assert "uploadCustomStickers(p.id,selected)" in page
              assert 'setTimeout(()=>document.getElementById(\'connect-sticker-upload\')' not in page
              print('iOS sticker picker fix already present; no source changes needed')
          else:
              assert 'CONNECT_PWA_STICKER_WEBP_EDITOR_20261115' in page, 'WebP/JPG editor upgrade not present: run original sticker workflow first'

              page=once(page,
                "  async function uploadCustomStickers(files:FileList|null){",
                "  async function uploadCustomStickers(packId:string,files:File[]){ // CONNECT_PWA_STICKER_PICKER_IOS_FIX_20261115",
                'upload function signature')
              page=once(page,
                "if(!supabase||!user||!customPack||!files?.length||busy)return;",
                "if(!supabase||!user||!packId||!files.length||busy)return;",
                'upload guard')
              page=once(page,
                "const pack=customPacks.find(p=>p.id===customPack);",
                "const pack=customPacks.find(p=>p.id===packId);",
                'pack identity')
              page=once(page,
                "    setBusy(true);\n    try{\n      for(const file of Array.from(files).slice(0,30)){",
                "    setBusy(true);\n    setNotice('Обрабатываю '+Math.min(files.length,30)+' стикер(ов)…');\n    try{\n      for(const file of files.slice(0,30)){",
                'file-list snapshot and processing notice')
              page=once(page,
                "    finally{setBusy(false);if(stickerFileInput.current)stickerFileInput.current.value='';}",
                "    finally{setBusy(false);}",
                'upload finally')
              page=once(page,
                "  const stickerFileInput=useRef<HTMLInputElement|null>(null);",
                "  // Sticker input lives inside each pack's label; native iOS picker retains the tap gesture.",
                'remove obsolete upload ref')

              old_button='''<button className="settings-action" type="button" disabled={busy} onClick={()=>{
                                  setCustomPack(p.id);setTimeout(()=>document.getElementById('connect-sticker-upload')?.click(),0);
                                }}>Добавить стикеры</button>'''
              new_button='''<label className={'settings-action connect-sticker-upload-action'+(busy?' is-busy':'')}>
                                  <span>Добавить стикеры</span>
                                  <input type="file" className="connect-sticker-upload-input"
                                    accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif"
                                    multiple disabled={busy} aria-label={'Добавить стикеры в набор '+p.name}
                                    onChange={e=>{
                                      // Snapshot FileList BEFORE clearing the native input: it is a live collection.
                                      const input=e.currentTarget;
                                      const selected=Array.from(input.files||[]);
                                      input.value='';
                                      if(selected.length)void uploadCustomStickers(p.id,selected);
                                    }}/>
                                </label>'''
              page=once(page,old_button,new_button,'native iOS label input / direct file selection')
              old_input='''{customPack===p.id&&<input id="connect-sticker-upload" type="file"
                                  accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg" multiple hidden
                                  onChange={e=>void uploadCustomStickers(e.target.files)}/>}'''
              page=once(page,old_input,'','remove conditional hidden input')
              assert 'connect-sticker-upload-input' in page
              assert 'setTimeout(()=>document.getElementById(\'connect-sticker-upload\')' not in page
              assert 'async function uploadCustomStickers(packId:string,files:File[])' in page
              page_path.write_text(page,encoding='utf8')
              print('Patched app/page.tsx: direct native iOS file picker, explicit pack id, File[] snapshot and progress')

          CSS_FIX='''
          /* CONNECT_PWA_STICKER_PICKER_IOS_FIX_20261115
           * Invisible native input covers its label, so iOS Safari receives a real touch.
           * display:none/hidden plus delayed .click() can lose the user activation.
           */
          .connect-sticker-upload-action{display:inline-flex;position:relative;align-items:center;justify-content:center;overflow:hidden;max-width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent;}
          .connect-sticker-upload-action.is-busy{opacity:.55;cursor:default;}
          .connect-sticker-upload-input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;z-index:1;}
          .connect-sticker-upload-input:focus-visible{opacity:.01;outline:2px solid var(--accent);outline-offset:-3px;}
          '''
          if MARK not in css:
              css_path.write_text(css.rstrip()+'\n'+CSS_FIX,encoding='utf8')
              print('Patched app/globals.css: interactive invisible native input over upload label')
          else: print('iOS upload CSS already present')
          CONNECT_STICKER_IOS_PATCH
          python3 "$RUNNER_TEMP/sticker_picker_patch.py"
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Run targeted iOS picker regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sticker-picker.test.cjs" <<'CONNECT_STICKER_IOS_TEST'
          const { test }=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const ts=require('typescript');
          const src=fs.readFileSync('app/page.tsx','utf8');
          const css=fs.readFileSync('app/globals.css','utf8');

          test('iOS sticker uploads use a direct native file input, not an async synthetic click',()=>{
            const marker='CONNECT_PWA_STICKER_PICKER_IOS_FIX_20261115';
            assert(src.includes(marker), 'iOS picker patch marker missing');
            assert(!src.includes("setTimeout(()=>document.getElementById('connect-sticker-upload')"), 'Old asynchronous file picker still present');
            assert(!src.includes('type="file"\n                        accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg" multiple hidden'), 'Old hidden picker still present');
            assert(src.includes('<label className={\'settings-action connect-sticker-upload-action\''));
            assert(src.includes('className="connect-sticker-upload-input"'));
            assert(src.includes('accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif"'));
            assert(src.includes('multiple disabled={busy}'));
            assert(css.includes('.connect-sticker-upload-input{position:absolute;inset:0;'));
            assert(css.includes('opacity:0;cursor:pointer;z-index:1;'));
          });

          test('each pack receives the files actually chosen, and FileList is copied before input reset',()=>{
            assert(src.includes('async function uploadCustomStickers(packId:string,files:File[])'));
            assert(src.includes('const pack=customPacks.find(p=>p.id===packId);'));
            assert(src.includes('const selected=Array.from(input.files||[]);'));
            assert(src.includes("input.value='';\n                            if(selected.length)void uploadCustomStickers(p.id,selected);"));
            assert(!src.includes('if(!supabase||!user||!customPack||!files?.length||busy)return;'));
            assert(src.includes("setNotice('Обрабатываю '+Math.min(files.length,30)+' стикер(ов)…');"));
          });

          test('PWA page parses as valid TSX after the upload patch',()=>{
            const source=ts.createSourceFile('page.tsx',src,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            assert.equal(source.parseDiagnostics.length,0,source.parseDiagnostics.map(d=>ts.flattenDiagnosticMessageText(d.messageText,'\n')).join('\n'));
          });
          CONNECT_STICKER_IOS_TEST
          # Test runs in repository context, with TypeScript from npm ci.
          cp "$RUNNER_TEMP/sticker-picker.test.cjs" tests/sticker-picker-ios.test.cjs
          node --test tests/sticker-picker-ios.test.cjs
          node --test tests/sticker-webp.test.cjs
      - name: Install Chromium used by existing browser tests
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright-core install --with-deps chromium
          node - <<'VERIFY_STICKER_CHROMIUM'
          const fs = require('node:fs');
          const exe = require('playwright-core').chromium.executablePath();
          if (!fs.existsSync(exe)) throw Error('Chromium missing: '+exe);
          console.log('Verified Chromium:',exe);
          VERIFY_STICKER_CHROMIUM
      - name: Typecheck and all Connect tests
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit only validated PWA fixes
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css tests/sticker-picker-ios.test.cjs
          if git diff --cached --quiet; then
            echo 'Picker already fixed; no commit required'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA: fix native iOS sticker JPG PNG picker'
            git push origin HEAD:main
          fi
