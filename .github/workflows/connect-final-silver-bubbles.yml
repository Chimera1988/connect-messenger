      - name: Change only the splash bubble image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('components/ConnectSplashScreen.tsx')
          if not page.exists():
              raise SystemExit('ConnectSplashScreen.tsx not found; nothing changed.')
          src = page.read_text(encoding='utf-8')
          new = '/connect-splash-bubbles-exact-silver.png'
          known = [
              '/connect-splash-bubbles-silver-v1.png',
              '/connect-splash-bubbles-silver.png',
              '/connect-splash-bubbles-transparent.png',
          ]
          if new in src:
              print('Already updated; leaving component unchanged.')
          else:
              present = [item for item in known if item in src]
              if len(present) != 1:
                  raise SystemExit('Unexpected splash structure: refused to overwrite unrelated code.')
              src = src.replace(present[0], new, 1)
              page.write_text(src, encoding='utf-8')
              print('Replaced only the chat bubble graphic. CSS, waves and typography untouched.')
          PY
      - name: Check changes and TypeScript
        shell: bash
        run: |
          git diff --check
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit only splash bubble asset and reference
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx public/connect-splash-bubbles-exact-silver.png
          if git diff --cached --quiet; then
            echo 'The approved bubbles are already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use exact approved silver bubbles on Connect splash'
          git push origin HEAD:main
