name: Connect PWA | Bottom dock gesture safety and unified list cards

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-list-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-then-apply:
    name: Verify navigation and contact-parity before committing
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard source files and repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for f in AGENTS.md package.json package-lock.json tsconfig.json app/page.tsx app/globals.css app/liquid-glass.css app/call-journal-editor.css components/ConnectCallsHub.tsx tests/pwa-five-ui.test.cjs tests/connect-call-fullscreen.test.cjs; do
            test -s "$f" || { echo "SOURCE_DRIFT: missing $f" >&2; exit 1; }
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install matching Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Check browser availability
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Missing matching Chromium: '+p)"

      - name: Write targeted tests before the patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pwa-list-parity-gesture.test.cjs" <<'JS_LIST_PARITY_TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const ts=require('typescript');
          const root=process.cwd();
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const page=read('app/page.tsx');
          const liquid=read('app/liquid-glass.css');
          const journal=read('app/call-journal-editor.css');
          const marker='CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114';

          test('dock does not participate in PWA edge history; other edge swipes keep working',()=>{
            assert.match(page,/shell\.setAttribute\('data-connect-pwa-list-parity','true'\)/);
            const begin=page.indexOf("    let started:{x:number;y:number;edge:'back'|'forward'}|null=null;");
            const finish=page.indexOf("    shell.addEventListener('touchstart',start",begin);
            assert.ok(begin>=0&&finish>begin,'could not find current native gesture handlers');
            const source=page.slice(begin,finish);
            const factoryCode=`function harness(ctx) { const {shell,crop,mediaViewer,videoNoteOpen,menuMessage,forwardIds,selectionMode,stickerPicker,chatSearchOpen,chatActions,connectSwipeDirection,gestureHistory,conversations,profiles,activeChat,exitChat,enterChat,setActiveChat,showProfile,setProfileView,setProfileMediaOpen,setTab,setSettingsPage,setSearch,setListActions,setStickerPicker}=ctx; ${source}; return {start,end}; }`;
            const result=ts.transpileModule(factoryCode,{compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None},reportDiagnostics:true});
            assert.deepEqual((result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error),[]);
            const factory=new Function(result.outputText+';return harness;')();
            const originalElement=global.Element, originalDocument=global.document;
            global.Element=class FakeElement {constructor(nav){this.nav=nav;} closest(selector){return this.nav&&selector.includes('.bottom-nav')?this:null;}};
            global.document={querySelector:()=>null};
            try {
              function setup(){
                const state={calls:0};
                const history={current:{cursor:1,restoring:false,entries:[{tab:'chats',chat:null,profile:null,media:null,settings:'home'},{tab:'contacts',chat:null,profile:null,media:null,settings:'home'}]}};
                const shell={getBoundingClientRect:()=>({left:0,right:390}),querySelector:s=>s==='.bottom-nav'?{getBoundingClientRect:()=>({top:720})}:null};
                const ctx={shell,crop:null,mediaViewer:null,videoNoteOpen:false,menuMessage:null,forwardIds:[],selectionMode:false,stickerPicker:false,chatSearchOpen:false,chatActions:false,gestureHistory:history,conversations:[],profiles:[],activeChat:null,connectSwipeDirection:(edge,dx,dy)=>edge==='back'&&dx>=70&&Math.abs(dx)>Math.abs(dy)*1.3?-1:0,exitChat:()=>{},enterChat:()=>{},setActiveChat:()=>{},showProfile:()=>{},setProfileView:()=>{},setProfileMediaOpen:()=>{},setTab:()=>{state.calls++},setSettingsPage:()=>{},setSearch:()=>{},setListActions:()=>{},setStickerPicker:()=>{}};
                return {h:factory(ctx),state,history};
              }
              const ev=(x,y,nav=false)=>({target:new global.Element(nav),touches:[{clientX:x,clientY:y}],changedTouches:[{clientX:x,clientY:y}],preventDefault(){this.prevented=true;}});
              let t=setup();t.h.start(ev(6,730,true));t.h.end(ev(120,730,true));assert.equal(t.history.current.cursor,1,'nav gestures must not navigate');
              t=setup();t.h.start(ev(6,726,false));t.h.end(ev(120,726,false));assert.equal(t.history.current.cursor,1,'bottom dock hit band must not navigate');
              t=setup();t.h.start(ev(6,150,false));t.h.end(ev(120,725,true));assert.equal(t.history.current.cursor,1,'touch ending in nav must not navigate');
              t=setup();t.h.start(ev(6,150,false));t.h.end(ev(120,150,false));assert.equal(t.history.current.cursor,0,'edge gesture outside dock must navigate');assert.equal(t.state.calls,1);
            }finally{global.Element=originalElement;global.document=originalDocument;}
          });

          test('PWA-only selectors cover both comparison lists and preserve native wrapper',()=>{
            assert.match(liquid,/\/\* CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114/);
            assert.match(journal,/\/\* CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114/);
            assert.match(liquid,/\.connect-app\[data-connect-pwa-list-parity="true"\] \.chat-rows \.dialog-row/);
            assert.match(journal,/\.connect-app\[data-connect-pwa-list-parity="true"\] \.connect-pwa-call-journal \.connect-call-history-item/);
            for(const [name,src] of [['Chats',liquid],['Calls',journal]]){
              assert.match(src,/min-height:66px/);
              assert.match(src,/font-size:16px/);
              assert.match(src,/font-size:12px/);
              assert.match(src,/width:46px/);
              assert.match(src,/rgba\(37,54,78,\.35\)/);
              assert.match(src,/rgba\(255,255,255,\.76\)/);
            }
            assert.equal((page.match(/shell\.setAttribute\('data-connect-pwa-list-parity','true'\)/g)||[]).length,1);
          });

          test('Chromium: Chats and Calls cards match Contacts across themes and narrow screens',async()=>{
            const {chromium}=require('playwright-core');
            const browser=await chromium.launch({executablePath:process.env.CONNECT_TEST_CHROMIUM_EXECUTABLE||undefined,args:['--no-sandbox']});
            try{
              for(const width of [320,375,390,430])for(const mode of ['dark','light']){
                const p=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
                await p.setContent(`<div class="connect-app ${mode==='light'?'light':''}" data-connect-pwa-list-parity="true" style="--accent:#198f78;--glass-stroke:rgba(198,225,255,.14)"><div class="main-view">
                  <div class="contact-rows"><button class="contact-row"><span class="connect-presence-avatar"><span class="person-avatar avatar-md">A</span></span><span class="contact-text"><strong>Тестировщик )</strong><small>Тестовый аккаунт</small></span></button></div>
                  <div class="chat-rows"><div class="dialog-entry"><button class="dialog-row"><span class="connect-presence-avatar"><span class="person-avatar avatar-md">A</span></span><div class="dialog-summary"><strong>Тестировщик )</strong><span>Вы: Стикер</span></div><div class="dialog-meta"><time>21:45</time></div></button></div></div>
                  <div class="test-host"><section class="connect-call-history-screen connect-pwa-call-journal"><div class="connect-call-history-list"><div class="connect-call-history-item"><span class="connect-call-history-avatar">A</span><div class="connect-call-history-details"><strong>Тестировщик )</strong><small>Исходящий · 0:42</small></div><div class="connect-call-history-actions"><div class="connect-call-history-date"><time>14 нояб. 2026 г.</time><span>21:06</span></div><button class="connect-call-redial">☎</button></div></div></div></section></div>
                </div></div>`);
                for(const css of ['globals.css','liquid-glass.css','call-journal-editor.css'])await p.addStyleTag({content:read('app/'+css)});
                const d=await p.evaluate(()=>{
                  const s=sel=>getComputedStyle(document.querySelector(sel));
                  const $=sel=>document.querySelector(sel);
                  return {contact:{font:s('.contact-text strong').fontSize,avatar:s('.contact-row .connect-presence-avatar').width,min:s('.contact-row').minHeight,bg:s('.contact-row').backgroundImage,color:s('.contact-row').backgroundColor},chat:{font:s('.dialog-summary strong').fontSize,avatar:s('.dialog-row .connect-presence-avatar').width,min:s('.dialog-row').minHeight,bg:s('.dialog-entry').backgroundImage,color:s('.dialog-entry').backgroundColor},call:{font:s('.connect-call-history-details strong').fontSize,avatar:s('.connect-call-history-avatar').width,min:s('.connect-call-history-item').minHeight,bg:s('.connect-call-history-item').backgroundImage,color:s('.connect-call-history-item').backgroundColor},overflow:$('.connect-call-history-item').scrollWidth-$('.connect-call-history-item').clientWidth};
                });
                assert.equal(d.chat.font,d.contact.font,`chat font: ${width} ${mode}`);
                assert.equal(d.call.font,d.contact.font,`call font: ${width} ${mode}`);
                assert.equal(d.chat.avatar,d.contact.avatar,`chat avatar: ${width} ${mode}`);
                assert.equal(d.call.avatar,d.contact.avatar,`call avatar: ${width} ${mode}`);
                assert.equal(d.chat.min,d.contact.min,`chat min-height: ${width} ${mode}`);
                assert.equal(d.call.min,d.contact.min,`call min-height: ${width} ${mode}`);
                assert.equal(d.chat.bg,d.contact.bg,`chat background: ${width} ${mode}`);
                assert.equal(d.call.bg,d.contact.bg,`call background: ${width} ${mode}`);
                assert.equal(d.chat.color,d.contact.color,`chat fallback background: ${width} ${mode}`);
                assert.equal(d.call.color,d.contact.color,`call fallback background: ${width} ${mode}`);
                assert.ok(d.overflow<=3,`call card overflowing at ${width} ${mode}: ${d.overflow}px`);
                await p.close();
              }
            }finally{await browser.close()}
          });
          JS_LIST_PARITY_TEST
          if test -f tests/pwa-list-parity-gesture.test.cjs && ! cmp -s tests/pwa-list-parity-gesture.test.cjs "$RUNNER_TEMP/pwa-list-parity-gesture.test.cjs"; then
            echo 'SOURCE_DRIFT: existing test was edited; refusing to overwrite.' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/pwa-list-parity-gesture.test.cjs" tests/pwa-list-parity-gesture.test.cjs
          node --check tests/pwa-list-parity-gesture.test.cjs

      - name: Demonstrate original bug (RED)
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114' app/page.tsx; then
            echo 'Prior implementation marker found; full structural verification occurs in patch step.'
          else
            set +e
            node --test --test-name-pattern='dock does not participate|PWA-only selectors' tests/pwa-list-parity-gesture.test.cjs > "$RUNNER_TEMP/list-parity-red.log" 2>&1
            rc=$?
            set -e
            if test "$rc" -eq 0 || ! grep -Fq 'not ok' "$RUNNER_TEMP/list-parity-red.log"; then
              cat "$RUNNER_TEMP/list-parity-red.log"
              echo 'Expected initial navigation/card mismatch was not reproduced.' >&2
              exit 1
            fi
            echo 'RED confirmed: dock and contact-card parity are not yet enforced.'
          fi

      - name: Apply idempotent PWA-only source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-pwa-list-parity-patch.py" <<'PY_LIST_PARITY_PATCH'
          #!/usr/bin/env python3
          """Scoped PWA-only card parity and safe edge gesture fix (source guards)."""
          from pathlib import Path

          MARK='CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114'
          page=Path('app/page.tsx')
          liquid=Path('app/liquid-glass.css')
          journal=Path('app/call-journal-editor.css')

          OLD_MOUNT="    if(!shell)return;\n    let started:{x:number;y:number;edge:'back'|'forward'}|null=null;"
          NEW_MOUNT="    if(!shell)return;\n    // CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114: PWA-only layout, never Android WebView.\n    shell.setAttribute('data-connect-pwa-list-parity','true');\n    let started:{x:number;y:number;edge:'back'|'forward'}|null=null;"
          OLD_START="""      const target=e.target;
                if(target instanceof Element && target.closest('input,textarea,select,[contenteditable="true"],.bubble,.context-overlay,.sticker-picker,.connect-vnote-backdrop,.connect-media-overlay'))return;"""
          NEW_START="""      const target=e.target;
                // Keep the entire bottom navigation dock outside swipe history, even near screen edges.
                if(target instanceof Element && target.closest('.bottom-nav,.nav-tab,.connect-calls-tab'))return;
                const dock=shell!.querySelector<HTMLElement>('.bottom-nav');
                if(dock && touches[0].clientY>=dock.getBoundingClientRect().top-12)return;
                if(target instanceof Element && target.closest('input,textarea,select,[contenteditable="true"],.bubble,.context-overlay,.sticker-picker,.connect-vnote-backdrop,.connect-media-overlay'))return;"""
          OLD_END="""      const origin=started;started=null;
                const dx=changedTouches[0].clientX-origin.x,dy=changedTouches[0].clientY-origin.y;"""
          NEW_END="""      const origin=started;started=null;
                // Do not navigate if a gesture ends on or within the bottom dock's hit zone.
                const dock=shell!.querySelector<HTMLElement>('.bottom-nav');
                if((e.target instanceof Element && e.target.closest('.bottom-nav,.nav-tab,.connect-calls-tab')) ||
                  (dock && changedTouches[0].clientY>=dock.getBoundingClientRect().top-12))return;
                const dx=changedTouches[0].clientX-origin.x,dy=changedTouches[0].clientY-origin.y;"""

          LIQUID_CSS="""
          /* CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114 — Contacts are the visual list baseline.
             Only iPhone/desktop PWA receives this attribute; the Android wrapper is untouched. */
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-entry {
            min-height:66px;
            padding:0;
            background:linear-gradient(120deg,rgba(37,54,78,.35),rgba(25,35,53,.20));
            -webkit-backdrop-filter:blur(14px);
            backdrop-filter:blur(14px);
            border-bottom:1px solid var(--glass-stroke);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row {
            display:flex !important;
            flex-wrap:nowrap;
            align-items:center;
            min-height:66px;
            gap:12px;
            padding:8px 9px;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .connect-presence-avatar {
            flex:0 0 46px;
            width:46px;
            min-width:46px;
            height:46px;
            overflow:visible;
            border-radius:0;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .connect-presence-avatar > .person-avatar {
            width:100%;height:100%;border-radius:50%;overflow:hidden;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .dialog-summary {
            display:flex;
            flex:1 1 0;
            flex-direction:column;
            justify-content:center;
            min-width:0;
            gap:5px;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .dialog-summary strong {
            font-size:16px;
            font-weight:680;
            line-height:1.25;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .dialog-summary > span {
            font-size:12px;
            line-height:1.35;
            color:var(--muted);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .dialog-meta {
            flex:0 0 auto;
            align-self:center;
            align-items:flex-end;
            justify-self:auto;
            max-width:84px;
            gap:6px;
            margin:0;
            padding:0;
            white-space:nowrap;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .chat-rows .dialog-row > .dialog-meta time {
            font-size:11px;
          }
          .connect-app.light[data-connect-pwa-list-parity="true"] .chat-rows .dialog-entry {
            background:rgba(255,255,255,.76);
          }
          """
          JOURNAL_CSS="""
          /* CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114 — Calls list matches Contact cards. */
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-list {
            border:0;
            border-radius:18px;
            overflow:hidden;
            background:transparent;
            box-shadow:none;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-item {
            min-height:66px;
            padding:8px 9px;
            gap:12px;
            border-bottom:1px solid var(--glass-stroke);
            background:linear-gradient(120deg,rgba(37,54,78,.35),rgba(25,35,53,.20));
            -webkit-backdrop-filter:blur(14px);
            backdrop-filter:blur(14px);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-item:last-child {
            border-bottom-color:var(--glass-stroke);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-avatar {
            width:46px;
            height:46px;
            flex:0 0 46px;
            font-size:21px;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-details {
            flex:1 1 0;
            gap:5px;
            min-width:0;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-details strong {
            font-size:16px;
            font-weight:680;
            line-height:1.25;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-details small {
            font-size:12px;
            line-height:1.35;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-actions {
            gap:8px;
            min-width:0;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-date {
            font-size:11px;
            max-width:85px;
            line-height:1.25;
            text-align:right;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-date time {
            white-space:normal;
            overflow-wrap:normal;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-redial {
            width:38px;
            height:38px;
            flex:0 0 38px;
          }
          .connect-app.light[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-item {
            background:rgba(255,255,255,.76);
          }
          @media(max-width:380px) {
            .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-item {
              gap:9px;
            }
            .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-actions {
              gap:5px;
            }
            .connect-app[data-connect-pwa-list-parity="true"] .connect-pwa-call-journal .connect-call-history-date {
              max-width:72px;
            }
          }
          """

          def require_once(source: str, anchor: str, filename: str) -> None:
              count=source.count(anchor)
              if count!=1:
                  raise RuntimeError(f'SOURCE_DRIFT {filename}: expected exactly 1 occurrence, got {count}: {anchor[:100]!r}')

          def main():
              s=page.read_text(encoding='utf-8');l=liquid.read_text(encoding='utf-8');j=journal.read_text(encoding='utf-8')
              if any(MARK in x for x in (s,l,j)):
                  if not all((NEW_MOUNT in s,NEW_START in s,NEW_END in s,LIQUID_CSS.strip() in l,JOURNAL_CSS.strip() in j)):
                      raise RuntimeError('SOURCE_DRIFT: partial or edited prior implementation')
                  if any(a in s for a in (OLD_MOUNT,OLD_START,OLD_END)):
                      raise RuntimeError('SOURCE_DRIFT: obsolete listeners remain in updated source')
                  print('PWA list parity and nav guard already applied; content verified.')
                  return
              for a in [OLD_MOUNT,OLD_START,OLD_END]:require_once(s,a,str(page))
              for path,content,anchor in [
                (liquid,l,'/* CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: native-size iOS search; unified list menus. */'),
                (journal,j,'/* CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114 — the Calls tab owns its screen.')]:
                  require_once(content,anchor,str(path))
              # Prevent a partially applied repo update when an earlier anchor is missing.
              new_s=s.replace(OLD_MOUNT,NEW_MOUNT,1).replace(OLD_START,NEW_START,1).replace(OLD_END,NEW_END,1)
              page.write_text(new_s,encoding='utf-8')
              liquid.write_text(l.rstrip('\n')+'\n'+LIQUID_CSS,encoding='utf-8')
              journal.write_text(j.rstrip('\n')+'\n'+JOURNAL_CSS,encoding='utf-8')
              print('Scoped PWA edge gesture guard and three-list card parity applied.')

          if __name__=='__main__':main()
          PY_LIST_PARITY_PATCH
          python3 "$RUNNER_TEMP/connect-pwa-list-parity-patch.py"
          python3 "$RUNNER_TEMP/connect-pwa-list-parity-patch.py"
          git diff --check
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              app/page.tsx|app/liquid-glass.css|app/call-journal-editor.css) ;;
              *) echo "Unexpected modified file: $file" >&2; exit 1 ;;
            esac
          done

      - name: TypeScript and PWA focused functional and Chromium tests (GREEN)
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --test tests/pwa-list-parity-gesture.test.cjs
          node --test tests/pwa-five-ui.test.cjs tests/connect-call-fullscreen.test.cjs

      - name: Run the complete Connect regression suite
        run: npm test

      - name: Build the production PWA
        run: npm run build

      - name: Commit only after every check is green
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/liquid-glass.css app/call-journal-editor.css tests/pwa-list-parity-gesture.test.cjs
          if git diff --cached --quiet; then
            echo 'Already applied and verified; nothing to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): exclude bottom dock from swipe navigation and align list cards'
          git push origin HEAD:main
