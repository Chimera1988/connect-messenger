      - name: Match wordmark and letter progression
        shell: bash
        run: |
          python3 - <<'PATCH_SCRIPT'
          from pathlib import Path
          
          component = Path('components/ConnectSplashScreen.tsx')
          css = Path('app/connect-splash.css')
          source = component.read_text(encoding='utf-8')
          
          if 'connect-splash__word-slice' not in source:
              anchor = "const BRAND = 'Connect'.split('');"
              if source.count(anchor) != 1:
                  raise SystemExit('Unexpected ConnectSplashScreen.tsx: BRAND declaration changed.')
              source = source.replace(anchor, anchor + "\n// Exact character boundaries measured from the approved Connect screenshot.\nconst WORD_CUTS = [0, 17.6, 32.6, 46.7, 61.1, 75.8, 89.6, 100] as const;", 1)
          
              start = source.find('        <div className="connect-splash__word"')
              if start == -1:
                  raise SystemExit('Unexpected component markup: loading word not found.')
              end = source.find('\n        </div>', start)
              if end == -1 or 'BRAND.map' not in source[start:end]:
                  raise SystemExit('Unexpected component markup: original letter animation not found.')
              end += len('\n        </div>')
              replacement = '''        <div className="connect-splash__word" role="img" aria-label="Connect">
                    {BRAND.map((character, index) => (
                      <span key={character + index} aria-hidden="true"
                        className={'connect-splash__word-slice' + (index < letters ? ' is-visible' : '')}
                        style={{clipPath: `inset(0 ${100 - WORD_CUTS[index + 1]}% 0 ${WORD_CUTS[index]}%)`}}>
                        <img src="/connect-splash-wordmark-reference.png" alt="" draggable={false}/>
                      </span>
                    ))}
                  </div>'''
              source = source[:start] + replacement + source[end:]
              component.write_text(source, encoding='utf-8')
              print('Replaced font-rendered letters with the exact approved wordmark, revealing them individually.')
          else:
              print('The approved wordmark is already integrated.')
          
          style = css.read_text(encoding='utf-8')
          style_start = style.find('.connect-splash__word {')
          style_end = style.find('@keyframes connect-splash-wave-drift {',style_start)
          if style_start<0 or style_end<0:
              raise SystemExit('Unexpected connect-splash.css: style section not found.')
          newstyle = '''/* Exact approved lettering. The image remains in place as letters fade in, so
             the word never shifts horizontally on partial progress (C, Co, Con...). */
          .connect-splash__word {
            position: relative;
            flex: 0 0 auto;
            display: block;
            width: min(48vw, 347px);
            max-width: 100%;
            aspect-ratio: 347 / 66;
            margin-top: -2px;
            user-select: none;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,.12));
          }
          .connect-splash__word-slice {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 260ms ease;
          }
          .connect-splash__word-slice.is-visible { opacity: 1; }
          .connect-splash__word-slice img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
          }
          '''
          style = style[:style_start] + newstyle + style[style_end:]
          # Restore the vertical grouping of the approved reference, no wave/logo changes.
          style = style.replace('transform: translateY(-2.8%);','transform: translateY(-5.6%);',1)
          style = style.replace('  .connect-splash__word { font-size: clamp(27px, 7vw, 46px); margin-top: 9px; }',
                                '  .connect-splash__word { width: min(46vw, 290px); margin-top: 0; }')
          style = style.replace('  .connect-splash__letter { transition: none; transform: none; }',
                                '  .connect-splash__word-slice { transition: none; }')
          css.write_text(style,encoding='utf-8')
          print('Updated spacing and responsive styles; kept current waves, icon and loading logic unchanged.')
          PATCH_SCRIPT
      - name: Validate diff
        run: git diff --check
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit only splash typography
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx app/connect-splash.css public/connect-splash-wordmark-reference.png
          if git diff --cached --quiet; then
            echo 'Already installed; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: match Connect splash lettering to approved reference'
          git push origin HEAD:main
