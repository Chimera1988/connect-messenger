      - name: Replace redrawn bubbles with exact image from supplied original
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('components/ConnectSplashScreen.tsx')
          if not path.exists():
              raise SystemExit('Missing ConnectSplashScreen.tsx: install the approved splash first.')
          source = path.read_text(encoding='utf-8')
          replacement = ('        <img className="connect-splash__icon" '
                         'src="/connect-splash-original-no-text.png" alt="" '
                         'decoding="async" draggable={false} />')
          pattern = r'(?m)^        <svg className="connect-splash__icon"[^>]*>.*?^        </svg>'
          if re.search(pattern, source, flags=re.S):
              source, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('Could not replace exactly one hand-drawn icon.')
          elif replacement not in source:
              raise SystemExit('Unexpected splash markup: refusing to change unrelated code.')
          if '<svg className="connect-splash__waves"' not in source:
              raise SystemExit('The existing wave background is missing; no patch applied.')
          if "const BRAND = 'Connect'.split('');" not in source:
              raise SystemExit('The existing loading-letter animation is missing; no patch applied.')
          path.write_text(source, encoding='utf-8')
          print('Logo replaced. Original bubbles unchanged; animated letters remain below the icon.')
          PY

      - name: Verify change is limited to the logo
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('components/ConnectSplashScreen.tsx').read_text(encoding='utf-8')
          assert s.count('src="/connect-splash-original-no-text.png"') == 1
          assert 'connect-splash__word' in s
          assert 'connect-splash__waves' in s
          assert 'connect-splash__letter' in s
          assert '<svg className="connect-splash__icon"' not in s
          assert Path('public/connect-splash-original-no-text.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Splash markup and image verified.')
          PY

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit only the splash icon change
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx public/connect-splash-original-no-text.png
          if git diff --cached --quiet; then
            echo 'Final splash logo is already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use original Connect speech bubbles on splash screen'
          git push origin HEAD:main
