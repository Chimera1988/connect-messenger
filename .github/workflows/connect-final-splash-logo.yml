name: Connect - final splash logo from original icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-final-splash-logo.yml'

permissions:
  contents: write

concurrency:
  group: connect-final-splash-logo
  cancel-in-progress: false

