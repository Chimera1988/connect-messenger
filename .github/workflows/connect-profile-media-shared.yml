name: Connect - profile photo video music visible to members

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-profile-media-shared.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Connect
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install profile media library foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import run
          Path('components').mkdir(parents=True,exist_ok=True)
          Path('app').mkdir(parents=True,exist_ok=True)
          Path('sql').mkdir(parents=True,exist_ok=True)
          Path('components/ConnectProfileMedia.tsx').write_text(r''''use client';

          import { useCallback, useEffect, useRef, useState } from 'react';
          import type { SupabaseClient } from '@supabase/supabase-js';
          import * as tus from 'tus-js-client';

          export type ProfileMediaKind = 'photos' | 'videos' | 'music';

          type MediaItem = { path: string; name: string; mime: string; url: string; createdAt: string };
          type Props = {
            client: SupabaseClient;
            userId: string;
            kind: ProfileMediaKind;
            onBack: () => void;
            onAvatar: (file: File) => void;
          };

          const BUCKET = 'connect-profile-media';
          const TITLES: Record<ProfileMediaKind, string> = { photos: 'Мои фото', videos: 'Мои видео', music: 'Моя музыка' };
          const ACCEPT: Record<ProfileMediaKind, string> = {
            photos: 'image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif',
            videos: 'video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm',
            music: 'audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/x-wav,audio/ogg,audio/webm,audio/flac,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac',
          };
          const EXTENSIONS: Record<ProfileMediaKind, string[]> = {
            photos: ['jpg', 'jpeg', 'png', 'webp', 'gif'],
            videos: ['mp4', 'mov', 'webm'],
            music: ['mp3', 'm4a', 'aac', 'wav', 'ogg', 'opus', 'flac', 'webm'],
          };
          const MIME: Record<string, string> = {
            jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif',
            mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm',
            mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav',
            ogg: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac',
          };
          const MAX_SIZE = 100 * 1024 * 1024;

          // Keep signed audio/video/image requests on the working same-origin proxy
          // when Connect is opened through its alternate DuckDNS domain.
          function playbackUrl(url: string) {
            if (typeof window === 'undefined' || window.location.hostname !== 'connect-chat.duckdns.org') return url;
            const root = process.env.NEXT_PUBLIC_SUPABASE_URL || '';
            try {
              const source = new URL(url);
              const base = new URL(root);
              if (source.hostname === base.hostname) return `${window.location.origin}/supabase${source.pathname}${source.search}${source.hash}`;
              if (source.hostname === base.hostname.replace(/\.supabase\.co$/, '.storage.supabase.co'))
                return `${window.location.origin}/supabase-storage${source.pathname}${source.search}${source.hash}`;
            } catch { /* Signed URL may already be relative. */ }
            return url;
          }

          function extension(name: string) { return name.split('.').pop()?.toLowerCase() || ''; }
          function validFile(file: File, kind: ProfileMediaKind) {
            return EXTENSIONS[kind].includes(extension(file.name)) && file.size > 0 && file.size <= MAX_SIZE;
          }
          function encodeName(name: string) {
            const ext = extension(name);
            const clipped = name.length <= 70 ? name : name.slice(0, 68 - ext.length) + '.' + ext;
            const bytes = new TextEncoder().encode(clipped);
            let raw = '';
            for (const byte of bytes) raw += String.fromCharCode(byte);
            return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
          }
          function decodeName(name: string) {
            const suffix = name.split('~').slice(1).join('~');
            const encoded = suffix.replace(/\.[^.]*$/, '');
            if (!encoded) return name;
            try {
              const raw = atob(encoded.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - encoded.length % 4) % 4));
              return new TextDecoder().decode(Uint8Array.from(raw, char => char.charCodeAt(0)));
            } catch { return name; }
          }
          function bytesLabel(size: number) { return `${(size / 1024 / 1024).toFixed(1)} МБ`; }

          export default function ConnectProfileMedia({ client, userId, kind, onBack, onAvatar }: Props) {
            const inputRef = useRef<HTMLInputElement>(null);
            const [items, setItems] = useState<MediaItem[]>([]);
            const [loading, setLoading] = useState(true);
            const [busy, setBusy] = useState(false);
            const [uploadProgress, setUploadProgress] = useState<number | null>(null);
            const [error, setError] = useState('');
            const [notice, setNotice] = useState('');
            const [selectedSong, setSelectedSong] = useState<string | null>(null);
            const [preview, setPreview] = useState<MediaItem | null>(null);
            const directory = `${userId}/${kind}`;

            const load = useCallback(async () => {
              setLoading(true);
              setError('');
              const { data, error: listError } = await client.storage.from(BUCKET).list(`${userId}/${kind}`, {
                limit: 100, sortBy: { column: 'created_at', order: 'desc' },
              });
              if (listError) {
                setError('Не удалось открыть медиатеку: ' + listError.message);
                setLoading(false);
                return;
              }
              const files = (data || []).filter(row => row.id && row.name);
              const resolved = await Promise.all(files.map(async row => {
                const path = `${userId}/${kind}/${row.name}`;
                const signed = await client.storage.from(BUCKET).createSignedUrl(path, 3600);
                if (!signed.data?.signedUrl) return null;
                const name = decodeName(row.name);
                const ext = extension(name);
                return { path, name, mime: MIME[ext] || 'application/octet-stream', url: playbackUrl(signed.data.signedUrl),
                  createdAt: row.created_at || '' } as MediaItem;
              }));
              setItems(resolved.filter((item): item is MediaItem => item !== null));
              setLoading(false);
            }, [client, userId, kind]);

            useEffect(() => { void load(); }, [load]);

            async function upload(files: File[]) {
              if (busy || !files.length) return;
              if (files.length > 12) { setError('За один раз можно загрузить до 12 файлов.'); return; }
              setError(''); setNotice(''); setBusy(true);
              let completed = 0;
              try {
                for (const file of files) {
                  if (!validFile(file, kind)) throw new Error(`Неподдерживаемый формат или размер: ${file.name}. Максимум ${bytesLabel(MAX_SIZE)}.`);
                  const ext = extension(file.name);
                  const path = `${directory}/${Date.now()}-${crypto.randomUUID()}~${encodeName(file.name)}.${ext}`;
                  const contentType = kind === 'music' && ext === 'webm' ? 'audio/webm' : MIME[ext] || file.type || 'application/octet-stream';
                  setUploadProgress(0);
                  if (file.size <= 6 * 1024 * 1024) {
                    const { error: uploadError } = await client.storage.from(BUCKET).upload(path, file, {
                      contentType, upsert: false,
                    });
                    if (uploadError) throw uploadError;
                  } else {
                    const { data: { session } } = await client.auth.getSession();
                    if (!session) throw new Error('Сессия завершена. Войдите снова.');
                    const root = process.env.NEXT_PUBLIC_SUPABASE_URL || '';
                    const proxy = window.location.hostname === 'connect-chat.duckdns.org';
                    const endpoint = proxy
                      ? `${window.location.origin}/supabase-storage/storage/v1/upload/resumable`
                      : `${root.replace('.supabase.co', '.storage.supabase.co')}/storage/v1/upload/resumable`;
                    await new Promise<void>((resolve, reject) => {
                      const request = new tus.Upload(file, {
                        endpoint,
                        retryDelays: [0, 3000, 5000, 10000, 20000],
                        headers: { authorization: `Bearer ${session.access_token}`, 'x-upsert': 'false' },
                        uploadDataDuringCreation: true,
                        removeFingerprintOnSuccess: true,
                        metadata: { bucketName: BUCKET, objectName: path, contentType },
                        chunkSize: 6 * 1024 * 1024,
                        onError: reject, onSuccess: () => resolve(),
                        onProgress: (done, total) => setUploadProgress(Math.round(done / total * 100)),
                      });
                      request.start();
                    });
                  }
                  completed++;
                }
                setNotice(completed === 1 ? 'Файл добавлен.' : `Загружено файлов: ${completed}.`);
              } catch (e) {
                setError((e instanceof Error ? e.message : String(e)) + (completed ? ` · Успешно загружено: ${completed}` : ''));
              } finally {
                setBusy(false); setUploadProgress(null); await load();
              }
            }

            async function remove(item: MediaItem) {
              if (busy || !window.confirm(`Удалить «${item.name}» из своей медиатеки?`)) return;
              setBusy(true); setError('');
              try {
                const { error: removeError } = await client.storage.from(BUCKET).remove([item.path]);
                if (removeError) throw removeError;
                if (selectedSong === item.path) setSelectedSong(null);
                if (preview?.path === item.path) setPreview(null);
                setNotice('Файл удалён.');
              } catch (e) { setError('Не удалось удалить: ' + (e instanceof Error ? e.message : String(e))); }
              finally { setBusy(false); await load(); }
            }

            async function makeAvatar(item: MediaItem) {
              if (busy || !['image/jpeg', 'image/png', 'image/webp'].includes(item.mime)) return;
              setBusy(true); setError('');
              try {
                const { data, error: downloadError } = await client.storage.from(BUCKET).download(item.path);
                if (downloadError || !data) throw downloadError || new Error('Не удалось прочитать фотографию');
                onAvatar(new File([data], item.name, { type: item.mime }));
              } catch (e) { setError('Не удалось открыть редактор аватара: ' + (e instanceof Error ? e.message : String(e))); }
              finally { setBusy(false); }
            }

            const song = items.find(item => item.path === selectedSong) || items[0];
            return <>
              <header className="profile-top"><button type="button" className="icon-btn" onClick={onBack} aria-label="Вернуться в мой профиль"><span aria-hidden="true" style={{ fontSize: 30, lineHeight: 1 }}>‹</span></button><strong>{TITLES[kind]}</strong></header>
              <div className="connect-profile-media-page">
                <div className="connect-profile-media-toolbar">
                  <div><strong>{TITLES[kind]}</strong><small>Личная коллекция · {items.length} файлов</small></div>
                  <button type="button" disabled={busy} onClick={() => inputRef.current?.click()}>+ Добавить</button>
                  <input ref={inputRef} type="file" accept={ACCEPT[kind]} multiple hidden onChange={e => {
                    const files = Array.from(e.currentTarget.files || []);
                    e.currentTarget.value = '';
                    void upload(files);
                  }}/>
                </div>
                {busy && <div className="connect-profile-media-info" role="status">Загрузка или обработка файла…{uploadProgress !== null ? ` ${uploadProgress}%` : ''}</div>}
                {error && <div className="connect-profile-media-error" role="alert">{error}</div>}
                {notice && <div className="connect-profile-media-info" role="status">{notice}</div>}
                {loading ? <div className="connect-profile-media-empty">Загружаем медиатеку…</div> : items.length === 0 ? <div className="connect-profile-media-empty">Здесь пока пусто. Нажми «Добавить», чтобы загрузить {kind === 'photos' ? 'фотографии' : kind === 'videos' ? 'видео' : 'музыку'}.</div> : <>
                  {kind === 'photos' && <div className="connect-profile-photo-grid">{items.map(item => <article key={item.path} className="connect-profile-media-item">
                    <button type="button" className="connect-profile-photo-thumb" onClick={() => setPreview(item)} aria-label={`Открыть ${item.name}`}><img loading="lazy" src={item.url} alt={item.name}/></button>
                    <div className="connect-profile-media-item-caption" title={item.name}>{item.name}</div>
                    <div className="connect-profile-media-item-actions"><button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(item.mime)} onClick={() => void makeAvatar(item)}>На аватар</button><button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button></div>
                  </article>)}</div>}
                  {kind === 'videos' && <div className="connect-profile-video-list">{items.map(item => <article key={item.path} className="connect-profile-media-item">
                    <video src={item.url} playsInline controls preload="metadata" className="connect-profile-video-player" aria-label={item.name}/>
                    <div className="connect-profile-media-item-info"><strong title={item.name}>{item.name}</strong><button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button></div>
                  </article>)}</div>}
                  {kind === 'music' && <>
                    {song && <div className="connect-profile-music-player"><small>Сейчас выбрано</small><strong>{song.name}</strong><audio key={song.path} src={song.url} controls preload="metadata" aria-label={`Прослушать ${song.name}`}/></div>}
                    <div className="connect-profile-track-list">{items.map((item, index) => <div key={item.path} className={'connect-profile-track' + (song?.path === item.path ? ' selected' : '')}>
                      <button type="button" className="connect-profile-track-select" onClick={() => setSelectedSong(item.path)} aria-label={`Выбрать трек ${item.name}`}><span aria-hidden="true">♪</span><span><strong>{item.name}</strong><small>Трек {index + 1}</small></span></button>
                      <button type="button" disabled={busy} className="connect-profile-track-delete" onClick={() => void remove(item)} aria-label={`Удалить ${item.name}`}>Удалить</button>
                    </div>)}</div>
                  </>}
                </>}
                <p className="connect-profile-media-hint">Файлы доступны только тебе в Connect. До 100 МБ на файл. Для аватара подходят JPG, PNG и WebP.</p>
              </div>
              {preview && <div className="connect-profile-photo-overlay" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" onClick={() => setPreview(null)}>
                <button type="button" className="connect-profile-photo-close" onClick={() => setPreview(null)}>Закрыть</button>
                <img src={preview.url} alt={preview.name} onClick={e => e.stopPropagation()}/>
                <button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(preview.mime)} onClick={e => { e.stopPropagation(); void makeAvatar(preview); setPreview(null); }}>Сделать аватаром</button>
              </div>}
            </>;
          }''', encoding='utf-8')
          Path('app/profile-media.css').write_text(r'''/* Connect: own private photo/video/music library in the profile. */
          .connect-app .connect-profile-library-links { display:grid; gap:10px; margin:0 0 14px; }
          .connect-app .connect-profile-library-link { display:flex; width:100%; align-items:center; gap:13px; min-height:68px;
            border:1px solid var(--v4-border, var(--border)); border-radius:20px; padding:11px 16px;
            color:var(--text); background:var(--v4-card, var(--panel)); box-shadow:var(--v4-highlight,none); text-align:left; cursor:pointer; }
          .connect-app .connect-profile-library-link-icon { width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
            color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); font-size:25px; flex:0 0 auto; }
          .connect-app .connect-profile-library-link-text { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
          .connect-app .connect-profile-library-link-text strong {font-size:16px;}
          .connect-app .connect-profile-library-link-text small {font-size:12px; color:var(--muted);}
          .connect-app .connect-profile-library-link-arrow { color:var(--muted); font-size:26px; }
          .connect-app .connect-profile-media-page { flex:1; min-height:0; overflow-y:auto; padding:16px 15px max(42px,env(safe-area-inset-bottom));
            -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
          .connect-app .connect-profile-media-toolbar { display:flex; gap:12px; align-items:center; justify-content:space-between; margin:0 0 16px;
            padding:15px; border:1px solid var(--v4-border,var(--border)); border-radius:19px; background:var(--v4-card,var(--panel)); }
          .connect-app .connect-profile-media-toolbar >div {display:flex;flex-direction:column;gap:4px;min-width:0;}
          .connect-app .connect-profile-media-toolbar strong {font-size:19px;}
          .connect-app .connect-profile-media-toolbar small {font-size:12px;color:var(--muted);}
          .connect-app .connect-profile-media-toolbar button {color:white;background:var(--accent);border:0;border-radius:12px;
            padding:10px 13px;font-weight:650;font-size:13px;flex:0 0 auto;}
          .connect-app .connect-profile-media-toolbar button:disabled {opacity:.5;}
          .connect-app .connect-profile-media-empty,.connect-app .connect-profile-media-info,.connect-app .connect-profile-media-error {padding:18px;
            border:1px solid var(--v4-border,var(--border)); border-radius:17px; background:var(--v4-card,var(--panel)); font-size:13px; color:var(--muted); margin-bottom:12px;}
          .connect-app .connect-profile-media-error{color:#fa8393;}
          .connect-app .connect-profile-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
          .connect-app .connect-profile-media-item{min-width:0;overflow:hidden;border:1px solid var(--v4-border,var(--border));
            border-radius:18px;background:var(--v4-card,var(--panel));}
          .connect-app .connect-profile-photo-thumb{display:block;border:0;margin:0;padding:0;background:color-mix(in srgb,var(--panel) 72%,#111b2b);width:100%;aspect-ratio:1;overflow:hidden;}
          .connect-app .connect-profile-photo-thumb img{width:100%;height:100%;display:block;object-fit:cover;}
          .connect-app .connect-profile-media-item-caption{font-size:12px;line-height:1.35;color:var(--text);padding:9px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
          .connect-app .connect-profile-media-item-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;}
          .connect-app .connect-profile-media-item-actions button,.connect-app .connect-profile-media-item-info button,.connect-app .connect-profile-track-delete{
            color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 23%,var(--border));
            border-radius:10px;padding:7px 9px;font-size:11px;white-space:nowrap;}
          .connect-app .connect-profile-media-item-actions button:disabled{opacity:.36;}
          .connect-app .connect-profile-video-list{display:grid;gap:14px;}
          .connect-app .connect-profile-video-player{display:block;width:100%;max-height:340px;aspect-ratio:auto;object-fit:contain;background:#070b12;border-radius:14px 14px 0 0;}
          .connect-app .connect-profile-media-item-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px;}
          .connect-app .connect-profile-media-item-info strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;}
          .connect-app .connect-profile-music-player{position:sticky;top:0;z-index:4;display:flex;flex-direction:column;gap:9px;
            padding:16px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:20px;
            background:var(--v4-card,var(--panel));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
          .connect-app .connect-profile-music-player small{font-size:11px;color:var(--muted);}
          .connect-app .connect-profile-music-player strong{font-size:15px;overflow-wrap:anywhere;}
          .connect-app .connect-profile-music-player audio{width:100%;height:43px;}
          .connect-app .connect-profile-track-list{display:flex;flex-direction:column;gap:9px;}
          .connect-app .connect-profile-track{display:flex;gap:10px;align-items:center;border:1px solid var(--v4-border,var(--border));border-radius:15px;
            background:var(--v4-card,var(--panel));padding:9px 11px;}
          .connect-app .connect-profile-track.selected{border-color:color-mix(in srgb,var(--accent) 56%,transparent);}
          .connect-app .connect-profile-track-select{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:transparent;border:0;color:var(--text);text-align:left;padding:0;}
          .connect-app .connect-profile-track-select>span:first-child{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:11px;
            color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:23px;}
          .connect-app .connect-profile-track-select>span:last-child{display:flex;min-width:0;flex-direction:column;gap:4px;}
          .connect-app .connect-profile-track-select strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;}
          .connect-app .connect-profile-track-select small{color:var(--muted);font-size:11px;}
          .connect-app .connect-profile-media-hint{font-size:11px;color:var(--muted);line-height:1.5;margin:16px 4px 0;}
          .connect-app .connect-profile-photo-overlay{position:absolute;inset:0;z-index:19000;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:calc(env(safe-area-inset-top) + 22px) 14px calc(env(safe-area-inset-bottom) + 22px);gap:20px;background:rgba(0,5,15,.96);}
          .connect-app .connect-profile-photo-overlay img{max-width:100%;max-height:72%;object-fit:contain;}
          .connect-app .connect-profile-photo-overlay button{color:white;background:color-mix(in srgb,var(--accent) 25%,#1a2c45);border:1px solid color-mix(in srgb,var(--accent) 45%,white 10%);
            border-radius:12px;padding:11px 20px;}
          .connect-app .connect-profile-photo-overlay button:disabled{opacity:.38;}
          .connect-app .connect-profile-photo-overlay .connect-profile-photo-close{position:absolute;top:max(18px,env(safe-area-inset-top));right:16px;}
          @media(max-width:360px){.connect-app .connect-profile-photo-grid{gap:8px}.connect-app .connect-profile-media-item-actions{gap:3px;padding:7px}.connect-app .connect-profile-media-item-actions button{padding:6px;font-size:10px}}''', encoding='utf-8')
          Path('sql/connect_profile_media.sql').write_text(r'''-- Connect: private media library for the signed-in profile.
          -- Photos, videos and music are never exposed as public URLs.
          INSERT INTO storage.buckets (id, name, public, file_size_limit)
          VALUES ('connect-profile-media', 'connect-profile-media', false, 104857600)
          ON CONFLICT (id) DO NOTHING;

          DROP POLICY IF EXISTS "connect profile media read own" ON storage.objects;
          CREATE POLICY "connect profile media read own" ON storage.objects
          FOR SELECT TO authenticated USING (
            bucket_id = 'connect-profile-media'
            AND (storage.foldername(name))[1] = (SELECT auth.uid())::text
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
          );

          DROP POLICY IF EXISTS "connect profile media upload own" ON storage.objects;
          CREATE POLICY "connect profile media upload own" ON storage.objects
          FOR INSERT TO authenticated WITH CHECK (
            bucket_id = 'connect-profile-media'
            AND (storage.foldername(name))[1] = (SELECT auth.uid())::text
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
          );

          DROP POLICY IF EXISTS "connect profile media delete own" ON storage.objects;
          CREATE POLICY "connect profile media delete own" ON storage.objects
          FOR DELETE TO authenticated USING (
            bucket_id = 'connect-profile-media'
            AND (storage.foldername(name))[1] = (SELECT auth.uid())::text
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
          );''', encoding='utf-8')
          from pathlib import Path

