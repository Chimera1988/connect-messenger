          page_file.write_text(page, encoding='utf-8')

          layout_file = Path('app/layout.tsx')
          layout = layout_file.read_text(encoding='utf-8')
          if "import './profile-media.css';" not in layout:
              if layout.count("import './calls.css';") != 1:
                  raise RuntimeError('Missing app/layout.tsx CSS import anchor')
