                          <button type="button" className="connect-profile-library-link" onClick={()=>setProfileMediaOpen('photos')}><span className="connect-profile-library-link-icon" aria-hidden="true">▧</span><span className="connect-profile-library-link-text"><strong>Мои фото</strong><small>Коллекция фотографий и выбор аватара</small></span><span className="connect-profile-library-link-arrow" aria-hidden="true">›</span></button>
                          <button type="button" className="connect-profile-library-link" onClick={()=>setProfileMediaOpen('videos')}><span className="connect-profile-library-link-icon" aria-hidden="true">▶</span><span className="connect-profile-library-link-text"><strong>Мои видео</strong><small>Личные видеозаписи</small></span><span className="connect-profile-library-link-arrow" aria-hidden="true">›</span></button>
                          <button type="button" className="connect-profile-library-link" onClick={()=>setProfileMediaOpen('music')}><span className="connect-profile-library-link-icon" aria-hidden="true">♫</span><span className="connect-profile-library-link-text"><strong>Моя музыка</strong><small>Треки и встроенный аудиоплеер</small></span><span className="connect-profile-library-link-arrow" aria-hidden="true">›</span></button>
                        </nav>}
                        {profileView===user.id ? <form className="profile-edit" onSubmit={saveProfile}>''',
          )
          replace_once(
              '''            </div>
                    </div>
                    : activeChat && selected ? <div className="chat-view">''',
              '''            </div>
                      </>}
                    </div>
                    : activeChat && selected ? <div className="chat-view">''',
