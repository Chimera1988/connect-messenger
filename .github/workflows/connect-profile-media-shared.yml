      - name: Enable read-only profile media for other members
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('components/ConnectProfileMedia.tsx')
          s = component.read_text(encoding='utf-8')

          def once(old, new, name):
              global s
              if new in s:
                  return
              if s.count(old) != 1:
                  for shift in range(1,24):
                      alt = "\n".join(line[shift:] if line.startswith(" " * shift) else line for line in old.split("\n"))
                      if s.count(alt) == 1:
                          old = alt
                          new = "\n".join(line[shift:] if line.startswith(" " * shift) else line for line in new.split("\n"))
                          break
              if s.count(old) != 1:
                  raise RuntimeError(f'Component anchor {name}: expected 1, got {s.count(old)}')
              s = s.replace(old, new, 1)

          once("  onAvatar: (file: File) => void;", "  onAvatar: (file: File) => void;\n  isOwner: boolean;", "owner prop")
          once("export default function ConnectProfileMedia({ client, userId, kind, onBack, onAvatar }: Props) {", "export default function ConnectProfileMedia({ client, userId, kind, onBack, onAvatar, isOwner }: Props) {", "owner argument")
          once("    const directory = `${userId}/${kind}`;", "    const directory = `${userId}/${kind}`;\n    const heading = isOwner ? TITLES[kind] : ({ photos: 'Фото', videos: 'Видео', music: 'Музыка' } as const)[kind];", "visitor heading")
          once("      if (busy || !files.length) return;", "      if (!isOwner || busy || !files.length) return;", "upload guard")
          once("      if (busy || !window.confirm(`Удалить «${item.name}» из своей медиатеки?`)) return;", "      if (!isOwner || busy || !window.confirm(`Удалить «${item.name}» из своей медиатеки?`)) return;", "delete guard")
          once("      if (busy || !['image/jpeg', 'image/png', 'image/webp'].includes(item.mime)) return;", "      if (!isOwner || busy || !['image/jpeg', 'image/png', 'image/webp'].includes(item.mime)) return;", "avatar guard")
          once("<strong>{TITLES[kind]}</strong></header>", "<strong>{heading}</strong></header>", "header heading")
          once("<div><strong>{TITLES[kind]}</strong><small>Личная коллекция · {items.length} файлов</small></div>", "<div><strong>{heading}</strong><small>{isOwner ? 'Медиатека профиля' : 'Медиа пользователя'} · {items.length} файлов</small></div>", "toolbar heading")
          once('''                  <button type="button" disabled={busy} onClick={() => inputRef.current?.click()}>+ Добавить</button>
                            <input ref={inputRef} type="file" accept={ACCEPT[kind]} multiple hidden onChange={e => {
                              const files = Array.from(e.currentTarget.files || []);
                              e.currentTarget.value = '';
                              void upload(files);
                            }}/>''', '''                  {isOwner && <><button type="button" disabled={busy} onClick={() => inputRef.current?.click()}>+ Добавить</button>
                            <input ref={inputRef} type="file" accept={ACCEPT[kind]} multiple hidden onChange={e => {
                              const files = Array.from(e.currentTarget.files || []);
                              e.currentTarget.value = '';
                              void upload(files);
                            }}/></>}''', "toolbar owner action")
          once("Здесь пока пусто. Нажми «Добавить», чтобы загрузить {kind === 'photos' ? 'фотографии' : kind === 'videos' ? 'видео' : 'музыку'}.", "{isOwner ? <>Здесь пока пусто. Нажми «Добавить», чтобы загрузить {kind === 'photos' ? 'фотографии' : kind === 'videos' ? 'видео' : 'музыку'}.</> : 'Пользователь ещё ничего не добавил.'}", "empty state")
          once('''                    <div className="connect-profile-media-item-actions"><button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(item.mime)} onClick={() => void makeAvatar(item)}>На аватар</button><button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button></div>''', '''                    {isOwner && <div className="connect-profile-media-item-actions"><button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(item.mime)} onClick={() => void makeAvatar(item)}>На аватар</button><button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button></div>}''', "photo owner actions")
          once('''<strong title={item.name}>{item.name}</strong><button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button>''', '''<strong title={item.name}>{item.name}</strong>{isOwner && <button type="button" disabled={busy} onClick={() => void remove(item)}>Удалить</button>}''', "video owner actions")
          once('''                      <button type="button" disabled={busy} className="connect-profile-track-delete" onClick={() => void remove(item)} aria-label={`Удалить ${item.name}`}>Удалить</button>''', '''                      {isOwner && <button type="button" disabled={busy} className="connect-profile-track-delete" onClick={() => void remove(item)} aria-label={`Удалить ${item.name}`}>Удалить</button>}''', "music owner actions")
          once('''      <p className="connect-profile-media-hint">Файлы доступны только тебе в Connect. До 100 МБ на файл. Для аватара подходят JPG, PNG и WebP.</p>''', '''      <p className="connect-profile-media-hint">{isOwner ? 'Медиа доступны другим участникам Connect при просмотре твоего профиля. Максимум 100 МБ на файл.' : 'Медиа этого пользователя доступны для просмотра и прослушивания только участникам Connect.'}</p>''', "visibility explanation")
          once('''      <button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(preview.mime)} onClick={e => { e.stopPropagation(); void makeAvatar(preview); setPreview(null); }}>Сделать аватаром</button>''', '''      {isOwner && <button type="button" disabled={busy || !['image/jpeg','image/png','image/webp'].includes(preview.mime)} onClick={e => { e.stopPropagation(); void makeAvatar(preview); setPreview(null); }}>Сделать аватаром</button>}''', "overlay owner action")

          component.write_text(s, encoding='utf-8')

          pagefile = Path('app/page.tsx')
          p = pagefile.read_text(encoding='utf-8')
          marker = '/* Connect profile media visible to members v2 */'
          if marker not in p:
              old = '''{profileView===user.id && profileMediaOpen ? <ConnectProfileMedia key={profileMediaOpen} client={supabase!} userId={user.id} kind={profileMediaOpen} onBack={()=>setProfileMediaOpen(null)} onAvatar={selectAvatar}/> : <>'''
              new = '''{profileMediaOpen ? <ConnectProfileMedia key={`${profileView}:${profileMediaOpen}`} client={supabase!} userId={profileView} isOwner={profileView===user.id} kind={profileMediaOpen} onBack={()=>setProfileMediaOpen(null)} onAvatar={selectAvatar}/> : <>'''
              if p.count(old)!=1: raise RuntimeError('Profile media main branch v1 anchor missing')
              p=p.replace(old,new,1)
              nav_old = '''{profileView===user.id && <nav className="connect-profile-library-links" aria-label="Моя медиатека">'''
              nav_new = '''<nav className="connect-profile-library-links" aria-label="Медиатека профиля">'''
              if p.count(nav_old)!=1:raise RuntimeError('Profile library nav v1 anchor missing')
              p=p.replace(nav_old,nav_new,1)
              titles = {
                 '<strong>Мои фото</strong>': "<strong>{profileView===user.id ? 'Мои фото' : 'Фото'}</strong>",
                 '<strong>Мои видео</strong>': "<strong>{profileView===user.id ? 'Мои видео' : 'Видео'}</strong>",
                 '<strong>Моя музыка</strong>': "<strong>{profileView===user.id ? 'Моя музыка' : 'Музыка'}</strong>",
              }
              for old_t,new_t in titles.items():
                  if p.count(old_t)!=1: raise RuntimeError(f'Profile navigation title missing: {old_t}')
                  p=p.replace(old_t,new_t,1)
              captions={
                'Коллекция фотографий и выбор аватара': "{profileView===user.id ? 'Коллекция фотографий и выбор аватара' : 'Фотографии пользователя'}",
                'Личные видеозаписи': "{profileView===user.id ? 'Мои видеозаписи' : 'Видеозаписи пользователя'}",
                'Треки и встроенный аудиоплеер': "{profileView===user.id ? 'Треки и встроенный аудиоплеер' : 'Музыка и встроенный плеер'}",
              }
              for old_t,new_t in captions.items():
                  if p.count(old_t)!=1: raise RuntimeError('Profile caption anchor missing: ' + old_t)
                  p=p.replace(old_t,new_t,1)
              nav_closer='''              </nav>}'''
              if p.count(nav_closer)!=1: raise RuntimeError('Profile nav closing anchor missing')
              p=p.replace(nav_closer,'''              </nav>''',1)
              state_anchor = "  const [profileMediaOpen, setProfileMediaOpen] = useState<ProfileMediaKind | null>(null);"
              if p.count(state_anchor) != 1: raise RuntimeError('Profile media state marker anchor missing')
              p=p.replace(state_anchor, state_anchor + ' ' + marker, 1)
              pagefile.write_text(p,encoding='utf-8')

          sql = '''-- Connect profile media: each owner manages own files; logged-in members may view other active profiles.
          -- The bucket remains PRIVATE: no anonymous/public bucket access.
          INSERT INTO storage.buckets (id, name, public, file_size_limit)
          VALUES ('connect-profile-media','connect-profile-media',false,104857600)
          ON CONFLICT (id) DO NOTHING;

          DROP POLICY IF EXISTS "connect profile media read own" ON storage.objects;
          DROP POLICY IF EXISTS "connect profile media read member" ON storage.objects;
          CREATE POLICY "connect profile media read member" ON storage.objects
          FOR SELECT TO authenticated USING (
            bucket_id='connect-profile-media'
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
            AND EXISTS (
              SELECT 1 FROM public.profiles owner_profile
              WHERE owner_profile.id::text = (storage.foldername(name))[1]
                AND owner_profile.is_blocked = false
            )
          );

          DROP POLICY IF EXISTS "connect profile media upload own" ON storage.objects;
          CREATE POLICY "connect profile media upload own" ON storage.objects
          FOR INSERT TO authenticated WITH CHECK (
            bucket_id='connect-profile-media'
            AND (storage.foldername(name))[1] = (SELECT auth.uid())::text
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
          );

          DROP POLICY IF EXISTS "connect profile media delete own" ON storage.objects;
          CREATE POLICY "connect profile media delete own" ON storage.objects
          FOR DELETE TO authenticated USING (
            bucket_id='connect-profile-media'
            AND (storage.foldername(name))[1] = (SELECT auth.uid())::text
            AND (storage.foldername(name))[2] IN ('photos','videos','music')
          );
          '''
          Path('sql/connect_profile_media.sql').write_text(sql,encoding='utf-8')
          print('Connect profile media is now shared read-only with members; owner controls preserved.')
          PY
      - name: Validate patch formatting
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit and deploy
        shell: bash
        run: |
          git add app/page.tsx app/layout.tsx app/profile-media.css components/ConnectProfileMedia.tsx sql/connect_profile_media.sql
          if git diff --cached --quiet; then
            echo "Profile media already accessible to members."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: viewable photo video music on member profiles"
          git push origin HEAD:main
