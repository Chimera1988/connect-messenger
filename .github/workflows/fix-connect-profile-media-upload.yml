name: Connect - fix profile media uploads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-connect-profile-media-upload.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct Supabase Storage names and keep upload errors visible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path('components/ConnectProfileMedia.tsx')
          code = file.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global code
              if old in code:
                  if code.count(old) != 1:
                      raise RuntimeError(f'{label}: ambiguous match')
                  code = code.replace(old, new, 1)
                  print(f'Fixed: {label}')
              elif new in code:
                  print(f'Already fixed: {label}')
              else:
                  raise RuntimeError(f'{label}: unexpected source code; no changes committed')

          # Supabase Storage rejects '~' in object keys (400 Invalid key).
          # Use '__', which consists only of permitted ASCII characters.
          replace_once(
              "  const suffix = name.split('~').slice(1).join('~');",
              "  const suffix = name.split('__').slice(1).join('__');",
              'decode media filename'
          )
          replace_once(
              "const path = `${directory}/${Date.now()}-${crypto.randomUUID()}~${encodeName(file.name)}.${ext}`;",
              "const path = `${directory}/${Date.now()}-${crypto.randomUUID()}__${encodeName(file.name)}.${ext}`;",
              'safe media storage path'
          )

          # Bound the UTF-8 byte length so long Cyrillic/emoji filenames do not
          # produce oversized object keys after URL-safe base64 encoding.
          replace_once(
              "  const clipped = name.length <= 70 ? name : name.slice(0, 68 - ext.length) + '.' + ext;\n  const bytes = new TextEncoder().encode(clipped);",
              "  const suffix = '.' + ext;\n  const chars = Array.from(name.slice(0, -suffix.length));\n  const encoder = new TextEncoder();\n  while (chars.length && encoder.encode(chars.join('') + suffix).length > 88) chars.pop();\n  const bytes = encoder.encode(chars.join('') + suffix);",
              'bound UTF-8 filename length'
          )

          # Previously load() cleared any error immediately after upload()'s
          # catch block, leaving the user staring at a silent empty library.
          replace_once(
              "    setLoading(true);\n    setError('');\n    const { data, error: listError }",
              "    setLoading(true);\n    const { data, error: listError }",
              'keep upload errors visible after refresh'
          )

          file.write_text(code, encoding='utf-8')
          PY
          git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit and deploy the fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ConnectProfileMedia.tsx
          if git diff --cached --quiet; then
            echo 'Profile media upload fix already applied.'
            exit 0
          fi
          git commit -m 'fix: upload profile media using valid storage keys'
          git push origin HEAD:main
