name: Fix Connect 1.3.3 TypeScript (chat and sounds)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-connect-chat-ts.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fix both TypeScript errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path('app/page.tsx'),
                  '|| (last?.sender_id === user?.id && m.id === last.id));',
                  '|| (last?.sender_id === user?.id && m.id === last?.id));',
              ),
              (
                  Path('components/ConnectNotificationSettings.tsx'),
                  'const Audio = audioWindow.AudioContext || audioWindow.webkitAudioContext;',
                  "const Audio = typeof AudioContext !== 'undefined' ? AudioContext : audioWindow.webkitAudioContext;",
              ),
          ]
          for path, old, new in patches:
              source = path.read_text(encoding='utf-8')
              if source.count(old) == 1:
                  path.write_text(source.replace(old, new), encoding='utf-8')
                  print(f'Fixed {path}')
              elif source.count(new) == 1:
                  print(f'Already fixed {path}')
              else:
                  raise SystemExit(f'Unexpected source in {path}; stop without changing other code')
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Validate TypeScript
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit only verified fixes
        shell: bash
        run: |
          git config user.name 'Connect build fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx components/ConnectNotificationSettings.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: type-safe chat scroll and audio preview on PWA'
            git push origin HEAD:main
          else
            echo 'Both TypeScript fixes are already applied'
          fi
