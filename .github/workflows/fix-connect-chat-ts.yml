name: Fix Connect 1.3.3 chat build (TypeScript)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-connect-chat-ts.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fix optional last message access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path('app/page.tsx')
          source = file.read_text(encoding='utf-8')
          old = '|| (last?.sender_id === user?.id && m.id === last.id));'
          new = '|| (last?.sender_id === user?.id && m.id === last?.id));'
          if source.count(old) == 1:
              file.write_text(source.replace(old, new), encoding='utf-8')
              print('Fixed: last.id -> last?.id')
          elif source.count(new) == 1:
              print('Fix already applied')
          else:
              raise SystemExit('Expected code not found: stop rather than changing unrelated code')
          PY

      - name: Validate changes
        run: git diff --check

      - name: Check TypeScript before committing
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit only the corrected application file
        shell: bash
        run: |
          git config user.name 'Connect build fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: guard missing last message in chat navigation'
            git push origin HEAD:main
          else
            echo 'Already fixed; no commit needed'
          fi
