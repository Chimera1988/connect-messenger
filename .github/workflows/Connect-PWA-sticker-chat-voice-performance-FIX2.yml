name: Connect PWA | Faster chat sends voice and stickers FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-chat-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify repository and base revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s app/page.tsx
          test -s app/globals.css
          test -s lib/media-cache.ts
          test -s package-lock.json
          grep -q 'CONNECT_PWA_STICKER_BINARY_TRANSPORT_FIX4_20261115' app/page.tsx
      - name: Apply guarded integrated PWA performance patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect_chat_speed_patch.py" <<'CONNECT_CHAT_SPEED_PATCH'
          #!/usr/bin/env python3
          """Guarded optimization of Connect PWA sticker hydration, first send, and voice media.
          Fails closed if the repository's expected source changes.
          """
          from pathlib import Path

          ROOT = Path('.')
          PAGE = ROOT / 'app/page.tsx'
          MEDIA = ROOT / 'lib/media-cache.ts'
          CSS = ROOT / 'app/globals.css'
          MARK = 'CONNECT_PWA_CHAT_SPEED_STICKER_VOICE_V1_20261115'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              # Fast exact replacement; fail closed if the intended anchor is duplicated.
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if count > 1:
                  raise RuntimeError(f'{label}: ambiguous exact matches ({count})')

              # GitHub's TSX source indents inner lines differently from the V1
              # embedded Python strings. Only normalize LEADING indentation in
              # complete multiline blocks; keep every code token unchanged.
              # In particular this fixes the audio-warmup guard which failed V1.
              if '\n' in old:
                  wanted = old.splitlines()
                  lines = text.splitlines(keepends=True)
                  candidates = [i for i in range(len(lines) - len(wanted) + 1)
                      if all(lines[i + j].strip() == wanted[j].strip()
                             for j in range(len(wanted)))]
                  if len(candidates) == 1:
                      i = candidates[0]
                      matched = ''.join(lines[i:i + len(wanted)])
                      suffix = '\n' if matched.endswith('\n') and not new.endswith('\n') else ''
                      return ''.join(lines[:i]) + new + suffix + ''.join(lines[i + len(wanted):])
                  raise RuntimeError(f'{label}: expected one code-equivalent multiline block, found {len(candidates)}')
              raise RuntimeError(f'{label}: expected exactly one occurrence, found 0')

          def replace_region(text: str, start: str, end: str, replacement: str, label: str) -> str:
              if text.count(start)!=1:raise RuntimeError(f'{label}: start expected once, got {text.count(start)}')
              a=text.index(start)
              b=text.find(end,a+len(start))
              if b<0:raise RuntimeError(f'{label}: end missing')
              return text[:a]+replacement+text[b+len(end):]

          page=PAGE.read_text(encoding='utf-8')
          media=MEDIA.read_text(encoding='utf-8')
          css=CSS.read_text(encoding='utf-8')
          if MARK in page:
              print('Update already applied; no changes necessary')
              raise SystemExit(0)
          for expected in ('CONNECT_PWA_STICKER_BINARY_TRANSPORT_FIX4_20261115','CONNECT_PWA_CHAT_MEDIA_ENTRY_V2','const VoicePlayer = memo(function VoicePlayer'):
              if expected not in page:raise RuntimeError('Source incompatible: '+expected)

          page=replace_once(page,
              "import { prefetchCachedMedia } from '../lib/media-cache';",
              "import { prefetchCachedMedia, prefetchChatAudio, prefetchStickerWebp } from '../lib/media-cache'; // "+MARK,
              'media-cache import')

          # Avoid decoding 80 recordings at once when opening a long conversation.
          old_start = "  useEffect(() => {\n    let cancelled = false;\n    const controller = new AbortController();\n    let context: AudioContext | null = null;\n    const cached = isNativeMediaRuntime()?voiceWaveformCache.get(src):readChatWave(waveOwner,path);"
          old_end = "  }, [src,path,waveOwner]);"
          new_wave = """  useEffect(() => {
              const cached = isNativeMediaRuntime()?voiceWaveformCache.get(path):readChatWave(waveOwner,path);
              if (cached) { setBars(cached.bars); setDuration(cached.duration); }
              else { setBars(Array(43).fill(0.28)); setDuration(0); }
              // Never fetch or decode an audio file during initial chat render.
              // Decoding 80 recordings at once blocked the very first play and text send.
            }, [path,waveOwner]);"""
          page=replace_region(page,old_start,old_end,new_wave,'eager voice waveform')
          # Voice playback must be independent of the lazy signer, and recover once from an expired URL.
          page=replace_once(page,
              "  const [error, setError] = useState(false);\n  const seeking = useRef(false);",
              """  const [error, setError] = useState(false);
            const [buffering,setBuffering] = useState(false);
            const [playSrc,setPlaySrc] = useState(src||'');
            const seeking = useRef(false);
            useEffect(()=>{setPlaySrc(src||'');setError(false);},[src,path]);""",
              'voice state')
          old_toggle="""  async function toggle() {
              const audio = audioRef.current;
              if (!audio) return;
              if (!audio.paused) { audio.pause(); return; }
              // Only one voice message should play at a time.
              document.querySelectorAll<HTMLAudioElement>('audio[data-connect-voice]').forEach(other => {
                if (other !== audio) other.pause();
              });
              try { setError(false); await audio.play(); } catch { setError(true); }
            }"""
          new_toggle="""  async function toggle() {
              const audio=audioRef.current;
              if(!audio||buffering)return;
              if(!audio.paused){audio.pause();return;}
              document.querySelectorAll<HTMLAudioElement>('audio[data-connect-voice]').forEach(other=>{
                if(other!==audio)other.pause();
              });
              setError(false);
              setBuffering(true);
              try {
                const identity='/storage/v1/object/sign/connect-attachments/'+path;
                let current=playSrc||src||'';
                if(!current){
                  const cached=await resolveCachedMedia(identity,waveOwner).catch(()=>identity);
                  current=cached.startsWith('blob:')?cached:(await refreshMediaUrl(identity)||'');
                  if(!current)throw new Error('Voice message URL is not ready');
                  audio.src=current;setPlaySrc(current);
                }
                try {
                  // For normal, already-signed files play() runs in the user click gesture.
                  await audio.play();
                } catch(firstError) {
                  if(!navigator.onLine||audio.error?.code===3||audio.error?.code===4)throw firstError;
                  const renewed=await refreshMediaUrl(identity);
                  if(!renewed||renewed===current)throw firstError;
                  audio.src=renewed;setPlaySrc(renewed);audio.load();
                  await audio.play();
                }
              } catch {setError(true);}
              finally {setBuffering(false);}
            }"""
          page=replace_once(page,old_toggle,new_toggle,'voice play on demand')
          page=replace_once(page,
              'data-connect-voice src={src} preload="metadata"',
              'data-connect-voice src={playSrc||undefined} preload="none"',
              'audio no eager metadata')
          page=replace_once(page,
              'onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}',
              'onPlay={() => {setPlaying(true);setError(false);setBuffering(false);}} onPause={() => setPlaying(false)}',
              'voice play event')
          page=replace_once(page,
              'onEnded={() => {setPlaying(false);setPosition(0);}} onError={() => setError(true)}/>',
              'onEnded={() => {setPlaying(false);setPosition(0);}} onError={() => {setError(true);setBuffering(false);}}/>',
              'voice error event')
          page=replace_once(page,
              '{error ? \'Не удалось воспроизвести\' : `${voiceTime(playing || position > 0 ? position : duration)}${playing || position > 0 ? \' / \'+voiceTime(duration) : \'\'}`}',
              '{buffering ? \'Загружаю аудио…\' : error ? \'Не удалось воспроизвести\' : `${voiceTime(playing || position > 0 ? position : duration)}${playing || position > 0 ? \' / \'+voiceTime(duration) : \'\'}`}',
              'voice buffering indicator')
          page=replace_once(page,
              "    <button type=\"button\" className=\"voice-play\" onClick={e => {e.stopPropagation();void toggle();}} aria-label={playing ? 'Пауза' : 'Воспроизвести голосовое'}>",
              "    <button type=\"button\" className=\"voice-play\" onClick={e => {e.stopPropagation();void toggle();}} aria-label={playing ? 'Пауза' : 'Воспроизвести голосовое'} disabled={buffering}>",
              'voice play button')

          # Prepare sticker assets incrementally. The existing Promise.all barrier held every
          # signed URL until even the slowest request completed. Persist small WebPs by path.
          old_catalog="""  const loadCustomStickers=useCallback(async()=>{
              if(!supabase||!user)return;
              const packs=await supabase.from('connect_sticker_packs').select('id,name,emoji,owner_id,is_public,created_at').order('created_at',{ascending:false});
              if(packs.error)return;
              const list=(packs.data||[]) as CustomPack[];
              setCustomPacks(list);
              if(!list.length){setCustomStickers([]);return;}
              const stickers=await supabase.from('connect_stickers').select('id,pack_id,name,storage_path,position').in('pack_id',list.map(p=>p.id)).order('position');
              if(!stickers.error){
                const items=(stickers.data||[]) as CustomSticker[];setCustomStickers(items);
                const urls:Record<string,string>={};
                await Promise.all(items.map(async st=>{const {data}=await supabase!.storage.from('connect-stickers').createSignedUrl(st.storage_path,3600);if(data?.signedUrl)urls[st.id]=mediaUrl(data.signedUrl)}));
                setCustomStickerUrls(urls);
              }
            },[user?.id]);"""
          new_catalog="""  const stickerCatalogEpoch=useRef(0);
            const stickerPriority=useRef<Set<string>>(new Set());
            const [stickerCatalogReady,setStickerCatalogReady]=useState(false);
            useEffect(()=>{
              const ids=new Set<string>();
              for(const m of messages){
                const found=m.body.match(/^\\[\\[connect-custom-sticker:([0-9a-f-]{36})\\]\\]$/);
                if(found)ids.add(found[1]);
              }
              stickerPriority.current=ids;
            },[messages]);
            useEffect(()=>{stickerCatalogEpoch.current++;setStickerCatalogReady(false);setCustomStickerUrls({});},[user?.id]);
            const loadCustomStickers=useCallback(async()=>{
              if(!supabase||!user)return;
              const epoch=++stickerCatalogEpoch.current;
              const viewer=user.id;
              const packs=await supabase.from('connect_sticker_packs').select('id,name,emoji,owner_id,is_public,created_at').order('created_at',{ascending:false});
              if(epoch!==stickerCatalogEpoch.current||packs.error)return;
              const list=(packs.data||[]) as CustomPack[];
              setCustomPacks(list);
              if(!list.length){setCustomStickers([]);setCustomStickerUrls({});setStickerCatalogReady(true);return;}
              const stickers=await supabase.from('connect_stickers').select('id,pack_id,name,storage_path,position').in('pack_id',list.map(p=>p.id)).order('position');
              if(epoch!==stickerCatalogEpoch.current||stickers.error)return;
              const items=(stickers.data||[]) as CustomSticker[];
              setCustomStickers(items);
              setStickerCatalogReady(true);
              // Prioritize stickers referenced by the open history. Do not wait for
              // hundreds of Storage signing requests before presenting any of them.
              const queue=[...items].sort((a,b)=>Number(stickerPriority.current.has(b.id))-Number(stickerPriority.current.has(a.id)));
              let cursor=0;
              const worker=async()=>{
                while(epoch===stickerCatalogEpoch.current&&cursor<queue.length){
                  const st=queue[cursor++];
                  const identity='/storage/v1/object/sign/connect-stickers/'+st.storage_path;
                  try {
                    const local=await resolveCachedMedia(identity,viewer);
                    if(epoch!==stickerCatalogEpoch.current)return;
                    if(local.startsWith('blob:')){
                      setCustomStickerUrls(prev=>prev[st.id]===local?prev:{...prev,[st.id]:local});
                      continue;
                    }
                    const {data}=await supabase!.storage.from('connect-stickers').createSignedUrl(st.storage_path,3600);
                    if(epoch!==stickerCatalogEpoch.current)return;
                    if(!data?.signedUrl)continue;
                    const signed=mediaUrl(data.signedUrl);
                    setCustomStickerUrls(prev=>prev[st.id]===signed?prev:{...prev,[st.id]:signed});
                    // Queue a small, account-scoped cache write. Never block the UI on it.
                    void prefetchStickerWebp(signed,viewer).catch(()=>{});
                  }catch{/* Retry on next login/visibility refresh; never expose private packs. */}
                }
              };
              await Promise.all(Array.from({length:Math.min(4,queue.length)},()=>worker()));
            },[user?.id]);"""
          page=replace_once(page,old_catalog,new_catalog,'sticker catalog progressive load')
          # A spinner distinguishes an unloaded sticker from a truly deleted one.
          old_bubble="""const st=customStickers.find(x=>x.id===id);return st?<img className="sent-sticker" src={customStickerUrl(st)} alt="Стикер" loading="lazy"/>:<span>Стикер недоступен</span>"""
          new_bubble="""const st=customStickers.find(x=>x.id===id);const link=st?customStickerUrl(st):'';return link?<img className="sent-sticker" src={link} alt="Стикер" loading="lazy"/>:(!st&&stickerCatalogReady?<span>Стикер недоступен</span>:<span className="connect-sticker-loading" role="status" aria-label="Загрузка стикера"><i/></span>)"""
          page=replace_once(page,old_bubble,new_bubble,'sticker pending indicator')

          # Native Android must not wait for Promise.all of every audio/media signature.
          old_native="""    // The packaged Android UI keeps its original signer and playback lifecycle.
              if(isNativeMediaRuntime()){
                const paths=Array.from(new Set(messages.filter(m=>!m.deleted_at).flatMap(m=>[...(m.attachment_path?[m.attachment_path]:[]),...parseAlbum(m.body).map(x=>x.path)])));
                const missing=paths.filter(path=>!attachmentUrls[path]);
                if(missing.length)void Promise.all(missing.map(async path=>{
                  const meta=messages.find(m=>m.attachment_path===path);
                  if(meta?.attachment_kind==='image'||!meta&&supportsPhotoPreview(path)){
                    const identity='/storage/v1/object/sign/connect-attachments/'+path;
                    const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
                    if(local.startsWith('blob:'))return {path,url:local};
                  }
                  const {data}=await client.storage.from('connect-attachments').createSignedUrl(path,3600);
                  return {path,url:data?.signedUrl?mediaUrl(data.signedUrl):undefined};
                })).then(rows=>{if(!cancelled)setAttachmentUrls(prev=>{const next={...prev};rows.forEach(row=>{if(row.url)next[row.path]=row.url;});return next;});});
                return()=>{cancelled=true;};
              }"""
          new_native="""    // Android also needs progressive, bounded signing for large audio-heavy chats.
              if(isNativeMediaRuntime()){
                const selected=messages.filter(m=>!m.deleted_at&&(!activeChat||m.conversation_id===activeChat));
                const paths=Array.from(new Set([...selected].reverse().flatMap(m=>[...(m.attachment_path?[m.attachment_path]:[]),...parseAlbum(m.body).map(x=>x.path)])));
                const missing=paths.filter(path=>!attachmentUrls[path]);
                let cursor=0, audioWarm=0;
                const worker=async()=>{
                  while(!cancelled&&cursor<missing.length){
                    const path=missing[cursor++];
                    const meta=selected.find(m=>m.attachment_path===path);
                    const identity='/storage/v1/object/sign/connect-attachments/'+path;
                    try {
                      const local=await resolveCachedMedia(identity,viewer).catch(()=>identity);
                      let url=local.startsWith('blob:')?local:'';
                      if(!url){
                        const {data}=await client.storage.from('connect-attachments').createSignedUrl(path,3600);
                        url=data?.signedUrl?mediaUrl(data.signedUrl):'';
                      }
                      if(!url||cancelled)continue;
                      setAttachmentUrls(prev=>prev[path]?prev:{...prev,[path]:url});
                      if(meta?.attachment_kind==='audio'&&meta.attachment_size&&meta.attachment_size<=1024*1024&&audioWarm++<2)
                        void prefetchChatAudio(url,viewer,meta.attachment_size);
                    }catch{/* One failed attachment must not block the rest. */}
                  }
                };
                void Promise.all(Array.from({length:Math.min(4,missing.length)},()=>worker())).catch(()=>{});
                return()=>{cancelled=true;};
              }"""
          page=replace_once(page,old_native,new_native,'native progressive signing')

          # PWA attachment workers must never wait for waveform decoding in the foreground.
          old_warm="""           if(item.kind==='audio'&&index<10&&item.size>0&&item.size<=2*1024*1024&&!readChatWave(viewer,path))
                       await prewarmChatWave(viewer,path,url,item.size);"""
          new_warm="""           if(item.kind==='audio'&&index<4&&item.size>0&&item.size<=1024*1024)
                       void prefetchChatAudio(url,viewer,item.size);"""
          page=replace_once(page,old_warm,new_warm,'remove foreground wave decoding')

          # Show sent text immediately; reconcile the server ID, and recover the draft on error.
          old_send="""  async function sendMessage(e: FormEvent) {
              e.preventDefault();
              if (!supabase || !user || !activeChat || !draft.trim() || busy) return;
              const body = draft.trim(); setBusy(true); setNotice('');
              if (editing) {
                const { error } = await supabase.from('messages').update({ body }).eq('id', editing.id).eq('sender_id', user.id);
                setBusy(false); if (error) { setNotice('Не удалось изменить: ' + error.message); return; }
                setMessages(prev => prev.map(m => m.id === editing.id ? { ...m, body, edited_at: new Date().toISOString() } : m));
                cancelCompose(); return;
              }
              const { data, error } = await supabase.from('messages').insert({ conversation_id: activeChat, sender_id: user.id, body, reply_to: replyTo?.id || null }).select(MESSAGE_COLUMNS).single();
              setBusy(false); if (error || !data) { setNotice('Не удалось отправить: ' + (error?.message || 'Ошибка')); return; }
              setDraft(''); setReplyTo(null); lastKeypress.current = 0; void updateTyping(activeChat, false);
              const m = data as Message;
              setMessages(prev => prev.some(x => x.id === m.id) ? prev : [...prev, m]);
              setLatest(prev => ({ ...prev, [activeChat]: m }));
              requestAnimationFrame(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; });
            }"""
          new_send="""  const optimisticSend=useRef<{id:string;chat:string;body:string;reply:string|null;at:string}|null>(null);
            async function sendMessage(e: FormEvent) {
              e.preventDefault();
              if (!supabase || !user || !activeChat || !draft.trim() || busy) return;
              const body=draft.trim(),chat=activeChat,reply=replyTo?.id||null;
              setBusy(true);setNotice('');
              if(editing){
                const {error}=await supabase.from('messages').update({body}).eq('id',editing.id).eq('sender_id',user.id);
                setBusy(false);if(error){setNotice('Не удалось изменить: '+error.message);return;}
                setMessages(prev=>prev.map(m=>m.id===editing.id?{...m,body,edited_at:new Date().toISOString()}:m));
                cancelCompose();return;
              }
              const tempId='local-'+crypto.randomUUID(),at=new Date().toISOString();
              optimisticSend.current={id:tempId,chat,body,reply,at};
              const optimistic:Message={id:tempId,conversation_id:chat,sender_id:user.id,body,created_at:at,
                edited_at:null,deleted_at:null,reply_to:reply,attachment_path:null,attachment_name:null,
                attachment_type:null,attachment_size:null,attachment_kind:null};
              setMessages(prev=>[...prev,optimistic].sort(compareChatMessages));
              setDraft('');setReplyTo(null);lastKeypress.current=0;void updateTyping(chat,false);
              requestAnimationFrame(()=>{const el=scrollRef.current;if(el&&activeChat===chat)el.scrollTop=el.scrollHeight;});
              const {data,error}=await supabase.from('messages').insert({conversation_id:chat,sender_id:user.id,body,reply_to:reply}).select(MESSAGE_COLUMNS).single();
              setBusy(false);
              if(error||!data){
                setMessages(prev=>prev.filter(m=>m.id!==tempId));
                if(activeChat===chat){setDraft(current=>current||body);setReplyTo(current=>current||replyTo);}
                setNotice('Не удалось отправить: '+(error?.message||'Ошибка'));
                if(optimisticSend.current?.id===tempId)optimisticSend.current=null;
                return;
              }
              const m=data as Message;
              if(optimisticSend.current?.id===tempId)optimisticSend.current=null;
              setMessages(prev=>{
                const without=prev.filter(x=>x.id!==tempId);
                return without.some(x=>x.id===m.id)?without:[...without,m].sort(compareChatMessages);
              });
              setLatest(prev=>({...prev,[chat]:m}));
            }"""
          page=replace_once(page,old_send,new_send,'optimistic text send')
          # Server refresh must not wipe optimistic rows while the insert is in flight.
          page=replace_once(page,
              "const merged=[...older,...incoming].filter(m=>!m.deleted_at&&!serverDeleted.current.has(m.id));",
              "const queued=prev.filter(m=>m.id.startsWith('local-')&&m.conversation_id===id);\n        const merged=[...older,...incoming,...queued].filter(m=>!m.deleted_at&&!serverDeleted.current.has(m.id)).sort(compareChatMessages);",
              'preserve pending message during chat refresh')
          # Avoid duplicates when Realtime beats the insert response.
          page=replace_once(page,
              "      setMessages(prev => {\n        const exists = prev.some(x => x.id === m.id);\n        return exists ? prev.map(x => x.id === m.id ? m : x) : [...prev, m].sort(compareChatMessages);\n      });",
              """      const optimistic=optimisticSend.current;
                const replaceOptimistic=optimistic&&optimistic.chat===id&&m.sender_id===user.id&&
                  m.body===optimistic.body&&m.reply_to===optimistic.reply&&m.created_at>=optimistic.at;
                setMessages(prev=>{
                  const without=replaceOptimistic?prev.filter(x=>x.id!==optimistic!.id):prev;
                  const exists=without.some(x=>x.id===m.id);
                  return exists?without.map(x=>x.id===m.id?m:x):[...without,m].sort(compareChatMessages);
                });""",
              'optimistic realtime deduplication')
          page=replace_once(page,
              "const rows=messages.filter(m=>m.conversation_id===chatId&&!m.deleted_at&&!hiddenMessages.includes(m.id)&&!serverDeleted.current.has(m.id));",
              "const rows=messages.filter(m=>m.conversation_id===chatId&&!m.id.startsWith('local-')&&!m.deleted_at&&!hiddenMessages.includes(m.id)&&!serverDeleted.current.has(m.id));",
              'exclude pending sends from persistent history')

          # Account-scoped, size-limited audio prefetch via the existing IndexedDB cache.
          media += """
          /** CONNECT_PWA_CHAT_STICKER_CACHE_V1_20261115\n * Cache WebP by its stable authenticated Storage path, not signed URL tokens.\n */\nexport async function prefetchStickerWebp(url:string,user:string):Promise<void>{\n  const id=mediaIdentity(url);\n  if(!url||!user||!id?.startsWith('connect-stickers/'))return;\n  await remember(url,user,2*1024*1024,false);\n}\n\n/** CONNECT_PWA_CHAT_AUDIO_LAZY_CACHE_V1_20261115
           * Warm a couple of small voice messages without blocking chat rendering.
           * Persist by stable storage path, not by expiring signed URL.
           */
          export async function prefetchChatAudio(url:string,user:string,declaredSize:number):Promise<void>{
            const id=mediaIdentity(url);
            if(!url||!user||!id?.startsWith('connect-attachments/')||!declaredSize||declaredSize>1024*1024)return;
            await remember(url,user,1024*1024,false);
          }
          """
          css += """
          /* CONNECT_PWA_STICKER_LOADING_PREVIEW_V1_20261115 */
          .connect-sticker-loading{display:flex;width:152px;height:152px;align-items:center;justify-content:center;background:transparent;color:var(--text);opacity:.5}
          .connect-sticker-loading i{display:block;width:23px;height:23px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:connect-sticker-spin .8s linear infinite}
          @keyframes connect-sticker-spin{to{transform:rotate(360deg)}}
          """
          PAGE.write_text(page,encoding='utf-8')
          MEDIA.write_text(media,encoding='utf-8')
          CSS.write_text(css,encoding='utf-8')
          print('Connect PWA sticker, text send, and voice performance patch applied')
          CONNECT_CHAT_SPEED_PATCH
          python -m py_compile "$RUNNER_TEMP/connect_chat_speed_patch.py"
          python "$RUNNER_TEMP/connect_chat_speed_patch.py"
          mkdir -p tests
          cat > tests/chat-speed-regression.test.cjs <<'CONNECT_CHAT_SPEED_TESTS'
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const page=fs.readFileSync('app/page.tsx','utf8');
          const cache=fs.readFileSync('lib/media-cache.ts','utf8');
          const css=fs.readFileSync('app/globals.css','utf8');

          test('chat has a single integrated performance patch without dropping the existing security/access layer',()=>{
            assert(page.includes('CONNECT_PWA_CHAT_SPEED_STICKER_VOICE_V1_20261115'));
            assert(page.includes('connect-delete-forever'));
            assert(page.includes('connect-sticker-webp-convert'));
          });
          test('sticker metadata is presented before all remote signatures finish; cache persists stable paths',()=>{
            assert(page.includes('stickerPriority.current.has'));
            assert(page.includes("resolveCachedMedia(identity,viewer)"));
            assert(page.includes("prefetchStickerWebp(signed,viewer)"));
            assert(!page.includes('await Promise.all(items.map(async st=>{const {data}='));
            assert(page.includes('setStickerCatalogReady(true)'));
            assert(cache.includes("id?.startsWith('connect-stickers/')"));
            assert(cache.includes('await remember(url,user,2*1024*1024,false)'));
            assert(css.includes('.connect-sticker-loading'));
          });
          test('voice playback is not starved by eager waveform decoding or eager metadata requests',()=>{
            const player=page.slice(page.indexOf('const VoicePlayer = memo('),page.indexOf('type CropState'));
            assert(player.includes('preload="none"'));
            assert(!player.includes('new AudioContext()'));
            assert(!player.includes('await fetch(src, { signal: controller.signal })'));
            assert(player.includes("refreshMediaUrl(identity)"));
            assert(player.includes('setBuffering(true)'));
            assert(player.includes('Загружаю аудио'));
            assert(player.includes('await audio.play()'));
          });
          test('Android signs media progressively rather than blocking all attachments with Promise.all',()=>{
            const start=page.indexOf('// Android also needs progressive, bounded signing');
            assert(start>=0);
            const section=page.slice(start,page.indexOf('if(!activeChat||historyReadyChat!==activeChat)return;',start));
            assert(section.includes('setAttachmentUrls(prev=>prev[path]?prev:'));
            assert(section.includes('Math.min(4,missing.length)'));
            assert(!section.includes('Promise.all(missing.map(async'));
            assert(section.includes('prefetchChatAudio'));
          });
          test('text is shown immediately and failed send restores draft; server id replaces temporary id',()=>{
            const begin=page.indexOf('async function sendMessage(e: FormEvent)');
            assert(begin>=0);
            const chunk=page.slice(begin,page.indexOf('// CONNECT_PWA_CHAT_MEDIA_ENTRY_V2',begin));
            assert(chunk.indexOf('setMessages(prev=>[...prev,optimistic]')>=0);
            assert(chunk.indexOf('setMessages(prev=>[...prev,optimistic]')<chunk.indexOf("supabase.from('messages').insert("));
            assert(chunk.includes('setDraft(current=>current||body)'));
            assert(chunk.includes('const without=prev.filter(x=>x.id!==tempId)'));
            assert(page.includes("m.id.startsWith('local-')"));
            assert(page.includes('const replaceOptimistic=optimistic&&'));
          });
          test('media prefetch stays size-limited and isolated to per-user stable keys',()=>{
            assert(cache.includes('export async function prefetchChatAudio('));
            assert(cache.includes('declaredSize>1024*1024'));
            assert(cache.includes("id?.startsWith('connect-attachments/')"));
            assert(cache.includes('const key = user + \':\' + id'));
          });
          CONNECT_CHAT_SPEED_TESTS
      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Run targeted chat responsiveness regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/chat-speed-regression.test.cjs
          node - <<'CONNECT_PARSE_TSX'
          const fs=require('node:fs');
          const ts=require('typescript');
          const p=ts.createSourceFile('app/page.tsx',fs.readFileSync('app/page.tsx','utf8'),ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
          if(p.parseDiagnostics.length)throw new Error(p.parseDiagnostics.map(x=>x.messageText).join('; '));
          console.log('Connect TSX parsed without syntax errors');
          CONNECT_PARSE_TSX
      - name: Install and check Chromium for existing browser tests
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright-core install --with-deps chromium
          node - <<'CONNECT_CHROMIUM_CHECK'
          const fs=require('node:fs');
          const exe=require('playwright-core').chromium.executablePath();
          if(!fs.existsSync(exe))throw new Error('Chromium not installed: '+exe);
          console.log('Chromium ready');
          CONNECT_CHROMIUM_CHECK
      - name: Typecheck full test suite and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit only verified changes to main
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css lib/media-cache.ts tests/chat-speed-regression.test.cjs
          if git diff --cached --quiet; then
            echo 'Already installed: no new commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA: cache stickers, accelerate first send and voice playback'
            git push origin HEAD:main
          fi
