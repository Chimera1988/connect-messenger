name: Connect PWA | Theme loader and persistent video stills FIX5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-video-stills-fix5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-pwa-video-stills:
    name: Fix PWA animation, video circles, ordinary video posters
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply PWA-only visual media changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT=Path('.')
          page_path=ROOT/'app/page.tsx'
          css_path=ROOT/'app/globals.css'
          if not page_path.is_file() or not css_path.is_file():
              raise RuntimeError('Expected Connect PWA sources are missing')
          page=page_path.read_text('utf-8')
          css=css_path.read_text('utf-8')
          marker='CONNECT_PWA_VIDEO_STILLS_FIX4_20261113'
          if marker in page:
              print('PWA visual media FIX4 already installed; no source changes.')
              raise SystemExit(0)
          if 'CONNECT_PWA_CHAT_MEDIA_ENTRY_V2' not in page or 'storeGeneratedChatPoster' not in page:
              raise RuntimeError('FIX3 baseline not found. No modifications applied.')

          def once(old,new,why):
              global page
              matches=page.count(old)
              if matches!=1:
                  raise RuntimeError(f'{why}: expected unique source anchor, found {matches}; no modifications applied')
              page=page.replace(old,new,1)

          # 1. Replace text-heavy splash with theme-colored small wave-dot animation.
          once('''{!isNativeMediaRuntime()&&chatDisplayReady!==activeChat&&<div className="connect-chat-entry-overlay" role="status" aria-live="polite"><span className="connect-chat-entry-spinner" aria-hidden="true"/><strong>Подготавливаем переписку</strong><small>Восстанавливаем медиа и миниатюры…</small></div>}''',
          '''{!isNativeMediaRuntime()&&chatDisplayReady!==activeChat&&<div className="connect-chat-entry-overlay" role="status" aria-label="Подготовка переписки" style={wallpaper?{backgroundImage:`linear-gradient(#00000018,#00000018),url(${wallpaper})`,backgroundSize:'cover',backgroundPosition:'center'}:undefined}><span className="connect-chat-entry-pulse" aria-hidden="true"><i/><i/><i/></span></div>}''','theme loading overlay')

          # 2. Take a JPEG snapshot without network reload, keeping a stable local fallback.
          # The last drawable frame replaces previously captured pictures before video detaches.
          anchor='''function VideoThumbnail({src,path}:{src:string;path?:string}) {'''
          frame_helper=r'''// CONNECT_PWA_VIDEO_STILLS_FIX4_20261113
          /** Save the most recent nonempty decoded frame as a stable attachment poster.
           * PWA only. Cross-origin/tainted video falls back to its uploaded poster.
           */
          function preserveVisibleChatFrame(video:HTMLVideoElement,path:string,display:(url:string)=>void):boolean{
            if(isNativeMediaRuntime()||!path||!mediaCacheOwner()||video.readyState<2||video.currentTime<.12||!video.videoWidth||!video.videoHeight)return false;
            try{
              const canvas=document.createElement('canvas');
              const scale=Math.min(1,420/video.videoWidth,420/video.videoHeight);
              canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
              canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
              const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return false;
              ctx.drawImage(video,0,0,canvas.width,canvas.height);
              // Avoid persisting a decoder's all-black placeholder on iOS.
              const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
              let sampled=0,lit=0;
              for(let i=0;i<pixels.length;i+=128){sampled++;if(pixels[i]+pixels[i+1]+pixels[i+2]>65)lit++;}
              if(sampled&&!lit)return false;
              const url=canvas.toDataURL('image/jpeg',.76);if(url.length<180)return false;
              const viewer=mediaCacheOwner();
              rememberChatPoster(viewer,path,url);
              display(url);
              canvas.toBlob(blob=>{if(blob&&viewer===mediaCacheOwner())void storeGeneratedChatPoster(viewer,path,blob).catch(()=>{});},'image/jpeg',.76);
              return true;
            }catch{return false;}
          }

          '''
          once(anchor,frame_helper+anchor,'frame-capture helper')
          once('''  function capture(video:HTMLVideoElement){
              if(!video.videoWidth||!video.videoHeight)return;
              try{''',
          '''  function capture(video:HTMLVideoElement){
              if(!video.videoWidth||!video.videoHeight)return;
              if(!isNativeMediaRuntime()&&path){
                preserveVisibleChatFrame(video,path,url=>{setPoster(url);setUploadedPoster(url);});
                return;
              }
              try{''','album video still frames')

          # 3. Save frame BEFORE the shared PWA player detaches its source when offscreen.
          once('''function useVisibleVideo(ref:{current:HTMLVideoElement|null},src:string,userPaused:{current:boolean},muted:{current:boolean}){
           const resumePosition=useRef(0);''',
          '''function useVisibleVideo(ref:{current:HTMLVideoElement|null},src:string,userPaused:{current:boolean},muted:{current:boolean},onBeforeDetach?:(video:HTMLVideoElement)=>void){
            const onBeforeDetachRef=useRef(onBeforeDetach);
            onBeforeDetachRef.current=onBeforeDetach;
            const resumePosition=useRef(0);''','lifecycle callback')
          once('''else if(attached){resumePosition.current=video.currentTime||resumePosition.current;attached=false;video.pause();video.removeAttribute('src');video.load();}''',
          '''else if(attached){if(!isNativeMediaRuntime())onBeforeDetachRef.current?.(video);resumePosition.current=video.currentTime||resumePosition.current;attached=false;video.pause();video.removeAttribute('src');video.load();}''','freeze before detach')

          # 4. Ordinary videos: real poster image remains visible while detached/scrolling.
          once('''  const [poster,setPoster]=useState<string|null>(()=>getHotChatPoster(mediaCacheOwner(),path));
            const [error,setError]=useState(false);

            useEffect(()=>{''',
          '''  const [poster,setPoster]=useState<string|null>(()=>getHotChatPoster(mediaCacheOwner(),path));
            const [error,setError]=useState(false);
            const [frameReady,setFrameReady]=useState(false);
            const firstFrameStored=useRef(false);
            const freezeFrame=(video:HTMLVideoElement)=>{preserveVisibleChatFrame(video,path,setPoster);};

            useEffect(()=>{''','ordinary video poster state')
          once('''    setPoster(getHotChatPoster(mediaCacheOwner(),path));setError(false);''',
          '''    setPoster(getHotChatPoster(mediaCacheOwner(),path));setError(false);setFrameReady(false);firstFrameStored.current=false;''','video poster reset')
          once('''    void cachedChatPoster(path).then(url=>{if(!cancelled&&url)setPoster(url);}).catch(()=>{});''',
          '''    void cachedChatPoster(path).then(url=>{if(!cancelled&&url)setPoster(previous=>previous?.startsWith('data:')?previous:url);}).catch(()=>{});''','prevent overwriting a live video snapshot')
          once('''  useVisibleVideo(ref,src,userPaused,soundRef);''',
          '''  useVisibleVideo(ref,src,userPaused,soundRef,freezeFrame);''','ordinary video offscreen capture')
          once('''      <video ref={ref} poster={poster||undefined} muted={muted} loop playsInline preload="none"
                  onLoadedMetadata={event=>connectUpdateVideoFrame(event.currentTarget,path)}
                  onError={()=>setError(true)}/>''',
          '''      {!isNativeMediaRuntime()&&(poster?<img className="connect-inline-video-still" src={poster} alt="" aria-hidden="true"/>:<span className="connect-inline-video-still-fallback" aria-hidden="true">▶</span>)}
                <video ref={ref} poster={poster||undefined} muted={muted} loop playsInline preload="none" crossOrigin={isNativeMediaRuntime()?undefined:'anonymous'}
                  style={isNativeMediaRuntime()?undefined:{opacity:frameReady?1:0}}
                  onLoadedMetadata={event=>connectUpdateVideoFrame(event.currentTarget,path)}
                  onEmptied={()=>{if(!isNativeMediaRuntime())setFrameReady(false);}}
                  onTimeUpdate={event=>{if(isNativeMediaRuntime())return;const video=event.currentTarget;if(video.currentTime>.12){setFrameReady(true);if(!firstFrameStored.current){firstFrameStored.current=preserveVisibleChatFrame(video,path,setPoster);}}}}
                  onError={()=>setError(true)}/>''','ordinary video still image')

          # 5. Video circles: keep old picture until actual nonblack decoded frame arrives.
          once('''  const [videoFrameReady,setVideoFrameReady]=useState(false);
            useEffect(()=>{''',
          '''  const [videoFrameReady,setVideoFrameReady]=useState(false);
            const firstFrameStored=useRef(false);
            useEffect(()=>{''','circle capture ref declaration')
          once('''  const userPaused=useRef(false),mutedRef=useRef(true);
            useVisibleVideo(ref,src,userPaused,mutedRef);''',
          '''  const userPaused=useRef(false),mutedRef=useRef(true);
            const freezeFrame=(video:HTMLVideoElement)=>{preserveVisibleChatFrame(video,path,setPoster);};
            useVisibleVideo(ref,src,userPaused,mutedRef,freezeFrame);''','circle offscreen capture')
          start=page.index('  const captureNotePoster=(video:HTMLVideoElement)=>{')
          end=page.index('  const toggleNote=(event:React.MouseEvent)=>{',start)
          old=page[start:end]
          if old.count('storeGeneratedChatPoster')!=1:
              raise RuntimeError('Unexpected video-note old capture logic; no modifications applied')
          page=page[:start]+page[end:]
          once('''    setPoster(getHotChatPoster(mediaCacheOwner(),path)||undefined);
              if(supabase)void cachedChatPoster(path).then(url=>{if(alive)setPoster(url||undefined);}).catch(()=>{});''',
          '''    setPoster(getHotChatPoster(mediaCacheOwner(),path)||undefined);firstFrameStored.current=false;
              if(supabase)void cachedChatPoster(path).then(url=>{if(alive&&url)setPoster(url);}).catch(()=>{});''','circle poster reset')
          once('''          onLoadedData={event=>{if(!isNativeMediaRuntime()){setVideoFrameReady(true);captureNotePoster(event.currentTarget);}}}''',
          '''          onLoadedData={()=>{/* Wait for a drawable frame instead of revealing iOS decoder black. */}}''','circle premature reveal')
          once('''          onTimeUpdate={event=>{const v=event.currentTarget,d=v.duration;if(Number.isFinite(d)&&d>0)setProgress(Math.max(0,Math.min(1,v.currentTime/d)));}}''',
          '''          onTimeUpdate={event=>{const v=event.currentTarget,d=v.duration;if(Number.isFinite(d)&&d>0)setProgress(Math.max(0,Math.min(1,v.currentTime/d)));if(!isNativeMediaRuntime()&&v.currentTime>.12){setVideoFrameReady(true);if(!firstFrameStored.current)firstFrameStored.current=preserveVisibleChatFrame(v,path,setPoster);}}}''','circle playback frame capture')
          # Reset on src change without tearing down cached stills.

          # 6. The shared cache remains source of truth and deletion semantics stay untouched.
          # Styling intentionally overrides previous opaque overlay, preserving the ambient
          # seven-theme Liquid Glass backdrop and optional chat wallpaper.
          if 'CONNECT_PWA_VIDEO_STILLS_FIX4_20261113' in css:
              raise RuntimeError('CSS already patched while TS is not: refusing unsafe mixed state')
          css += r'''
          /* CONNECT_PWA_VIDEO_STILLS_FIX4_20261113: themed, text-free media warmup */
          .connect-app .connect-chat-entry-overlay {
            background-color:transparent !important;
            color:var(--wave-primary,var(--accent)) !important;
            -webkit-backdrop-filter:blur(3px) saturate(112%);
            backdrop-filter:blur(3px) saturate(112%);
          }
          .connect-chat-entry-pulse{display:flex;align-items:center;justify-content:center;gap:15px;width:110px;height:58px;pointer-events:none}
          .connect-chat-entry-pulse>i{display:block;width:13px;height:13px;border-radius:50%;background:var(--wave-primary,var(--accent));box-shadow:0 0 17px color-mix(in srgb,var(--wave-primary,var(--accent)) 70%,transparent),0 0 34px color-mix(in srgb,var(--wave-secondary,var(--accent)) 38%,transparent);animation:connect-media-dot 1.18s ease-in-out infinite both}
          .connect-chat-entry-pulse>i:nth-child(2){background:var(--wave-secondary,var(--accent));animation-delay:.16s}
          .connect-chat-entry-pulse>i:nth-child(3){background:var(--wave-tertiary,var(--accent));animation-delay:.32s}
          @keyframes connect-media-dot{0%,70%,100%{opacity:.4;transform:translateY(0) scale(.75)}36%{opacity:1;transform:translateY(-8px) scale(1.15)}}
          @media(prefers-reduced-motion:reduce){.connect-chat-entry-pulse>i{animation:none;opacity:1}}
          .connect-app .connect-v4-note-circle>.connect-note-still-fallback{background:linear-gradient(135deg,color-mix(in srgb,var(--wave-primary,var(--accent)) 18%,var(--panel)),color-mix(in srgb,var(--wave-secondary,var(--accent)) 14%,var(--panel))) !important;color:var(--text)!important}
          .connect-app .connect-inline-autoplay-video-open>.connect-inline-video-still,.connect-app .connect-inline-autoplay-video-open>.connect-inline-video-still-fallback{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain;pointer-events:none;z-index:0;border-radius:12px}
          .connect-app .connect-inline-autoplay-video-open>.connect-inline-video-still-fallback{display:grid;place-items:center;font-size:28px;color:var(--wave-primary,var(--accent));background:linear-gradient(120deg,color-mix(in srgb,var(--wave-primary,var(--accent)) 16%,var(--panel)),color-mix(in srgb,var(--wave-secondary,var(--accent)) 11%,var(--panel)))}
          .connect-app .connect-inline-autoplay-video-open>video{z-index:1;transition:opacity .12s ease}
          '''

          # Source changes are committed only when typecheck/tests/build all pass.
          page_path.write_text(page,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          print('FIX5 PWA-only: theme loading dots, freeze frames for video notes and ordinary videos.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install Chromium for browser regression tests
        run: |
          npx playwright-core install --with-deps chromium
          node -e "require('node:fs').accessSync(require('playwright-core').chromium.executablePath())"

      - name: Run all regression tests
        run: npm test

      - name: Build release PWA
        run: npm run build

      - name: Publish verified PWA changes
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): theme media loader and preserve last decoded video frames'
          git push origin HEAD:main
