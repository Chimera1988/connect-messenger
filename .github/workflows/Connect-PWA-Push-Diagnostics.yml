        \      });\n      if(!response.ok){const body=await response.json().catch(()=>({}));throw Error(typeof body.error==='string'?body.error:'Не\
        \ удалось зарегистрировать устройство');}\n      // The old PWA toggle may have left server-side notifications\
        \ disabled.\n      const {data:stored,error:readError}=await supabase.from('notification_preferences')\n\
        \        .select('enabled,sound,vibrate').eq('user_id',userId).maybeSingle();\n      if(readError)throw\
