        \ onClick={()=>void testDelivery()}>{delivery==='sending'?'Ожидаем подтверждение…':'Проверить доставку'}</button>\n\
        \    <div className=\"connect-web-push-delivery\" role=\"status\" aria-live=\"polite\">\n      <span className={'connect-web-push-indicator\
        \ is-'+(delivery==='confirmed'?'active':delivery==='error'||delivery==='unconfirmed'?'unregistered':'checking')}\
        \ aria-hidden=\"true\"/>\n      <div><strong>{delivery==='confirmed'?'Тестовая доставка подтверждена':delivery==='sending'?'Проверяем\
