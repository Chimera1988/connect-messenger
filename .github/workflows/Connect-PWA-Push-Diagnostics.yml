name: Connect PWA | Push subscription status and diagnostic delivery
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/Connect-PWA-Push-Diagnostics.yml
permissions:
  contents: write
concurrency:
  group: connect-pwa-push-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  push-diagnostics:
    name: PWA subscription check, test push receipt, regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Apply PWA notification diagnostics (Android unchanged)
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\n\nROOT=Path('.')\nmarker='CONNECT_PWA_PUSH_DIAGNOSTICS_V1'\n\
        component_path=ROOT/'components/ConnectNotificationSettings.tsx'\nweb_path=ROOT/'components/ConnectWebPushDiagnostics.tsx'\n\
        sw_path=ROOT/'public/sw.js'\ncss_path=ROOT/'app/liquid-glass.css'\napi_path=ROOT/'app/api/push/diagnostics/route.ts'\n\
        test_path=ROOT/'tests/push-diagnostics.test.cjs'\nfor required in [component_path,sw_path,css_path]:\n \
        \   if not required.is_file():raise RuntimeError('Missing Connect source '+str(required))\norig=component_path.read_text(encoding='utf-8')\n\
        sw=sw_path.read_text(encoding='utf-8')\ncss=css_path.read_text(encoding='utf-8')\nif marker in orig:\n \
        \   if marker not in sw or marker not in css or not api_path.exists() or not web_path.exists() or not test_path.exists():\n\
        \        raise RuntimeError('Partial diagnostics patch detected; stop instead of overwriting other changes')\n\
        \    print('Connect PWA push diagnostics already applied; checking project without rewriting.')\nelse:\n\
        \    if any(p.exists() for p in [web_path,api_path,test_path]) or marker in sw or marker in css:\n     \
        \   raise RuntimeError('Unexpected existing diagnostics files; refusing to overwrite')\n    def once(body,old,new,label):\n\
        \        n=body.count(old)\n        if n!=1:raise RuntimeError(label+': expected one exact anchor, got '+str(n))\n\
        \        return body.replace(old,new,1)\n    # Keep existing Android settings function/logic intact; mount\
        \ its component only on Android.\n    orig=once(orig,\"import type { SupabaseClient } from '@supabase/supabase-js';\"\
        ,\n        \"import type { SupabaseClient } from '@supabase/supabase-js';\\nimport ConnectWebPushDiagnostics\
        \ from './ConnectWebPushDiagnostics';\".replace('\\n','\\n'),'notification import')\n    old=\"export default\
        \ function ConnectNotificationSettings({supabase,userId}:{supabase:SupabaseClient,userId:string}) {\"\n\
        \    wrapper=\"\"\"/* CONNECT_PWA_PUSH_DIAGNOSTICS_V1: runtime choice after hydration; Android stays unchanged.\
        \ */\nexport default function ConnectNotificationSettings(props:{supabase:SupabaseClient;userId:string}){\n\
        \  const [runtime,setRuntime]=useState<'pending'|'web'|'android'>('pending');\n  useEffect(()=>{setRuntime(window.ConnectAndroid?'android':'web');},[]);\n\
        \  if(runtime==='pending')return <section className=\"connect-notifications\" aria-label=\"Уведомления\"\
        />;\n  return runtime==='web'?<ConnectWebPushDiagnostics {...props}/>:<ConnectAndroidNotificationSettings\
        \ {...props}/>;\n}\nfunction ConnectAndroidNotificationSettings({supabase,userId}:{supabase:SupabaseClient,userId:string})\
        \ {\"\"\"\n    orig=once(orig,old,wrapper,'notification runtime split')\n    # The worker must display a\
        \ real system notification before acknowledging it.\n    msg_anchor=\"self.addEventListener('message',event=>{if(event.data?.type==='CONNECT_BADGE_SNAPSHOT')\"\
        \n    msg_new=\"self.addEventListener('message',event=>{if(event.data?.type==='CONNECT_DIAGNOSTICS_PING'){event.ports?.[0]?.postMessage({type:'CONNECT_DIAGNOSTICS_READY'});return;}if(event.data?.type==='CONNECT_BADGE_SNAPSHOT')\"\
        \n    sw=once(sw,msg_anchor,msg_new,'worker feature handshake')\n    push_anchor=\" if(d.kind==='call-ended')\"\
        \n    push_new=\"\"\" /* CONNECT_PWA_PUSH_DIAGNOSTICS_V1: diagnostic push never changes unread badges/call\
        \ states. */\n if(d.kind==='connect-push-diagnostic'){\n  const id=typeof d.requestId==='string'?d.requestId:'';\n\
        \  if(!/^[0-9a-f-]{36}$/i.test(id)||typeof d.userId!=='string')return;\n  await self.registration.showNotification('Connect\
        \ · Проверка',{body:'Тестовое уведомление',icon:'/icon-192.png',badge:'/icon-192.png',tag:'connect-push-check-'+id,data:{kind:'connect-push-diagnostic'},silent:false});\n\
        \  for(const client of await clients.matchAll({type:'window',includeUncontrolled:true})){\n   if(new URL(client.url).origin===self.location.origin)client.postMessage({type:'CONNECT_PUSH_DIAGNOSTIC_RECEIVED',requestId:id,userId:d.userId,receivedAt:new\
        \ Date().toISOString()});\n  }\n  return;\n }\n if(d.kind==='call-ended')\"\"\"\n    sw=once(sw,push_anchor,push_new,'push\
        \ diagnostic before normal messages')\n    click_anchor=\"event.notification.close();const details=event.notification.data||{};event.waitUntil((async()=>{\"\
        \n    click_new=\"\"\"event.notification.close();const details=event.notification.data||{};\nif(details.kind==='connect-push-diagnostic'){event.waitUntil((async()=>{\n\
        \ for(const client of await clients.matchAll({type:'window',includeUncontrolled:true}))if(new URL(client.url).origin===self.location.origin){await\
        \ client.focus();return;}\n await clients.openWindow('/');\n})());return;}\nevent.waitUntil((async()=>{\"\
        \"\"\n    sw=once(sw,click_anchor,click_new,'diagnostic notification click isolation')\n    css+='\\n'+r'''/*\
        \ CONNECT_PWA_PUSH_DIAGNOSTICS_V1: seven-theme Liquid Glass PWA diagnostics */\n.connect-app .connect-notifications.connect-web-push{display:flex;flex-direction:column;gap:16px;padding:12px\
        \ 5px 10px}\n.connect-app .connect-web-push-state,.connect-app .connect-web-push-delivery{display:flex;align-items:flex-start;gap:12px;padding:15px\
        \ 14px;border:1px solid var(--glass-stroke-hi,rgba(255,255,255,.14));border-radius:17px;background:color-mix(in\
        \ srgb,var(--glass-surface,rgba(33,44,65,.6)) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}\n\
        .connect-app .connect-web-push-state>div,.connect-app .connect-web-push-delivery>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}\n\
        .connect-app .connect-web-push-state strong,.connect-app .connect-web-push-delivery strong{color:var(--text);font-size:15px;font-weight:660}\n\
        .connect-app .connect-web-push-state small,.connect-app .connect-web-push-delivery small{font-size:12px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}\n\
        .connect-app .connect-web-push-indicator{width:11px;height:11px;min-width:11px;border-radius:50%;margin-top:3px;background:var(--muted);box-shadow:0\
        \ 0 0 4px color-mix(in srgb,var(--muted) 14%,transparent)}\n.connect-app .connect-web-push-indicator.is-active{background:var(--wave-primary,var(--accent));box-shadow:0\
        \ 0 0 4px color-mix(in srgb,var(--wave-primary,var(--accent)) 15%,transparent),0 0 15px color-mix(in srgb,var(--wave-primary,var(--accent))\
        \ 25%,transparent)}\n.connect-app .connect-web-push-indicator.is-checking{background:var(--wave-secondary,var(--accent))}\n\
        .connect-app .connect-web-push-indicator.is-denied,.connect-app .connect-web-push-indicator.is-error,.connect-app\
        \ .connect-web-push-indicator.is-unregistered{background:#e6a55a}\n.connect-app .connect-web-push-primary,.connect-app\
        \ .connect-web-push-secondary{display:flex!important;align-items:center!important;justify-content:center!important;min-height:48px!important;padding:12px\
        \ 16px!important;border:1px solid var(--glass-stroke-hi,rgba(255,255,255,.2))!important;border-radius:15px!important;font-size:14px!important;font-weight:650!important;color:var(--text)!important;box-shadow:inset\
        \ 0 1px 0 rgba(255,255,255,.12)!important}\n.connect-app .connect-web-push-primary{background:linear-gradient(120deg,color-mix(in\
        \ srgb,var(--wave-primary,var(--accent)) 25%,var(--glass-surface-strong,#172034)),color-mix(in srgb,var(--wave-secondary,var(--accent))\
        \ 21%,var(--glass-surface-strong,#172034)))!important}\n.connect-app .connect-web-push-secondary{background:color-mix(in\
        \ srgb,var(--glass-surface,rgba(27,39,58,.64)) 90%,transparent)!important}\n.connect-app .connect-web-push-primary:disabled,.connect-app\
        \ .connect-web-push-secondary:disabled{opacity:.48}\n.connect-app .connect-web-push-note{font-size:12px;line-height:1.55;color:var(--muted);margin:0\
        \ 5px}\n'''\n    web_path.write_text(r''''use client';\n\nimport {useCallback,useEffect,useRef,useState}\
        \ from 'react';\nimport type {SupabaseClient} from '@supabase/supabase-js';\n\ntype Connection = 'checking'|'active'|'unsupported'|'denied'|'permission'|'missing'|'unregistered'|'disabled'|'invalid-key'|'error';\n\
        type Delivery = 'idle'|'sending'|'confirmed'|'unconfirmed'|'error';\ntype Props={supabase:SupabaseClient;userId:string};\n\
        const VAPID=process.env.NEXT_PUBLIC_VAPID_PUBLIC_KEY||'';\nconst ACK_EVENT='CONNECT_PUSH_DIAGNOSTIC_RECEIVED';\n\
        \nfunction vapidBytes(value:string):Uint8Array{\n  const pad='='.repeat((4-value.length%4)%4);\n  return\
        \ Uint8Array.from(atob((value+pad).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));\n}\nfunction\
        \ validCurrentKey(sub:PushSubscription):boolean{\n  if(!VAPID)return false;\n  try{\n    const expected=vapidBytes(VAPID),current=sub.options.applicationServerKey;\n\
        \    if(!current)return true; // Some browsers do not expose the key after subscribing.\n    const actual=new\
        \ Uint8Array(current);\n    return actual.length===expected.length&&actual.every((n,i)=>n===expected[i]);\n\
        \  }catch{return false;}\n}\nasync function diagnosticWorkerReady(reg:ServiceWorkerRegistration):Promise<boolean>{\n\
        \  const worker=reg.active||navigator.serviceWorker.controller;\n  if(!worker)return false;\n  return new\
        \ Promise(resolve=>{\n    const channel=new MessageChannel();\n    const timer=window.setTimeout(()=>{channel.port1.close();resolve(false);},2500);\n\
        \    channel.port1.onmessage=event=>{\n      window.clearTimeout(timer);channel.port1.close();\n      resolve(event.data?.type==='CONNECT_DIAGNOSTICS_READY');\n\
        \    };\n    try{worker.postMessage({type:'CONNECT_DIAGNOSTICS_PING'},[channel.port2]);}\n    catch{window.clearTimeout(timer);channel.port1.close();resolve(false);}\n\
        \  });\n}\nfunction available():boolean{\n  return typeof window!=='undefined'&&'serviceWorker'in navigator&&'PushManager'in\
        \ window&&'Notification'in window&&Boolean(VAPID);\n}\nfunction label(state:Connection):string{\n  return\
        \ ({checking:'Проверяем подписку',active:'Подписка активна',unsupported:'Web Push недоступен',denied:'Уведомления\
        \ запрещены в iOS',permission:'Требуется разрешение',missing:'Подписка отсутствует',unregistered:'Устройство\
