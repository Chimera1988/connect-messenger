        \    lastTestAt.current=Date.now();setDelivery('sending');setDetail('Отправляем тестовое уведомление…');\n\
        \    const id=crypto.randomUUID();\n    try{\n      const reg=await navigator.serviceWorker.getRegistration();\n\
