    - name: Install locked dependencies
      run: npm ci
    - name: Check TypeScript
      run: npm run typecheck
    - name: Check diagnostics isolation
      run: node tests/push-diagnostics.test.cjs
    - name: Install Chromium for browser regression tests
      run: npx playwright-core install --with-deps chromium
    - name: Run regression tests
      run: npm test
    - name: Build PWA release
      run: npm run build
    - name: Publish only after all checks pass
      shell: bash
      run: "set -euo pipefail\ngit add components/ConnectNotificationSettings.tsx components/ConnectWebPushDiagnostics.tsx\
        \ public/sw.js app/liquid-glass.css app/api/push/diagnostics/route.ts tests/push-diagnostics.test.cjs\n\
        if git diff --cached --quiet; then\n  echo 'No changes: diagnostics already present.'\n  exit 0\nfi\ngit\
        \ config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git commit -m 'feat(pwa): test and verify web push delivery without changing Android'\ngit push origin HEAD:main"
