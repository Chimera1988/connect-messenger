        \  return ({checking:'Проверяем разрешение, подписку и регистрацию устройства.',active:'Разрешение получено,\
        \ текущая подписка есть и зарегистрирована на сервере.',unsupported:'На iPhone открой Connect с экрана «Домой»;\
        \ проверь настройку Web Push.',denied:'Разреши уведомления для Connect в настройках iPhone.',permission:'Нажми\
        \ «Подключить уведомления» и предоставь разрешение.',missing:'Нажми «Подключить уведомления», чтобы создать\
        \ подписку.',unregistered:'Подписка есть на iPhone, но отсутствует в базе Connect. Подключи её повторно.',disabled:'Нажми\
        \ «Подключить уведомления», чтобы снова включить отправку.', 'invalid-key':'Ключ подписки изменился. Переподключи\
        \ уведомления.',error:'Не удалось подтвердить регистрацию на сервере. Попробуй ещё раз.'})[state];\n}\n\
        function formatDate(value:string|null):string{\n  if(!value)return '';\n  const d=new Date(value);\n  return\
        \ Number.isFinite(d.getTime())?d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';\n\
        }\n\nexport default function ConnectWebPushDiagnostics({supabase,userId}:Props){\n  const [connection,setConnection]=useState<Connection>('checking');\n\
        \  const [delivery,setDelivery]=useState<Delivery>('idle');\n  const [detail,setDetail]=useState('');\n\
        \  const [busy,setBusy]=useState(false);\n  const [lastReceived,setLastReceived]=useState<string|null>(null);\n\
        \  const pending=useRef<{id:string;timer:number}|null>(null);\n  const refreshGeneration=useRef(0);\n  const\
        \ lastTestAt=useRef(0);\n\n  const check=useCallback(async()=>{\n    const generation=++refreshGeneration.current;\n\
        \    const update=(next:Connection)=>{if(generation===refreshGeneration.current)setConnection(next);};\n\
        \    if(!available()){update('unsupported');return;}\n    if(Notification.permission==='denied'){update('denied');return;}\n\
