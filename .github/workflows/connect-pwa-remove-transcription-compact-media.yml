          python3 /tmp/connect-pwa-no-transcript.py
          git diff --check

      - name: Remove transcription backend and stylesheet
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- \
            components/ConnectTranscript.tsx \
            app/api/transcribe/route.ts \
            app/connect-transcript.css
          python3 - <<'PY'
          from pathlib import Path
          page=Path('app/page.tsx').read_text()
          layout=Path('app/layout.tsx').read_text()
          css=Path('app/profile-media.css').read_text()
          assert 'ConnectTranscript' not in page
          assert '/api/transcribe' not in page
          assert "connect-transcript.css" not in layout
          assert '.connect-transcript' not in css
          assert 'voice-save' in page and 'connect-voice-v4-top' in page
          assert Path('components/ConnectGalleryViewer.tsx').exists(), 'Gallery must be preserved'
          print('Transcription removed; gallery, video notes and audio save retained.')
          PY
          git diff --check

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and browser for existing tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Check TypeScript, tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Publish only after passing every check
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/profile-media.css app/layout.tsx
          if git diff --cached --quiet; then
            echo 'No changes: already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: remove unused transcription and compact audio bubbles [skip ci]'
          git push origin HEAD:main
