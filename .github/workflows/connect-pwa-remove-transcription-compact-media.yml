# Connect PWA — remove transcription and compact voice/audio media.
# Upload to .github/workflows/connect-pwa-remove-transcription-compact-media.yml
# Scope: PWA only. Does not alter videos, calls, E2EE, Supabase or Vercel settings.
name: Connect PWA - remove transcription and compact audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-remove-transcription-compact-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-no-transcript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current Connect PWA main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

