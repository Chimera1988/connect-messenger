name: Connect 2.2.6 — guarded technical call failure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-226-call-failure.yml']
permissions:
  contents: write
concurrency:
  group: connect-226-pwa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded final source package
        run: |
          python3 - <<'CONNECT_PACKAGE'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request,time
          root=pathlib.Path.cwd().resolve()
          workflow_ref=os.environ['GITHUB_WORKFLOW_REF']
          relative='.github/workflows/'+workflow_ref.split('/.github/workflows/',1)[1].rsplit('@',1)[0]
          source=(root/relative).read_text()
          block=source.split('# CONNECT_SOURCE_BUNDLE_BEGIN\n',1)[1].split('# CONNECT_SOURCE_BUNDLE_END',1)[0]
          encoded=''.join(line.removeprefix('# ')for line in block.splitlines())
          packed=base64.b64decode(encoded)
          assert hashlib.sha256(packed).hexdigest()=="60cff1a243f2331ae50efdf626a0996e0510089238ae4825b0a562b990422e71", 'Embedded package checksum mismatch'
          payload=json.loads(gzip.decompress(packed))
          def target(name):
           path=root/name
           if any(p.is_symlink() for p in [path,*path.parents] if p.is_relative_to(root)):raise SystemExit('Symlink source path: '+name)
           path=path.resolve()
           if not path.is_relative_to(root):raise SystemExit('Unsafe package path')
           if path.exists() and not path.is_file():raise SystemExit('Expected source file: '+name)
           return path
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          def decode(value):return base64.b64decode(value['binary'])if isinstance(value,dict)else value.encode('utf-8')
          # Validate the COMPLETE affected source state before writing anything.
          for name,digest in payload['unchanged'].items():
           if sha(target(name))!=digest:raise SystemExit('Incompatible prerequisite: '+name)
          for name,value in payload['files'].items():
           path=target(name);old=sha(path);new=hashlib.sha256(decode(value)).hexdigest()
           if old is not None and old!=new and old not in payload['before'].get(name,[]):raise SystemExit('Source drift: '+name)
          for name,allowed in payload['delete'].items():
           old=sha(target(name))
           if old is not None and old not in allowed:raise SystemExit('Deletion source drift: '+name)
          for item in payload['downloads']:
           old=sha(target(item['path']))
           if old is not None and old!=item['sha256']:raise SystemExit('Asset source drift: '+item['path'])
          # Stage and verify every external immutable asset before committing changes.
          staged={}
          for item in payload['downloads']:
           if sha(target(item['path']))==item['sha256']:continue
           for attempt in range(3):
            try:
             with urllib.request.urlopen(item['url'],timeout=30) as response:content=response.read()
             assert hashlib.sha256(content).hexdigest()==item['sha256'], 'Pinned asset checksum mismatch'
             staged[item['path']]=content;break
            except Exception:
             if attempt==2:raise
             time.sleep(attempt+1)
          for name,value in payload['files'].items():staged[name]=decode(value)
          for name,content in staged.items():
           path=target(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          for name in payload['delete']:target(name).unlink(missing_ok=True)
          print('Verified source package: '+str(len(payload['files']))+' changes, '+str(len(payload['downloads']))+' pinned assets')
          CONNECT_PACKAGE
      - name: Install locked PWA dependencies and isolated SQL test engine
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/connect-call-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify SQL permissions, device ownership and repeat application
        run: CONNECT_SQL_TEST_MODULE="$RUNNER_TEMP/connect-call-sql/node_modules/@electric-sql/pglite" node scripts/verify-call-failure-sql.cjs
      - name: Verify current PWA including Turnix
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Apply server RPC only with an explicitly configured administrator connection
        env:
          CONNECT_SUPABASE_DB_URL: ${{ secrets.CONNECT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CONNECT_SUPABASE_DB_URL" ]; then
            echo '::warning::Server RPC NOT applied. Configure CONNECT_SUPABASE_DB_URL for the intended project or run the bundled checked SQL in Supabase SQL editor. Native audio fixes do not depend on this step; guarded technical-failure history does.'
            exit 0
          fi
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.13'
          python - <<'PYSQL'
          import os,pathlib,psycopg
          sql=pathlib.Path('supabase/migrations/20261111000100_connect_fail_audio_call.sql').read_text()
          body=sql.split('as $$',1)[1].split('end $$;',1)[0]+'end '
          try:
            with psycopg.connect(os.environ['CONNECT_SUPABASE_DB_URL'],sslmode='verify-full',sslrootcert='/etc/ssl/certs/ca-certificates.crt',autocommit=True) as connection:
              with connection.cursor() as cursor:
                cursor.execute("select to_regprocedure('public.connect_finish_audio_call(uuid,text)') is not null, to_regclass('public.connect_calls') is not null")
                if cursor.fetchone()!=(True,True): raise RuntimeError('Incompatible Connect server')
                cursor.execute("select prosrc from pg_proc where oid=to_regprocedure('public.connect_finish_owned_audio_call(uuid,text,text)')")
                old=cursor.fetchone()
                if old and old[0].strip()!=body.strip(): raise RuntimeError('Unknown newer failure RPC; refusing replacement')
                cursor.execute(sql,prepare=False)
                cursor.execute("select has_function_privilege('anon','public.connect_finish_owned_audio_call(uuid,text,text)','EXECUTE'),has_function_privilege('authenticated','public.connect_finish_owned_audio_call(uuid,text,text)','EXECUTE')")
                if cursor.fetchone()!=(False,True): raise RuntimeError('RPC privileges differ')
            print('Server RPC applied and verified; existing call rows and schema retained.')
          except Exception as error:
            print('::error::Server migration failed: '+type(error).__name__+'. Connection strings and credentials are never logged.')
            raise SystemExit(1)
          PYSQL
      - name: Save checked server source
        run: |
          set -euo pipefail
          git add supabase/migrations/20261111000100_connect_fail_audio_call.sql scripts/verify-call-failure-sql.cjs
          git diff --cached --binary > connect-226-server.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Guard technical call failures by the answering device'
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then echo '::error::Source push failed; repository main was NOT updated.' >&2; exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Connect-226-server-source
          path: |
            connect-226-server.patch
            supabase/migrations/20261111000100_connect_fail_audio_call.sql
            scripts/verify-call-failure-sql.cjs

