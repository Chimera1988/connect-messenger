name: Connect - iOS stickers and personal favorites

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-ios-sticker-favorites.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped UI and favorites changes
        run: |
          python3 - <<'PY_PATCH'
          from pathlib import Path
          
          page_path = Path('app/page.tsx')
          css_path = Path('app/globals.css')
          page = page_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          
          
          def patch_once(old: str, new: str, label: str):
              global page
              if new in page:
                  print('Already applied:', label)
                  return
              n = page.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected one anchor, got {n}')
              page = page.replace(old, new, 1)
              print('Patched:', label)
          
          patch_once(
              'type CustomSticker = {id:string;pack_id:string;name:string;storage_path:string;position:number};',
              "type CustomSticker = {id:string;pack_id:string;name:string;storage_path:string;position:number};\nconst IOS_FAVORITE_PACK = 'Избранное из чатов · Connect';",
              'private favorites pack identifier',
          )
          
          # Save a private COPY of a received iPhone sticker in the existing sticker backend.
          # Image bytes, not expiring signed URLs, are stored. Private packs never leak to other users.
          helpers = '''  // Connect iOS sticker favorites v1: save a private durable copy, not a temporary photo link.
            async function saveKeyboardStickerFavorite(m: Message) {
              if (!supabase || !user || !m.attachment_path || !isKeyboardSticker(m) || busy) return;
              setMenuMessage(null);
              setBusy(true);
              let storedPath: string | null = null;
              try {
                const source = await supabase.storage.from('connect-attachments').download(m.attachment_path);
                if (source.error || !source.data) throw new Error(source.error?.message || 'Файл недоступен');
                let imageBlob: Blob = source.data;
                let mime = (m.attachment_type || imageBlob.type || 'image/png').toLowerCase();
                if (mime === 'image/jpeg' || mime === 'image/jpg') {
                  const url = URL.createObjectURL(imageBlob);
                  try {
                    const image = new Image();
                    await new Promise<void>((resolve, reject) => {
                      image.onload = () => resolve();
                      image.onerror = () => reject(new Error('Невозможно прочитать изображение'));
                      image.src = url;
                    });
                    const canvas = document.createElement('canvas');
                    canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
                    const context = canvas.getContext('2d');
                    if (!context) throw new Error('Невозможно обработать изображение');
                    context.drawImage(image, 0, 0);
                    imageBlob = await new Promise<Blob>((resolve, reject) => canvas.toBlob(
                      value => value ? resolve(value) : reject(new Error('Не удалось создать PNG')), 'image/png'
                    ));
                    mime = 'image/png';
                  } finally { URL.revokeObjectURL(url); }
                }
                if (!['image/png','image/webp','image/gif'].includes(mime)) throw new Error('Поддерживаются PNG, WebP и GIF');
                if (imageBlob.size < 1 || imageBlob.size > 2 * 1024 * 1024) throw new Error('Размер стикера должен быть до 2 МБ');
                const hash = await crypto.subtle.digest('SHA-256', await imageBlob.arrayBuffer());
                const fingerprint = Array.from(new Uint8Array(hash), n => n.toString(16).padStart(2, '0')).join('').slice(0, 48);
                const name = 'iOS-' + fingerprint;
                let pack = customPacks.find(item => item.owner_id === user.id && item.name === IOS_FAVORITE_PACK);
                if (!pack) {
                  const existing = await supabase.from('connect_sticker_packs')
                    .select('id,name,emoji,owner_id,is_public,created_at')
                    .eq('owner_id', user.id).eq('name', IOS_FAVORITE_PACK).maybeSingle();
                  if (existing.error) throw existing.error;
                  if (existing.data) pack = existing.data as CustomPack;
                  else {
                    const created = await supabase.from('connect_sticker_packs')
                      .insert({name:IOS_FAVORITE_PACK,emoji:'⭐',owner_id:user.id,is_public:false})
                      .select('id,name,emoji,owner_id,is_public,created_at').single();
                    if (created.error || !created.data) throw created.error || new Error('Не удалось создать избранное');
                    pack = created.data as CustomPack;
                  }
                }
                const duplicate = await supabase.from('connect_stickers').select('id')
                  .eq('pack_id', pack.id).eq('name', name).limit(1);
                if (duplicate.error) throw duplicate.error;
                if (duplicate.data?.length) {
                  setNotice('Этот стикер уже в избранном');
                  await loadCustomStickers();
                  return;
                }
                const ext = mime === 'image/gif' ? 'gif' : mime === 'image/webp' ? 'webp' : 'png';
                storedPath = `${user.id}/${pack.id}/${crypto.randomUUID()}.${ext}`;
                const uploaded = await supabase.storage.from('connect-stickers')
                  .upload(storedPath, imageBlob, {contentType:mime,upsert:false});
                if (uploaded.error) throw uploaded.error;
                const inserted = await supabase.from('connect_stickers')
                  .insert({pack_id:pack.id,name,storage_path:storedPath});
                if (inserted.error) throw inserted.error;
                storedPath = null;
                await loadCustomStickers();
                setNotice('Стикер добавлен в избранное');
              } catch (error) {
                if (storedPath) await supabase.storage.from('connect-stickers').remove([storedPath]);
                setNotice('Не удалось сохранить стикер: ' + (error instanceof Error ? error.message : String(error)));
              } finally { setBusy(false); }
            }
          
          '''
          patch_once(
              '  function handleComposerPaste(event: React.ClipboardEvent<HTMLInputElement>) {',
              helpers + '  function handleComposerPaste(event: React.ClipboardEvent<HTMLInputElement>) {',
              'durable favorite handler',
          )
          
          # Sending a privately saved sticker re-uploads it as a normal conversation attachment,
          # preserving the recipient's access and the existing message attachment RLS checks.
          send_old = '''  async function sendCustomSticker(st:CustomSticker){
              if(!supabase||!user||!activeChat||busy)return;
              setBusy(true);'''
          send_new = '''  async function sendCustomSticker(st:CustomSticker){
              if(!supabase||!user||!activeChat||busy)return;
              const savedPack = customPacks.find(pack => pack.id === st.pack_id);
              if(savedPack?.owner_id === user.id && savedPack.name === IOS_FAVORITE_PACK) {
                try {
                  const result = await supabase.storage.from('connect-stickers').download(st.storage_path);
                  if (result.error || !result.data) throw result.error || new Error('Не удалось загрузить стикер');
                  const ext = /\\.(png|webp|gif)$/i.exec(st.storage_path)?.[1]?.toLowerCase() || 'png';
                  const mime = ext === 'gif' ? 'image/gif' : ext === 'webp' ? 'image/webp' : 'image/png';
                  await sendAttachment(new File([result.data], `sticker-${Date.now()}.${ext}`, {type:mime}));
                  setStickerPicker(false);
                } catch (error) {
                  setNotice('Не удалось отправить стикер: '+(error instanceof Error?error.message:String(error)));
                }
                return;
              }
              setBusy(true);'''
          patch_once(send_old, send_new, 'send saved private stickers as cross-user attachments')
          
          # Keep Apple/pasted stickers out of the picture gallery completely.
          patch_once(
              "(m.attachment_kind==='image'||m.attachment_kind==='video')&&!isVideoNote(m)?",
              "(m.attachment_kind==='image'||m.attachment_kind==='video')&&!isVideoNote(m)&&!isKeyboardSticker(m)?",
              'gallery excludes stickers',
          )
          
          patch_once(
              '                          {!attachmentUrls[m.attachment_path] ? <span>Загрузка вложения…</span>',
              '                          {!attachmentUrls[m.attachment_path] ? (isKeyboardSticker(m) ? <span className="connect-keyboard-sticker-loading" aria-label="Загрузка стикера"/> : <span>Загрузка вложения…</span>)',
              'fixed loading placeholder for stickers',
          )
          
          # This is the precise image branch which currently opens the photo viewer.
          old_image = '''                            : m.attachment_kind==='image' ? <button type="button" className="connect-media-thumb" onClick={e=>{e.stopPropagation();setMediaViewer({url:attachmentUrls[m.attachment_path!],path:m.attachment_path!,name:m.attachment_name || 'Фото.jpg',kind:'image'})}} aria-label="Открыть фото"><img src={attachmentUrls[m.attachment_path]} alt={m.attachment_name || 'Фото'} loading="lazy"/></button>'''
          new_image = '''                            : m.attachment_kind==='image' ? (isKeyboardSticker(m)
                                        ? <img className="connect-keyboard-sticker" src={attachmentUrls[m.attachment_path]} alt="Стикер" draggable={false} loading="lazy"/>
                                        : <button type="button" className="connect-media-thumb" onClick={e=>{e.stopPropagation();setMediaViewer({url:attachmentUrls[m.attachment_path!],path:m.attachment_path!,name:m.attachment_name || 'Фото.jpg',kind:'image'})}} aria-label="Открыть фото"><img src={attachmentUrls[m.attachment_path]} alt={m.attachment_name || 'Фото'} loading="lazy"/></button>)'''
          patch_once(old_image, new_image, 'sticker renderer has no photo viewer')
          
          # Favorites appear in the existing star tab instead of an extra visible pack tab.
          patch_once(
              '                  {customPacks.map(p=><button key={p.id}',
              '                  {customPacks.filter(p=>p.name!==IOS_FAVORITE_PACK).map(p=><button key={p.id}',
              'hide private imported-favorites pack tab',
          )
          
          picker_extra = '''<div className="sticker-grid">{!customPack && stickerPack==='favorites' && customStickers
                            .filter(st => customPacks.some(pack => pack.id===st.pack_id && pack.owner_id===user.id && pack.name===IOS_FAVORITE_PACK))
                            .map(st => <div key={'ios-saved-'+st.id} className="sticker-choice">
                              <button type="button" onClick={()=>void sendCustomSticker(st)} disabled={busy} aria-label="Отправить сохранённый стикер"><img src={customStickerUrl(st)} alt="Сохранённый стикер"/></button>
                              <button type="button" className="sticker-fav" onClick={()=>void deleteCustomSticker(st)} aria-label="Удалить из избранного">★</button>
                            </div>)}{customPack?'''
          patch_once(
              '<div className="sticker-grid">{customPack?',
              picker_extra,
              'show private iOS stickers in existing favorites tab',
          )
          
          patch_once(
              '      <button type="button" onClick={() => beginForward([menuMessage.id])}><Icon name="forward" size={22}/>Переслать</button>',
              '''      {isKeyboardSticker(menuMessage) && <button type="button" onClick={() => void saveKeyboardStickerFavorite(menuMessage)} disabled={busy}><Icon name="plus" size={22}/>Добавить в избранное</button>}
                <button type="button" onClick={() => beginForward([menuMessage.id])}><Icon name="forward" size={22}/>Переслать</button>''',
              'long press Save to Favorites',
          )
          
          # Photo-heavy conversations still use the same image viewer; only keyboard stickers are exempt.
          # Keep message previews semantically accurate.
          old_preview = "stickerFromBody(forwardedMessage(m.body).text) ? 'Стикер' : forwardedMessage(m.body).text"
          new_preview = "(stickerFromBody(forwardedMessage(m.body).text) || (m.attachment_kind==='image' && /^sticker-\\d+\\.(png|webp|gif|jpe?g)$/i.test(m.attachment_name || ''))) ? 'Стикер' : forwardedMessage(m.body).text"
          patch_once(old_preview, new_preview, 'chat list displays Sticker instead of Photo')
          
          # Isolate CSS to paste-style stickers, never regular photographs or albums.
          css_marker = '/* Connect iOS sticker favorites v1: inert sticker media, not an image viewer */'
          css_rules = '''
          /* Connect iOS sticker favorites v1: inert sticker media, not an image viewer */
          .connect-app .bubble.sticker-bubble .keyboard-sticker-preview {
            width: min(170px, 44vw) !important;
            max-width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            overflow: visible !important;
          }
          .connect-app .bubble.sticker-bubble .keyboard-sticker-preview .connect-keyboard-sticker,
          .connect-app .bubble.sticker-bubble .keyboard-sticker-preview .connect-keyboard-sticker-loading {
            display: block !important;
            width: min(170px, 44vw) !important;
            height: min(170px, 44vw) !important;
            max-width: 100% !important;
            max-height: none !important;
            min-width: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            object-fit: contain !important;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
          }
          .connect-app .bubble.sticker-bubble:has(.connect-keyboard-sticker) {
            width: fit-content !important;
            max-width: min(180px, 48vw) !important;
          }
          '''
          if css_marker not in css:
              css = css.rstrip() + '\n' + css_rules
              print('Patched: sticker-only CSS')
          else:
              print('Already applied: sticker-only CSS')
          
          page_path.write_text(page, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY_PATCH
      - name: Confirm clean patch
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit only affected PWA files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No additional changes needed"
            exit 0
          fi
          git commit -m "feat: treat iPhone image stickers as stickers with durable personal favorites"
          git push origin HEAD:main
