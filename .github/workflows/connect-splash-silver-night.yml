name: Connect - Silver Night splash screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-splash-silver-night.yml'

permissions:
  contents: write

concurrency:
  group: connect-splash-silver-night
  cancel-in-progress: false

