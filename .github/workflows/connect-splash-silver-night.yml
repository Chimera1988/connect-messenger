      - name: Change only the splash colors and typography
        shell: bash
        run: |
          cat > /tmp/connect-silver-splash.py <<'CONNECT_SILVER_PATCH'
          from pathlib import Path
          
          component_path=Path('components/ConnectSplashScreen.tsx')
          css_path=Path('app/connect-splash.css')
          if not component_path.is_file() or not css_path.is_file():
              raise SystemExit('Splash component or its CSS missing: abort without altering anything.')
          s=component_path.read_text(encoding='utf-8')
          old_name='/connect-splash-bubbles-transparent.png'
          new_name='/connect-splash-bubbles-silver-v1.png'
          if new_name not in s:
              if old_name not in s:
                  raise SystemExit('Unknown splash icon structure: abort without altering anything.')
              s=s.replace(old_name, new_name, 1)
          # Only splash wave SVG colors are touched. Never change the app theme or its logo.
          colors={
           '#15b5ff':'#a7bdcc', '#0067e8':'#465c70', '#053ebd':'#09131e',
           '#009aff':'#bbcbd8', '#078bfa':'#526c82', '#063bc4':'#1b3145',
           '#3caefb':'#859aa9', '#69ecff':'#dceaf4', '#27a9ff':'#b0cadb',
           '#48a6fe':'#687f93', '#41aaff':'#92a9b9', '#288afe':'#536f84',
          }
          for before,after in colors.items():
              if before in s:
                  s=s.replace(before,after)
              elif after not in s:
                  raise SystemExit('Unknown wave color '+before+': abort.')
          # Light ribbon interiors; luminous thin edge should remain the visual focus.
          transparency={
           'stopColor="#a7bdcc" stopOpacity=".85"': 'stopColor="#a7bdcc" stopOpacity=".12"',
           'stopColor="#465c70" stopOpacity=".63"': 'stopColor="#465c70" stopOpacity=".18"',
           'stopColor="#09131e" stopOpacity=".08"': 'stopColor="#09131e" stopOpacity=".02"',
           'stopColor="#bbcbd8" stopOpacity=".15"': 'stopColor="#bbcbd8" stopOpacity=".02"',
           'stopColor="#526c82" stopOpacity=".78"': 'stopColor="#526c82" stopOpacity=".25"',
           'stopColor="#1b3145" stopOpacity=".7"': 'stopColor="#1b3145" stopOpacity=".22"',
           'stopColor="#dceaf4" stopOpacity=".9"': 'stopColor="#dceaf4" stopOpacity=".55"',
          }
          for before,after in transparency.items():
              if before in s: s=s.replace(before,after)
              elif after not in s: raise SystemExit('Unknown wave opacity '+before)
          component_path.write_text(s, encoding='utf-8')
          css_path.write_text("/* Connect splash / Silver Night — isolated from application theme settings. */\n.connect-splash {\n  position: fixed;\n  inset: 0;\n  z-index: 2147483000;\n  overflow: hidden;\n  min-height: 100vh;\n  min-height: 100dvh;\n  color: #f4f5f7;\n  isolation: isolate;\n  background:\n    radial-gradient(95% 57% at -8% 22%, rgba(87, 105, 121, .17), transparent 72%),\n    radial-gradient(120% 67% at 104% 76%, rgba(75, 98, 120, .25), transparent 72%),\n    linear-gradient(165deg, #090e14 0%, #0b131c 50%, #0a1017 100%);\n  opacity: 1;\n  transition: opacity 420ms ease;\n  -webkit-font-smoothing: antialiased;\n  pointer-events: all;\n}\n.connect-splash--leaving { opacity: 0; pointer-events: none; }\n.connect-splash__waves {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  pointer-events: none;\n}\n.connect-splash__upper-wave,\n.connect-splash__lower-wave {\n  transform-origin: center;\n  animation: connect-splash-wave-drift 9s ease-in-out infinite alternate;\n}\n.connect-splash__lower-wave {\n  animation-duration: 12s;\n  animation-direction: alternate-reverse;\n}\n.connect-splash__center {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-direction: column;\n  transform: translateY(-2.8%);\n  padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));\n}\n.connect-splash__icon {\n  display: block;\n  width: min(47vw, 220px);\n  max-width: 100%;\n  height: auto;\n  filter: drop-shadow(0 11px 16px rgba(1, 5, 10, .28));\n}\n.connect-splash__word {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  flex-wrap: nowrap;\n  margin-top: -2px;\n  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;\n  font-size: clamp(41px, 11vw, 58px);\n  font-weight: 750;\n  line-height: 1.12;\n  letter-spacing: -.045em;\n  user-select: none;\n  filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .14));\n}\n.connect-splash__letter {\n  opacity: 0;\n  transform: translateY(5px);\n  color: transparent;\n  transition: opacity 260ms ease, transform 260ms ease;\n}\n.connect-splash__letter.is-visible {\n  opacity: 1;\n  transform: translateY(0);\n  color: #dbe0e7; /* fallback when background-clip is unavailable */\n  background-image: linear-gradient(180deg, #fff 0%, #edf0f3 28%, #b5bdc7 66%, #687686 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n@keyframes connect-splash-wave-drift {\n  from { transform: translate3d(-2%, 0, 0) scale(1.01); }\n  to { transform: translate3d(2%, -0.6%, 0) scale(1.035); }\n}\n@media (max-height: 570px) {\n  .connect-splash__icon { width: min(30vh, 185px); }\n  .connect-splash__word { font-size: clamp(27px, 7vw, 46px); margin-top: 9px; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .connect-splash__upper-wave,\n  .connect-splash__lower-wave { animation: none; }\n  .connect-splash__letter { transition: none; transform: none; }\n  .connect-splash { transition-duration: 100ms; }\n}\n",encoding='utf-8')
          print('Silver Night colors installed; original letter-loading logic preserved.')
          CONNECT_SILVER_PATCH
          python3 /tmp/connect-silver-splash.py
      - name: Verify changes
        run: git diff --check
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Commit approved splash palette
        shell: bash
        run: |
          git add components/ConnectSplashScreen.tsx app/connect-splash.css public/connect-splash-bubbles-silver-v1.png
          if git diff --cached --quiet; then
            echo 'Silver Night splash is already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: Connect silver night splash screen'
          git push origin HEAD:main
