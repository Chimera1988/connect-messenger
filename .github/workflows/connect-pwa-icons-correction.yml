name: Connect PWA - reference icons only (no styling changes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-icons-correction.yml'

permissions:
  contents: write

concurrency:
  group: connect-pwa-icons-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  icons-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect PWA
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch SVG shapes only
        shell: bash
        run: |
          test "${{ github.repository }}" = 'Chimera1988/connect-messenger' || exit 1
          python3 - <<'PY_ICONS_ONLY'
          from pathlib import Path
          import re

          page_file = Path('app/page.tsx')
          call_file = Path('components/ConnectCallsHub.tsx')
          for path in (page_file, call_file):
              if not path.is_file():
                  raise SystemExit(f'Connect PWA source not found: {path}')

          page = page_file.read_text(encoding='utf-8')
          call = call_file.read_text(encoding='utf-8')
          if 'function Icon({ name, size = 22, stroke = 1.9 }:' not in page:
              raise SystemExit('The PWA SVG component has changed; stopping to protect the layout.')
          if 'function CallIcon({ outgoing = false, size = 24 }:' not in call:
              raise SystemExit('The Calls SVG component has changed; stopping to protect call logic.')
          if 'aria-label="Стикеры"><Icon name="smile" size={24}/>' not in page:
              raise SystemExit('The sticker button SVG is not installed. Apply the preceding icons workflow first.')

          # Recreate the supplied outline shapes only. Do not touch CSS, themes,
          # selection highlight, sizes, icons' colors or event handlers.
          icons = {
              'chats': '''<><path d="M4.6 9.8c-1.7 1.5-2.3 3.9-1.5 6.1.3.8.7 1.4 1.2 2l-1 2.6 3.1-.9c1.1.5 2.2.6 3.3.5"/><path d="M12.7 3.3c4.2 0 7.6 3.3 7.6 7.4 0 1.5-.4 2.9-1.1 4.1l.9 3.5-3.5-1.1c-1.2.7-2.6 1.1-4 1.1-4.2 0-7.6-3.3-7.6-7.6s3.4-7.4 7.7-7.4Z"/></>''',
              'contacts': '''<><circle cx="7.7" cy="8.2" r="2.3"/><circle cx="16.2" cy="7.9" r="2.55"/><path d="M3.1 18.7v-.6c0-2.7 2.1-4.6 4.6-4.6 1.1 0 2.1.3 2.9.9"/><path d="M11.3 19.3v-.7c0-2.8 2.2-4.7 4.9-4.7s4.9 1.9 4.9 4.7v.7h-9.8Z"/></>''',
              'settings': '''<><path d="M10.4 2.4h3.2l.65 2.2c.64.2 1.25.46 1.8.78l2.1-.97 2.25 2.25-.98 2.08c.32.56.58 1.16.77 1.8l2.21.66v3.2l-2.21.65c-.19.65-.45 1.25-.77 1.81l.98 2.08-2.25 2.25-2.1-.97c-.55.32-1.16.58-1.8.77l-.65 2.21h-3.2l-.65-2.21c-.64-.19-1.25-.45-1.81-.77l-2.08.97-2.25-2.25.97-2.08c-.32-.56-.58-1.16-.77-1.81l-2.21-.65v-3.2l2.21-.66c.19-.64.45-1.24.77-1.8l-.97-2.08 2.25-2.25 2.08.97c.56-.32 1.17-.58 1.81-.78z"/><circle cx="12" cy="12.8" r="2.9"/></>''',
              'smile': '''<><circle cx="12" cy="12" r="9.1"/><circle cx="8.4" cy="9.6" r="1" fill="currentColor" stroke="none"/><circle cx="15.6" cy="9.6" r="1" fill="currentColor" stroke="none"/><path d="M7.8 14.2h8.4c-.7 2.35-2.25 3.8-4.2 3.8s-3.5-1.45-4.2-3.8Z" fill="currentColor" stroke="none"/></>''',
              'plus': '''<path d="M12 3.4v17.2M3.4 12h17.2"/>''',
              'camera': '''<><path d="M3.6 7h3.1l1.7-2.5h7.2L17.3 7h3.1c.85 0 1.5.65 1.5 1.5v10.4c0 .9-.65 1.6-1.5 1.6H3.6c-.85 0-1.5-.7-1.5-1.6V8.5c0-.85.65-1.5 1.5-1.5Z"/><circle cx="12" cy="13.4" r="3.65"/></>''',
              'mic': '''<><rect x="9.2" y="2" width="5.6" height="13.2" rx="2.8"/><path d="M5.3 10.2v1.2a6.7 6.7 0 0 0 13.4 0v-1.2M12 18v4m-3.7 0h7.4"/></>''',
          }

          for name, svg in icons.items():
              desired = f'    {name}: {svg},'
              pattern = re.compile(r'^    '+re.escape(name)+r': .+,$', re.MULTILINE)
              matches = list(pattern.finditer(page))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {name} icon definition, found {len(matches)}. No files written.')
              match = matches[0]
              page = page[:match.start()] + desired + page[match.end():]

          # Calls are a separate React component. Replace its handset only;
          # leave outgoing-arrow indication and telephony handlers intact.
          a = call.find('function CallIcon(')
          b = call.find('function Arrow(', a)
          if a < 0 or b <= a:
              raise SystemExit('Cannot locate the dedicated call icon function.')
          segment = call[a:b]
          shape = '''<path d="M6.3 3.2c-.65-.6-1.4-.6-2.05-.05L2.9 4.45c-.9.85-.85 2.05-.45 3.3 2.3 6.3 6.9 10.9 13.2 13.2 1.25.4 2.45.45 3.3-.45l1.3-1.35c.55-.65.55-1.4-.05-2.05l-3.65-2.9a1.8 1.8 0 0 0-2.2.15l-1.35 1.35A15 15 0 0 1 8.3 11l1.35-1.35a1.8 1.8 0 0 0 .15-2.2Z" />'''
          pattern = re.compile(r'(?m)^    <path d="[^"]+" />$')
          found = list(pattern.finditer(segment))
          if len(found) != 1:
              raise SystemExit('Could not safely find the single handset path in ConnectCallsHub.')
          m = found[0]
          segment = segment[:m.start()] + '    ' + shape + segment[m.end():]
          call = call[:a] + segment + call[b:]

          page_file.write_text(page, encoding='utf-8')
          call_file.write_text(call, encoding='utf-8')
          print('Only inline SVG paths updated. CSS, colors, selection highlighting, sizes and all button actions unchanged.')
          PY_ICONS_ONLY
      - name: Verify SVG-only changes and TypeScript
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only | grep -v -E '^(app/page\.tsx|components/ConnectCallsHub\.tsx)$' || true)
          test -z "$changed" || { echo "Unexpected non-icon files modified: $changed"; exit 1; }
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Save icon changes to main
        shell: bash
        run: |
          git config user.name 'Connect PWA Icons'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx components/ConnectCallsHub.tsx
          if git diff --cached --quiet; then
            echo 'SVG reference shapes already applied.'
          else
            git commit -m 'style: match reference icon shapes without changing UI styling'
            git push origin HEAD:main
          fi
