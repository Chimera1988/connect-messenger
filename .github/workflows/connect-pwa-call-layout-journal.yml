name: Connect PWA | Standalone calls journal and fullscreen call layout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-calls-layout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-then-apply:
    name: Test call UI and journal before committing
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Connect PWA sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for f in AGENTS.md package.json package-lock.json tsconfig.json app/calls.css app/call-journal-editor.css components/ConnectAudioCalls.tsx components/ConnectCallsHub.tsx tests/call-rtc.integration.cjs tests/pwa-five-ui.test.cjs; do
            test -s "$f" || { echo "SOURCE_DRIFT: missing $f" >&2; exit 1; }
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install matching Chromium for existing browser tests
        run: npx playwright-core install --with-deps chromium

      - name: Check Chromium binary
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Chromium missing: '+p)"

      - name: Add focused regression tests (without overwriting edits)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-call-fullscreen.test.cjs" <<'JS_CALL_TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=process.cwd();
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const call=read('components/ConnectAudioCalls.tsx');
          const css=read('app/calls.css');
          const journal=read('app/call-journal-editor.css');
          const hub=read('components/ConnectCallsHub.tsx');
          const marker='CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114';
          
          test('Calls journal is its own screen, not a translucent overlay',()=>{
            assert.match(journal,/\.connect-app \.main-view:has\(> \.connect-pwa-call-journal\) > :not\(\.connect-pwa-call-journal\)\s*\{\s*display:none !important;/);
            assert.match(journal,/\.connect-app \.main-view > \.connect-call-history-screen\.connect-pwa-call-journal\s*\{[\s\S]*?position:relative;[\s\S]*?background:transparent;[\s\S]*?backdrop-filter:none;/);
            assert.ok(hub.includes('connect-pwa-call-journal'),'PWA-only journal class missing');
            assert.ok(hub.includes('!window.ConnectAndroid&&!window.ConnectNative'),'native journal must remain unchanged');
            assert.ok(journal.includes(marker));
          });
          
          test('Call has a fullscreen theme-owned canvas without underlying screen bleed',()=>{
            assert.match(css,/\.connect-app \.connect-call-backdrop\.connect-pwa-call-layout\s*\{[\s\S]*?var\(--glass-background, var\(--bg\)\);[\s\S]*?backdrop-filter:none;/);
            assert.match(css,/\.connect-app \.connect-pwa-call-layout \.connect-call-modal\s*\{[\s\S]*?height:100%;[\s\S]*?border:0;[\s\S]*?border-radius:0;[\s\S]*?background:transparent;/);
            assert.ok(css.includes(marker));
          });
          
          test('Avatar, name and timer form the centered middle group',()=>{
            assert.match(call,/className="connect-call-identity"[\s\S]*?<ConnectCallAvatar className="connect-call-avatar"[\s\S]*?<h2>\{shownName[\s\S]*?<p className="connect-call-info" role="status">\{phaseTitle\[phase\]\}<\/p>\s*<\/div>/);
            assert.match(css,/\.connect-app \.connect-pwa-call-layout \.connect-call-identity\s*\{[\s\S]*?justify-content:center;/);
            assert.match(css,/\.connect-app \.connect-pwa-call-layout \.connect-call-identity \.connect-call-avatar\s*\{[\s\S]*?width:clamp\(124px, 38vw, 164px\)/);
          });
          
          test('Actions have one horizontal row, ending with End on the right',()=>{
            assert.match(css,/\.connect-app \.connect-pwa-call-layout \.connect-call-actions\s*\{[\s\S]*?display:grid;[\s\S]*?grid-template-columns:repeat\(3, minmax\(0, 1fr\)\)/);
            assert.match(css,/\.connect-app \.connect-pwa-call-layout \.connect-call-actions \.connect-call-action\.hangup\s*\{\s*grid-column:3;/);
            const action=call.split('<div className="connect-call-actions">')[1]?.split('</div>')[0]||'';
            for(const command of ['toggleMute','enableRemoteAudio',"finish(incoming ? 'decline' : 'hangup')"])assert.ok(action.includes(command),command+' missing');
            assert.ok(action.indexOf('toggleMute')<action.indexOf('enableRemoteAudio'));
            assert.ok(action.indexOf('enableRemoteAudio')<action.indexOf("finish(incoming ? 'decline' : 'hangup')"));
          });
          
          test('Minimize has text only; compact call remains interactive and RTC cleanup unchanged',()=>{
            assert.match(call,/aria-label="Свернуть звонок">Свернуть<\/button>/);
            assert.ok(call.includes('connect-pwa-call-layout'),'PWA call screen class missing');
            assert.ok(call.includes('!window.ConnectAndroid && !window.ConnectNative'),'native call UI must remain unchanged');
            assert.doesNotMatch(call,/aria-label="Свернуть звонок">⌄/);
            assert.match(call,/className="connect-call-mini" aria-label="Вернуться к разговору" onClick=\{\(\)=>setMinimized\(false\)\}/);
            assert.match(call,/\<audio ref=\{remoteAudioRef\} className="connect-call-audio" autoPlay\/\>/);
            assert.match(call,/pcRef\.current\?\.close\(\)/);
          });
          
          test('Chrome layout: standalone journal and bottom row on wide/narrow mobile screens',async t=>{
            if(process.env.CONNECT_SKIP_BROWSER==='1'){t.diagnostic('Browser test runs on GitHub Actions with matching Chromium');return;}
            const {chromium}=require('playwright-core');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const [width,height] of [[390,844],[375,667],[320,568]]){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,isMobile:true,hasTouch:true});
                const base=`html,body{margin:0;min-height:100%;}*{box-sizing:border-box}
                .connect-app{position:relative;display:flex;flex-direction:column;width:${width}px;height:${height}px;--bg:#080b11;--text:#eee;--muted:#a7acbb;--accent:#198f78;--wave-primary:#0ad9b7;--wave-secondary:#65acf4;--glass-background:#070c15;--panel:#152034;--glass-surface-strong:#172034;--glass-sheen:rgba(255,255,255,.08)}
                .main-view{position:relative;display:flex;flex-direction:column;min-height:0;flex:1;padding:0 16px;}`;
                await page.setContent(`<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div class="connect-app"><div class="main-view"><header class="old-chats">Чаты</header><section class="connect-call-history-screen connect-pwa-call-journal"><h1>Звонки</h1></section></div><div class="connect-call-backdrop connect-pwa-call-layout"><div class="connect-call-modal"><div class="connect-call-headline"><p class="connect-call-eyebrow">CONNECT · АУДИО</p><button class="connect-call-minimize">Свернуть</button></div><div class="connect-call-identity"><span class="connect-call-avatar">А</span><h2>Тестировщик</h2><p class="connect-call-info">Разговор · 0:14</p></div><div class="connect-call-actions"><button class="connect-call-action"><span>♪</span><span>Микрофон</span></button><button class="connect-call-action"><span>↗</span><span>Аудиовыход</span></button><button class="connect-call-action hangup"><span>×</span><span>Завершить</span></button></div><p class="connect-call-note">Звонки работают при открытой PWA.</p></div></div></div></body></html>`);
                await page.addStyleTag({content:base+'\n'+css+'\n'+journal});
                const rects=await page.evaluate(()=>{
                  const box=s=>document.querySelector(s).getBoundingClientRect();
                  const style=s=>getComputedStyle(document.querySelector(s));
                  return { old:style('.old-chats').display, journalPosition:style('.connect-call-history-screen').position,
                    journalFilter:style('.connect-call-history-screen').backdropFilter,
                    backdrop:style('.connect-call-backdrop').backgroundImage,
                    modal:box('.connect-call-modal').toJSON(), avatar:box('.connect-call-avatar').toJSON(),
                    actionDisplay:style('.connect-call-actions').display,
                    actions:['.connect-call-actions .connect-call-action:nth-child(1)','.connect-call-actions .connect-call-action:nth-child(2)','.connect-call-actions .hangup'].map(s=>box(s).toJSON()),
                    minimize:document.querySelector('.connect-call-minimize').textContent};
                });
                assert.equal(rects.old,'none',`journal must hide old tab at ${width}`);
                assert.equal(rects.journalPosition,'relative');
                assert.equal(rects.journalFilter,'none');
                assert.equal(rects.actionDisplay,'grid');
                assert.ok(rects.actions[0].x < rects.actions[1].x && rects.actions[1].x<rects.actions[2].x,`${width} controls not in horizontal order`);
                assert.ok(Math.abs(rects.avatar.x+rects.avatar.width/2-width/2)<5,`${width} avatar not centered`);
                assert.ok(rects.avatar.width>=105,`${width} avatar too small`);
                assert.ok(rects.actions[0].y>rects.avatar.bottom,`${width} buttons overlap avatar`);
                assert.ok(rects.actions[0].y>height*.55,`${width} buttons not at bottom`);
                assert.equal(rects.minimize,'Свернуть');
                await page.close();
              }
            }finally{await browser.close();}
          });
          JS_CALL_TEST
          if test -f tests/connect-call-fullscreen.test.cjs; then
            cmp -s "$RUNNER_TEMP/connect-call-fullscreen.test.cjs" tests/connect-call-fullscreen.test.cjs || { echo 'SOURCE_DRIFT: call-layout regression tests modified' >&2; exit 1; }
          else
            cp "$RUNNER_TEMP/connect-call-fullscreen.test.cjs" tests/connect-call-fullscreen.test.cjs
          fi
          node --check tests/connect-call-fullscreen.test.cjs

      - name: Confirm failure before patch (TDD RED)
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114' components/ConnectAudioCalls.tsx; then
            echo 'Prior implementation found. Full tests below validate it.'
            exit 0
          fi
          set +e
          CONNECT_SKIP_BROWSER=1 node --test --test-name-pattern='Calls journal is its own screen' tests/connect-call-fullscreen.test.cjs > "$RUNNER_TEMP/connect-call-red.log" 2>&1
          rc=$?
          set -e
          if test "$rc" -eq 0 || ! grep -Fq 'not ok' "$RUNNER_TEMP/connect-call-red.log"; then
            cat "$RUNNER_TEMP/connect-call-red.log"
            echo 'Expected journal transparency regression not reproduced; stop.' >&2
            exit 1
          fi
          echo 'RED confirmed: journal screen is not independent before patch.'

      - name: Apply guarded call-only patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-call-fullscreen-patch.py" <<'PY_CALL_PATCH'
          #!/usr/bin/env python3
          """Guarded and idempotent visual-only PWA call and journal layout update."""
          from pathlib import Path
          
          MARKER = 'CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114'
          
          call = Path('components/ConnectAudioCalls.tsx')
          styles = Path('app/calls.css')
          journal = Path('app/call-journal-editor.css')
          hub = Path('components/ConnectCallsHub.tsx')
          
          ORIGINAL_IDENTITY = '''        <ConnectCallAvatar className="connect-call-avatar" name={shownName || 'Собеседник'} url={shownAvatarUrl}/>
                  <h2>{shownName || 'Собеседник'}</h2>
                  <p className="connect-call-info" role="status">{phaseTitle[phase]}</p>'''
          UPDATED_IDENTITY = '''        {/* CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114: centered identity; transport remains mounted. */}
                  <div className="connect-call-identity">
                    <ConnectCallAvatar className="connect-call-avatar" name={shownName || 'Собеседник'} url={shownAvatarUrl}/>
                    <h2>{shownName || 'Собеседник'}</h2>
                    <p className="connect-call-info" role="status">{phaseTitle[phase]}</p>
                  </div>'''
          OLD_BACKDROP = '{calling && !compactCall && <div className="connect-call-backdrop" role="dialog" aria-modal="true" aria-label="Аудиозвонок Connect">'
          NEW_BACKDROP = '{calling && !compactCall && <div className={"connect-call-backdrop" + (!window.ConnectAndroid && !window.ConnectNative ? " connect-pwa-call-layout" : "")} role="dialog" aria-modal="true" aria-label="Аудиозвонок Connect">'
          OLD_JOURNAL = '{main && nav && userId && open && createPortal(<section className={"connect-call-history-screen"+(callSelecting?" is-selecting":"")} aria-label="История звонков">'
          NEW_JOURNAL = '{main && nav && userId && open && createPortal(<section className={"connect-call-history-screen"+(!window.ConnectAndroid&&!window.ConnectNative?" connect-pwa-call-journal":"")+(callSelecting?" is-selecting":"")} aria-label="История звонков">'
          OLD_MINIMIZE = 'aria-label="Свернуть звонок">⌄ Свернуть</button>' 
          NEW_MINIMIZE = 'aria-label="Свернуть звонок">Свернуть</button>'
          
          CALL_CSS = '''
          /* CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114 — an independent themed call screen.
             Keep the audio element and WebRTC component mounted while the UI is minimized. */
          .connect-app .connect-call-backdrop.connect-pwa-call-layout {
            display:block;
            padding:0;
            background:
              radial-gradient(ellipse 88% 51% at 5% 10%, color-mix(in srgb, var(--wave-primary, var(--accent)) 11%, transparent), transparent 77%),
              radial-gradient(ellipse 80% 43% at 96% 92%, color-mix(in srgb, var(--wave-secondary, var(--accent)) 12%, transparent), transparent 80%),
              var(--glass-background, var(--bg));
            -webkit-backdrop-filter:none;
            backdrop-filter:none;
          }
          .connect-app .connect-pwa-call-layout .connect-call-modal {
            display:flex;
            flex-direction:column;
            align-items:stretch;
            width:100%;
            max-width:none;
            height:100%;
            max-height:none;
            min-height:0;
            margin:0;
            padding:max(18px, env(safe-area-inset-top)) clamp(14px, 4vw, 24px) max(20px, env(safe-area-inset-bottom));
            overflow-y:auto;
            border:0;
            border-radius:0;
            background:transparent;
            box-shadow:none;
            -webkit-backdrop-filter:none;
            backdrop-filter:none;
          }
          .connect-app .connect-pwa-call-layout .connect-call-headline {
            flex:0 0 auto;
            min-height:40px;
            margin:0;
          }
          .connect-app .connect-pwa-call-layout .connect-call-minimize {
            font-size:13px;
            min-height:42px;
            padding:9px 15px;
          }
          /* Preserve the original ungrouped layout in native Android WebView. */
          .connect-app .connect-call-identity { display:contents; }
          .connect-app .connect-pwa-call-layout .connect-call-identity {
            flex:1 1 auto;
            min-height:205px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            padding:18px 2px 16px;
            text-align:center;
          }
          .connect-app .connect-pwa-call-layout .connect-call-identity .connect-call-avatar {
            width:clamp(124px, 38vw, 164px);
            height:clamp(124px, 38vw, 164px);
            flex:0 0 auto;
            margin:0 auto 22px;
            font-size:54px;
          }
          .connect-app .connect-pwa-call-layout .connect-call-identity h2 {
            width:100%;
            max-width:100%;
            font-size:clamp(24px, 6.5vw, 34px);
            line-height:1.18;
            margin:0;
          }
          .connect-app .connect-pwa-call-layout .connect-call-identity .connect-call-info {
            min-height:22px;
            margin:11px 0 0;
            font-size:clamp(14px, 3.6vw, 17px);
          }
          .connect-app .connect-pwa-call-layout .connect-call-actions {
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            align-items:start;
            justify-items:stretch;
            flex:0 0 auto;
            flex-wrap:nowrap;
            gap:7px;
            width:100%;
            margin-top:auto;
            padding:10px 0 0;
          }
          .connect-app .connect-pwa-call-layout .connect-call-actions .connect-call-action {
            min-width:0;
            width:100%;
            align-self:start;
            justify-self:stretch;
            font-size:clamp(11px, 3vw, 13px);
            line-height:1.26;
            text-align:center;
            gap:9px;
          }
          .connect-app .connect-pwa-call-layout .connect-call-actions .connect-call-action > span:first-child {
            width:clamp(55px, 16vw, 68px);
            height:clamp(55px, 16vw, 68px);
            border-radius:22px;
          }
          .connect-app .connect-pwa-call-layout .connect-call-actions .connect-call-action.hangup {
            grid-column:3;
          }
          .connect-app .connect-pwa-call-layout .connect-call-note {
            flex:0 0 auto;
            max-width:340px;
            margin:18px auto 0;
            font-size:11px;
          }
          .connect-app .connect-pwa-call-layout .connect-call-outputs {
            position:absolute;
            z-index:6;
            left:clamp(16px, 6vw, 40px);
            right:clamp(16px, 6vw, 40px);
            bottom:max(156px, 26dvh);
            width:auto;
            max-height:42dvh;
            overflow-y:auto;
            box-shadow:0 16px 36px rgba(0,0,0,.37);
          }
          @media (max-height:650px) {
            /* Preserve the original ungrouped layout in native Android WebView. */
          .connect-app .connect-call-identity { display:contents; }
          .connect-app .connect-pwa-call-layout .connect-call-identity { min-height:155px; padding:8px 2px; }
            .connect-app .connect-pwa-call-layout .connect-call-identity .connect-call-avatar { width:112px; height:112px; margin-bottom:13px; }
            .connect-app .connect-pwa-call-layout .connect-call-note { margin-top:11px; }
          }
          '''
          
          JOURNAL_CSS = '''
          /* CONNECT_PWA_CALL_SCREEN_JOURNAL_V2_20261114 — the Calls tab owns its screen.
             The underlying Chats/Contacts/Settings view must not bleed through. */
          .connect-app .main-view:has(> .connect-pwa-call-journal) > :not(.connect-pwa-call-journal) {
            display:none !important;
          }
          .connect-app .main-view:has(> .connect-pwa-call-journal) {
            overflow:hidden;
            isolation:isolate;
          }
          .connect-app .main-view > .connect-call-history-screen.connect-pwa-call-journal {
            position:relative;
            inset:auto;
            flex:1 1 auto;
            width:100%;
            min-height:0;
            z-index:1;
            background:transparent;
            -webkit-backdrop-filter:none;
            backdrop-filter:none;
          }
          '''
          
          def require_once(source: str, needle: str, filename: str):
              if source.count(needle) != 1:
                  raise RuntimeError(f'SOURCE_DRIFT {filename}: expected one anchor, found {source.count(needle)}: {needle[:85]}')
          
          def main():
              source = call.read_text(encoding='utf8')
              css = styles.read_text(encoding='utf8')
              jcss = journal.read_text(encoding='utf8')
              hub_source = hub.read_text(encoding='utf8')
          
              if MARKER in source or MARKER in css or MARKER in jcss:
                  if not (UPDATED_IDENTITY in source and NEW_MINIMIZE in source and NEW_BACKDROP in source and NEW_JOURNAL in hub_source and CALL_CSS.strip() in css and JOURNAL_CSS.strip() in jcss):
                      raise RuntimeError('SOURCE_DRIFT: incomplete or modified prior implementation')
                  if ORIGINAL_IDENTITY in source or OLD_MINIMIZE in source:
                      raise RuntimeError('SOURCE_DRIFT: prior patch left old call controls')
                  print('Already applied and verified: no additional changes.')
                  return
          
              require_once(source, ORIGINAL_IDENTITY, str(call))
              require_once(source, OLD_MINIMIZE, str(call))
              require_once(source, OLD_BACKDROP, str(call))
              require_once(hub_source, OLD_JOURNAL, str(hub))
              require_once(source, '        <div className="connect-call-actions">', str(call))
              require_once(source, '        <p className="connect-call-note">', str(call))
              require_once(css, '.connect-app .connect-call-backdrop {', str(styles))
              require_once(css, '.connect-app .connect-call-mini {', str(styles))
              require_once(jcss, '.connect-app .connect-call-history-screen.is-selecting', str(journal))
              # The active call keeps its three existing actions and ordering; only layout changes.
              actions=source.split('        <div className="connect-call-actions">',1)[1].split('        </div>',1)[0]
              for label in ('toggleMute','enableRemoteAudio','connect-call-action hangup'):
                  if label not in actions:
                      raise RuntimeError('SOURCE_DRIFT: call action missing: '+label)
          
              updated_source=source.replace(ORIGINAL_IDENTITY,UPDATED_IDENTITY,1).replace(OLD_MINIMIZE,NEW_MINIMIZE,1).replace(OLD_BACKDROP,NEW_BACKDROP,1)
              updated_hub=hub_source.replace(OLD_JOURNAL,NEW_JOURNAL,1)
              updated_css=css.rstrip('\n')+'\n'+CALL_CSS
              updated_jcss=jcss.rstrip('\n')+'\n'+JOURNAL_CSS
              # Do not partially mutate the working tree if any validation fails.
              call.write_text(updated_source,encoding='utf8')
              hub.write_text(updated_hub,encoding='utf8')
              styles.write_text(updated_css,encoding='utf8')
              journal.write_text(updated_jcss,encoding='utf8')
              print('Applied focused PWA call screen and journal styles.')
          
          if __name__=='__main__':main()
          PY_CALL_PATCH
          python3 "$RUNNER_TEMP/connect-call-fullscreen-patch.py"
          python3 "$RUNNER_TEMP/connect-call-fullscreen-patch.py"
          git diff --check
          # This workflow must not edit the Android APK, Supabase or Push routes.
          git diff --name-only | while read -r changed; do
            case "$changed" in
              app/calls.css|app/call-journal-editor.css|components/ConnectAudioCalls.tsx|components/ConnectCallsHub.tsx) ;;
              *) echo "Unexpected modified source: $changed" >&2; exit 1 ;;
            esac
          done

      - name: Validate TypeScript and functional and browser tests (GREEN)
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --test tests/connect-call-fullscreen.test.cjs
          node --test tests/connect-call-output.test.cjs tests/ios-call-background.test.cjs tests/pwa-five-ui.test.cjs

      - name: Run full existing Connect suite
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Commit only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git add app/calls.css app/call-journal-editor.css components/ConnectAudioCalls.tsx components/ConnectCallsHub.tsx tests/connect-call-fullscreen.test.cjs
          if git diff --cached --quiet; then
            echo 'Already applied and checked, nothing to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): independent calls tab and bottom-row call controls'
          git push origin HEAD:main
