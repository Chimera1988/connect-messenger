jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base: ${{ steps.base.outputs.sha }}
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - name: Require the intended repository and main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Check latest default branch and record source SHA
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          current="$(git rev-parse HEAD)"
          test "$current" = "$GITHUB_SHA"
          test "$current" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test -s package-lock.json
          git diff --exit-code
          echo "sha=$current" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/connect-media-logs"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate this complete YAML, expressions and byte size
        env:
          WORKFLOW_PATH: .github/workflows/connect-pwa-media-egress.yml
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'PY'
          import os,pathlib,yaml
          path=pathlib.Path(os.environ['WORKFLOW_PATH']);data=path.read_bytes()
          assert 0<len(data)<450000, 'Workflow must be below 450000 bytes'
          doc=yaml.load(data,Loader=yaml.BaseLoader)
          assert set(doc['on'])=={'workflow_dispatch'}
          assert set(doc['jobs'])=={'verify','commit'}
          print(str(path)+': '+str(len(data))+' bytes; YAML parsed')
          PY
          tool="$RUNNER_TEMP/connect-actionlint"
          mkdir -p "$tool"
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --location --retry 2 "$base/$archive" --output "$tool/$archive"
          curl --fail --location --retry 2 "$base/actionlint_1.7.12_checksums.txt" --output "$tool/checksums.txt"
          (cd "$tool" && awk -v wanted="$archive" '$2 == wanted || $2 == ("*" wanted) {print;matched=1} END {if(!matched)exit 1}' checksums.txt | sha256sum --check)
          tar -xzf "$tool/$archive" -C "$tool" actionlint
          "$tool/actionlint" -color "$WORKFLOW_PATH"
      - name: Apply only the exact audited missing repairs
        id: patch
        run: &apply_media |
          set -euo pipefail
          python3 - <<'PY_CONNECT_MEDIA_INSTALL_20261120'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          def run(*args,**kw):return subprocess.run(args,check=True,**kw)
          def digest(name):
           p=root/name
           if not p.is_file() or p.is_symlink() or not p.resolve().is_relative_to(root.resolve()):raise SystemExit('SOURCE_DRIFT: missing/unsafe '+name)
           run('git','ls-files','--error-unmatch','--',name,stdout=subprocess.DEVNULL)
           return hashlib.sha256(p.read_bytes()).hexdigest()
          STATES=json.loads(os.environ['CONNECT_MEDIA_STATES'])
          GUARDS=json.loads(os.environ['CONNECT_MEDIA_GUARDS'])
          for name,expected in GUARDS.items():
           if digest(name)!=expected:raise SystemExit('SOURCE_DRIFT: audited dependency/configuration changed: '+name)
          actual={name:digest(name) for name in STATES}
          before=all(actual[n]==v['before'] for n,v in STATES.items())
          after=all(actual[n]==v['after'] for n,v in STATES.items())
          if not before and not after:raise SystemExit('SOURCE_DRIFT: incompatible or partially edited sources; nothing overwritten')
          if os.environ.get('VERIFY_ONLY')=='1' and not after:raise SystemExit('SOURCE_DRIFT: tested sources changed during verification')
          PATCH=''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('CONNECT_MEDIA_PATCH_'))
          if before:
           run('git','apply','--check','--whitespace=error-all','-',input=PATCH.encode())
           run('git','apply','--whitespace=error-all','-',input=PATCH.encode())
          for name,v in STATES.items():
           if digest(name)!=v['after']:raise SystemExit('SOURCE_DRIFT: unexpected patched bytes: '+name)
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACDMRTUXB']).decode().splitlines()
          if set(changed)-set(STATES):raise SystemExit('Unexpected modified files: '+repr(set(changed)-set(STATES)))
          run('git','diff','--check')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
           out.write('changed='+str(bool(changed)).lower()+'\n')
           out.write('paths='+json.dumps(list(STATES),separators=(',',':'))+'\n')
          print('Exact reviewed source state verified: '+('patched existing files' if before else 'already applied'))
          PY_CONNECT_MEDIA_INSTALL_20261120
      - name: Locked install and TypeScript
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/connect-media-logs/typecheck.log"
      - name: Install the browser matching the lockfile
        run: |
          set -euo pipefail
          npx --no-install playwright-core install --with-deps chromium
          browser="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$browser"
          echo "CONNECT_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
      - name: Unit, integration, real HTTP byte accounting and offline media regressions
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/connect-media-logs/tests.log"
          grep -F 'MEDIA_NETWORK_ACCOUNTING ' "$RUNNER_TEMP/connect-media-logs/tests.log"
      - name: Build the PWA without publishing
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/connect-media-logs/build.log"
          # Next generates a declaration locally; it is not part of this repair.
          git show HEAD:next-env.d.ts > next-env.d.ts
      - name: Recheck exact source bytes after all gates
        id: sealed
        env:
          VERIFY_ONLY: '1'
        run: *apply_media
      - name: Seal the exact tested tree
        id: tree
        env:
          ALLOWED_PATHS: ${{ steps.sealed.outputs.paths }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          paths=json.loads(os.environ['ALLOWED_PATHS'])
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(changed)<=set(paths), 'Unexpected source changes'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard']), 'Unexpected new tracked candidates'
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+tree+'\n')
          PY
      - name: Store verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connect-pwa-media-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/connect-media-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verification summary and physical-device checklist
        if: always()
        env:
          VERIFY_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo 'Verification result: '"$VERIFY_RESULT"
            echo 'Source SHA: ${{ steps.base.outputs.sha }}'
            echo 'Tests and byte accounting are available in the verification artifact.'
            echo 'No Supabase schema, policies, accounts, messages or server media are changed.'
            echo 'НЕ ПРОВЕРЕНО на устройствах: iPhone installed PWA cold/offline history and media; Poco F1 Android 10 and a modern Android: offline photo/voice/audio/video/video notes, seek, process restart, expiry, account switch, cache clear, delete for everyone, large chat scrolling.'
            echo 'НЕ ПРОВЕРЕНО на устройствах: background/locked-screen calls, push notifications, reconnect and data/login retention after a signed APK upgrade.'
            echo 'No production deploy, APK upload, version bump or OTA publication runs here.'
            echo 'The existing root Service Worker registration and push handlers are retained; only private-media IDB handling is extended.'
          } >> "$GITHUB_STEP_SUMMARY"
  commit:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the intended main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce the inline repair from the tested parent
        id: patch
        run: *apply_media
      - name: Commit the exact tested files only if main has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ needs.verify.outputs.base }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
          ALLOWED_PATHS: ${{ steps.patch.outputs.paths }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import json,os,subprocess
          paths=json.loads(os.environ['ALLOWED_PATHS'])
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(changed)<=set(paths)
          subprocess.run(['git','add','--',*paths],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree==os.environ['EXPECTED_TREE'], 'The commit tree differs from the verified tree'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          if git diff --cached --quiet; then
            echo 'All exact repairs are already in main; no empty commit created.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(media): persist first responses and reuse verified ranges'
          # Ordinary fast-forward push; a concurrent main update fails safely.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/main
          committed="$(git rev-parse HEAD)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$committed...main" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]]
          echo "GitHub confirmed commit in main: https://github.com/$GITHUB_REPOSITORY/commit/$committed" >> "$GITHUB_STEP_SUMMARY"
          echo 'No release was published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
