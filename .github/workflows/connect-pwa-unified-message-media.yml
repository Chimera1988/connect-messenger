          import base64, tarfile, io
          from pathlib import Path
          payload=base64.b64decode(Path('/tmp/connect-unified-ui-payload.b64').read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as t:
              expected={'patch.py','connect-unified-chat.css'}
              files={x.name for x in t.getmembers()}
              if files!=expected: raise SystemExit(f'Unexpected update files: {files!r}')
              for x in t.getmembers():
                  if not x.isfile() or x.name not in expected: raise SystemExit('Unexpected archive item')
                  Path('/tmp',x.name).write_bytes(t.extractfile(x).read())
          PY
          python3 /tmp/patch.py
          git diff --check
          echo 'Changed files:'
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install project and Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Typecheck, regression tests, and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Publish only verified frontend changes
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/layout.tsx app/connect-unified-chat.css
          if git diff --cached --quiet; then
            echo 'Connect PWA unified media is already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: unify forwarded media, album layout and message receipts [skip ci]'
          git push origin HEAD:main
