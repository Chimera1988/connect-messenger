# Connect PWA — unified Liquid Glass message media (2026-11-12)
# Safe, source-anchored, idempotent. Replaces no existing workflow.
# Upload as .github/workflows/connect-pwa-unified-message-media.yml
# Do not put this YAML in the repository root or run old FIX workflows again.
name: Connect PWA — unified message media and receipts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-unified-message-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-unified-message-media-${{ github.ref }}
  cancel-in-progress: false

