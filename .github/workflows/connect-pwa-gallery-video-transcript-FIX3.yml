# Connect PWA — precise UX correction for voice notes and video circles.
# Replace the current workflow file with this one:
# .github/workflows/connect-pwa-gallery-video-transcript.yml
# Scope: PWA only. No Android, no E2EE, no Supabase schema or calls changes.
name: Connect PWA — voice notes and video circles polish (FIX3)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-gallery-video-transcript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-media-ux-fix3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and run the precise PWA patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/connect-pwa-fix3.patch.py.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = gzip.decompress(base64.b64decode(pathlib.Path('/tmp/connect-pwa-fix3.patch.py.gz.b64').read_text()))
          pathlib.Path('/tmp/connect-pwa-fix3.patch.py').write_bytes(raw)
          PY
          python3 /tmp/connect-pwa-fix3.patch.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and Chromium on supported Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CONNECT_CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Verify PWA behavior and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Publish only if every check succeeds
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/profile-media.css components/ConnectTranscript.tsx
          if git diff --cached --quiet; then
            echo 'PWA voice/video UX is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect PWA: polish voice notes and video circles [skip ci]'
          git push origin HEAD:main
