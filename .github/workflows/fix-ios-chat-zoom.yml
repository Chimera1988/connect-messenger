name: Fix iPhone chat zoom on keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-chat-zoom.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set composer input font size to 16px
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/liquid-glass.css')
          css = path.read_text(encoding='utf-8')
          head = '.connect-app .chat-composer .compose-line input {\n  height: 38px !important;'
          if css.count(head) != 1:
              raise SystemExit('Expected composer style not found exactly once; no files changed')
          start = css.index(head)
          end = css.index('}', start) + 1
          block = css[start:end]
          old = 'font-size: 15px;'
          new = 'font-size: 16px;'
          if block.count(old) == 1:
              css = css[:start] + block.replace(old, new, 1) + css[end:]
              path.write_text(css, encoding='utf-8')
              print('Fixed iOS input auto-zoom: 15px -> 16px')
          elif block.count(new) == 1:
              print('Already fixed; no change necessary')
          else:
              raise SystemExit('Unexpected font size: stop rather than modifying unrelated styles')
          PY

      - name: Validate change
        run: git diff --check

      - name: Commit composer fix
        shell: bash
        run: |
          git config user.name 'Connect UI fixes'
          git config user.email 'actions@users.noreply.github.com'
          git add app/liquid-glass.css
          if ! git diff --cached --quiet; then
            git commit -m 'fix: prevent iOS auto-zoom when focusing chat composer'
            git push origin HEAD:main
          else
            echo 'No additional change needed'
          fi
