name: Connect PWA | Sliding glass dock and nested-only edge gestures

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-sliding-dock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-pwa-update:
    name: Test moving selection and safe nested gestures before push
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure repository and source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for f in AGENTS.md package.json package-lock.json tsconfig.json app/page.tsx app/liquid-glass.css app/globals.css components/ConnectCallsHub.tsx tests/pwa-five-ui.test.cjs tests/pwa-list-parity-gesture.test.cjs; do
            test -s "$f" || { echo "SOURCE_DRIFT missing $f" >&2; exit 1; }
          done

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium matching playwright-core
        run: npx playwright-core install --with-deps chromium

      - name: Verify Chromium executable
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Chromium missing: '+p)"

      - name: Install focused regression tests before modifying PWA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pwa-dock-motion.test.cjs" <<'DOCK_TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const ts=require('typescript');
          const root=process.cwd();
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const page=read('app/page.tsx');
          const liquid=read('app/liquid-glass.css');
          const previous=read('tests/pwa-list-parity-gesture.test.cjs');
          const marker='CONNECT_PWA_DOCK_MOTION_NESTED_GESTURES_V1_20261114';

          function extractFunction(name){
            const ast=ts.createSourceFile('page.tsx',page,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            assert.deepEqual(ast.parseDiagnostics,[],'page must parse as TSX');
            let found;
            function visit(node){if(ts.isFunctionDeclaration(node)&&node.name?.text===name)found=node;ts.forEachChild(node,visit)}
            visit(ast);
            assert.ok(found,`missing ${name}`);
            return found.getText(ast);
          }

          function getAllowed(){
            const source=extractFunction('connectAllowHistorySwipe');
            const result=ts.transpileModule(source+`\nglobalThis.__gesturePolicy=connectAllowHistorySwipe;`,{compilerOptions:{module:ts.ModuleKind.None,target:ts.ScriptTarget.ES2020},reportDiagnostics:true});
            assert.deepEqual((result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error),[]);
            return new Function(result.outputText+`;return globalThis.__gesturePolicy;`)();
          }

          const v=(tab,opts={})=>({tab,chat:null,profile:null,media:null,settings:'home',...opts});

          test('gesture policy prevents root-tab switching, but preserves chat and submenu back',()=>{
            const allowed=getAllowed();
            for(const t of ['chats','contacts','settings'])for(const other of ['chats','contacts','settings']){
              assert.equal(allowed(v(t),v(other),-1),false,`root back ${t}->${other}`);
              assert.equal(allowed(v(t),v(other),1),false,`root forward ${t}->${other}`);
            }
            const chat=v('chats',{chat:'conversation-1'});
            assert.equal(allowed(chat,v('chats'),-1),true);
            assert.equal(allowed(chat,v('contacts'),-1),true,'back from chat opened via Contacts');
            assert.equal(allowed(chat,v('chats'),1),false,'no accidental forward swipe inside chat');
            assert.equal(allowed(chat,v('chats',{chat:'conversation-2'}),-1),false,'never change conversation via edge swipe');
            const settings=v('settings',{settings:'appearance'});
            assert.equal(allowed(settings,v('settings'),-1),true,'back from appearance settings');
            assert.equal(allowed(settings,v('chats'),-1),false,'submenu must not switch tabs');
            assert.equal(allowed(settings,v('settings',{settings:'notifications'}),1),true,'submenu forward');
            assert.equal(allowed(settings,v('settings'),1),false,'no forward to root from submenu');
            const media=v('chats',{profile:'user-1',media:'photos',chat:'conversation-1'});
            assert.equal(allowed(media,v('chats',{profile:'user-1',chat:'conversation-1'}),-1),true,'media to profile');
            assert.equal(allowed(v('chats',{profile:'user-1'}),v('chats',{profile:'user-1',media:'music'}),1),true,'forward inside profile');
          });

          test('event guard rejects any swipe starting at root or on lower dock, without changing chat touch controls',()=>{
            assert.match(page,/const currentView=gestureHistory\.current\.entries\[gestureHistory\.current\.cursor\]/);
            assert.match(page,/if\(!currentView \|\| \(!currentView\.chat && !currentView\.profile && !currentView\.media && currentView\.settings==='home'\)\)return/);
            assert.match(page,/connectAllowHistorySwipe\(history\.entries\[history\.cursor\],target,direction\)/);
            assert.match(page,/target\.closest\('\.bottom-nav,\.nav-tab,\.connect-calls-tab'\)/);
            assert.match(page,/dock && touches\[0\]\.clientY>=dock\.getBoundingClientRect\(\)\.top-12/);
            assert.match(page,/function touchStart\(e: TouchEvent<HTMLDivElement>, m: Message\)/);
            assert.match(previous,/root tabs must never navigate by swiping/);
            assert.match(previous,/swiping back inside Settings must still navigate/);
          });

          test('PWA-only CSS defines an inert animated selection capsule in a fixed four-tab order',()=>{
            assert.match(liquid,new RegExp(`\\/\\* ${marker}`));
            assert.match(liquid,/\.bottom-nav::before\s*\{[^}]*pointer-events:none/s);
            assert.match(liquid,/\.bottom-nav:has\(> \.connect-calls-tab\)::before\s*\{[^}]*\/ 4\)/s);
            for(const pct of ['100%','200%','300%'])assert.ok(liquid.includes(`transform:translate3d(${pct},0,0)`),`missing ${pct} selection target`);
            assert.match(liquid,/\.bottom-nav > \.nav-tab\s*\{[^}]*z-index:1/s);
            assert.match(liquid,/\.bottom-nav > \.nav-tab\s*\{[^}]*background:transparent !important/s);
            assert.match(liquid,/@media\(prefers-reduced-motion:reduce\)/);
          });

          test('Chromium: dock capsule tracks all four tabs, never covers taps, and honors themes and reduced motion',async()=>{
            const {chromium}=require('playwright-core');
            const browser=await chromium.launch({args:['--no-sandbox']});
            try{
              for(const width of [320,390,430])for(const theme of ['dark','light']){
                const p=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
                await p.setContent(`<meta name="viewport" content="width=device-width, initial-scale=1"><div class="connect-app ${theme==='light'?'light':''}" data-connect-pwa-list-parity="true" style="--accent:#198f78;--wave-primary:#0ad9b7;--wave-secondary:#65acf4"><div class="main-view"></div><nav class="bottom-nav"><button type="button" class="nav-tab selected"><span class="nav-symbol">◯</span><small>Чаты</small></button><button type="button" class="nav-tab"><span class="nav-symbol">◯</span><small>Контакты</small></button><button type="button" class="nav-tab"><span class="nav-symbol">◯</span><small>Настройки</small></button><button type="button" class="nav-tab connect-calls-tab" style="order:2"><span class="nav-symbol">◯</span><small>Звонки</small></button></nav></div>`);
                for(const name of ['globals.css','liquid-glass.css'])await p.addStyleTag({content:read('app/'+name)});
                await p.addStyleTag({content:'.bottom-nav > .nav-tab:nth-child(1){order:0}.bottom-nav > .nav-tab:nth-child(2){order:1}.bottom-nav > .nav-tab:nth-child(3){order:3}'});
                const tabs=p.locator('.bottom-nav > .nav-tab');
                const selectedOrder=[0,1,3,2]; // DOM order, visual order: Chats, Contacts, Calls, Settings
                for(const idx of selectedOrder){
                  await tabs.evaluateAll((all,i)=>{all.forEach((el,k)=>el.classList.toggle('selected',k===i));},idx);
                  await p.waitForTimeout(510);
                  const value=await p.evaluate(()=>{
                    const nav=document.querySelector('.bottom-nav'),active=nav.querySelector('.connect-calls-tab.selected')||nav.querySelector('.nav-tab.selected');
                    const pseudo=getComputedStyle(nav,'::before'),matrix=new DOMMatrixReadOnly(pseudo.transform);
                    const rect=nav.getBoundingClientRect(),act=active.getBoundingClientRect();
                    const center=rect.left+parseFloat(pseudo.left)+matrix.m41+parseFloat(pseudo.width)/2;
                    return {distance:Math.abs(center-(act.left+act.width/2)),pointer:pseudo.pointerEvents,width:parseFloat(pseudo.width),font:getComputedStyle(active).color,transition:pseudo.transitionDuration};
                  });
                  assert.ok(value.distance<4,`highlight misses tab ${idx} at ${width}px ${theme}: ${JSON.stringify(value)}`);
                  assert.equal(value.pointer,'none');
                }
                let taps=0;
                await tabs.nth(1).evaluate(el=>el.addEventListener('click',()=>window.__connectTap=(window.__connectTap||0)+1));
                await tabs.nth(1).click();
                taps=await p.evaluate(()=>window.__connectTap);
                assert.equal(taps,1,`highlight must not swallow tab taps at ${width}px`);
                await p.close();
              }
              const reduced=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
              await reduced.setContent('<div class="connect-app" data-connect-pwa-list-parity="true"><nav class="bottom-nav"><button class="nav-tab selected">Чаты</button></nav></div>');
              await reduced.addStyleTag({content:read('app/liquid-glass.css')});
              assert.equal(await reduced.locator('.bottom-nav').evaluate(el=>getComputedStyle(el,'::before').transitionDuration),'0s');
              await reduced.close();
            }finally{await browser.close()}
          });
          DOCK_TEST
          if test -e tests/pwa-dock-motion.test.cjs && ! cmp -s tests/pwa-dock-motion.test.cjs "$RUNNER_TEMP/pwa-dock-motion.test.cjs"; then
            echo 'SOURCE_DRIFT: pre-existing dock test differs from expected version' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/pwa-dock-motion.test.cjs" tests/pwa-dock-motion.test.cjs

      - name: RED - reproduce main tab swipe and missing moving capsule
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'CONNECT_PWA_DOCK_MOTION_NESTED_GESTURES_V1_20261114' app/page.tsx; then
            echo 'Already applied: RED phase not repeated; exact-content guard will verify existing source.'
          else
            if node --test --test-name-pattern='gesture policy prevents|event guard rejects|PWA-only CSS defines' tests/pwa-dock-motion.test.cjs; then
              echo 'RED PHASE FAILED: pre-fix tests unexpectedly passed' >&2
              exit 1
            fi
            echo 'RED confirmed: root tab swipe and capsule do not yet meet the requested behavior.'
          fi

      - name: Apply guarded idempotent PWA source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-pwa-dock-motion-patch.py" <<'DOCK_PATCH'
          #!/usr/bin/env python3
          """PWA-only animated dock and nested-only swipe navigation; guarded and idempotent."""
          from pathlib import Path

          MARK='CONNECT_PWA_DOCK_MOTION_NESTED_GESTURES_V1_20261114'
          PAGE=Path('app/page.tsx')
          LIQUID=Path('app/liquid-glass.css')
          OLD_TEST=Path('tests/pwa-list-parity-gesture.test.cjs')

          INSERT_BEFORE='\n\nexport default function Home() {'
          HELPER='''// CONNECT_PWA_DOCK_MOTION_NESTED_GESTURES_V1_20261114: no swipes between root tabs.
          function connectAllowHistorySwipe(current: ConnectGestureView | undefined, target: ConnectGestureView, direction: -1 | 1): boolean {
            if (!current) return false;
            // Back and forward belong to nested screens, not primary tab switching.
            const inSubmenu = Boolean(current.profile || current.media || current.settings !== 'home');
            if (inSubmenu) {
              if (current.tab !== target.tab) return false;
              return direction === -1 || Boolean(target.profile || target.media || target.settings !== 'home');
            }
            // A conversation is the only full-screen root child with a back edge gesture.
            if (current.chat) return direction === -1 && !target.chat;
            return false;
          }'''
          OLD_START="      if(document.querySelector('.connect-call-backdrop,.connect-call-history-screen'))return;\n      const target=e.target;"
          NEW_START="""      if(document.querySelector('.connect-call-backdrop,.connect-call-history-screen'))return;
                // A root tab never starts swipe navigation, even away from the bottom dock.
                const currentView=gestureHistory.current.entries[gestureHistory.current.cursor];
                if(!currentView || (!currentView.chat && !currentView.profile && !currentView.media && currentView.settings==='home'))return;
                const target=e.target;"""
          OLD_END="      if(target.profile && !profiles.some(p=>p.id===target.profile))return;\n      e.preventDefault();"
          NEW_END="""      if(target.profile && !profiles.some(p=>p.id===target.profile))return;
                if(!connectAllowHistorySwipe(history.entries[history.cursor],target,direction))return;
                e.preventDefault();"""

          CSS='''/* CONNECT_PWA_DOCK_MOTION_NESTED_GESTURES_V1_20261114
             Liquid-glass moving selection capsule, scoped to the PWA.
             Only the highlight moves. All four buttons remain in place and clickable. */
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav {
            isolation:isolate;
            justify-content:space-between;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav::before {
            content:"";
            box-sizing:border-box;
            position:absolute;
            top:4px;
            bottom:4px;
            left:4px;
            width:calc((100% - 8px) / 3);
            border-radius:18px;
            z-index:0;
            pointer-events:none;
            background:linear-gradient(145deg,
              color-mix(in srgb,var(--wave-primary,var(--accent)) 10%,rgba(222,231,241,.21)),
              color-mix(in srgb,var(--wave-secondary,var(--accent)) 7%,rgba(174,192,215,.16)));
            border:1px solid color-mix(in srgb,var(--glass-stroke-hi) 70%,rgba(255,255,255,.13));
            box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 15px rgba(0,0,0,.13);
            -webkit-backdrop-filter:blur(18px) saturate(140%);
            backdrop-filter:blur(18px) saturate(140%);
            transform:translate3d(0,0,0);
            transition:transform .44s cubic-bezier(.2,1.12,.34,1),width .24s ease,background-color .24s ease;
            will-change:transform;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav:has(> .connect-calls-tab)::before {
            width:calc((100% - 8px) / 4);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav:has(> .nav-tab:nth-child(2).selected):not(:has(> .connect-calls-tab.selected))::before {
            transform:translate3d(100%,0,0);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav:has(> .nav-tab:nth-child(3).selected):not(:has(> .connect-calls-tab.selected))::before {
            transform:translate3d(300%,0,0);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav:not(:has(> .connect-calls-tab)):has(> .nav-tab:nth-child(3).selected)::before {
            transform:translate3d(200%,0,0);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav:has(> .connect-calls-tab.selected)::before {
            transform:translate3d(200%,0,0);
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav > .nav-tab {
            position:relative;
            z-index:1;
            flex:1 1 0;
            min-width:0;
            max-width:none;
            background:transparent !important;
            border:1px solid transparent !important;
            box-shadow:none !important;
            transition:color .23s ease;
          }
          .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav > .nav-tab.selected {
            color:var(--accent);
          }
          .connect-app.light[data-connect-pwa-list-parity="true"] .bottom-nav::before {
            background:linear-gradient(145deg,rgba(73,92,115,.19),rgba(106,124,143,.13));
            border-color:rgba(65,88,118,.19);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(42,67,93,.10);
          }
          @media(prefers-reduced-motion:reduce) {
            .connect-app[data-connect-pwa-list-parity="true"] .bottom-nav::before {transition:none;will-change:auto;}
          }'''

          TEST_FACTORY='  const factoryCode=`function harness(ctx) {'
          NEW_TEST_FACTORY='''  const helperStart=page.indexOf('function connectAllowHistorySwipe(');
            const helperEnd=page.indexOf('\\n}',helperStart)+2;
            assert.ok(helperStart>=0 && helperEnd>helperStart,'missing scoped gesture policy');
            const helper=page.slice(helperStart,helperEnd);
            const factoryCode=`${helper}\\nfunction harness(ctx) {'''
          OLD_EXPECT="t=setup();t.h.start(ev(6,150,false));t.h.end(ev(120,150,false));assert.equal(t.history.current.cursor,0,'edge gesture outside dock must navigate');assert.equal(t.state.calls,1);"
          NEW_EXPECT="""t=setup();t.h.start(ev(6,150,false));t.h.end(ev(120,150,false));assert.equal(t.history.current.cursor,1,'root tabs must never navigate by swiping');assert.equal(t.state.calls,0);
              t=setup();t.history.current.entries=[{tab:'settings',chat:null,profile:null,media:null,settings:'home'},{tab:'settings',chat:null,profile:null,media:null,settings:'appearance'}];
              t.h.start(ev(6,150,false));t.h.end(ev(120,150,false));assert.equal(t.history.current.cursor,0,'swiping back inside Settings must still navigate');assert.equal(t.state.calls,1);"""


          def once(text,old,filename):
              n=text.count(old)
              if n!=1:raise RuntimeError(f'SOURCE_DRIFT {filename}: {old[:95]!r}: found {n}, expected 1')

          def verify_after(p,l,t):
              for content,substring,name in [(p,HELPER,str(PAGE)),(p,NEW_START,str(PAGE)),(p,NEW_END,str(PAGE)),(l,CSS,str(LIQUID)),(t,NEW_TEST_FACTORY,str(OLD_TEST)),(t,NEW_EXPECT,str(OLD_TEST))]:
                  once(content,substring,name)
              if OLD_START in p or OLD_END in p or OLD_EXPECT in t or TEST_FACTORY in t:raise RuntimeError('SOURCE_DRIFT: old active code still present')


          def main():
              p=PAGE.read_text(encoding='utf-8');l=LIQUID.read_text(encoding='utf-8');t=OLD_TEST.read_text(encoding='utf-8')
              if any(MARK in x for x in (p,l)):
                  verify_after(p,l,t)
                  print('Dock animation and nested gesture policy already exactly applied.')
                  return
              for value in [INSERT_BEFORE,OLD_START,OLD_END]:once(p,value,str(PAGE))
              if 'CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114' not in p:raise RuntimeError('SOURCE_DRIFT: missing previous dock guard')
              if '/* CONNECT_PWA_LIST_PARITY_GESTURE_V1_20261114' not in l:raise RuntimeError('SOURCE_DRIFT: missing previous PWA styles')
              for value in [TEST_FACTORY,OLD_EXPECT]:once(t,value,str(OLD_TEST))
              np=p.replace(INSERT_BEFORE,'\n\n'+HELPER+INSERT_BEFORE,1).replace(OLD_START,NEW_START,1).replace(OLD_END,NEW_END,1)
              nl=l.rstrip('\n')+'\n\n'+CSS+'\n'
              nt=t.replace(TEST_FACTORY,NEW_TEST_FACTORY,1).replace(OLD_EXPECT,NEW_EXPECT,1)
              verify_after(np,nl,nt)
              PAGE.write_text(np,encoding='utf-8')
              LIQUID.write_text(nl,encoding='utf-8')
              OLD_TEST.write_text(nt,encoding='utf-8')
              print('Applied PWA floating dock and limited gestures; verified source anchors.')

          if __name__=='__main__':main()
          DOCK_PATCH
          python3 "$RUNNER_TEMP/connect-pwa-dock-motion-patch.py"
          python3 "$RUNNER_TEMP/connect-pwa-dock-motion-patch.py"
          git diff --check
          while IFS= read -r file; do
            case "$file" in
              app/page.tsx|app/liquid-glass.css|tests/pwa-list-parity-gesture.test.cjs|tests/pwa-dock-motion.test.cjs) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          while IFS= read -r file; do
            case "$file" in
              tests/pwa-dock-motion.test.cjs) ;;
              *) echo "Unexpected untracked file: $file" >&2; exit 1 ;;
            esac
          done < <(git ls-files --others --exclude-standard)

      - name: TypeScript and targeted PWA functional and Chromium tests
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --test tests/pwa-dock-motion.test.cjs tests/pwa-list-parity-gesture.test.cjs tests/pwa-five-ui.test.cjs

      - name: Full Connect regression suite
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Commit to main only when all checks succeed
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/liquid-glass.css tests/pwa-list-parity-gesture.test.cjs tests/pwa-dock-motion.test.cjs
          if git diff --cached --quiet; then
            echo 'All checks green, patch already applied. Nothing to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pwa): moving glass nav capsule with nested-only edge swipes'
          git push origin HEAD:main
