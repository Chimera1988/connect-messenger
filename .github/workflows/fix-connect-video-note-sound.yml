name: Connect - fix videonote sound button visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-connect-video-note-sound.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Connect
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move videonote mute button above receipt ticks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/liquid-glass.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Connect: videonote sound button above read receipt v2 */'
          if marker in css:
              print('Video note sound button positioning already applied')
          else:
              if '.connect-video-note .connect-video-note-sound' not in css or '.connect-video-note .connect-video-note-screen' not in css:
                  raise SystemExit('Connect inline video player CSS not found; no changes made')
              css += '''

          /* Connect: videonote sound button above read receipt v2 */
          /* Keep the video clipped to a circle, but not the independent sound control. */
          .connect-app .bubble.video-note-bubble .connect-video-note {
            position: relative !important;
            overflow: visible !important;
            isolation: isolate;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note > .connect-video-note-screen {
            position: absolute !important;
            inset: 0 !important;
            overflow: hidden !important;
            border-radius: 50% !important;
            z-index: 1 !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note > .connect-video-note-length {
            z-index: 3 !important;
          }
          .connect-app .bubble.video-note-bubble .connect-video-note > button.connect-video-note-sound {
            position: absolute !important;
            top: auto !important;
            left: auto !important;
            right: 10% !important;
            bottom: 22% !important;
            z-index: 40 !important;
            display: grid !important;
            place-items: center !important;
            width: 34px !important;
            height: 34px !important;
            min-width: 34px !important;
            min-height: 34px !important;
            padding: 0 !important;
            margin: 0 !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            transform: none !important;
            border-radius: 50% !important;
            border: 1px solid rgba(255,255,255,.32) !important;
            background: rgba(8,15,25,.7) !important;
            color: white !important;
            box-shadow: 0 2px 8px rgba(0,0,0,.28) !important;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
          }
          '''
              path.write_text(css, encoding='utf-8')
              print('Videonote sound control positioned above bottom-right read receipt')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Commit CSS change
        shell: bash
        run: |
          git add app/liquid-glass.css
          if git diff --cached --quiet; then
            echo 'Fix already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: position videonote mute button above message checks'
          git push origin HEAD:main
