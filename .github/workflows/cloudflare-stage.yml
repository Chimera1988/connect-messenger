name: Connect Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy staging Worker (requires CLOUDFLARE_API_TOKEN secret)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  cloudflare-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Connect
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize isolated Cloudflare build
        run: >-
          npx --yes vinext@latest init
          --platform=cloudflare
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none
          --no-prerender
          --ignore-wrangler-config
          --name=connect-messenger-stage-1105
      - name: Build for Cloudflare
        run: npm run build:vinext
      - name: Deploy staging Worker
        if: ${{ inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '008a9c3000656987f9b17560f558fc6c'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN repository secret' >&2
            exit 1
          fi
          npm run deploy:vinext
