name: Connect PWA | Chat online dot visibility fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-online-chat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-then-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm expected Connect sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for p in AGENTS.md package-lock.json app/page.tsx app/globals.css app/liquid-glass.css tests/presence-list-indicator.test.cjs; do test -s "$p" || exit 1; done
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install matching Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Verify Chromium executable
        run: |
          node -e "const fs=require('fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Missing Chromium: '+p)"
      - name: Install browser regression test for chat and contacts
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/chat-presence-visibility.test.cjs <<'JS_PRESENCE_CLIP_TEST'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright-core');
          const root = path.join(__dirname, '..');
          const main = fs.readFileSync(path.join(root, 'app/page.tsx'), 'utf8');
          const globalCss = fs.readFileSync(path.join(root, 'app/globals.css'), 'utf8');
          const liquidCss = fs.readFileSync(path.join(root, 'app/liquid-glass.css'), 'utf8');

          test('Chats: online dot is not clipped and inherits the selected accent', async () => {
            assert.match(main, /filteredChats\.map\(c =>/);
            assert.match(main, /<PresenceAvatar name=\{c\.other\?\.display_name[^\n]*online=\{!isNativeMediaRuntime\(\) && formatPresence\(presence\[c\.other\?\.id \|\| ''\], clock\) === 'В сети'\}/);
            assert.match(main, /filteredContacts\.map\(p =>[^\n]*<PresenceAvatar/);
            assert.match(globalCss, /\.connect-app \.connect-presence-dot\s*\{/);

            const browser = await chromium.launch({args:['--no-sandbox']});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              await page.setContent(`<!doctype html><html lang="ru"><head><style>${globalCss}\n${liquidCss}</style></head>
              <body><div class="connect-app" style="--accent:#cc4545"><div class="main-view">
                <div class="chat-rows"><div class="dialog-entry"><button type="button" class="dialog-row">
                  <span class="connect-presence-avatar"><span class="person-avatar avatar-md">Т</span><span class="connect-presence-dot" aria-label="В сети"></span></span>
                  <span class="dialog-summary">Тестировщик</span><span class="dialog-meta">18:48</span>
                </button></div></div>
                <div class="contact-rows"><button type="button" class="contact-row">
                  <span class="connect-presence-avatar"><span class="person-avatar avatar-md">Т</span><span class="connect-presence-dot" aria-label="В сети"></span></span><span class="contact-text">Тестировщик</span>
                </button></div>
              </div></div></body></html>`,{waitUntil:'load'});

              async function state() {return page.evaluate(() => {
                const chat = document.querySelector('.chat-rows .connect-presence-avatar');
                const avatar = chat.querySelector('.person-avatar');
                const chatDot = chat.querySelector('.connect-presence-dot');
                const contactDot = document.querySelector('.contact-rows .connect-presence-dot');
                return {
                  overflow: getComputedStyle(chat).overflow,
                  radius: getComputedStyle(chat).borderRadius,
                  chatWidth: chat.getBoundingClientRect().width,
                  avatarWidth: avatar.getBoundingClientRect().width,
                  avatarHeight: avatar.getBoundingClientRect().height,
                  chatHeight: chat.getBoundingClientRect().height,
                  dotColor: getComputedStyle(chatDot).backgroundColor,
                  contactColor: getComputedStyle(contactDot).backgroundColor,
                  dotPosition: getComputedStyle(chatDot).position,
                };
              });}
              for (const width of [390,360]) {
                await page.setViewportSize({width,height:844});
                const result=await state();
                assert.equal(result.overflow, 'visible', 'online chat avatar wrapper must not clip the presence dot');
                assert.equal(result.radius, '0px', 'only the inner avatar should be circular');
                assert.ok(Math.abs(result.chatWidth-result.avatarWidth)<.5, 'chat avatar image must fill the original avatar slot');
                assert.ok(Math.abs(result.chatHeight-result.avatarHeight)<.5, 'chat avatar height must fill the original slot');
                assert.equal(result.dotPosition, 'absolute');
                assert.equal(result.dotColor, 'rgb(204, 69, 69)', 'online badge must follow the selected accent');
                assert.equal(result.contactColor, result.dotColor, 'Contacts badge must keep the same theme color');
              }
              await page.close();
            } finally {await browser.close();}
          });
          JS_PRESENCE_CLIP_TEST
          node --check tests/chat-presence-visibility.test.cjs
      - name: Prove current chat online badge clipping (RED)
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'CONNECT_PWA_CHAT_ONLINE_DOT_CLIP_FIX_20261114' app/liquid-glass.css; then
            echo 'Already patched: skip RED, run GREEN below'
          else
            set +e
            node --test tests/chat-presence-visibility.test.cjs > "$RUNNER_TEMP/presence-chat-red.log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! grep -Fq 'online chat avatar wrapper must not clip the presence dot' "$RUNNER_TEMP/presence-chat-red.log"; then
              cat "$RUNNER_TEMP/presence-chat-red.log"
              echo 'Baseline did not fail for expected CSS clipping; refusing to modify source.' >&2
              exit 1
            fi
            echo 'RED confirmed: circular avatar wrapper clips the online badge.'
          fi
      - name: Fix only Liquid Glass chat avatar clipping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHAT_ONLINE'
          from pathlib import Path
          import subprocess

          path=Path('app/liquid-glass.css')
          marker='CONNECT_PWA_CHAT_ONLINE_DOT_CLIP_FIX_20261114'
          expected_sha='17891a9fe20de84ca9364a2f6f5bdbec4ac89a36'
          selector='.connect-app .chat-rows .dialog-row > :first-child {'
          original=""".connect-app .chat-rows .dialog-row > :first-child {
            width: 58px;
            min-width: 58px;
            height: 58px;
            border-radius: 999px;
            overflow: hidden;
          }"""
          addition="""
          /* CONNECT_PWA_CHAT_ONLINE_DOT_CLIP_FIX_20261114: allow presence marker outside the circular chat avatar. */
          .connect-app .chat-rows .dialog-row > .connect-presence-avatar {
            overflow: visible;
            border-radius: 0;
          }
          .connect-app .chat-rows .dialog-row > .connect-presence-avatar > .person-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
          }
          """
          assert path.is_file(),'SOURCE_DRIFT: app/liquid-glass.css missing'
          css=path.read_text(encoding='utf-8')
          if marker in css:
              if css.count(marker)!=1 or not css.endswith(addition):
                  raise SystemExit('SOURCE_DRIFT: existing online-dot fix differs; manual review required')
              print('Online badge clipping fix already present; verified exact content.')
          else:
              sha=subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              if sha!=expected_sha:
                  raise SystemExit('SOURCE_DRIFT: Liquid Glass stylesheet changed since inspection; refusing unsafe replacement: '+sha)
              if css.count(original)!=1 or css.count(selector)!=2:
                  raise SystemExit('SOURCE_DRIFT: expected one desktop clipping rule and one mobile sizing rule')
              if 'connect-presence-avatar' in css:
                  raise SystemExit('Unexpected pre-existing presence override; stop to inspect actual cascade')
              css=css.rstrip('\n')+'\n'+addition
              path.write_text(css,encoding='utf-8')
              print('Applied PWA-only clipping fix for chat list online badge.')
          post=path.read_text(encoding='utf-8')
          assert post.count(marker)==1 and post.endswith(addition)
          assert post.count(original)==1
          PY_CHAT_ONLINE
          git diff --check
      - name: Verify browser behavior, presence logic and TypeScript (GREEN)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/chat-presence-visibility.test.cjs tests/presence-list-indicator.test.cjs
          npm run typecheck
      - name: Run complete Connect tests and PWA production build
        shell: bash
        run: |
          set -euo pipefail
          npm test
          NEXT_PUBLIC_SUPABASE_URL='https://example.supabase.co' \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY='sb_publishable_ci_placeholder' \
          NEXT_PUBLIC_VAPID_PUBLIC_KEY='AQID' \
          NEXT_TELEMETRY_DISABLED='1' npm run build
      - name: Commit verified CSS and regression test to main
        shell: bash
        run: |
          set -euo pipefail
          git add app/liquid-glass.css tests/chat-presence-visibility.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Fix already present; nothing to commit.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): show theme-aware online badge outside chat avatar clip'
          git push origin HEAD:main
