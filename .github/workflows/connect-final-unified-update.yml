name: Connect unified update - media recovery (E2EE incomplete)
'on':
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit checked source changes to this branch
        type: boolean
        default: true
      apply_server_migration:
        description: Apply additive SQL using protected CONNECT_DATABASE_URL secret
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: connect-final-unified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Chimera1988/connect-messenger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audited source and unpack verified embedded update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT_INSTALLER'
          import base64,lzma,hashlib,json,pathlib,subprocess,tarfile,io,sys
          workflow=pathlib.Path(sys.argv[1] if len(sys.argv)>1 else '.github/workflows/connect-final-unified-update.yml')
          lines=workflow.read_text().splitlines();start=lines.index('# CONNECT_PACKAGE_BEGIN')+1;end=lines.index('# CONNECT_PACKAGE_END',start)
          assert all(line.startswith('# ') for line in lines[start:end]), 'Malformed embedded package'
          encoded=''.join(line[2:] for line in lines[start:end])
          compressed=base64.b64decode(encoded,validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=4*1024*1024+1)
          assert decoder.eof and not decoder.unused_data and len(raw)<=4*1024*1024, 'Package size exceeded'
          assert hashlib.sha256(raw).hexdigest()=='058a024211e9cf2bee73ffd5d34501a544341a2e282d1ccf5e6eae7cd70b5efc', 'Embedded package integrity failed'
          archive=tarfile.open(fileobj=io.BytesIO(raw),mode='r:')
          assert all(member.isfile() for member in archive.getmembers()), 'Only regular package files are allowed'
          package=json.load(archive.extractfile('manifest.json'))
          assert set(archive.getnames())=={'manifest.json',*[item['path'] for item in package['files']]}
          assert len(archive.getmembers())==len(package['files'])+1, 'Duplicate package members'
          root=pathlib.Path.cwd();marker=root/'.connect-unified-update.json'
          installed=json.loads(marker.read_text()).get('packageSha256') if marker.exists() else None
          repeated=installed=='058a024211e9cf2bee73ffd5d34501a544341a2e282d1ccf5e6eae7cd70b5efc';upgrade=installed==package['previousPackage']
          assert installed is None or repeated or upgrade, 'Unknown installer version already present'
          assert subprocess.run(['git','diff','--quiet']).returncode==0, 'Tracked working tree is dirty'
          if not repeated and not upgrade:
              assert subprocess.run(['git','diff','--quiet']).returncode==0, 'Tracked working tree is dirty'
              differences=subprocess.check_output(['git','diff','--name-only',package['base'],'HEAD','--','.',':(exclude).github/workflows'],text=True).strip()
              assert not differences,'Repository source differs from the audited main; refusing to overwrite: '+differences
          if upgrade:
              changed=set(subprocess.check_output(['git','diff','--name-only',package['base'],'HEAD','--','.',':(exclude).github/workflows'],text=True).splitlines())
              allowed={item['path'] for item in package['files']}|{'.connect-unified-update.json'}
              assert not changed-allowed,'Unexpected repository changes: '+', '.join(sorted(changed-allowed))
          verified={}
          for item in package['files']:
              rel=pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              path=root/str(rel)
              assert not path.is_symlink() and all(not parent.is_symlink() for parent in path.parents if parent!=root),'Symlink target refused'
              expected=item['after'] if repeated else item['previous'] if upgrade else item['before']
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual==expected,'Source mismatch: '+str(rel)
              data=archive.extractfile(item['path']).read()
              assert hashlib.sha256(data).hexdigest()==item['after'], 'File integrity failed'
              verified[item['path']]=data
          if not repeated:
              for rel,data in verified.items():
                  target=root/rel;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              marker.write_text(json.dumps({'packageSha256':'058a024211e9cf2bee73ffd5d34501a544341a2e282d1ccf5e6eae7cd70b5efc','base':package['base'],'version':'2.2.1','e2eeEnabled':False},indent=2)+'\n')
          (root/'.connect-unified-files.json').write_text(json.dumps([item['path'] for item in package['files']]+['.connect-unified-update.json']))
          print('Verified embedded update:',len(package['files']),'files; already applied:',repeated,'; upgrade:',upgrade)
          CONNECT_INSTALLER
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright-core install --with-deps chromium
      - name: Verify types, cryptographic primitives, SQL and persistent cache
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
      - name: Build production PWA
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cp next-env.d.ts "$RUNNER_TEMP/connect-next-env.d.ts"
          npm run build
          cp "$RUNNER_TEMP/connect-next-env.d.ts" next-env.d.ts
      - name: Apply additive server migration if explicitly selected
        id: migration
        if: inputs.apply_server_migration
        env:
          CONNECT_DATABASE_URL: ${{ secrets.CONNECT_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          set -euo pipefail
          if [ -z "$CONNECT_DATABASE_URL" ]; then
            echo '::error::CONNECT_DATABASE_URL is missing; server was not migrated.'
            exit 1
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          owner=$(psql "$CONNECT_DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "select pg_has_role(current_user,relowner,'MEMBER') from pg_class where oid='public.messages'::regclass")
          if [ "$owner" != 't' ]; then
            echo '::error::Administrative table-owner privileges are required. No SQL applied.'
            exit 1
          fi
          psql "$CONNECT_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261109000100_connect_unified.sql
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - name: Commit and push when permitted
        id: commit
        if: inputs.commit_changes
        run: |
          set -euo pipefail
          python3 - <<'PY_STAGE'
          import json,subprocess
          paths=json.load(open('.connect-unified-files.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY_STAGE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: recover media loading and sticker grid (E2EE pending)'
          fi
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::GitHub rejected the push; repository was not updated. Checked files remain in the artifact.'
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package checked source and honest deployment status
        env:
          SOURCE_PUSHED: ${{ steps.commit.outputs.pushed }}
          DATABASE_APPLIED: ${{ steps.migration.outputs.applied }}
        run: |
          python3 - <<'PY_RESULT'
          import json,os,pathlib,shutil
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'connect-final-result'
          destination.mkdir(exist_ok=True)
          for file in json.load(open('.connect-unified-files.json')):
              target=destination/file;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(file,target)
          report={'sourcePushed':os.environ.get('SOURCE_PUSHED')=='true','databaseMigrated':os.environ.get('DATABASE_APPLIED')=='true','e2eeEnabled':False,'remainingReleaseBlockers':['trusted-device enrollment, linking, revocation and history migration','encrypted message/media transport integration','authenticated E2EE call signaling','transactionally leased physical attachment garbage collection','real Android/iOS acceptance and 60fps confirmation']}
          (destination/'DEPLOYMENT-STATUS.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Connect update status\n\n'+json.dumps(report,indent=2)+'\n\nThis update does not complete the requested E2EE rollout. No legacy plaintext migration is performed.\n')
          PY_RESULT
      - uses: actions/upload-artifact@v4
        with:
          name: connect-unified-checked-source
          path: ${{ runner.temp }}/connect-final-result
          include-hidden-files: true
          retention-days: 14

