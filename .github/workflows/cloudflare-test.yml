name: Cloudflare compatibility test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Connect
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Next.js production build
        run: npm run build
      - name: Check vinext compatibility
        run: npx --yes vinext@latest check
