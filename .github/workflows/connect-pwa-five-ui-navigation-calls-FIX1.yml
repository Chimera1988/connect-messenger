          @media(max-width:370px){.connect-app .connect-call-headline{gap:4px}.connect-app .connect-call-minimize{font-size:11px;padding:7px 9px;}}
          '''
              calls.write_text(s,encoding='utf-8')

          # Verify that no PWA source outside the four intentional files was changed.
          for path in EXPECTED:
              body=(ROOT/path).read_text(encoding='utf-8')
              if body.count(MARKER)!=1:
                  raise RuntimeError('Patch missing or duplicated marker in '+path)
          print('Connect PWA 5-point update: source guards and markers passed')
          PY_PATCH
          python3 "$RUNNER_TEMP/connect-pwa-five-ui-patch.py"
          python3 "$RUNNER_TEMP/connect-pwa-five-ui-patch.py"
