name: Connect PWA | Gestures, unified menus, keyboard and compact themed call

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-five-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: PWA five-point UI update (tests before push)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate repository and required files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          for f in AGENTS.md package.json package-lock.json tsconfig.json app/page.tsx app/globals.css app/liquid-glass.css app/calls.css app/call-journal-editor.css components/ConnectAudioCalls.tsx tests/call-rtc.integration.cjs tests/connect-call-output.test.cjs; do
            test -s "$f" || { echo "SOURCE_DRIFT: missing $f" >&2; exit 1; }
          done
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Install matching Chromium for browser regressions
        run: npx playwright-core install --with-deps chromium
      - name: Check browser installed by locked playwright-core
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p))throw Error('Chromium missing: '+p)"
      - name: Install reproducible PWA regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-pwa-five-ui.test.cjs" <<'JS_TEST'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const ts = require('typescript');

          const root = path.resolve(__dirname,'..');
          const page = fs.readFileSync(path.join(root,'app/page.tsx'),'utf8');
          const call = fs.readFileSync(path.join(root,'components/ConnectAudioCalls.tsx'),'utf8');
          const liquid = fs.readFileSync(path.join(root,'app/liquid-glass.css'),'utf8');
          const callsCss = fs.readFileSync(path.join(root,'app/calls.css'),'utf8');

          function findFunction(source,name){
            const tree=ts.createSourceFile('test.tsx',source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            assert.deepEqual(tree.parseDiagnostics,[],`TSX parse errors in ${name}`);
            let item;
            function walk(node){if(ts.isFunctionDeclaration(node)&&node.name?.text===name)item=node;ts.forEachChild(node,walk);}
            walk(tree);
            assert.ok(item,`Missing ${name}`);
            return item.getText(tree);
          }

          test('RED/GREEN: gestures distinguish back, forward, scroll and short drag',()=>{
            const declaration=findFunction(page,'connectSwipeDirection');
            const js=ts.transpileModule(declaration+'\nglobalThis.connectSwipeDirection=connectSwipeDirection;',{
              compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None},reportDiagnostics:true
            });
            assert.deepEqual((js.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error),[]);
            const swipe=new Function(`${js.outputText};return globalThis.connectSwipeDirection;`)();
            assert.equal(swipe('back',95,9),-1);
            assert.equal(swipe('forward',-95,10),1);
            assert.equal(swipe('back',-95,1),0);
            assert.equal(swipe('forward',95,1),0);
            assert.equal(swipe('back',65,1),0);
            assert.equal(swipe('back',100,90),0);
          });

          test('navigation has a bounded history, restores chat through existing actions, and excludes message swipes',()=>{
            assert.match(page,/gestureHistory\s*=\s*useRef/);
            assert.match(page,/history\.entries=\[\.\.\.history\.entries\.slice\(0,history\.cursor\+1\),view\]\.slice\(-24\)/);
            assert.match(page,/history\.restoring=true/);
            assert.match(page,/if\(activeChat && target\.chat!==activeChat\)exitChat\(\)/);
            assert.match(page,/if\(target\.chat && target\.chat!==activeChat\)enterChat\(target\.chat\)/);
            assert.match(page,/target\.closest\('[^']*\.bubble/);
            assert.match(page,/shell\.addEventListener\('touchstart',start,\{passive:true\}\)/);
            assert.match(page,/shell\.addEventListener\('touchend',end,\{passive:false\}\)/);
            assert.match(page,/if\(!user\?\.id \|\| isNativeMediaRuntime\(\)\)return/);
          });

          test('gesture listeners use native DOM Event, not imported React TouchEvent',()=>{
            const after=page.split('// Keep one in-memory navigation stack.')[1] || '';
            assert.match(after,/function start\(e: Event\)/);
            assert.match(after,/function end\(e: Event\)/);
            assert.match(after,/const touches=\(e as Event & \{touches:TouchList\}\)\.touches/);
            assert.match(after,/const changedTouches=\(e as Event & \{changedTouches:TouchList\}\)\.changedTouches/);
            assert.doesNotMatch(after,/function (?:start|end)\(e:TouchEvent\)/);
          });

          test('contact and chats search never uses iOS autozoom font or rectangular focused-input outline',()=>{
            assert.match(liquid,/\.connect-app \.main-view \.search-field input\s*\{[^}]*font-size:\s*16px !important/s);
            assert.match(liquid,/\.connect-app \.main-view \.search-field input:focus-visible\s*\{[^}]*outline:\s*none !important/s);
          });

          test('chat menus and call journal menu share the same panel color',()=>{
            const selector=liquid.split('/* CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: native-size iOS search; unified list menus. */')[1];
            assert.ok(selector,'menu theme patch missing');
            for(const name of ['.chat-actions-menu','.floating-menu','.list-chat-popover','.connect-call-editor-popup'])
              assert.ok(selector.includes(name),`missing ${name}`);
            assert.match(selector,/background:\s*var\(--panel\) !important/);
          });

          test('audio call can minimize only after answer and retains an always-mounted audio element',()=>{
            assert.match(call,/const \[minimized,setMinimized\]=useState\(false\)/);
            assert.match(call,/compactCall=minimized && \(phase==='active'\|\|phase==='reconnecting'\)/);
            assert.match(call,/onClick=\{\(\)=>\{setAudioRouteOpen\(false\);setMinimized\(true\);\}\}/);
            assert.match(call,/aria-label="Вернуться к разговору" onClick=\{\(\)=>setMinimized\(false\)\}/);
            assert.match(call,/\{calling && compactCall && <button/);
            assert.match(call,/\{calling && !compactCall && <div/);
            assert.match(call,/<audio ref=\{remoteAudioRef\} className="connect-call-audio" autoPlay\/>/);
            const cleanup=findFunction(call,'cleanup');
            assert.doesNotMatch(cleanup,/setMinimized/);
            assert.match(call,/if\(phase==='idle'\)setMinimized\(false\)/);
          });

          test('call chrome uses live selected theme variables rather than a fixed blue dialog',()=>{
            const themed=callsCss.split('/* CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: call UI follows all seven themes. */')[1];
            assert.ok(themed,'call palette patch missing');
            assert.match(themed,/\.connect-app \.connect-call-modal\s*\{[^}]*var\(--wave-primary, var\(--accent\)\)/s);
            assert.match(themed,/\.connect-app \.connect-call-mini\s*\{[^}]*z-index:21000/s);
            assert.match(themed,/--glass-surface-strong/);
            assert.match(themed,/--v4-border/);
          });

          test('Chromium: search focus, all context menus, and call card share intended live theme',async()=>{
            const {chromium}=require('playwright-core');
            const browser=await chromium.launch({args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3});
              await page.setContent(`<div class="connect-app" data-visual-scene="sunset" style="--accent:#b46b26;--wave-primary:#f4a951;--wave-secondary:#efbf7c">
                <div class="main-view"><div class="search-field"><input aria-label="Поиск контактов" /></div><div class="chat-actions-menu">Найти в чате</div></div>
                <div class="floating-menu">Переслать</div><div class="connect-call-editor-popup">Выбрать</div>
                <div class="connect-call-modal">Звонок</div><button class="connect-call-mini">Вернуться</button>
              </div>`);
              for(const file of ['globals.css','liquid-glass.css','calls.css','call-journal-editor.css'])
                await page.addStyleTag({content:fs.readFileSync(path.join(root,'app',file),'utf8')});
              await page.locator('input').focus();
              const appearance=await page.evaluate(()=>{
                const css=s=>getComputedStyle(document.querySelector(s));
                return {font:css('.search-field input').fontSize,outline:css('.search-field input').outlineStyle,
                  chat:css('.chat-actions-menu').backgroundColor,other:css('.floating-menu').backgroundColor,
                  journal:css('.connect-call-editor-popup').backgroundColor,
                  modal:css('.connect-call-modal').backgroundImage,mini:css('.connect-call-mini').zIndex};
              });
              assert.equal(appearance.font,'16px');
              assert.equal(appearance.outline,'none');
              assert.equal(appearance.chat,appearance.other);
              assert.equal(appearance.chat,appearance.journal);
              assert.equal(appearance.mini,'21000');
              await page.locator('.connect-app').evaluate(el=>{
                el.style.setProperty('--accent','#8055dc');
                el.style.setProperty('--wave-primary','#a17afb');
                el.style.setProperty('--wave-secondary','#7e9cf6');
              });
              const violet=await page.locator('.connect-call-modal').evaluate(el=>getComputedStyle(el).backgroundImage);
              assert.notEqual(violet,appearance.modal,'Call modal must respond to selected palette');
            } finally {await browser.close();}
          });
          JS_TEST
          if test -f tests/pwa-five-ui.test.cjs; then
            cmp -s "$RUNNER_TEMP/connect-pwa-five-ui.test.cjs" tests/pwa-five-ui.test.cjs || { echo 'SOURCE_DRIFT: existing regression test differs' >&2; exit 1; }
          else
            cp "$RUNNER_TEMP/connect-pwa-five-ui.test.cjs" tests/pwa-five-ui.test.cjs
          fi
          node --check tests/pwa-five-ui.test.cjs
      - name: Confirm gesture feature absent before patch (TDD RED)
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'CONNECT_PWA_NAV_MENUS_CALL_V1_20261114' app/page.tsx; then
            echo 'Existing update found: structural checks will verify complete implementation.'
            exit 0
          fi
          set +e
          node --test --test-name-pattern='RED/GREEN: gestures' tests/pwa-five-ui.test.cjs > "$RUNNER_TEMP/connect-five-red.log" 2>&1
          code=$?
          set -e
          if test "$code" -eq 0 || ! grep -Fq 'Missing connectSwipeDirection' "$RUNNER_TEMP/connect-five-red.log"; then
            cat "$RUNNER_TEMP/connect-five-red.log"
            echo 'Expected failing regression not reproduced; refuse to patch' >&2
            exit 1
          fi
          echo 'RED verified: edge-swipe navigation does not exist yet.'
      - name: Apply guarded PWA-only patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-pwa-five-ui-patch.py" <<'PY_PATCH'
          #!/usr/bin/env python3
          """Connect PWA 2026-11-14: five UI refinements, guarded and idempotent."""
          from pathlib import Path
          import subprocess

          ROOT = Path('.')
          MARKER = 'CONNECT_PWA_NAV_MENUS_CALL_V1_20261114'
          EXPECTED = {
              'app/page.tsx': '02194257b9276d88404a92e7599334da71811e99',
              'components/ConnectAudioCalls.tsx': '22c40006af5735c72c616d5926372d2f196a38b7',
              'app/liquid-glass.css': '9ad6256c7152d7e72e16c3a88809802ece0b7636',
              'app/calls.css': '1a2c1bae6fcda16a8ee1cf85352702513b1ccad5',
          }

          def once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'SOURCE_DRIFT: {label} must occur once; observed {count}')
              return source.replace(old, new, 1)

          for path, expected in EXPECTED.items():
              f = ROOT / path
              if not f.is_file():
                  raise RuntimeError(f'SOURCE_DRIFT: missing {path}')
              raw=f.read_text(encoding='utf-8')
              if MARKER in raw:
                  if raw.count(MARKER) != 1:
                      raise RuntimeError(f'SOURCE_DRIFT: duplicate marker in {path}')
                  continue
              sha=subprocess.check_output(['git','hash-object',str(f)],text=True).strip()
              if sha != expected:
                  raise RuntimeError(f'SOURCE_DRIFT: {path} changed; expected {expected}, observed {sha}')

          page = ROOT / 'app/page.tsx'
          s = page.read_text(encoding='utf-8')
          if MARKER not in s:
              s = once(s, 'export default function Home() {', '''// CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: edge gestures navigate screen history,
          // never message swipes or the iOS native system back gesture.
          type ConnectGestureView = { tab: Tab; chat: string | null; profile: string | null; media: ProfileMediaKind | null; settings: SettingsPage };
          function connectSwipeDirection(edge: 'back' | 'forward', dx: number, dy: number): -1 | 0 | 1 {
            if (Math.abs(dx) < 76 || Math.abs(dy) > Math.abs(dx) * 0.52) return 0;
            if (edge === 'back' && dx > 0) return -1;
            if (edge === 'forward' && dx < 0) return 1;
            return 0;
          }

          export default function Home() {''', 'top-level gesture helper')
              s = once(s, "  const [activeChat, setActiveChat] = useState<string | null>(null);", "  const [activeChat, setActiveChat] = useState<string | null>(null);\n  const gestureHistory = useRef<{ owner: string; entries: ConnectGestureView[]; cursor: number; restoring: boolean }>({owner:'',entries:[],cursor:-1,restoring:false});", 'history ref')
              s = once(s, "  async function openContact(p: Profile) {", '''  // Keep one in-memory navigation stack. Swipe restoration must not create new entries.
            useEffect(() => {
              const history = gestureHistory.current;
              if(!user?.id) { history.owner='';history.entries=[];history.cursor=-1;history.restoring=false;return; }
              if(history.owner!==user.id) { history.owner=user.id;history.entries=[];history.cursor=-1;history.restoring=false; }
              const view:ConnectGestureView={tab,chat:activeChat,profile:profileView,media:profileMediaOpen,settings:settingsPage};
              if(history.restoring) { history.restoring=false;return; }
              const same=(a:ConnectGestureView|undefined,b:ConnectGestureView)=>Boolean(a && a.tab===b.tab && a.chat===b.chat && a.profile===b.profile && a.media===b.media && a.settings===b.settings);
              if(same(history.entries[history.cursor],view))return;
              // Native back buttons and bottom tabs must move the cursor too, not push duplicate screens.
              if(same(history.entries[history.cursor-1],view)){history.cursor--;return;}
              if(same(history.entries[history.cursor+1],view)){history.cursor++;return;}
              history.entries=[...history.entries.slice(0,history.cursor+1),view].slice(-24);
              history.cursor=history.entries.length-1;
            },[user?.id,tab,activeChat,profileView,profileMediaOpen,settingsPage]);

            useEffect(() => {
              if(!user?.id || isNativeMediaRuntime())return;
              const shell=shellRef.current;
              if(!shell)return;
              let started:{x:number;y:number;edge:'back'|'forward'}|null=null;
              function start(e: Event){
                started=null;
                // This is a DOM listener, not the React TouchEvent imported for message gestures.
                const touches=(e as Event & {touches:TouchList}).touches;
                if(touches.length!==1 || crop || mediaViewer || videoNoteOpen || !!menuMessage || !!forwardIds.length || selectionMode || stickerPicker || chatSearchOpen || chatActions)return;
                if(document.querySelector('.connect-call-backdrop,.connect-call-history-screen'))return;
                const target=e.target;
                if(target instanceof Element && target.closest('input,textarea,select,[contenteditable="true"],.bubble,.context-overlay,.sticker-picker,.connect-vnote-backdrop,.connect-media-overlay'))return;
                const rect=shell!.getBoundingClientRect(),x=touches[0].clientX,y=touches[0].clientY;
                if(x>=rect.left && x<=rect.left+28)started={x,y,edge:'back'};
                else if(x<=rect.right && x>=rect.right-28)started={x,y,edge:'forward'};
              }
              function end(e: Event){
                const changedTouches=(e as Event & {changedTouches:TouchList}).changedTouches;
                if(!started || changedTouches.length!==1)return;
                const origin=started;started=null;
                const dx=changedTouches[0].clientX-origin.x,dy=changedTouches[0].clientY-origin.y;
                const direction=connectSwipeDirection(origin.edge,dx,dy);
                if(!direction)return;
                const history=gestureHistory.current,step=history.cursor+direction;
                if(step<0||step>=history.entries.length)return;
                const target=history.entries[step];
                if(target.chat && !conversations.some(c=>c.id===target.chat))return;
                if(target.profile && !profiles.some(p=>p.id===target.profile))return;
                e.preventDefault();
                history.cursor=step;
                history.restoring=true;
                if(activeChat && target.chat!==activeChat)exitChat();
                if(target.chat && target.chat!==activeChat)enterChat(target.chat);
                if(!target.chat)setActiveChat(null);
                if(target.profile)showProfile(target.profile);
                else {setProfileView(null);setProfileMediaOpen(null);}
                setProfileMediaOpen(target.media);
                setTab(target.tab);setSettingsPage(target.settings);setSearch('');setListActions(null);setStickerPicker(false);
              }
              function cancel(){started=null;}
              shell.addEventListener('touchstart',start,{passive:true});
              shell.addEventListener('touchend',end,{passive:false});
              shell.addEventListener('touchcancel',cancel,{passive:true});
              return()=>{shell.removeEventListener('touchstart',start);shell.removeEventListener('touchend',end);shell.removeEventListener('touchcancel',cancel);};
            },[user?.id,tab,activeChat,profileView,profileMediaOpen,settingsPage,crop,mediaViewer,videoNoteOpen,menuMessage,forwardIds.length,selectionMode,stickerPicker,chatSearchOpen,chatActions,conversations,profiles]);

            async function openContact(p: Profile) {''', 'navigation stack + touch handlers')
              page.write_text(s,encoding='utf-8')

          call=ROOT/'components/ConnectAudioCalls.tsx'
          s=call.read_text(encoding='utf-8')
          if MARKER not in s:
              s = once(s, "  const [phase, setPhase] = useState<Phase>('idle');", "  // CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: minimized PWA calls keep their WebRTC component mounted.\n  const [minimized,setMinimized]=useState(false);\n  const [phase, setPhase] = useState<Phase>('idle');",'minimized state')
              s = once(s, "  const callIsOpen = phase !== 'idle';", "  const callIsOpen = phase !== 'idle';\n  useEffect(()=>{if(phase==='idle')setMinimized(false);},[phase]);",'reset minimized on call end')
              s = once(s, "  const incoming = phase === 'incoming';", "  const incoming = phase === 'incoming';\n  const compactCall=minimized && (phase==='active'||phase==='reconnecting') && !window.ConnectAndroid && !window.ConnectNative;", 'compact phase condition')
              s = once(s, '''  return <>
              {calling && <div className="connect-call-backdrop" role="dialog" aria-modal="true" aria-label="Аудиозвонок Connect">
                <div className="connect-call-modal">
                  <p className="connect-call-eyebrow">CONNECT · АУДИО</p>''', '''  return <>
              {calling && compactCall && <button type="button" className="connect-call-mini" aria-label="Вернуться к разговору" onClick={()=>setMinimized(false)}>
                <span className="connect-call-mini-name">{shownName || 'Собеседник'}</span>
                <span className="connect-call-mini-phase">{phaseTitle[phase]}</span>
                <span className="connect-call-mini-expand" aria-hidden="true">↗</span>
              </button>}
              {calling && !compactCall && <div className="connect-call-backdrop" role="dialog" aria-modal="true" aria-label="Аудиозвонок Connect">
                <div className="connect-call-modal">
                  <div className="connect-call-headline">
                    <p className="connect-call-eyebrow">CONNECT · АУДИО</p>
                    {(phase==='active'||phase==='reconnecting') && !window.ConnectAndroid && !window.ConnectNative && <button className="connect-call-minimize" type="button" onClick={()=>{setAudioRouteOpen(false);setMinimized(true);}} aria-label="Свернуть звонок">⌄ Свернуть</button>}
                  </div>''','call screen visual toggle')
              call.write_text(s,encoding='utf-8')

          liquid=ROOT/'app/liquid-glass.css'
          s=liquid.read_text(encoding='utf-8')
          if MARKER not in s:
              s += '''
          /* CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: native-size iOS search; unified list menus. */
          .connect-app .main-view .search-field input {
            font-size: 16px !important;
            line-height: normal;
            -webkit-appearance: none;
            appearance: none;
            outline: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent;
          }
          .connect-app .main-view .search-field input:focus,
          .connect-app .main-view .search-field input:focus-visible {
            outline: none !important;
            box-shadow: none !important;
          }
          .connect-app .main-view .search-field:focus-within {
            border-color: var(--glass-stroke);
            box-shadow: inset 0 1px 0 var(--glass-sheen), var(--glass-shadow);
          }
          .connect-app .chat-actions-menu,
          .connect-app .floating-menu,
          .connect-app .list-chat-popover,
          .connect-app .connect-call-editor-popup {
            background: var(--panel) !important;
            color: var(--text);
            border-color: var(--v4-border, var(--glass-stroke)) !important;
            box-shadow: var(--glass-shadow, 0 16px 40px rgba(0,0,0,.32));
          }
          '''
              liquid.write_text(s,encoding='utf-8')

          calls=ROOT/'app/calls.css'
          s=calls.read_text(encoding='utf-8')
          if MARKER not in s:
              s += '''
          /* CONNECT_PWA_NAV_MENUS_CALL_V1_20261114: call UI follows all seven themes. */
          .connect-app .connect-call-backdrop {
            background: color-mix(in srgb, var(--bg) 75%, rgba(0,0,0,.75));
          }
          .connect-app .connect-call-modal {
            color: var(--text);
            background: linear-gradient(145deg,
              color-mix(in srgb, var(--wave-primary, var(--accent)) 13%, var(--glass-surface-strong, var(--panel))),
              color-mix(in srgb, var(--wave-secondary, var(--accent)) 9%, var(--panel)));
            border: 1px solid var(--v4-border, var(--glass-stroke-hi, var(--border)));
            box-shadow: 0 25px 60px rgba(0,0,0,.30), inset 0 1px 0 var(--glass-sheen,rgba(255,255,255,.10));
          }
          .connect-app .connect-call-avatar {
            background: linear-gradient(140deg, var(--accent), color-mix(in srgb,var(--wave-primary,var(--accent)) 22%,var(--panel)));
          }
          .connect-app .connect-call-headline {
            display:flex;align-items:center;justify-content:space-between;gap:8px;
            margin-bottom:20px;min-height:28px;
          }
          .connect-app .connect-call-headline .connect-call-eyebrow {margin:0;text-align:left;color:var(--wave-primary,var(--accent));}
          .connect-app .connect-call-minimize {
            flex:0 0 auto;min-height:39px;border-radius:13px;padding:8px 12px;
            border:1px solid var(--v4-border,var(--border));
            background:color-mix(in srgb,var(--accent) 11%,var(--glass-surface-strong,var(--panel)));
            color:var(--text);font-size:12px;font-weight:650;
          }
          .connect-app .connect-call-action:not(.accept):not(.hangup)>span:first-child {
            background:color-mix(in srgb,var(--wave-primary,var(--accent)) 14%,var(--glass-surface-strong,var(--panel)));
            border-color:var(--v4-border,var(--border));
          }
          .connect-app .connect-call-outputs {
            background:var(--glass-surface-strong,var(--panel));
            border-color:var(--v4-border,var(--border));
          }
          .connect-app .connect-call-outputs button {
            background:color-mix(in srgb,var(--accent) 12%,var(--glass-surface-strong,var(--panel)));
            border-color:var(--v4-border,var(--border));
          }
          .connect-app .connect-call-mini {
            position:absolute;z-index:21000;
            top:max(74px,calc(env(safe-area-inset-top) + 18px));right:12px;
            display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 11px;
            align-items:center;text-align:left;padding:11px 13px;min-height:56px;
            width:min(264px,calc(100% - 24px));border-radius:18px;
            border:1px solid var(--v4-border,var(--border));
            background:linear-gradient(125deg,color-mix(in srgb,var(--wave-primary,var(--accent)) 17%,var(--glass-surface-strong,var(--panel))),var(--panel));
            color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.32);
            -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
          }
          .connect-app .connect-call-mini-name{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
          .connect-app .connect-call-mini-phase{font-size:11px;grid-column:1;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
