name: Connect PWA | Delete forever and consistent media quality

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-pwa-permanent-delete-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Verify server migration and update PWA client
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm repository and source anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-messenger'
          test "$GITHUB_REF" = 'refs/heads/main'
          for f in AGENTS.md package.json package-lock.json tsconfig.json app/page.tsx lib/connect-media-optimizer.ts; do
            test -s "$f" || { echo "SOURCE_DRIFT: Missing $f" >&2; exit 1; }
          done
          node -e "const p=require('./package.json');if(p.dependencies['@supabase/supabase-js']!=='2.57.0')process.exit(1)"
          grep -Fq 'async function eraseMessage(m:Message)' app/page.tsx
          grep -Fq 'export function connectCanOptimizeMedia' lib/connect-media-optimizer.ts
      - name: Node 22, matching repository lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Stage regression tests and surgical patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_pwa.py" <<'CONNECT_HARD_DELETE_PATCH_PY'
          #!/usr/bin/env python3
          """Safely patch *current* Connect PWA only, rejecting unexpected source drift."""
          from pathlib import Path
          import sys
          
          ROOT=Path('.')
          page=ROOT/'app/page.tsx'
          optimizer=ROOT/'lib/connect-media-optimizer.ts'
          assert page.is_file() and optimizer.is_file(), 'SOURCE_DRIFT: required source missing'
          original=page.read_text(encoding='utf8')
          media=optimizer.read_text(encoding='utf8')
          
          MARKER='CONNECT_PWA_HARD_DELETE_UNIFIED_QUALITY_20261115'
          HARD_DELETE='''  // CONNECT_PWA_HARD_DELETE_UNIFIED_QUALITY_20261115
            async function eraseMessage(m:Message){
              if(!supabase||!user)return {error:new Error('Нет соединения')};
              // The server verifies the sender, physically deletes the message row,
              // writes a content-free tombstone, and removes unreferenced media.
              // No fallback to a soft-delete: do not claim success if the server fails.
              const {data,error}=await supabase.functions.invoke<{deleted:boolean;pending_files?:number}>(
                'connect-delete-forever',{body:{message_id:m.id}}
              );
              if(error||!data?.deleted)return {error:error||new Error('Удаление не подтверждено сервером')};
              await dropCachedMessage(user.id,m.conversation_id,m.id).catch(()=>{});
              for(const path of [m.attachment_path,...parseAlbum(m.body).map(x=>x.path)]){
                if(path)await clearCachedMedia('temporary','connect-attachments/'+path);
              }
              if((data.pending_files||0)>0)setNotice('Сообщение удалено. Вложение ожидает очистки на сервере.');
              return {error:null};
            }
          '''
          
          QUEUE_EFFECT='''  // Retried private storage cleanups contain only object paths, never message text.
            useEffect(()=>{
              if(!supabase||!user)return;
              void supabase.functions.invoke('connect-delete-forever',{body:{cleanup_pending:true}}).catch(()=>{});
            },[user?.id]);
          '''
          
          if MARKER in original:
              if original.count(MARKER)!=1 or "body:{message_id:m.id}" not in original or 'cleanup_pending:true' not in original:
                  sys.exit('SOURCE_DRIFT: partial previous hard-delete update')
          else:
              begin='  async function eraseMessage(m:Message){\n'
              end='  async function removeForEveryone(ids:string[])'
              assert original.count(begin)==1 and original.count(end)==1, 'SOURCE_DRIFT: delete handler anchors'
              before,after=original.split(begin,1)
              block,after=after.split(end,1)
              assert "supabase.rpc('connect_delete_message'" in block and "deleted_at:new Date().toISOString()" in block, 'SOURCE_DRIFT: unexpected eraseMessage implementation'
              original=before+HARD_DELETE+end+after
              effect_anchor="  useEffect(()=>{\n    if(!supabase||!user)return;let active=true,running=false;"
              assert original.count(effect_anchor)==1, 'SOURCE_DRIFT: tombstone sync effect changed'
              original=original.replace(effect_anchor,QUEUE_EFFECT+effect_anchor,1)
          
          MEDIA_MARKER='CONNECT_PWA_UNIFIED_MEDIA_QUALITY_20261115'
          if MEDIA_MARKER in media:
              assert 'const VIDEO_MIN = 4 * MB;' in media and '1600/Math.max(' in media and 'videoBitsPerSecond:targetBitrate' in media, 'SOURCE_DRIFT: partial media quality patch'
          else:
              replacements=[
                ('const VIDEO_MIN = 12 * MB;', 'const VIDEO_MIN = 4 * MB;'),
                ("const mime = original.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp';", "const mime = 'image/webp';"),
                ("const blob = await bounded(toBlob(canvas, mime, mime === 'image/jpeg' ? .83 : .82), 12000);", "const blob = await bounded(toBlob(canvas, mime, .86), 12000);"),
                ("mediaFilename(original.name, mime === 'image/jpeg' ? 'jpg' : 'webp')", "mediaFilename(original.name, 'webp')"),
                ('const scale=Math.min(1,1280/video.videoWidth,720/video.videoHeight);','const scale=Math.min(1,1600/Math.max(video.videoWidth,video.videoHeight));'),
                ('recorder=new MediaRecorder(media,{mimeType:mime,videoBitsPerSecond:1_100_000,audioBitsPerSecond:96_000});',
                 'const targetBitrate=Math.round(Math.min(3_200_000,Math.max(900_000,2_600_000*Math.pow((canvas.width*canvas.height)/(1600*900),.7))));\n    recorder=new MediaRecorder(media,{mimeType:mime,videoBitsPerSecond:targetBitrate,audioBitsPerSecond:96_000});'),
              ]
              for old,new in replacements:
                assert media.count(old)==1, f'SOURCE_DRIFT: {old[:70]}'
                media=media.replace(old,new,1)
              media='// '+MEDIA_MARKER+'\n'+media
          
          page.write_text(original,encoding='utf8')
          optimizer.write_text(media,encoding='utf8')
          assert 'const VIDEO_MIN = 4 * MB;' in media
          assert "supabase.functions.invoke<{deleted:boolean;pending_files?:number}>" in original
          assert "supabase.rpc('connect_delete_message'" not in original[original.index(MARKER):original.index('  async function removeForEveryone(')]
          print('PWA permanent-delete and unified media-quality patch OK')
          CONNECT_HARD_DELETE_PATCH_PY
          cat > "$RUNNER_TEMP/test_patch.py" <<'CONNECT_HARD_DELETE_TEST_PY'
          """Focused regression tests on synthetic PWA source (never modify real project)."""
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import subprocess, shutil
          script=Path(__file__).with_name('patch_pwa.py').resolve()
          # Fail closed when code differs.
          with TemporaryDirectory() as wd:
           root=Path(wd);(root/'app').mkdir();(root/'lib').mkdir()
           (root/'app/page.tsx').write_text('  async function eraseMessage(m:Message){\n    let result=await supabase.rpc(\'connect_delete_message\',{p_message_id:m.id});\n    if(result.error?.code===\'PGRST202\')result=await supabase.from(\'messages\').update({deleted_at:new Date().toISOString()});\n  }\n  async function removeForEveryone(ids:string[]){}\n  useEffect(()=>{\n    if(!supabase||!user)return;let active=true,running=false;')
           (root/'lib/connect-media-optimizer.ts').write_text('const VIDEO_MIN = 12 * MB;\nconst mime = original.type === \'image/jpeg\' ? \'image/jpeg\' : \'image/webp\';\nconst blob = await bounded(toBlob(canvas, mime, mime === \'image/jpeg\' ? .83 : .82), 12000);\nmediaFilename(original.name, mime === \'image/jpeg\' ? \'jpg\' : \'webp\')\nconst scale=Math.min(1,1280/video.videoWidth,720/video.videoHeight);\nrecorder=new MediaRecorder(media,{mimeType:mime,videoBitsPerSecond:1_100_000,audioBitsPerSecond:96_000});')
           def run():return subprocess.run(['python',str(script)],cwd=root,capture_output=True,text=True)
           a=run();assert a.returncode==0,(a.stdout,a.stderr)
           p=root/'app/page.tsx';first=p.read_text();m=root/'lib/connect-media-optimizer.ts';v=m.read_text()
           assert 'CONNECT_PWA_HARD_DELETE' in first and 'cleanup_pending:true' in first
           assert 'deleted_at:new Date().toISOString()' not in first
           assert '1600/Math.max' in v and 'videoBitsPerSecond:targetBitrate' in v and "const mime = 'image/webp';" in v
           b=run();assert b.returncode==0,(b.stdout,b.stderr)
           assert first==p.read_text() and v==m.read_text(),'Patch is not idempotent'
           # Source drift must be rejected before writing.
           p.write_text(first.replace('cleanup_pending:true','wrong:true'))
           c=run();assert c.returncode!=0,'Drift must fail'
           print('PASS: permanent deletion, queue-drain hook, 1600px quality, idempotency, source drift')
          CONNECT_HARD_DELETE_TEST_PY
          python -m py_compile "$RUNNER_TEMP/patch_pwa.py" "$RUNNER_TEMP/test_patch.py"
          python "$RUNNER_TEMP/test_patch.py"
      - name: Patch PWA once, reject unexpected source drift
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/patch_pwa.py"
          python "$RUNNER_TEMP/patch_pwa.py" # idempotence regression
      - name: Keep the deployed backend design in source control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/connect-permanent-deletion
          cat > ops/connect-permanent-deletion/20261115_connect_hard_delete.sql <<'CONNECT_HARD_DELETE_SQL'
          -- CONNECT: hard-delete message contents, retain only content-free synchronization tombstones.
          -- Existing private.connect_fix6_deleted_event() AFTER DELETE trigger is intentionally preserved.
          BEGIN;
          
          CREATE TABLE IF NOT EXISTS public.connect_media_deletion_jobs (
            message_id uuid NOT NULL,
            sender_id uuid NOT NULL,
            conversation_id uuid NOT NULL,
            path text NOT NULL,
            queued_at timestamptz NOT NULL DEFAULT now(),
            PRIMARY KEY (message_id, path)
          );
          ALTER TABLE public.connect_media_deletion_jobs ENABLE ROW LEVEL SECURITY;
          REVOKE ALL ON public.connect_media_deletion_jobs FROM PUBLIC, anon, authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.connect_media_deletion_jobs TO service_role;
          CREATE INDEX IF NOT EXISTS connect_media_deletion_jobs_sender ON public.connect_media_deletion_jobs(sender_id,queued_at);
          
          CREATE OR REPLACE FUNCTION private.connect_queue_removed_media() RETURNS trigger
          LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $func$
          DECLARE p text; entry text[];
          BEGIN
            -- Only an actual database DELETE queues storage removal, not a soft-delete update.
            IF OLD.attachment_path IS NOT NULL AND length(OLD.attachment_path) BETWEEN 10 AND 900 THEN
              INSERT INTO public.connect_media_deletion_jobs(message_id,sender_id,conversation_id,path)
              VALUES (OLD.id, OLD.sender_id, OLD.conversation_id, OLD.attachment_path)
              ON CONFLICT DO NOTHING;
            END IF;
            -- Albums are encoded as JSON under [[connect-album:...]]. Forwarded album
            -- wrappers may also include this exact marker. Never scan arbitrary body JSON.
            IF position('[[connect-album:' IN OLD.body)>0 THEN
              FOR entry IN SELECT regexp_matches(OLD.body, '"path"[[:space:]]*:[[:space:]]*"([^"\\]+)"','g') LOOP
                p:=entry[1];
                IF length(p) BETWEEN 10 AND 900 AND
                   p LIKE OLD.conversation_id::text || '/' || OLD.sender_id::text || '/%' THEN
                  INSERT INTO public.connect_media_deletion_jobs(message_id,sender_id,conversation_id,path)
                  VALUES (OLD.id,OLD.sender_id,OLD.conversation_id,p)
                  ON CONFLICT DO NOTHING;
                END IF;
              END LOOP;
            END IF;
            RETURN OLD;
          END $func$;
          REVOKE ALL ON FUNCTION private.connect_queue_removed_media() FROM PUBLIC,anon,authenticated;
          DROP TRIGGER IF EXISTS connect_queue_removed_media ON public.messages;
          CREATE TRIGGER connect_queue_removed_media AFTER DELETE ON public.messages
          FOR EACH ROW EXECUTE FUNCTION private.connect_queue_removed_media();
          
          -- PostgreSQL ON DELETE SET NULL for replies must be allowed to update reply_to,
          -- otherwise the existing validator blocks physical deletion of replied-to messages.
          -- Reject direct user edits to reply_to while the referenced message still exists.
          CREATE OR REPLACE FUNCTION public.validate_message_changes() RETURNS trigger
          LANGUAGE plpgsql SET search_path='' AS $func$
          DECLARE fk_nullified boolean := false;
          BEGIN
           IF tg_op='UPDATE' THEN
             fk_nullified := old.reply_to IS NOT NULL AND new.reply_to IS NULL
               AND NOT EXISTS(SELECT 1 FROM public.messages parent WHERE parent.id=old.reply_to);
             IF new.id IS DISTINCT FROM old.id
               OR new.conversation_id IS DISTINCT FROM old.conversation_id
               OR new.sender_id IS DISTINCT FROM old.sender_id
               OR new.created_at IS DISTINCT FROM old.created_at
               OR (new.reply_to IS DISTINCT FROM old.reply_to AND NOT fk_nullified) THEN
                 RAISE EXCEPTION 'Message identity cannot be changed';
             END IF;
             IF old.deleted_at IS NOT NULL THEN
               IF fk_nullified AND (to_jsonb(new)-'reply_to')=(to_jsonb(old)-'reply_to') THEN
                 RETURN new;
               END IF;
               RAISE EXCEPTION 'Deleted message cannot be changed';
             END IF;
             IF new.deleted_at IS NOT NULL THEN
               new.deleted_at=now(); new.body='';
             ELSIF new.body IS DISTINCT FROM old.body THEN
               new.edited_at=now();
             END IF;
           END IF;
           IF tg_op='INSERT' AND new.reply_to IS NOT NULL THEN
             IF NOT EXISTS(SELECT 1 FROM public.messages m WHERE m.id=new.reply_to AND m.conversation_id=new.conversation_id AND m.deleted_at IS NULL) THEN
               RAISE EXCEPTION 'Invalid reply target';
             END IF;
           END IF;
           RETURN new;
          END $func$;
          
          -- Legacy PWA/APK clients already attempt this RPC before a soft-delete fallback.
          -- Ownership is enforced server-side, and DELETE triggers the existing tombstone.
          GRANT DELETE ON TABLE public.messages TO authenticated;
          DROP POLICY IF EXISTS "connect sender hard delete" ON public.messages;
          CREATE POLICY "connect sender hard delete" ON public.messages
            FOR DELETE TO authenticated USING (sender_id=(SELECT auth.uid()));
          
          CREATE OR REPLACE FUNCTION public.connect_delete_message(p_message_id uuid) RETURNS void
          LANGUAGE plpgsql SECURITY INVOKER SET search_path='' AS $func$
          DECLARE caller uuid;
          BEGIN
           caller := (SELECT auth.uid());
           IF caller IS NULL THEN RAISE EXCEPTION 'Authentication required' USING ERRCODE='28000'; END IF;
           IF EXISTS (SELECT 1 FROM public.messages WHERE id=p_message_id AND sender_id<>caller) THEN
             RAISE EXCEPTION 'Only the sender can delete a message' USING ERRCODE='42501';
           END IF;
           DELETE FROM public.messages WHERE id=p_message_id AND sender_id=caller;
          END $func$;
          REVOKE ALL ON FUNCTION public.connect_delete_message(uuid) FROM PUBLIC,anon;
          GRANT EXECUTE ON FUNCTION public.connect_delete_message(uuid) TO authenticated;
          
          COMMIT;
          NOTIFY pgrst, 'reload schema';
          CONNECT_HARD_DELETE_SQL
          cat > ops/connect-permanent-deletion/connect-delete-forever.ts <<'CONNECT_DELETE_EDGE_TS'
          import { createClient } from 'npm:@supabase/supabase-js@2.57.0';
          
          /** Connect server-only deletion. No message content is returned or logged.
           * Real message rows are physically deleted, while ID-only tombstones remain
           * to prevent old device caches from resurrecting the message.
           */
          const CORS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
            'Access-Control-Allow-Methods': 'POST, OPTIONS',
          };
          const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const respond = (value: Record<string, unknown>, status = 200) =>
            new Response(JSON.stringify(value), {status, headers:{...CORS,'Content-Type':'application/json'}});
          
          Deno.serve(async (req: Request) => {
            if (req.method === 'OPTIONS') return new Response(null, {status:204,headers:CORS});
            if (req.method !== 'POST') return respond({error:'Method not allowed'},405);
            const url=Deno.env.get('SUPABASE_URL');
            const anon=Deno.env.get('SUPABASE_ANON_KEY');
            const secret=Deno.env.get('SUPABASE_SERVICE_ROLE_KEY');
            if (!url || !anon || !secret) return respond({error:'Backend not configured'},503);
            const bearer=/^Bearer\s+(.+)$/i.exec(req.headers.get('Authorization')??'')?.[1];
            if (!bearer) return respond({error:'Unauthorized'},401);
            const auth=createClient(url,anon,{auth:{persistSession:false,autoRefreshToken:false}});
            const {data:identity,error:authError}=await auth.auth.getUser(bearer);
            const userId=identity.user?.id;
            if (authError || !userId) return respond({error:'Unauthorized'},401);
            let payload:{message_id?:unknown;cleanup_pending?:unknown};
            try {payload=await req.json();} catch {return respond({error:'Invalid JSON'},400);}
            if (!payload || typeof payload!=='object') return respond({error:'Invalid body'},400);
            const drain=payload.cleanup_pending===true;
            const messageId=payload.message_id;
            if (!drain && (typeof messageId!=='string' || !UUID.test(messageId))) return respond({error:'Invalid message ID'},400);
            const db=createClient(url,secret,{auth:{persistSession:false,autoRefreshToken:false}});
            try {
              let removedNow=false;
              if (!drain && typeof messageId==='string') {
                const {data:row,error:readError}=await db.from('messages').select('id,sender_id').eq('id',messageId).maybeSingle();
                if (readError) throw readError;
                if (row) {
                  if (row.sender_id!==userId) return respond({error:'Forbidden'},403);
                  // Existing AFTER DELETE trigger writes the ID-only tombstone. The new
                  // AFTER DELETE trigger atomically queues only owned attachment paths.
                  const {data:deleted,error:deleteError}=await db.from('messages')
                    .delete().eq('id',messageId).eq('sender_id',userId).select('id');
                  if (deleteError) throw deleteError;
                  removedNow=Array.isArray(deleted)&&deleted.length===1;
                }
              }
              let query=db.from('connect_media_deletion_jobs')
                .select('message_id,path,conversation_id,sender_id').eq('sender_id',userId)
                .order('queued_at',{ascending:true}).limit(100);
              if (!drain && typeof messageId==='string') query=query.eq('message_id',messageId);
              const {data:jobs,error:queueError}=await query;
              if (queueError) throw queueError;
              if (!drain && !removedNow && !(jobs?.length)) return respond({deleted:false,error:'Message not found'},404);
          
              const referenced=async(path:string):Promise<boolean>=>{
                // Protect real links in ALL chats, including album JSON embedded in body.
                const direct=await db.from('messages').select('id').eq('attachment_path',path).is('deleted_at',null).limit(1);
                if (direct.error) throw direct.error;
                if (direct.data?.length) return true;
                const escaped=path.replace(/[\\%_]/g,(char:string)=>'\\'+char);
                const album=await db.from('messages').select('id').ilike('body','%'+escaped+'%').is('deleted_at',null).limit(1);
                if (album.error) throw album.error;
                if (album.data?.length) return true;
                const avatar=await db.from('profiles').select('id').eq('avatar_path',path).limit(1);
                if (avatar.error) throw avatar.error;
                if (avatar.data?.length) return true;
                const sticker=await db.from('connect_stickers').select('id').eq('storage_path',path).limit(1);
                if (sticker.error) throw sticker.error;
                return Boolean(sticker.data?.length);
              };
              let deletedFiles=0,pendingFiles=0;
              for (const job of jobs??[]) {
                const path=job.path;
                // No arbitrary delete: path must have belonged to the sender and chat
                // when its message was deleted. Queue entries come only from DB triggers.
                if(typeof path!=='string' || path.length>900 ||
                   !path.startsWith(`${job.conversation_id}/${userId}/`)){
                  pendingFiles++;continue;
                }
                try {
                  if (await referenced(path)) {pendingFiles++;continue;}
                  const paths=[path];
                  for (const sibling of [path+'__thumb.webp',path+'__poster.jpg']) {
                    if (!(await referenced(sibling))) paths.push(sibling);
                  }
                  const {error:storageError}=await db.storage.from('connect-attachments').remove(paths);
                  if (storageError) throw storageError;
                  const {error:dequeueError}=await db.from('connect_media_deletion_jobs')
                    .delete().eq('message_id',job.message_id).eq('path',path).eq('sender_id',userId);
                  if (dequeueError) throw dequeueError;
                  deletedFiles++;
                } catch(e) {
                  // Durable jobs remain in the table and retry on future app sessions.
                  console.error('Connect media GC pending:',e instanceof Error?e.name:'error');
                  pendingFiles++;
                }
              }
              return respond({deleted:!drain || removedNow,deleted_files:deletedFiles,pending_files:pendingFiles});
            }catch(e){
              console.error('Connect hard-delete unavailable:',e instanceof Error?e.name:'error');
              return respond({error:'Server deletion unavailable; retry'},503);
            }
          });
          CONNECT_DELETE_EDGE_TS
          # Database migration and Edge Function were deployed before this PWA update.
          # The stored SQL/TypeScript are an audit record, NEVER automatically re-run here.
      - name: Regression checks for new upload quality and permanent deletion
        shell: bash
        run: |
          set -euo pipefail
          node <<'CONNECT_QUALITY_TEST_JS'
          const fs=require('node:fs');
          const ts=require('typescript');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const src=fs.readFileSync('lib/connect-media-optimizer.ts','utf8');
          const page=fs.readFileSync('app/page.tsx','utf8');
          assert.match(src,/const VIDEO_MIN = 4 \* MB;/);
          assert.match(src,/const scale=Math.min\(1,1600\/Math.max\(video.videoWidth,video.videoHeight\)\);/);
          assert.match(src,/videoBitsPerSecond:targetBitrate,audioBitsPerSecond:96_000/);
          assert.match(src,/const mime = 'image\/webp';/);
          assert.match(page,/supabase.functions.invoke<\{deleted:boolean;pending_files\?:number\}>/);
          assert.match(page,/body:\{message_id:m.id\}/);
          assert.match(page,/cleanup_pending:true/);
          const body=page.slice(page.indexOf('async function eraseMessage(m:Message)'),page.indexOf('async function removeForEveryone('));
          assert.ok(!body.includes('deleted_at:new Date()'),'No soft-delete fallback');
          const compiled=ts.transpileModule(src.replace(/^export /gm,''),{compilerOptions:{module:ts.ModuleKind.None,target:ts.ScriptTarget.ES2020}}).outputText;
          const sandbox={File:class File{constructor(a,b,c){this.size=0;this.name=b;this.type=c?.type||'';}}};
          vm.createContext(sandbox);
          vm.runInContext(compiled+';this.mediaRule=connectCanOptimizeMedia;',sandbox);
          const f=(name,type,mb)=>({name,type,size:mb*1048576});
          assert.equal(sandbox.mediaRule(f('movie.mov','video/quicktime',6),false),'video');
          assert.equal(sandbox.mediaRule(f('pic.png','image/png',2),false),'image');
          assert.equal(sandbox.mediaRule(f('movie.mov','video/quicktime',6),true),null);
          assert.equal(sandbox.mediaRule(f('connect-video-note-17.mp4','video/mp4',18),false),null);
          console.log('PASS client optimizer and hard-delete regression checks');
          CONNECT_QUALITY_TEST_JS
      - name: Check entire project before commit
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Commit and push only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx lib/connect-media-optimizer.ts ops/connect-permanent-deletion/
          if git diff --cached --quiet; then
            echo 'No changes: code is already updated and verified'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect PWA: hard-delete messages and align media quality target'
            git push origin HEAD:main
          fi
